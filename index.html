<script>
/* ========= configuración de audio =========
   Si al lado de este archivo existe una carpeta "audio" con los MP3
   generados (audio/prado-01.mp3, etc.), la app los usa.
   Si no encuentra el archivo, lee el guion con la voz del dispositivo. */
var AUDIO_BASE = "audio/";

(function () {
  "use strict";

  /* En orden de viaje: es como se leen en la pestaña Audioguías. */
  var GUIAS = [GUIA_MADRID_D1, GUIA_MADRID_D2, GUIA_TOLEDO, GUIA_MADRID_D4,
               GUIA_NAPOLES_D1, GUIA_NAPOLES_D2, GUIA_NAPOLES_D3,
             GUIA_NAPOLES_D4, GUIA_NAPOLES_D5];
  /* Cada guía se narra con una voz. Se copia a cada parada porque la huella
     del MP3 la incluye: si le cambio la voz a una guía, cambia la URL y el
     teléfono se baja SOLO esas pistas, sin tocar las demás. */
  GUIAS.forEach(function (g) {
    g.paradas.forEach(function (p) { p.voz = g.voz || ""; });
  });
  var IT = ITINERARIO;

  /* ---------- almacenamiento tolerante a fallos ---------- */
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem("eurotrip." + k); return v === null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem("eurotrip." + k, JSON.stringify(v)); } catch (e) {}
    }
  };
  var hechas = store.get("hechas", {});

  /* ---------- utilidades ---------- */
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  /* nombres cortos de los días. Ojo: DIAS a secas son los del viaje,
     que vienen de dias.js. */
  var DIA_SEM = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fechaCorta(s) { var d = parseISO(s); return DIA_SEM[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parrafos(t) {
    return String(t).split("\n\n").map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  }
  function el(id) { return document.getElementById(id); }

  /* ---------- cuenta regresiva ---------- */
  (function () {
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var salida = new Date(2026, 8, 30);
    var fin = parseISO(IT.fin);
    var dias = Math.round((salida - hoy) / 86400000);
    var txt;
    if (dias > 1) txt = "faltan " + dias + " días";
    else if (dias === 1) txt = "salís mañana";
    else if (dias === 0) txt = "salís hoy";
    else if (hoy <= fin) {
      var n = Math.round((hoy - parseISO(IT.inicio)) / 86400000) + 1;
      txt = "día " + n + " de 35";
    } else txt = "viaje terminado";
    el("countdown").textContent = txt;
  })();

  /* ================= VISTA: ITINERARIO ================= */
  /* ================= ITINERARIO POR DÍA =================
     La pestaña principal: cada día se despliega y muestra su línea de tiempo
     con TODO junto — actividades, audioguías y pases —, ordenado por hora.
     Las pestañas Audioguías y Pases siguen existiendo como listas sueltas,
     pero el día es el lugar donde uno mira cuando está viajando. */

  var pasesCache = [];
  /* undefined = todavía no se calculó el día por defecto.
     null = el usuario cerró todo a propósito. Distinguirlos importa: si se
     usa null para las dos cosas, el día por defecto no se puede compactar
     porque renderItin lo vuelve a abrir en el acto. */
  var diaAbierto;

  function paradaPorId(id) {
    for (var i = 0; i < GUIAS.length; i++) {
      var g = GUIAS[i];
      for (var k = 0; k < g.paradas.length; k++) {
        if (g.paradas[k].id === id) return { guia: g, idx: k, p: g.paradas[k] };
      }
    }
    return null;
  }

  /* Reproduce una parada desde donde sea, sin pasar por la pestaña de guías. */
  function tocarParadaPorId(id) {
    var r = paradaPorId(id);
    if (!r) return;
    guiaActual = r.guia;
    cargarParada(r.idx);
  }

  /* Todos los audios de un día, en el orden en que los vas a caminar. No es
     el orden de la guía: un día puede cruzar guías y mezcla paradas y tramos. */
  function paradasDelDia(fecha) {
    var d = DIAS.filter(function (x) { return x.fecha === fecha; })[0];
    if (!d) return [];
    var out = [];
    (d.actividades || []).forEach(function (a) {
      (a.paradas || []).forEach(function (id) {
        var r = paradaPorId(id);
        if (r) out.push(r.p);
      });
    });
    return out;
  }

  function minutosDeParada(p) {
    return Math.max(1, Math.round(p.guion.length / CARACTERES_POR_MINUTO));
  }

  function hoyISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }

  function diaPorDefecto() {
    var hoy = hoyISO();
    for (var i = 0; i < DIAS.length; i++) if (DIAS[i].fecha >= hoy) return DIAS[i].fecha;
    return DIAS.length ? DIAS[DIAS.length - 1].fecha : null;
  }

  function pasesDelDia(fecha) {
    return pasesCache.filter(function (p) { return p.fecha === fecha; });
  }

  /* Las actividades se marcan como hechas con un toque en el círculo. La clave
     es fecha + posición: los días vienen de dias.js y no tienen id propio. */
  var actHechas = store.get("actHechas", {});

  function claveAct(fecha, i) { return fecha + "#" + i; }

  /* Qué bloques de audio se abrieron a mano. Un bloque con 3 o más audios
     arranca colapsado: si no, una sala de museo te empuja el día entero. */
  var audiosAbiertos = {};

  function filaActividad(a, fecha, i) {
    var k = claveAct(fecha, i);
    var lista = !!actHechas[k];
    var h = '<div class="fila' + (lista ? " hecha" : "") + '">';
    h += '<div class="fila-h">' + esc(a.hora) + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-t"><button class="tic" data-act="' + esc(k) + '" ' +
         'aria-pressed="' + lista + '" aria-label="Marcar como hecha">' +
         (lista ? "&#10003;" : "") + "</button>";
    h += "<span>" + esc(a.titulo) + "</span></div>";
    (a.detalle || []).forEach(function (d) {
      h += '<div class="fila-d">' + esc(d) + "</div>";
    });
    var pegados = pasesDelDia(fecha).filter(function (x) { return x.actividad === k; });
    if ((a.paradas && a.paradas.length) || pegados.length) {
      h += '<div class="fila-audio">';
      pegados.forEach(function (x) {
        h += '<button class="mini-play ver" data-verpase="' + esc(x.id) + '">';
        h += '<span class="mp-ico">&#9744;</span>';
        h += '<span class="mp-t">' + esc(x.titulo) + "</span>";
        h += '<span class="mp-m">' + esc(nombreTipo(x.tipo).toLowerCase()) + "</span></button>";
      });
      var refs = (a.paradas || []).map(paradaPorId).filter(Boolean);
      var mins = refs.reduce(function (s2, r) { return s2 + minutosDeParada(r.p); }, 0);
      if (refs.length >= 3 && !audiosAbiertos[k]) {
        h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
        h += '<span class="mp-ico">&#9835;</span>';
        h += '<span class="mp-t">' + refs.length + " audios &middot; " + mins + " min</span>";
        h += '<span class="mp-m">ver</span></button>';
      } else {
        refs.forEach(function (r) {
          var id = r.p.id, listo = hechas[id], esTramo = r.p.tipo === "tramo";
          h += '<button class="mini-play' + (listo ? " listo" : "") +
               (esTramo ? " tramo" : "") + '" data-tocar="' + esc(id) + '">';
          h += '<span class="mp-ico">' +
               (listo ? "&#10003;" : esTramo ? "&#8599;" : "&#9654;") + "</span>";
          h += '<span class="mp-t">' + esc(r.p.titulo);
          /* Solo el tramo necesita aclaración: la parada es el caso normal, y
             ponerle "parate acá" a todo hacía el día más alto y más ruidoso. */
          if (esTramo) h += '<span class="mp-tipo">mientras caminás</span>';
          h += "</span>";
          h += '<span class="mp-m">' + minutosDeParada(r.p) + " min</span>";
          h += "</button>";
        });
        if (refs.length >= 3) {
          h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
          h += '<span class="mp-ico">&#9652;</span><span class="mp-t">Ocultar</span>';
          h += '<span class="mp-m"></span></button>';
        }
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }

  function filaPase(p) {
    var h = '<div class="fila pase-fila">';
    h += '<div class="fila-h">' + esc(p.hora || "") + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-tipo">' + esc(nombreTipo(p.tipo)) + " &middot; pase</div>";
    h += '<div class="fila-t">' + esc(p.titulo) + "</div>";
    if (p.codigo) h += '<div class="fila-cod">' + esc(p.codigo) + "</div>";
    if (p.nota) h += '<div class="fila-d">' + esc(p.nota) + "</div>";
    h += '<div class="fila-audio"><button class="mini-play ver" data-verpase="' + esc(p.id) + '">';
    h += '<span class="mp-ico">&#9744;</span><span class="mp-t">Ver el pase</span></button></div>';
    h += "</div></div>";
    return h;
  }

  function cuerpoDia(d) {
    var items = [];
    (d.actividades || []).forEach(function (a, i) {
      items.push({ hora: a.hora || "99:99", html: filaActividad(a, d.fecha, i) });
    });
    /* Los pases enganchados a una actividad ya se dibujaron dentro de ella.
       Los sueltos van por hora, y los que no tienen hora al final — antes
       caían primeros y te aparecía el pase arriba de todo el día. */
    pasesDelDia(d.fecha).forEach(function (p) {
      if (p.actividad) return;
      items.push({ hora: p.hora || "99:98", html: filaPase(p) });
    });
    items.sort(function (a, b) { return a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0; });

    var h = '<div class="linea">' + items.map(function (x) { return x.html; }).join("") + "</div>";
    if (d.notas && d.notas.length) {
      h += '<div class="dia-notas">';
      d.notas.forEach(function (n) { h += "<div>" + esc(n) + "</div>"; });
      h += "</div>";
    }
    return h;
  }

  function cabeceraDia(d) {
    var nAud = (d.actividades || []).reduce(function (s, a) {
      return s + ((a.paradas && a.paradas.length) || 0);
    }, 0);
    var nPas = pasesDelDia(d.fecha).length;
    var total = (d.actividades || []).length;
    var listas = 0;
    for (var i = 0; i < total; i++) if (actHechas[claveAct(d.fecha, i)]) listas++;
    var partes = [listas ? listas + " de " + total + " hechas" : total + " actividades"];
    if (nAud) partes.push(nAud + (nAud === 1 ? " audioguía" : " audioguías"));
    if (nPas) partes.push(nPas + (nPas === 1 ? " pase" : " pases"));

    var h = '<button class="dia-cab">';
    h += '<div class="dia-top"><span class="dia-n">Día ' + d.n + "</span>";
    h += '<span class="dia-f">' + esc(fechaLarga(d.fecha)) + "</span></div>";
    h += "<h3>" + esc(d.titulo) + "</h3>";
    h += '<div class="dia-tags">' + esc(partes.join(" · ")) + "</div>";
    if (nAud) {
      var minDia = paradasDelDia(d.fecha).reduce(function (s2, p) {
        return s2 + minutosDeParada(p);
      }, 0);
      h += '<span class="dia-play" data-diaplay="' + esc(d.fecha) + '">' +
           "&#9654; Reproducir el día &middot; " + minDia + " min</span>";
    }
    h += '<span class="dia-flecha">&#9662;</span>';
    h += "</button>";
    return h;
  }

  function renderItin() {
    if (diaAbierto === undefined) diaAbierto = diaPorDefecto();
    /* El itinerario es la lista de días y nada más. Los avisos y los tramos
       viven en Práctico: acá estorbaban arriba de todo. */
    var h = "";

    IT.ciudades.forEach(function (c) {
      var dd = DIAS.filter(function (x) { return x.ciudad === c.id; });
      if (!dd.length) return;

      h += '<h2 class="sec">' + esc(c.nombre) + " &middot; " + fechaCorta(c.desde) +
           " &rarr; " + fechaCorta(c.hasta) + "</h2>";

      var alo = IT.alojamientos.filter(function (a) { return a.ciudad === c.id; })[0];
      if (alo) {
        h += '<div class="alo">';
        if (alo.estado === "reservado") {
          h += '<div class="eyebrow">Alojamiento</div><div class="alo-t">' + esc(alo.nombre) + "</div>";
          var bits = [];
          if (alo.zona) bits.push(alo.zona);
          if (alo.plataforma) bits.push(alo.plataforma);
          if (alo.checkin) bits.push("check-in " + alo.checkin);
          h += '<div class="alo-s">' + esc(bits.join(" · ")) + "</div>";
        } else {
          h += '<div class="eyebrow" style="color:var(--alert)">Alojamiento sin reservar</div>';
          h += '<div class="alo-s">' + esc(alo.nota || "") + "</div>";
        }
        h += "</div>";
      }

      dd.forEach(function (d) {
        var abierto = d.fecha === diaAbierto;
        h += '<article class="dia' + (abierto ? " abierto" : "") + '" data-dia="' + esc(d.fecha) + '">';
        h += cabeceraDia(d);
        h += '<div class="dia-cuerpo"' + (abierto ? "" : " hidden") + ">";
        h += abierto ? cuerpoDia(d) : "";
        h += "</div></article>";
      });
    });

    el("view-itin").innerHTML = h;
  }
  function legHTML(t, etiqueta) {
    if (!t) return "";
    var h = '<div class="leg">';
    h += '<div class="leg-top"><span class="leg-op">' + esc(t.operador) + '</span>';
    h += '<span class="leg-date">' + fechaCorta(t.fecha) + "</span></div>";
    h += '<div class="leg-route">';
    h += '<div class="leg-pt from"><div class="time">' + esc(t.sale) + '</div><div class="place">' + esc(t.desde) + "</div></div>";
    h += '<div class="leg-arrow">&#9679;&mdash;&#9679;</div>';
    h += '<div class="leg-pt to"><div class="time">' + esc(t.llega) + '</div><div class="place">' + esc(t.hasta) + "</div></div>";
    h += "</div>";
    if (t.detalle) h += '<div class="leg-foot">' + esc(t.detalle) + "</div>";
    h += '<div class="chips">';
    h += t.estado === "comprado" ? '<span class="chip ok">comprado</span>' : '<span class="chip wait">falta comprar</span>';
    if (t.codigo) h += '<span class="chip code">' + esc(t.codigo) + "</span>";
    if (t.precio) h += '<span class="chip">' + esc(t.precio) + "</span>";
    h += "</div></div>";
    return h;
  }

  /* ================= VISTA: AUDIOGUÍAS ================= */
  /* Huella del texto de cada parada. Si reescribo un guion, cambia la huella,
     cambia la URL del MP3 y el celular se baja SOLO esa pista de nuevo.
     Es FNV-1a de 32 bits: el mismo algoritmo está en generar_audio.py. */
  function huella(texto) {
    var bytes = unescape(encodeURIComponent(texto));
    var h = 0x811c9dc5;
    for (var i = 0; i < bytes.length; i++) {
      h ^= bytes.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ("0000000" + h.toString(16)).slice(-8);
  }

  function urlParada(p) {
    return "audio/" + p.id + ".mp3?v=" + huella((p.voz || "") + "\n" + p.guion);
  }

  /* ===== descargas para usar sin conexión ===== */
  var BYTES_POR_CARACTER = 243;   // medido sobre los MP3 reales a velocidad 1,1
  var sw = null;
  var progresos = {};
  var estadosCache = {};

  function grupos() {
    var g = {};
    GUIAS.forEach(function (guia) {
      var k = guia.ciudad;
      if (!g[k]) g[k] = { ciudad: k, nombre: nombreCiudad(k), paradas: [], chars: 0 };
      guia.paradas.forEach(function (p) {
        g[k].paradas.push(urlParada(p));
        g[k].chars += p.guion.length;
      });
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  }

  function urlsDe(grupo) {
    return grupo.paradas.map(function (u) { return new URL(u, location.href).href; });
  }

  function todasLasUrls() {
    var out = [];
    grupos().forEach(function (g) { out = out.concat(urlsDe(g)); });
    return out;
  }

  function mb(bytes) { return (bytes / 1048576).toFixed(1).replace(".", ",") + " MB"; }

  function preguntarSW(msg) {
    return new Promise(function (res) {
      if (!sw) return res(null);
      var ch = new MessageChannel();
      var listo = false;
      ch.port1.onmessage = function (e) { listo = true; res(e.data); };
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { return res(null); }
      setTimeout(function () { if (!listo) res(null); }, 8000);
    });
  }

  function renderOffline() {
    var cont = el("offline-box");
    if (!cont) return;
    if (!sw) {
      cont.innerHTML = '<h3>Audio sin conexión</h3><div class="nota">' +
        "Esta función necesita que abras la app desde su dirección de internet, " +
        "no desde un archivo suelto. Mientras tanto, las paradas se leen con la voz del equipo.</div>";
      return;
    }
    var h = '<h3>Audio sin conexión</h3>';
    h += '<div class="nota">Descargá el audio con wifi antes de viajar. ' +
         "Una vez guardado queda en el teléfono y funciona sin señal y sin datos.</div>";
    grupos().forEach(function (g) {
      var est = mb(g.chars * BYTES_POR_CARACTER);
      var pr = progresos[g.ciudad];
      var guardadas = estadosCache[g.ciudad] === undefined ? null : estadosCache[g.ciudad];
      var completo = guardadas === g.paradas.length;
      h += '<div class="desc-fila' + (completo ? " lista" : "") + '" data-ciudad="' + esc(g.ciudad) + '">';
      h += "<div><div class=\"desc-nom\">" + esc(g.nombre) + "</div>";
      h += '<div class="desc-det">' + g.paradas.length + " pistas · " + est +
           (guardadas === null ? "" : completo ? " · guardado" : " · " + guardadas + " de " + g.paradas.length) +
           "</div></div>";
      if (pr) {
        h += '<button class="desc-btn" disabled>' + pr.hechas + "/" + pr.total + "</button>";
        h += '<div class="desc-barra"><i style="width:' +
             Math.round(pr.hechas / pr.total * 100) + '%"></i></div>';
      } else if (completo) {
        h += '<button class="desc-btn sec" data-borrar="' + esc(g.ciudad) + '">Borrar</button>';
      } else {
        h += '<button class="desc-btn" data-bajar="' + esc(g.ciudad) + '">Descargar</button>';
      }
      h += "</div>";
    });
    h += '<button class="desc-btn sec" id="diag-btn" style="margin-top:12px">Verificar audio guardado</button>';
    h += '<pre id="diag-out" class="diag" hidden></pre>';
    cont.innerHTML = h;
  }

  /* Comprueba que lo que la app pide sea exactamente lo que el service worker
     guardó. Si alguna vez vuelve a sonar la voz del equipo estando offline,
     esto dice por qué en una pantalla. */
  function diagnosticar() {
    var out = el("diag-out");
    if (!out) return;
    out.hidden = false;
    out.textContent = "Probando...";
    var gs = grupos();
    if (!gs.length || !sw) { out.textContent = "Sin service worker."; return; }
    var urls = urlsDe(gs[0]).slice(0, 3);
    preguntarSW({ tipo: "probar", urls: urls }).then(function (r) {
      if (!r) { out.textContent = "El service worker no respondio."; return; }
      if (r.error) { out.textContent = "Error: " + r.error; return; }
      var t = "guardadas: " + r.guardadas + "\n";
      t += "conexion: " + (navigator.onLine ? "si" : "no") + "\n";
      t += "ejemplo guardado:\n  " + (r.ejemplo || "(ninguno)") + "\n\n";
      (r.pruebas || []).forEach(function (x) {
        t += (x.ok ? "OK  " : "NO  ") + x.url.split("/").pop() + "\n";
        if (x.ok) t += "     " + x.tipo + " - " + x.bytes + " bytes\n";
      });
      out.textContent = t;
    });
  }

  function refrescarEstados() {
    var gs = grupos();
    var pend = gs.length;
    if (!pend || !sw) { renderOffline(); return; }
    gs.forEach(function (g) {
      preguntarSW({ tipo: "estado", urls: urlsDe(g) }).then(function (r) {
        g.guardadas = r ? r.guardadas : 0;
        estadosCache[g.ciudad] = g.guardadas;
        if (--pend === 0) {
          renderOffline();
          preguntarSW({ tipo: "limpiar", urls: todasLasUrls() });
        }
      });
    });
  }

  /* Medido sobre el MP3 real: 2492 caracteres = 175,5 s a velocidad 0,95,
     o sea unos 986 caracteres por minuto a la velocidad actual de 1,1. */
  var CARACTERES_POR_MINUTO = 986;

  function duracionGuia(g) {
    var chars = 0;
    g.paradas.forEach(function (p) { chars += p.guion.length; });
    var min = Math.round(chars / CARACTERES_POR_MINUTO);
    return g.paradas.length + " paradas · " + min + " min de audio";
  }

  /* ================= VISTA: PENDIENTES ================= */

  /* ================= REPRODUCTOR ================= */
  var reproductor = {
    lista: [], idx: -1, modo: null, audio: null, tocando: false, rate: 1, arrastrando: false,
    rates: [1, 1.15, 1.3, 0.85]
  };

  function soporteVoz() { return typeof speechSynthesis !== "undefined"; }

  function abrirPlayer() {
    el("player").hidden = false;
    document.body.classList.add("con-player");
  }

  function cargarParada(i) {
    if (!guiaActual) return;
    cargarLista(guiaActual.paradas, i);
  }

  /* Antes el reproductor solo sabía encadenar las paradas de una guía. Ahora
     recibe la lista, así "Reproducir el día" puede pasarle el día entero. */
  function cargarLista(lista, i) {
    if (!lista || i < 0 || i >= lista.length) return;
    detener(true);
    reproductor.lista = lista;
    reproductor.idx = i;
    var p = lista[i];
    el("player-title").textContent = p.titulo;
    abrirPlayer();
    marcarActiva(p.id);
    abrirCuerpo(p.id);
    reproducir(p);
    progreso(0);
    refrescarTiempos();
  }

  function reproducirDia(fecha) {
    var lista = paradasDelDia(fecha);
    if (!lista.length) return;
    var r = paradaPorId(lista[0].id);
    if (r) guiaActual = r.guia;
    cargarLista(lista, 0);
  }

  function marcarActiva(id) {
    Array.prototype.forEach.call(document.querySelectorAll(".parada"), function (n) {
      n.classList.toggle("playing", n.getAttribute("data-parada") === id);
    });
  }

  /* Al reproducir NO se abre el guion: la audioguía es para escuchar caminando.
     El texto se despliega solo si lo pedís con "Ver texto". */
  function abrirCuerpo(id) {
    var nodo = document.querySelector('.parada[data-parada="' + id + '"]');
    if (!nodo) return;
    nodo.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function reproducir(p) {
    var src = AUDIO_BASE + p.id + ".mp3?v=" + huella((p.voz || "") + "\n" + p.guion);
    var a = new Audio();
    a.preload = "auto";
    /* defaultPlaybackRate y no solo playbackRate: al asignar src el navegador
       corre el algoritmo de carga, que pisa playbackRate con el valor por
       defecto. Si solo se setea playbackRate acá, la pista siguiente arranca
       en 1× aunque el botón siga diciendo 1,3×. Se reaplica al cargar y al
       empezar a sonar porque no todos los navegadores se comportan igual. */
    a.defaultPlaybackRate = reproductor.rate;
    a.playbackRate = reproductor.rate;
    var falloAMP3 = false;

    a.addEventListener("loadedmetadata", function () {
      a.playbackRate = reproductor.rate;
      refrescarTiempos();
    });

    a.addEventListener("error", function () {
      if (falloAMP3) return;
      falloAMP3 = true;
      leerConVoz(p);
    });
    a.addEventListener("timeupdate", function () {
      if (a.duration) progreso(a.currentTime / a.duration);
      refrescarTiempos();
    });
    a.addEventListener("durationchange", refrescarTiempos);
    a.addEventListener("ended", function () { finParada(); });
    a.addEventListener("playing", function () {
      a.playbackRate = reproductor.rate;
      reproductor.modo = "mp3";
      el("player-src").textContent = "audio";
      setTocando(true);
      ponerMediaSession(p);
    });
    a.src = src;
    reproductor.audio = a;
    var pr = a.play();
    if (pr && pr.catch) {
      pr.catch(function () { if (!falloAMP3) { falloAMP3 = true; leerConVoz(p); } });
    }
  }

  function leerConVoz(p) {
    reproductor.audio = null;
    if (!soporteVoz()) {
      el("player-src").textContent = "sin audio";
      setTocando(false);
      return;
    }
    reproductor.modo = "voz";
    el("player-src").textContent = "voz del equipo";
    try { speechSynthesis.cancel(); } catch (e) {}
    var texto = p.guion.replace(/\n\n/g, ". ");
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    u.rate = reproductor.rate;
    var voces = [];
    try { voces = speechSynthesis.getVoices() || []; } catch (e) {}
    var esp = voces.filter(function (v) { return /^es/i.test(v.lang); });
    if (esp.length) u.voice = esp[0];
    var total = texto.length;
    u.onboundary = function (ev) { if (ev.charIndex && total) progreso(ev.charIndex / total); };
    u.onend = function () { finParada(); };
    u.onerror = function () { setTocando(false); };
    reproductor.utter = u;
    try { speechSynthesis.speak(u); setTocando(true); } catch (e) { setTocando(false); }
  }

  function ponerMediaSession(p) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: p.titulo,
        artist: guiaActual ? guiaActual.titulo : "Eurotrip 2026",
        album: p.sala || "",
        artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }]
      });
      navigator.mediaSession.setActionHandler("play", function () {
        if (reproductor.audio) { reproductor.audio.play(); setTocando(true); }
      });
      navigator.mediaSession.setActionHandler("pause", function () {
        if (reproductor.audio) { reproductor.audio.pause(); setTocando(false); }
      });
      navigator.mediaSession.setActionHandler("previoustrack", function () {
        if (reproductor.idx > 0) cargarLista(reproductor.lista, reproductor.idx - 1);
      });
      navigator.mediaSession.setActionHandler("nexttrack", function () {
        if (reproductor.idx < reproductor.lista.length - 1) {
          cargarLista(reproductor.lista, reproductor.idx + 1);
        }
      });
    } catch (e) {}
  }

  function progreso(f) {
    if (reproductor.arrastrando) return;   /* mientras arrastrás manda tu dedo */
    var pc = Math.max(0, Math.min(1, f)) * 100;
    el("player-bar").style.width = pc + "%";
    el("player-knob").style.left = pc + "%";
    el("player-seek").setAttribute("aria-valuenow", Math.round(pc));
  }

  function mmss(s) {
    if (!isFinite(s) || s < 0) return "--:--";
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  /* La voz del navegador no se puede recorrer: no hay duración ni posición.
     Cuando el audio es esa, la barra y los ±15 s quedan apagados. */
  function barraUtilizable() {
    var a = reproductor.audio;
    return !!(a && isFinite(a.duration) && a.duration > 0);
  }

  function refrescarTiempos() {
    var a = reproductor.audio, ok = barraUtilizable();
    el("player-cur").textContent = ok ? mmss(a.currentTime) : "0:00";
    el("player-tot").textContent = ok ? mmss(a.duration) : "--:--";
    el("player-seek").setAttribute("aria-disabled", ok ? "false" : "true");
    el("player-seek").style.opacity = ok ? "" : ".45";
    el("btn-back").disabled = !ok;
    el("btn-fwd").disabled = !ok;
  }

  function saltar(seg) {
    var a = reproductor.audio;
    if (!barraUtilizable()) return;
    a.currentTime = Math.max(0, Math.min(a.duration - 0.2, a.currentTime + seg));
    progreso(a.currentTime / a.duration);
    refrescarTiempos();
  }

  function irA(fraccion) {
    var a = reproductor.audio;
    if (!barraUtilizable()) return;
    a.currentTime = Math.max(0, Math.min(1, fraccion)) * a.duration;
    refrescarTiempos();
  }

  function setTocando(v) {
    reproductor.tocando = v;
    el("btn-play").innerHTML = v ? "&#10073;&#10073;" : "&#9654;";
    el("btn-play").setAttribute("aria-label", v ? "Pausar" : "Reproducir");
  }

  function finParada() {
    var p = reproductor.lista[reproductor.idx];
    if (p) { hechas[p.id] = true; store.set("hechas", hechas); refrescarMarca(p.id); }
    progreso(1);
    if (reproductor.idx < reproductor.lista.length - 1) {
      cargarLista(reproductor.lista, reproductor.idx + 1);
    } else setTocando(false);
  }

  function refrescarMarca(id) {
    var nodo = document.querySelector('.parada[data-parada="' + id + '"]');
    if (!nodo) return;
    nodo.classList.add("done");
    var b = nodo.querySelector(".marcar");
    if (b) b.innerHTML = "&#10003; Escuchada";
  }

  function detener(silencioso) {
    if (reproductor.audio) { try { reproductor.audio.pause(); } catch (e) {} reproductor.audio = null; }
    if (soporteVoz()) { try { speechSynthesis.cancel(); } catch (e) {} }
    setTocando(false);
    if (!silencioso) {
      progreso(0);
      el("player-cur").textContent = "0:00";
      el("player-tot").textContent = "--:--";
      el("player").hidden = true;
      document.body.classList.remove("con-player");
      marcarActiva(null);
      reproductor.idx = -1;
    }
  }

  el("btn-play").addEventListener("click", function () {
    if (reproductor.idx < 0) return;
    if (reproductor.tocando) {
      if (reproductor.audio) reproductor.audio.pause();
      else if (soporteVoz()) { try { speechSynthesis.pause(); } catch (e) {} }
      setTocando(false);
    } else {
      if (reproductor.audio) reproductor.audio.play();
      else if (soporteVoz()) {
        try {
          if (speechSynthesis.paused) speechSynthesis.resume();
          else leerConVoz(reproductor.lista[reproductor.idx]);
        } catch (e) {}
      }
      setTocando(true);
    }
  });
  /* Arrastre de la barra. Se usa pointer* para que funcione igual con el dedo
     y con el mouse, y setPointerCapture para no perder el dedo si se te va
     fuera de la barra mientras arrastrás. */
  (function () {
    var hit = el("player-seek");
    function fraccion(ev) {
      var r = hit.getBoundingClientRect();
      return r.width ? (ev.clientX - r.left) / r.width : 0;
    }
    function pintar(f) {
      var pc = Math.max(0, Math.min(1, f)) * 100;
      el("player-bar").style.width = pc + "%";
      el("player-knob").style.left = pc + "%";
      el("player-seek").setAttribute("aria-valuenow", Math.round(pc));
      var a = reproductor.audio;
      if (a && isFinite(a.duration)) el("player-cur").textContent = mmss(a.duration * pc / 100);
    }
    hit.addEventListener("pointerdown", function (ev) {
      if (!barraUtilizable()) return;
      reproductor.arrastrando = true;
      hit.classList.add("arrastrando");
      hit.setPointerCapture(ev.pointerId);
      pintar(fraccion(ev));
      ev.preventDefault();
    });
    hit.addEventListener("pointermove", function (ev) {
      if (reproductor.arrastrando) pintar(fraccion(ev));
    });
    function soltar(ev) {
      if (!reproductor.arrastrando) return;
      var f = fraccion(ev);
      reproductor.arrastrando = false;
      hit.classList.remove("arrastrando");
      irA(f);
    }
    hit.addEventListener("pointerup", soltar);
    hit.addEventListener("pointercancel", function () {
      reproductor.arrastrando = false;
      hit.classList.remove("arrastrando");
      var a = reproductor.audio;
      if (a && isFinite(a.duration)) progreso(a.currentTime / a.duration);
    });
    hit.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft") { saltar(-5); ev.preventDefault(); }
      else if (ev.key === "ArrowRight") { saltar(5); ev.preventDefault(); }
      else if (ev.key === "Home") { irA(0); ev.preventDefault(); }
      else if (ev.key === "End") { irA(0.99); ev.preventDefault(); }
    });
  })();

  /* ================= PASES: pasajes, entradas y reservas =================

     Todo vive en el teléfono, en IndexedDB, al lado del audio descargado.
     NADA de esto se publica nunca: el repositorio es público y el QR de un
     pase de embarque es la credencial misma, no una referencia a ella.

     Para tener lo mismo en los dos teléfonos hay Exportar e Importar: se
     genera un archivo cifrado con una contraseña y se lo pasa por donde sea.
     Ese mismo archivo sirve de respaldo si un teléfono borra los datos del
     sitio, que en iOS pasa. */

  var TIPOS = [
    { id: "vuelo",   nombre: "Vuelo" },
    { id: "tren",    nombre: "Tren" },
    { id: "bus",     nombre: "Bus" },
    { id: "ferry",   nombre: "Ferry" },
    { id: "entrada", nombre: "Entrada" },
    /* "tour" y "pase" ya venían en los pases importados: sin esta línea
       nombreTipo() caía en el "Otro" del final y catorce pases se mostraban
       sin tipo. */
    { id: "tour",    nombre: "Tour" },
    { id: "pase",    nombre: "Pase" },
    { id: "aloj",    nombre: "Alojamiento" },
    { id: "otro",    nombre: "Otro" }
  ];

  function nombreTipo(id) {
    for (var i = 0; i < TIPOS.length; i++) if (TIPOS[i].id === id) return TIPOS[i].nombre;
    return "Otro";
  }

  /* ---------- guardado ---------- */
  var DB = null;

  function abrirDB() {
    if (DB) return Promise.resolve(DB);
    return new Promise(function (ok, mal) {
      var r = indexedDB.open("eurotrip-pases", 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains("pases")) d.createObjectStore("pases", { keyPath: "id" });
      };
      r.onsuccess = function () { DB = r.result; ok(DB); };
      r.onerror = function () { mal(r.error); };
    });
  }

  function tx(modo) {
    return abrirDB().then(function (d) { return d.transaction("pases", modo).objectStore("pases"); });
  }

  function guardarPase(p) {
    return tx("readwrite").then(function (s) {
      return new Promise(function (ok, mal) {
        var r = s.put(p);
        r.onsuccess = function () { ok(p); };
        r.onerror = function () { mal(r.error); };
      });
    });
  }

  function leerPases() {
    return tx("readonly").then(function (s) {
      return new Promise(function (ok, mal) {
        var r = s.getAll();
        r.onsuccess = function () {
          var v = r.result || [];
          var clave = function (x) { return (x.fecha || "9999-99-99") + " " + (x.hora || "99:99"); };
          v.sort(function (a, b) { return clave(a) < clave(b) ? -1 : 1; });
          ok(v);
        };
        r.onerror = function () { mal(r.error); };
      });
    });
  }

  function borrarPaseDB(id) {
    return tx("readwrite").then(function (s) {
      return new Promise(function (ok) { var r = s.delete(id); r.onsuccess = function () { ok(); }; });
    });
  }

  /* ---------- PDF a imagen, solo si hace falta ----------
     pdf.js son 1,8 MB. No se precarga con la app: se baja la primera vez que
     importás un PDF y queda en una caché aparte que las publicaciones nuevas
     no borran, así se baja una sola vez en la vida. */
  var pdfjs = null;

  function cargarPdfjs() {
    if (pdfjs) return Promise.resolve(pdfjs);
    return import("./vendor/pdf.min.mjs").then(function (m) {
      m.GlobalWorkerOptions.workerSrc = "./vendor/pdf.worker.min.mjs";
      pdfjs = m;
      return m;
    });
  }

  function pdfAImagenes(archivo) {
    return cargarPdfjs().then(function (m) {
      return archivo.arrayBuffer().then(function (buf) {
        return m.getDocument({ data: buf }).promise;
      });
    }).then(function (doc) {
      var paginas = [];
      for (var i = 1; i <= doc.numPages; i++) paginas.push(i);
      return paginas.reduce(function (cadena, n) {
        return cadena.then(function (acum) {
          return doc.getPage(n).then(function (pag) {
            /* 2x da un QR nítido sin que el archivo se vaya de escala. */
            var vp = pag.getViewport({ scale: 2 });
            var c = document.createElement("canvas");
            c.width = vp.width; c.height = vp.height;
            return pag.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise
              .then(function () {
                return new Promise(function (ok) {
                  c.toBlob(function (b) { acum.push(b); ok(acum); }, "image/jpeg", 0.92);
                });
              });
          });
        });
      }, Promise.resolve([]));
    });
  }

  function archivoAImagenes(f) {
    if (f.type === "application/pdf") return pdfAImagenes(f);
    return Promise.resolve([f]);
  }

  /* ---------- alta ---------- */
  var borrador = null;

  function nuevoPase(archivos) {
    var lista = Array.prototype.slice.call(archivos);
    if (!lista.length) return;
    el("pase-estado").textContent = "Procesando " + lista.length + " archivo(s)...";
    el("pase-estado").hidden = false;
    lista.reduce(function (cadena, f) {
      return cadena.then(function (acum) {
        return archivoAImagenes(f).then(function (imgs) { return acum.concat(imgs); });
      });
    }, Promise.resolve([])).then(function (imagenes) {
      borrador = {
        id: "p" + Date.now() + Math.floor(Math.random() * 1000),
        tipo: "entrada", titulo: "", fecha: "", hora: "", actividad: "",
        codigo: "", nota: "",
        imagenes: imagenes, creado: Date.now()
      };
      el("pase-estado").hidden = true;
      abrirFormulario();

      el("pase-estado").textContent = "No pude leer ese archivo: " + e;
    });

  function abrirFormulario() {

  function confirmarPase() {

  /* ---------- lista ---------- */
  function fechaLarga(iso) {
    if (!iso) return "Sin fecha";
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
    var mes = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio",
               "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
    return dias[d.getDay()] + " " + d.getDate() + " de " + mes[d.getMonth()];
  }

  function refrescarPases() {
    return leerPases().then(function (ps) {
      pasesCache = ps;
      if (el("view-itin")) renderItin();

  function renderPases() {

      var dia = null;

          dia = p.fecha;
          h += '<h2 class="sec">' + esc(fechaLarga(dia)) + "</h2>";

        h += '<div class="pase" data-pase="' + esc(p.id) + '">';
        h += '<div class="pase-cab"><span class="pase-tipo">' + esc(nombreTipo(p.tipo)) +
             (p.hora ? " &middot; " + esc(p.hora) : "") + "</span>";
        h += '<span class="pase-n">' + p.imagenes.length + "</span></div>";
        h += '<div class="pase-t">' + esc(p.titulo) + "</div>";
        if (p.codigo) h += '<div class="pase-cod">' + esc(p.codigo) + "</div>";
        if (p.nota) h += '<div class="pase-nota">' + esc(p.nota) + "</div>";
        h += '<div class="pase-acc"><button class="pase-ver">Ver</button>' +
             '<button class="pase-del">Borrar</button></div>';
        h += "</div>";
      });
      h += '<div class="nota pase-pie">' + ps.length + ' pase(s) guardados en este teléfono. ' +
           'Usá <b>Exportar</b> para pasárselos al otro y para tener un respaldo.</div>';
      cont.innerHTML = h;
    });

  /* ---------- visor ---------- */
  var visor = { urls: [], i: 0, lock: null };

  function verPase(id) {
    leerPases().then(function (ps) {
      var p = ps.filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      visor.urls.forEach(URL.revokeObjectURL);
      visor.urls = p.imagenes.map(function (b) { return URL.createObjectURL(b); });

      pintarVisor();
      el("visor").hidden = false;
      document.body.classList.add("sin-scroll");
      /* La pantalla no se apaga mientras mostrás un código. */
      if (navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) { visor.lock = l; })
          .catch(function () {});
      }
    });
  }

  function pintarVisor() {
    el("visor-img").src = visor.urls[visor.i];
    el("visor-n").textContent = visor.urls.length > 1
      ? (visor.i + 1) + " / " + visor.urls.length : "";
    el("visor-ant").hidden = visor.urls.length < 2;
    el("visor-sig").hidden = visor.urls.length < 2;
  }

  function cerrarVisor() {
    el("visor").hidden = true;
    document.body.classList.remove("sin-scroll");
    if (visor.lock) { try { visor.lock.release(); } catch (e) {} visor.lock = null; }
    visor.urls.forEach(URL.revokeObjectURL);

  /* ---------- exportar e importar, cifrado ----------
     AES-256-GCM con la clave derivada de la contraseña por PBKDF2. Lo hace el
     navegador solo, sin librerías. El archivo que sale es: salt (16 bytes),
     iv (12) y el resto cifrado. Sin la contraseña no hay nada que hacer con él,
     y por eso la contraseña tiene que ser larga: cuatro o cinco palabras. */
  var VUELTAS = 310000;

  function derivar(pass, salt) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2",
                                   false, ["deriveKey"])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: VUELTAS, hash: "SHA-256" },
          km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }

  function blobAB64(b) {
    return new Promise(function (ok) {
      var r = new FileReader();
      r.onload = function () { ok(r.result.split(",")[1]); };
      r.readAsDataURL(b);
    });
  }

  function b64ABlob(s, tipo) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Blob([u], { type: tipo || "image/jpeg" });
  }

  function exportarPases() {
    var pass = prompt("Elegí una contraseña para el archivo.\n\n" +
                      "Tiene que ser larga: cuatro o cinco palabras sueltas.\n" +
                      "Si la perdés, el archivo no se puede abrir.");
    if (!pass) return;
    if (pass.length < 12) { alert("Muy corta. Poné al menos 12 caracteres."); return; }
    el("pase-estado").hidden = false;
    el("pase-estado").textContent = "Cifrando...";

    leerPases().then(function (ps) {
      return Promise.all(ps.map(function (p) {
        return Promise.all(p.imagenes.map(function (b) {
          return blobAB64(b).then(function (d) { return { t: b.type, d: d }; });
        })).then(function (imgs) {
          return { id: p.id, tipo: p.tipo, titulo: p.titulo, fecha: p.fecha,
                   hora: p.hora, actividad: p.actividad || "",
                   codigo: p.codigo, nota: p.nota,
                   creado: p.creado, imgs: imgs };
        });
      }));
    }).then(function (plano) {
      var salt = crypto.getRandomValues(new Uint8Array(16));
      var iv = crypto.getRandomValues(new Uint8Array(12));
      var datos = new TextEncoder().encode(JSON.stringify({ v: 1, pases: plano }));
      return derivar(pass, salt).then(function (k) {
        return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, datos);
      }).then(function (cif) {
        var out = new Uint8Array(16 + 12 + cif.byteLength);
        out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(cif), 28);
        var url = URL.createObjectURL(new Blob([out], { type: "application/octet-stream" }));
        var a = document.createElement("a");
        a.href = url; a.download = "pases-eurotrip.cifrado";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        el("pase-estado").textContent =
          "Listo. Mandale ese archivo al otro teléfono y pasale la contraseña por otro lado.";
      });
    }).catch(function (e) {
      el("pase-estado").textContent = "Falló el cifrado: " + e;
    });
  }

  function importarPases(archivo) {
    var pass = prompt("Contraseña del archivo:");
    if (!pass) return;
    el("pase-estado").hidden = false;
    el("pase-estado").textContent = "Descifrando...";
    archivo.arrayBuffer().then(function (buf) {
      var u = new Uint8Array(buf);
      var salt = u.slice(0, 16), iv = u.slice(16, 28), cif = u.slice(28);
      return derivar(pass, salt).then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, cif);
      });
    }).then(function (claro) {
      var obj = JSON.parse(new TextDecoder().decode(claro));
      var ps = (obj.pases || []).map(function (p) {
        return { id: p.id, tipo: p.tipo, titulo: p.titulo, fecha: p.fecha,
                 hora: p.hora || "", actividad: p.actividad || "",
                 codigo: p.codigo, nota: p.nota, creado: p.creado,
                 imagenes: p.imgs.map(function (x) { return b64ABlob(x.d, x.t); }) };
      });
      return ps.reduce(function (c, p) {
        return c.then(function () { return guardarPase(p); });
      }, Promise.resolve()).then(function () { return ps.length; });
    }).then(function (n) {
      el("pase-estado").textContent = "Importados " + n + " pase(s).";
      renderPases(); refrescarPases();
    }).catch(function () {
      el("pase-estado").textContent =
        "No pude abrirlo. Suele ser la contraseña mal escrita, o el archivo incompleto.";
    });
  }

  /* ---------- enganche de eventos ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t.closest) return;

    var verAudios = t.closest("[data-audios]");
    if (verAudios) {
      var ka = verAudios.getAttribute("data-audios");
      audiosAbiertos[ka] = !audiosAbiertos[ka];
      /* Esto hacía scrollIntoView del día entero, heredado del handler de la
         cabecera. Resultado: abrir un bloque de audios te mandaba al principio
         del día y perdías dónde estabas leyendo. Ahora se ancla en la
         actividad: se anota a qué altura de la pantalla estaba antes de
         redibujar y después se corrige el scroll para dejarla en el mismo
         lugar. La actividad no se mueve; lo que se mueve es lo de abajo. */
      var selAct = '[data-act="' + ka + '"]';
      var previo = document.querySelector(selAct);
      /* Se corrige con scrollTo absoluto y no con un scrollBy relativo. El
         delta no sirve: Chrome tiene anclaje de scroll y, cuando algo cambia
         de alto, ya mueve la página solo para que no te salte el contenido.
         Si además le sumábamos nuestro ajuste, la corrección se aplicaba dos
         veces y al cerrar el bloque se iba 400 px. Con la posición absoluta
         mandamos nosotros, haga lo que haga el navegador. */
      var enPantalla = previo ? previo.getBoundingClientRect().top : null;
      renderItin();
      var despues = enPantalla === null ? null : document.querySelector(selAct);
      if (despues) {
        /* Se restaura con scrollTo absoluto: se lleva la actividad a la misma
           altura de pantalla que tenía antes de redibujar. Lo que se mueve es
           el contenido de abajo, no la fila que estás mirando. */
        var docY = despues.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo(0, Math.max(0, docY - enPantalla));
      }
      return;
    }
    var diaPlay = t.closest("[data-diaplay]");
    if (diaPlay) {
      reproducirDia(diaPlay.getAttribute("data-diaplay"));
      return;
    }
    var cab = t.closest(".dia-cab");
    if (cab) {
      var art = cab.closest(".dia");
      var f = art.getAttribute("data-dia");
      diaAbierto = (diaAbierto === f) ? null : f;
      renderItin();
      /* Siempre se vuelve al mismo día, se haya abierto o cerrado. Al compactar,
         todo lo de abajo sube y sin esto el día se te va de la pantalla. */
      var nodo = document.querySelector('.dia[data-dia="' + f + '"]');
      if (nodo) nodo.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    var tic = t.closest("[data-act]");
    if (tic) {
      var k = tic.getAttribute("data-act");
      if (actHechas[k]) delete actHechas[k]; else actHechas[k] = 1;
      store.set("actHechas", actHechas);
      var fila = tic.closest(".fila");
      fila.classList.toggle("hecha", !!actHechas[k]);
      tic.innerHTML = actHechas[k] ? "&#10003;" : "";
      tic.setAttribute("aria-pressed", String(!!actHechas[k]));
      var art = tic.closest(".dia");
      if (art) {
        var d = DIAS.filter(function (x) { return x.fecha === art.getAttribute("data-dia"); })[0];
        var tg = art.querySelector(".dia-tags");
        if (d && tg) {
          var tot = d.actividades.length, li = 0;
          for (var j = 0; j < tot; j++) if (actHechas[claveAct(d.fecha, j)]) li++;
          var resto = tg.textContent.split(" · ").slice(1);
          tg.textContent = [li ? li + " de " + tot + " hechas" : tot + " actividades"]
            .concat(resto).join(" · ");
        }
      }
      return;
    }
    var tocar = t.closest("[data-tocar]");
    if (tocar) { tocarParadaPorId(tocar.getAttribute("data-tocar")); return; }
    var vp = t.closest("[data-verpase]");
    if (vp) { verPase(vp.getAttribute("data-verpase")); return; }

    if (t.closest("#pase-add")) { el("pase-file").click(); return; }
    if (t.closest("#pase-exp")) { exportarPases(); return; }
    if (t.closest("#pase-imp")) { el("pase-imp-file").click(); return; }
    if (t.closest("#pase-cancel")) { cerrarFormulario(); return; }
    if (t.closest("#pase-ok")) { confirmarPase(); return; }
    if (t.closest("#visor-cerrar")) { cerrarVisor(); return; }
    if (t.closest("#visor-ant")) { visor.i = (visor.i - 1 + visor.urls.length) % visor.urls.length; pintarVisor(); return; }
    if (t.closest("#visor-sig")) { visor.i = (visor.i + 1) % visor.urls.length; pintarVisor(); return; }

    var ver = t.closest(".pase-ver");
    if (ver) { verPase(ver.closest(".pase").getAttribute("data-pase")); return; }

    var del = t.closest(".pase-del");
    if (del) {
      var nodo = del.closest(".pase");
      var titulo = nodo.querySelector(".pase-t").textContent;
      if (confirm('¿Borrar "' + titulo + '" de este teléfono?')) {
        borrarPaseDB(nodo.getAttribute("data-pase")).then(function () {
          renderPases(); refrescarPases();
        });
      }
      return;
    }
  });

  /* ================= SERVICE WORKER ================= */
  function pedirPersistencia() {
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (e) {}
  }

  function registrarSW() {
    pedirPersistencia();
    if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
    navigator.serviceWorker.register("sw.js").then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      sw = reg.active || navigator.serviceWorker.controller;
      if (!sw) {
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          sw = navigator.serviceWorker.controller;
          refrescarEstados();
        });
        return;
      }
      refrescarEstados();
    }).catch(function () {});

    navigator.serviceWorker.addEventListener("message", function (ev) {
      var m = ev.data || {};
      if (m.tipo === "progreso") {
        if (!(m.ciudad in progresos)) return;   // ya terminó: aviso rezagado
        progresos[m.ciudad] = { hechas: m.hechas, total: m.total };
        renderOffline();
      }
    });
  }

  /* ================= ARRANQUE ================= */
  renderItin();
  /* Los pases viven en IndexedDB, que es asincrónico: el primer render del
     itinerario sale sin ellos y se vuelve a dibujar apenas llegan. */
  refrescarPases();
  renderPrac();
  renderAudioIndex();
  mostrar("itin");
  registrarSW();
  if (soporteVoz()) { try { speechSynthesis.getVoices(); } catch (e) {} }
})();
</script>
