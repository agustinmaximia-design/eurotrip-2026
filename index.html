      guion: "Son veinte minutos hasta la estación, a las siete de la mañana, cruzando un barrio que la mayoría de los turistas evita. Vale la pena saber por dónde vas, y hay una cosa en este camino que te toca más de cerca de lo que imaginás.\n\nEl barrio se llama Forcella y el nombre viene de la forma: acá la calle se abre en dos, como una horquilla. Es uno de los pedazos más viejos y más densos del centro, y arrastra una fama pesada, de las que salen en las películas y en los diarios policiales. A esta hora vas a ver otra cosa: gente abriendo persianas, el café, los chicos yendo a la escuela. Caminá normal, con el teléfono guardado, y listo.\n\nPero lo que te quiero señalar está un poco más adelante, sobre Via Annunziata.\n\nVas a pasar por delante de una basílica grande: la Santissima Annunziata Maggiore. Al costado del edificio, en el muro, hubo durante siglos un agujero con un cilindro de madera que giraba. Se llamaba la ruota degli esposti, la rueda de los expuestos.\n\nFuncionaba así. Una mujer que no podía criar a su hijo lo dejaba de noche en ese cilindro, lo hacía girar, y el bebé quedaba del lado de adentro sin que nadie la viera. Tocaba una campana y se iba. Del otro lado lo recibían las matronas del complejo, lo bautizaban y lo criaban.\n\nFuncionó desde el siglo catorce hasta el 27 de junio de 1875. Quinientos años.\n\nA esos chicos había que ponerles un apellido, y el que se usaba venía del latín expositum, que quiere decir expuesto, dejado afuera. El apellido era Esposito.\n\nPor eso Esposito es hoy uno de los apellidos más comunes de Nápoles y de toda Italia. Cada uno de esos Esposito desciende de un chico que pasó por una rueda de madera en un muro.\n\nY ahora la parte que te toca: la casa donde estás durmiendo estos cinco días se llama Casa Esposito.\n\nNo es casualidad ni es un nombre elegido por lindo. Es el apellido más napolitano que existe, y sale de acá, de este muro por el que estás pasando a las siete de la mañana camino a un tren.\n\nDe       guion: "Cuarenta minutos de barco pegado a la costa. Sentate del lado derecho mirando hacia adelante, que es donde está la tierra, y te voy contando lo que va apareciendo.\n\nLo primero, apenas salís de Sorrento, es el final de la península: un cabo largo y pelado que se mete en el mar. Se llama Punta Campanella y el nombre es literal.\n\nAhí arriba hubo una torre de vigilancia con una campana. Durante siglos, del siglo dieciséis en adelante, esta costa vivió bajo la amenaza de las incursiones de piratas berberiscos, que llegaban desde el norte de África a buscar gente para vender como esclavos. Toda la costa se llenó de torres de avistaje: cuando aparecía una vela sospechosa en el horizonte, la torre tocaba la campana y el pueblo entero se metía tierra adentro. Esa campana es la que le da nombre al cabo.\n\nVas a ver esas torres todo el día, en Positano, en Praiano, en cada punta. No son decorativas: son un sistema de alarma que funcionó de verdad.\n\nY mucho antes de eso, en ese mismo cabo hubo un templo dedicado a Atenea. Los griegos ponían templos en los puntos que servían de referencia para navegar.\n\nAhora mirá mar adentro, hacia la izquierda. Vas a ver tres islotes chicos, pelados, juntos. Se llaman Li Galli.\n\nSu nombre antiguo era Sirenuse, y eso quiere decir exactamente lo que estás pensando: los griegos decían que ahí vivían las sirenas. Las de la Odisea, las que cantaban para que los marineros se estrellaran contra las rocas, y por las que Ulises se hizo atar al mástil con la tripulación con los oídos tapados con cera. El geógrafo Estrabón, en el siglo primero antes de Cristo, las ubica acá.\n\nY lo que pasó después es casi mejor. En 1924 los tres islotes se los compró Léonide Massine, un coreógrafo ruso, bailarín de los Ballets Rusos. Se hizo construir una villa y un teatro al aire libre sobre los restos de una torre romana, con ayuda de Le Corbusier, que es probablemente el arquitecto más influyente del siglo veinte.\n\nY en 1988 los compró Rudolf Nureyev, el bailarín más famoso del mundo, que se había escapado de la Unión Soviética en plena Guerra Fría. Los decoró con mosaicos turcos y andaluces y los usó como refugio. Se fue de la isla en septiembre de 1992 y murió en enero del 93.\n\nO sea que las islas donde la mitología griega puso a las sirenas terminaron siendo, durante setenta años seguidos, la casa privada de dos bailarines rusos.\n\nEn un rato, doblando una punta, se te abre Positano de golpe. No te lo pierdas: es la mejor vista del pueblo y solo se tiene desde el agua.",

      guion: "Bajás del barco y lo primero que entendés es que no hay calle principal. Hay escaleras.\n\nPositano está construido sobre un barranco casi a pico sobre el mar, y las casas se amontonan una encima de otra en terrazas. El techo de una es el patio de la de arriba. No hay plano, no hay cuadrícula: hay la ladera y lo que se pudo apoyar en ella. Por eso las fotos desde el mar parecen un amontonamiento de cubos rosas y ocres.\n\nUn dato práctico antes que nada: todo lo que bajes lo vas a tener que subir. Tenés tres horas y media y no hay nada plano. Administrá las piernas.\n\nAhora, por qué existe este pueblo acá.\n\nLa respuesta corta es que era un puerto. Positano perteneció a la república de Amalfi, de la que te voy a hablar a la tarde, y durante la Edad Media fue un pueblo de marineros y comerciantes con bastante plata. Después vinieron siglos malos: los piratas, la decadencia del comercio, y sobre todo la miseria del siglo diecinueve.\n\nY ahí pasó algo que explica el nombre de una de las calles por las que vas a caminar.\n\nA fines del siglo diecinueve y principios del veinte, media Positano se fue a América. No a Buenos Aires: a Nueva York. Se calcula que el pueblo perdió dos tercios de su población. Los que volvieron, volvieron con plata, y la calle que bordea el acantilado hacia la playa del Fornillo se llama por ellos: Via Positanesi d'America, la calle de los positaneses de América.\n\nO sea que este pueblo que hoy es carísimo estaba vacío hace cien años porque nadie podía vivir de él.\n\nLo que lo dio vuelta fue el turismo, a partir de los años cincuenta. Escritores y artistas empezaron a venir, alguien escribió un artículo famoso en una revista norteamericana, y en veinte años Positano pasó de pueblo abandonado a destino internacional. La ropa liviana de colores que vas a ver en todas las vidrieras —lo que llaman «moda positano»— nació en esos años y sigue siendo el negocio del pueblo.\n\nUna cosa más, sobre el nombre. La leyenda dice que un barco pirata pasaba frente a la costa llevándose un icono bizantino robado de la Virgen, y que en medio de una tormenta los marineros escucharon una voz que decía «posa, posa» —«dejame, dejame»—. Dejaron el cuadro en la playa, se calmó la tormenta, y el pueblo se llamó Positano.\n\nComo siempre: es leyenda. Pero el icono existe, es bizantino de verdad, y lo vas a ver en un rato adentro de la iglesia.",

      guion: "Es la iglesia de la cúpula de mayólicas, la que se ve desde el mar. Entrá, que es gratis, y tiene dos cosas que valen la pena.\n\nPrimero la cúpula, aunque la paradoja es que desde adentro no se aprecia. Está forrada por fuera en azulejos vidriados verdes, amarillos y azules, puestos formando dibujos geométricos. Esa técnica se llama mayólica y es típica de toda esta costa: cerámica esmaltada, resistente al sol y a la sal, y barata comparada con la piedra. En una costa donde todo se desgasta, los azulejos aguantan. Por eso vas a ver cúpulas así en Positano, en Amalfi, en Atrani.\n\nSi no la miraste desde el barco, salí y miratela desde la playa. Desde el pueblo no se ve.\n\nAdentro, andá directo al altar mayor. Ahí está el icono: una Virgen bizantina con el Niño, pintada sobre tabla, con la cara oscura. Se la conoce como la Madonna Nera, la Virgen negra.\n\nEs la del cuento de los piratas que te conté recién, la del «posa, posa». La leyenda no se puede probar, pero la tabla es real y es antigua: viene del mundo bizantino, o sea del Imperio Romano de Oriente, el que siguió existiendo mil años después de que Roma cayera, con capital en Constantinopla. Que una pieza así termine en un pueblo de pescadores del sur de Italia no es raro: esta costa comerciaba con Bizancio todo el tiempo.\n\nLo de la cara oscura tiene explicación y no es milagrosa: siglos de humo de velas sobre un barniz que se oxida. Hay vírgenes negras por toda Europa por el mismo motivo, y en casi todos los casos se les armó una devoción propia alrededor del color.\n\nY ahora lo que casi nadie sabe. Debajo de esta iglesia, bajo el piso que estás pisando, hay una villa romana del siglo primero.\n\nLa sepultó la misma erupción del Vesubio del año 79 que enterró Pompeya, que es adonde vas pasado mañana. La excavaron hace pocos años y se puede visitar aparte, con entrada, y la llaman «la pequeña Pompeya de la costa». Tiene frescos.\n\nNo está en tu plan de hoy y con tres horas y media no te da. Pero pará un segundo a pensarlo: estás parado sobre una casa romana con las paredes pintadas, tapada por la misma nube de ceniza que vas a caminar el jueves.",
      mirar: [
        "La cúpula de mayólicas se ve desde el mar y desde la playa, no desde adentro.",
        "El icono bizantino del altar: la Virgen negra del «posa, posa».",
        "Bajo el piso hay una villa romana sepultada por la erupción del 79."

    {
      id: "nap2-05", tipo: "tramo", orden: 5, sala: "Via Positanesi d'America → Fornillo",
      titulo: "La pasarela del acantilado", autor: "", fecha: "",
      guion: "Desde el extremo de la Spiaggia Grande sale un camino tallado en la roca que bordea el acantilado sobre el mar. Son nueve minutos hasta la playa del Fornillo, y es el mejor paseo corto de Positano.\n\nSe llama Via Positanesi d'America, por los que se fueron a Nueva York y volvieron, que te conté recién.\n\nLo que hay que hacer acá es simple: caminá despacio y date vuelta. Desde la mitad del camino tenés la mejor vista del pueblo que vas a conseguir a pie, con la cúpula de mayólicas en el medio y las casas trepando detrás. Desde la playa no se ve así; desde arriba tampoco. Es desde acá.\n\nA mitad de camino vas a pasar al lado de una torre cilíndrica de piedra, maciza, plantada sobre la roca: la Torre Trasita.\n\nEs una de las torres de avistaje de las que te hablé en el barco. La costa entera está sembrada de estas: se construyeron sobre todo en el siglo dieciséis, cuando las incursiones desde el norte de África eran un problema constante. El sistema era una cadena: cada torre veía la anterior y la siguiente. Una encendía fuego o tocaba la campana, la de al lado repetía la señal, y en minutos la alarma recorría cincuenta kilómetros de costa.\n\nNo era prevención teórica. Pueblos enteros de esta costa fueron saqueados y su gente vendida como esclavos en los mercados de Argel y Túnez. Una torre cada pocos kilómetros era lo que separaba a un pueblo de desaparecer.\n\nHoy la Trasita es una casa privada, se alquila, y hay gente tomando sol en la terraza donde estaba el vigía.\n\nDel otro lado llegás al Fornillo, que es la otra playa de Positano: más chica, con menos gente y sin la fila de sombrillas caras de la principal. Si querés meter los pies en el agua sin pagar una fortuna por una reposera, es acá.\n\nY la vuelta es la misma pasarela, con la vista al revés.",
      mirar: [
        "Desde la mitad del camino, la mejor vista del pueblo a pie.",
        "La Torre Trasita: parte de una cadena de alarma contra los piratas.",
        "El Fornillo es la playa sin la fila de sombrillas caras."

      id: "nap2-06", tipo: "tramo", orden: 6, sala: "Ferry de Positano a Amalfi",
      titulo: "El fiordo y la gruta", autor: "", fecha: "",
      guion: "Veinticinco minutos de barco y este tramo es el más espectacular de la costa. Quedate afuera.\n\nLo primero que aparece es Praiano, un pueblo desparramado en la ladera, más tranquilo y mucho menos famoso que sus vecinos. Abajo, casi a nivel del agua, tiene una caleta minúscula llamada Marina di Praia, encajada entre dos paredes de roca, con unas pocas casas de pescadores y los botes varados en la piedra. Si Positano te pareció apretado, mirá eso.\n\nDespués, y hay que estar atento porque se pasa rápido, viene lo mejor: el Fiordo di Furore.\n\nEs una grieta profunda en el acantilado, angosta, donde el mar se mete tierra adentro. En el fondo hay una playita de piedras y unas casitas de pescadores. Y cruzando la grieta, muy arriba, hay un puente de carretera.\n\nNo es un fiordo de verdad —los fiordos los tallan los glaciares y acá nunca hubo hielo— sino una garganta excavada por un torrente. Pero la forma es esa: un tajo vertical en la roca con el mar adentro.\n\nEl pueblo de Furore tiene otra particularidad: casi no tiene centro. Las casas están desparramadas por la ladera, sin plaza ni calle principal. Le dicen «el pueblo que no existe».\n\nUn poco más adelante, en Conca dei Marini, hay un cartel y una escalera que bajan al mar: es la Grotta dello Smeraldo, la gruta esmeralda.\n\nEs una cueva marina con una entrada bajo el agua. La luz del sol entra por debajo de la superficie, atraviesa el agua y rebota hacia arriba, y el resultado es que toda la cueva queda iluminada de un verde intenso, como si el agua tuviera luz propia. La encontró un pescador en 1932; antes nadie sabía que estaba ahí.\n\nSe visita en bote, por dentro, y no está en tu plan de hoy: el ferry pasa por delante y sigue. Te lo cuento para que sepas qué estás mirando cuando veas la escalera colgada del acantilado.\n\nY de fondo, todo el tiempo, la misma pared: quinientos metros de roca cayendo al mar, con la carretera tallada en el medio. Esa carretera se abrió en el siglo diecinueve y hasta entonces estos pueblos se comunicaban entre sí casi únicamente por barco. Lo que estás haciendo hoy —ir de pueblo en pueblo por mar— es, durante mil años, la única manera que hubo de moverse por acá.",

    {
      id: "nap2-07", tipo: "parada", orden: 7, sala: "Amalfi",
      titulo: "La república que fue enorme", autor: "", fecha: "siglos IX al XII",
      guion: "Bajás en un pueblo de cuatro mil seiscientos habitantes, encajado entre dos montañas, que vive del turismo. Hace mil años esto era una potencia naval con ochenta mil habitantes y oficinas comerciales en medio Mediterráneo.\n\nEsa es la historia de Amalfi y conviene tenerla antes de caminar por acá.\n\nEntre los años 839 y 1200 más o menos, Amalfi fue una república marinera independiente. Ese término se usa para cuatro ciudades italianas —Amalfi, Pisa, Génova y Venecia— que durante la Edad Media fueron estados por su cuenta, con flota propia, moneda propia y colonias comerciales en el extranjero. Amalfi fue la primera de las cuatro.\n\n¿Cómo hace un pueblo encajado en un barranco para volverse una potencia? Justamente porque no tenía tierra. No podían vivir de la agricultura, así que vivieron del mar. Compraban y vendían: llevaban grano y sal a Oriente y volvían con sedas bizantinas y oro egipcio. Eran los intermediarios entre el mundo cristiano y el mundo musulmán, en una época en que esos dos mundos estaban en guerra casi permanente. Les convenía a todos que alguien hiciera de puente, y Amalfi hizo de puente.\n\nDe ahí salió algo que duró más que la república: las Tablas Amalfitanas, un código de derecho marítimo que se escribió acá y que después adoptaron los puertos de todo el Mediterráneo. Reglas sobre naufragios, sobre cargamentos, sobre quién paga qué cuando un barco se hunde. Fue durante siglos la ley del mar.\n\n¿Y qué pasó? Dos golpes.\n\nEl primero: Pisa, que era otra de las cuatro, atacó y saqueó Amalfi dos veces, en 1135 y 1137. Amalfi nunca recuperó el poder naval.\n\nEl segundo fue peor y fue el mar. En 1343 un maremoto se llevó el puerto y toda la parte baja de la ciudad. Lo que ves hoy junto al agua está construido encima de lo que quedó. La Amalfi medieval, la de verdad, está bajo el mar.\n\nAsí que mientras caminás por acá tené presente esto: no estás en un pueblo bonito que creció con el turismo. Estás en lo que quedó de una capital, después de que la saquearan y la tapara una ola.\n\nOchenta mil habitantes entonces. Cuatro mil seiscientos ahora.",
      mirar: [
        "Fue la primera de las cuatro repúblicas marineras, antes que Venecia.",
        "Las Tablas Amalfitanas: la ley del mar del Mediterráneo, escrita acá.",
        "El maremoto de 1343 se llevó el puerto. La ciudad medieval está bajo el agua."
      ]

    {
      id: "nap2-08", tipo: "parada", orden: 8, sala: "Duomo de Sant'Andrea",
      titulo: "La escalinata y el claustro", autor: "", fecha: "siglo XI, fachada del XIX",
      guion: "Llegás a la plaza y tenés enfrente una escalera de sesenta y dos escalones y arriba una fachada rayada de blanco y negro, con arcos apuntados, mosaicos dorados y un campanario al costado. Es la catedral de Amalfi y hay que leerla con cuidado, porque no todo es lo que parece.\n\nPrimero, lo importante de mirar: los arcos. Son apuntados y entrelazados, y el dibujo de las rayas blancas y negras que recorre todo el frente no es italiano. Es árabe. A esto se lo llama estilo árabe-normando, y aparece en el sur de Italia y en Sicilia porque durante siglos esta zona estuvo bajo dominio musulmán primero y normando después, y los normandos, en vez de borrar lo que encontraron, lo siguieron usando. Amalfi además comerciaba con el mundo islámico todos los días: sus constructores habían visto esa arquitectura de primera mano.\n\nAhora la advertencia. La fachada que estás mirando es del siglo diecinueve. La original se vino abajo en 1861 y la rehicieron entera imitando el estilo antiguo. El campanario de al lado sí es medieval de verdad, del siglo doce, con su remate de cerámica.\n\nAdentro hay dos cosas.\n\nUna es la cripta, abajo, donde se guardan los restos de San Andrés, el apóstol. Llegaron acá en 1206, traídos desde Constantinopla. Y conviene decir de dónde: dos años antes, en 1204, la Cuarta Cruzada —que iba supuestamente a Tierra Santa— terminó saqueando Constantinopla, que era una ciudad cristiana. Media Europa se llenó de reliquias bizantinas en esos años. Estas son de esas.\n\nLa otra, y es la que no hay que perderse, es el Chiostro del Paradiso, el claustro del Paraíso.\n\nSe construyó alrededor de 1266 como cementerio para los nobles de Amalfi. Es un patio cuadrado con más de cien columnitas blancas y delgadas, sosteniendo arcos apuntados entrelazados, con palmeras en el medio.\n\nY eso, otra vez, no es un claustro europeo. Los claustros románicos italianos son pesados, de columnas gruesas. Este es liviano, calado, y se parece muchísimo más al patio de una mezquita o de un palacio andaluz. Si estuviste en la mezquita del Cristo de la Luz el sábado en Toledo, la lógica es la misma: constructores que trabajaban con un vocabulario islámico para clientes cristianos, y a nadie le parecía contradictorio.\n\nEs un lugar silencioso y fresco, y después de la escalinata lo vas a agradecer.",
      mirar: [
        "Los arcos entrelazados y las rayas: estilo árabe-normando, no italiano.",

    {
      id: "nap2-09", tipo: "tramo", orden: 9, sala: "Via Lorenzo d'Amalfi → Valle dei Mulini",
      titulo: "El papel y el hombre que no existió", autor: "", fecha: "",
      guion: "Metete por la calle que sale de la plaza hacia adentro del valle. Se angosta, se llena de negocios, y en pocos minutos deja atrás a casi todos los turistas, que no pasan de la catedral.\n\nEsta calle sube hacia el Valle de los Molinos, y ahí está el segundo invento que Amalfi le dio a Europa.\n\nEl papel.\n\nEn la Edad Media, en Europa se escribía sobre pergamino, que es piel de animal tratada. Es durísimo, dura siglos, y es carísimo: para un libro mediano hacían falta decenas de animales. Mientras tanto, el mundo islámico llevaba siglos fabricando papel con fibras vegetales, una técnica que había llegado desde China.\n\nAmalfi comerciaba con ese mundo todos los días. Y trajo la técnica.\n\nAcá arriba, aprovechando el torrente que baja por el valle, se montaron molinos que trituraban trapos de algodón y lino hasta hacerlos pasta. Esa pasta se extendía en hojas y se secaba. El producto se llamó carta bambagina y Amalfi fue de los primeros lugares de Europa donde se fabricó en serie.\n\nPensalo un segundo: el papel abarata el libro, el libro abarata el conocimiento, y doscientos años después llega la imprenta a un mundo que ya tenía con qué imprimir. Ese hilo empieza en un valle de este pueblo.\n\nTodavía queda un molino funcionando como museo, más arriba. No te da el tiempo hoy, pero mientras caminás mirá a los costados: entre la vegetación se ven ruinas de piedra que fueron molinos.\n\nY ahora la otra historia de Amalfi, que es la mejor de las dos porque es un fraude.\n\nEn la plaza junto al puerto hay una estatua de un señor llamado Flavio Gioia, y la placa dice que inventó la brújula. Lo vas a ver al volver al muelle.\n\nNo inventó nada. Es casi seguro que nunca existió.\n\nLo que pasó fue esto. En el siglo quince un historiador llamado Flavio Biondo escribió que el uso del imán para navegar se había inventado en Amalfi. En 1511 otro autor citó eso y escribió, en latín, algo así como «en Amalfi se inventó el uso del imán, según Flavio». Y en copias posteriores alguien movió una coma. La frase pasó a leerse «el uso del imán fue inventado por Flavio».\n\nUna coma mal puesta creó un inventor. Le pusieron apellido, le pusieron siglo, le hicieron una estatua en 1900 y le pusieron su nombre a la plaza.\n\nLo que sí es cierto es que en esta región se perfeccionó la brújula: acá se le puso la aguja suspendida sobre una rosa de los vientos, adentro de una caja con tapa de vidrio, que es el instrumento que usaron los navegantes durante siglos.\n\nAsí que la estatua está mal, el invento está bien, y el personaje es hijo de un error de imprenta.",

        "El papel llegó a Europa por acá, traído del mundo islámico.",
        "La estatua de Flavio Gioia en el puerto: el personaje lo inventó una coma."
      ]

      id: "nap2-10", tipo: "parada", orden: 10, sala: "Atrani",
      titulo: "El pueblo más chico de Italia", autor: "", fecha: "",
      guion: "Quince minutos caminando desde Amalfi, por la carretera y después bajando unas escaleras, y estás en otro país.\n\nAtrani es el municipio más chico de toda Italia: doce hectáreas, que es menos que muchos parques urbanos, y unos setecientos sesenta habitantes. Entra entero en la palma de la mano.\n\nY es lo más parecido que vas a ver a cómo era esta costa antes del turismo. No hay hoteles grandes, no hay vidrieras de marca, no hay fila para nada. Hay una placita con bares, una iglesia, chicos jugando a la pelota, y casas apiladas subiendo por la garganta detrás.\n\nLa plaza se llama Piazza Umberto I y está prácticamente sobre la playa. Sentate diez minutos y tomá algo, que es lo que hay que hacer acá. Te va a costar la mitad que en Amalfi.\n\nPero que el tamaño no te engañe, porque este pueblo tuvo un papel que no le corresponde a su superficie.\n\nCuando Amalfi era república, Amalfi y Atrani eran las dos únicas ciudades con derecho a elegir y a destituir a los duques. Dos pueblos pegados, a quince minutos uno del otro, decidiendo entre los dos quién gobernaba un estado con oficinas comerciales en Constantinopla y en Egipto.\n\nY en la placita hay una iglesia chica, San Salvatore de' Birecto, que era la capilla palatina: ahí se hacía la ceremonia en la que al duque nuevo se le entregaban los símbolos del poder. Los amalfitanos de al lado eran amalfitanos; los de acá siguieron llamándose atraneses, y todavía se llaman así.\n\nUn pueblo de doce hectáreas donde se coronaban duques.\n\nMirá para arriba antes de irte: las casas trepan por la garganta una encima de otra, unidas por escaleras y por pasajes cubiertos que pasan por debajo de las viviendas. No hay calles para autos adentro del pueblo. No entran.\n\nY acordate del reloj. El ferry de las 17:02 desde Amalfi es el último del día, y volver caminando son quince minutos. Estate en el muelle a las 16:45.",
      mirar: [
        "Doce hectáreas: es el municipio más chico de Italia.",

    {
      id: "nap2-11", tipo: "parada", orden: 11, sala: "Villa Comunale de Sorrento",
      titulo: "El mirador y el valle de los molinos", autor: "", fecha: "",
      guion: "Última parada del día, y es gratis. La Villa Comunale es un jardín público chico, en el borde del acantilado, y tiene la mejor vista de Sorrento sin pagar un peso.\n\nAsomate a la baranda. Abajo, cincuenta metros a pico, está Marina Piccola, de donde saliste esta mañana. Enfrente, todo el golfo de Nápoles. A la izquierda, si el día está claro, el Vesubio recortado; y pasado mañana vas a estar parado en el borde de ese cráter. Y a la derecha, Capri, adonde vas el viernes.\n\nO sea que desde esta baranda ves los dos días que te quedan en Nápoles.\n\nEl sol se pone más o menos a las seis y media y este es el lugar. Quedate.\n\nAl lado del jardín hay un claustro chico, el de San Francesco, con arcos entrelazados parecidos a los que viste en Amalfi. Se entra gratis y son cinco minutos.\n\nY hay una última cosa, camino a la estación, que es de las más raras de esta costa.\n\nSubiendo hacia Piazza Tasso, la plaza principal, hay un puente. Asomate por la baranda y mirá para abajo.\n\nVas a ver una garganta profunda, verde, con ruinas de edificios de piedra en el fondo, tapadas de helechos y vegetación. Es el Vallone dei Mulini, el valle de los molinos.\n\nAhí abajo hubo molinos de harina y un aserradero, funcionando desde la Edad Media. El valle tenía agua y desembocaba en el mar, así que era el lugar lógico para ponerlos.\n\n¿Y qué pasó? En 1866 se construyó Piazza Tasso, la plaza que estás por cruzar, y esa obra cortó el valle y lo separó del mar. Los molinos quedaron aislados en el fondo de una grieta, sin salida. Siguieron trabajando a los tropezones hasta los años cuarenta y después se abandonaron.\n\nY ahí está lo bueno. Al quedar encajonado, sin viento y sin sol directo, el fondo del valle se llenó de humedad. Hoy crecen ahí helechos y plantas raras que no crecen en el resto de la península. Es un microclima accidental, hecho por una obra pública del siglo diecinueve.\n\nUn pedazo de selva en el medio del pueblo, con ruinas industriales adentro, que existe porque alguien hizo una plaza.\n\nDe ahí, la Circumvesuviana y Nápoles. Hoy caminaste mucho.",

        "El puente de Piazza Tasso: asomate y mirá el valle abandonado.",
        "Los helechos del fondo crecen por la humedad que dejó una obra de 1866."

      id: "nap3-01", tipo: "tramo", orden: 1, sala: "De casa al Museo Archeologico",
      titulo: "El botín de una familia", autor: "", fecha: "1734–1788",
      guion: "Catorce minutos cuesta arriba hasta el museo. Te cuento en el camino por qué las esculturas romanas más famosas del mundo están en Nápoles y no en Roma, que es la pregunta obvia y tiene una respuesta muy poco heroica.\n\nNo las encontró Nápoles. No las excavó el Estado italiano. Llegaron acá por una herencia.\n\nArranca en 1534, cuando un tal Alejandro Farnesio es elegido papa con el nombre de Pablo III. Los Farnesio eran una familia noble italiana, y ser papa en el siglo dieciséis quería decir tener a tu familia entera instalada en el poder. Con esa plata empezaron a comprar arte y, sobre todo, a excavar.\n\nY acá está la clave. En 1545 y 1546 los Farnesio pagan de su bolsillo excavaciones en las Termas de Caracalla, que eran unos baños públicos romanos gigantescos, abandonados hacía mil años y convertidos en una colina de escombros. De ahí sacan el Toro y el Hércules que vas a ver hoy. Las excavaciones eran privadas, así que lo que salía era propiedad de ellos: se lo llevaron a su palacio de Roma y lo pusieron en el patio.\n\nSalto de doscientos años. En 1731 se muere el último Farnesio varón sin hijos. Toda la herencia pasa entonces por vía femenina a una sobrina, Isabel de Farnesio, que estaba casada con Felipe V, el rey de España.\n\nY el hijo de Isabel, Carlos de Borbón, en 1734 conquista Nápoles y se hace rey. Hereda de su madre la colección entera.\n\nEntre 1786 y 1788 las esculturas bajan de Roma a Nápoles por mar. El papado intentó frenarlo, porque era evidente que se le estaba yendo media Roma antigua de las manos. No pudo: eran propiedad privada y los dueños se mudaban.\n\nAsí que lo que vas a ver en la planta baja estuvo mil años bajo tierra, doscientos cincuenta en el patio de un palacio romano, y está acá porque una señora se casó con el rey de España.\n\nDos avisos prácticos antes de entrar. Se entra por la puerta oeste, no por la principal. Y las mochilas grandes van al guardarropa, que es gratis, pero el abrigo no te lo dejan dejar.",
      mirar: [
        "Las esculturas salieron de las Termas de Caracalla en 1545, pagadas por una familia.",
        "Llegaron a Nápoles por herencia: el papado quiso frenarlo y no pudo.",
        "Se entra por la puerta oeste. Las mochilas grandes, al guardarropa."
      ]
    },
    {
      id: "nap3-02", tipo: "parada", orden: 2, sala: "Planta baja — Toro Farnese",
      titulo: "La montaña de mármol", autor: "copia romana de un original helenístico", fecha: "siglo III d.C.",
      guion: "Tenés enfrente la escultura antigua más grande que se conserva. Tres metros setenta de alto, unas veinticuatro toneladas, y los napolitanos del siglo dieciocho le decían la montaña de mármol.\n\nPrimero, qué está pasando ahí, porque parece una escena de caza y no lo es. Es una ejecución.\n\nLa mujer que está siendo atada a los cuernos del toro se llama Dirce. Los dos jóvenes que forcejean con el animal son Anfión y Zeto, hermanos gemelos. Y lo que están haciendo es vengar a su madre, Antíope, a la que Dirce había esclavizado y maltratado durante años. La madre está ahí también, de pie, mirando.\n\nO sea: dos hijos atan a una mujer a un toro salvaje para que la despedace, delante de su madre. Eso es lo que decoraba unos baños públicos romanos.\n\nAhora, qué mirar concretamente, que es lo mejor de esta pieza.\n\nBajá la vista a la base rocosa. Vas a ver un perro y un chico. No son antiguos: son agregados modernos, de cuando la restauraron. Las cabezas de Dirce y de los dos hermanos también están rehechas. Lo genuinamente antiguo es el núcleo: el toro, los dos cuerpos forcejeando y la roca.\n\nY ahí está la trampa de esta escultura, que conviene que sepas porque vas a leer cualquier cosa.\n\nPlinio el Viejo, un escritor romano, dijo que estaba tallada en un solo bloque de mármol. Esa frase se repite desde hace dos mil años. Hoy los especialistas creen que Plinio exageraba, y en cualquier caso la pieza que estás mirando tiene tantas partes rehechas que lo del bloque único describe el corazón antiguo, no lo que ves.\n\nTambién vas a leer que la restauró Miguel Ángel. Eso es falso. Lo que sí está documentado es que Miguel Ángel la quiso convertir en fuente, en el centro de un jardín. Nunca se hizo. Quién la restauró realmente sigue discutido.\n\nUn último dato, medio absurdo. Cuando llegó a Nápoles en 1788 no la metieron en un museo: la plantaron al aire libre en un parque, junto al mar, y la usaron de fuente durante casi cuarenta años. Recién entró acá en 1826.",
      mirar: [
        "El perro y el chico de la base son agregados modernos, no antiguos.",
        "No es una caza: es una ejecución, y la madre de los verdugos está mirando.",
        "Miguel Ángel no la restauró. La quiso usar de fuente y no se hizo."
      ]
    },
    {
      id: "nap3-03", tipo: "parada", orden: 3, sala: "Planta baja — Hércules Farnesio",
      titulo: "El héroe cansado", autor: "Glykon de Atenas", fecha: "siglo III d.C.",
      guion: "Tres metros diecisiete de hombre musculoso apoyado en un palo, con cara de no dar más. Este es el Hércules Farnesio y es probablemente la escultura antigua más copiada de la historia del arte europeo.\n\nLo primero: lo raro es que está cansado.\n\nHércules es el héroe forzudo por excelencia, el de los doce trabajos. La manera normal de representarlo era en acción, peleando, levantando algo. Acá está después. Terminó todo, está apoyado en su clava —el garrote— con la piel del león de Nemea colgando encima, y lo único que quiere es sentarse. Es un héroe agotado, y eso en el año cero no lo hacía nadie.\n\nAhora lo que tenés que hacer, y es el motivo por el que te traigo hasta acá: dale la vuelta.\n\nAndá por detrás y mirale la mano derecha, la que cae por atrás de la espalda. Tiene algo agarrado. Son las manzanas de oro del jardín de las Hespérides, que fueron el último de sus doce trabajos.\n\nDe frente no se ven. Está escondiendo el trofeo detrás de la espalda. Parece un tipo reventado y en realidad acaba de ganar. Esa es toda la escultura en un gesto, y el noventa por ciento de la gente que le saca una foto de frente se lo pierde.\n\nSobre la piedra, bajo la clava, está grabada la firma: Glykon de Atenas. Es lo único que sabemos de él.\n\nPorque esto es una copia. El original era un bronce del siglo cuarto antes de Cristo, atribuido a Lisipo, que fue el escultor personal de Alejandro Magno. Ese bronce sobrevivió más de mil quinientos años en Constantinopla. Y en 1204, cuando los cruzados saquearon la ciudad —los mismos que te mencioné ayer, los que llenaron Europa de reliquias robadas—, lo fundieron para hacer monedas.\n\nO sea que el original no existe y la copia sí. Es lo que pasa casi siempre: el bronce vale como metal, el mármol no.\n\nY hay una última historia, que es la mejor. Cuando la desenterraron en 1546 le faltaban las piernas de la rodilla para abajo. Un discípulo de Miguel Ángel, Guglielmo della Porta, le talló piernas nuevas. Después aparecieron las piernas antiguas originales, en el mismo lugar. Y Miguel Ángel aconsejó no cambiarlas: dejar las modernas, para demostrar que los escultores de su época podían igualar a los antiguos.\n\nLe hicieron caso. La estatua anduvo doscientos cuarenta años con piernas renacentistas. Recién en 1787 le devolvieron las suyas.",
      mirar: [
        "Dale la vuelta: en la mano de atrás esconde las manzanas de las Hespérides.",
        "La firma de Glykon está grabada en la roca, bajo el garrote.",
        "El bronce original lo fundieron los cruzados en 1204. Sobrevivió la copia."
      ]
    },
    {
      id: "nap3-04", tipo: "parada", orden: 4, sala: "Sala de mosaicos (cerrada)",
      titulo: "El mosaico que no vas a ver", autor: "", fecha: "c. 100 a.C.",
      guion: "Este audio es corto y es para que no pierdas veinte minutos buscando algo que no está.\n\nLa sala de mosaicos está cerrada por remontaje hasta fin de noviembre, y con ella el Mosaico de Alejandro. Está en restauración desde 2020: en 2023 lo despegaron de la pared después de más de un siglo y todavía están con el soporte de atrás. El director habló de que vuelve en la temporada que viene, sin fecha firme.\n\nTe lo cuento igual, por dos motivos. Uno, porque es la pieza más importante de este museo. Dos, porque mañana, en Pompeya, vas a estar parado exactamente donde estaba.\n\nEs un mosaico enorme, de casi seis metros por tres, hecho con alrededor de un millón novecientas mil piezas. Ese número no es un redondeo de folleto: salió de un estudio científico publicado durante esta restauración. Las teselas de las zonas de detalle miden menos de dos milímetros. Está hecho a mano, pieza por pieza, en el siglo primero antes de Cristo.\n\nRepresenta una batalla entre Alejandro Magno y Darío, el rey de Persia. Casi todos dicen que es la batalla de Issos, del año 333 antes de Cristo; hay especialistas que sostienen que es otra, Gaugamela. No está zanjado.\n\nY lo que lo hace extraordinario son tres detalles.\n\nEl primero es la cara de Darío. Tiene el brazo estirado hacia un pariente suyo que se está muriendo, y al mismo tiempo gira la cabeza hacia Alejandro. Es el segundo exacto en que entiende que perdió.\n\nEl segundo es un caballo visto desde atrás, en el centro. Dibujar un cuerpo que viene hacia vos era lo más difícil que sabían hacer, y acá está resuelto en piedritas de dos milímetros.\n\nY el tercero es un soldado persa caído que se está mirando la cara reflejada en un escudo pulido, probablemente segundos antes de morir.\n\nLo encontraron en 1831 en la Casa del Fauno, en Pompeya, y lo trajeron acá en un carro tirado por dieciséis bueyes. En el hueco que dejó, en 2005, pusieron una copia hecha por mosaiquistas de Rávena, con un millón y medio de piezas, que les llevó casi dos años.\n\nEsa copia es la que vas a ver mañana. Y ahora sabés qué mirar.",
      mirar: [
        "La sala está cerrada: no lo busques, no está.",
        "Mañana en Pompeya vas a ver la copia de 2005, en el lugar exacto del original.",
        "Buscá ahí la cara de Darío, el caballo de ancas y el soldado que se mira en el escudo."
      ]
    },
    {
      id: "nap3-05", tipo: "parada", orden: 5, sala: "Primer piso — frescos",
      titulo: "Cómo se pintaba una pared", autor: "", fecha: "siglos II a.C. – I d.C.",
      guion: "Estas paredes pintadas las arrancaron de las casas de Pompeya, Herculano y Estabia en el siglo dieciocho y las trajeron acá. Hoy no se haría; entonces era lo normal.\n\nAntes de mirar una por una, te doy la llave que hace que todo esto se entienda, y es más simple de lo que parece. Un arqueólogo alemán, August Mau, se dio cuenta hace más de cien años de que las paredes romanas se pintaban de cuatro maneras distintas, una después de la otra, como las modas. Se llaman los cuatro estilos y con una frase cada uno te alcanza.\n\nEl primero: la pared se pinta y se moldea para fingir que es mármol de colores. Era imitar un material caro.\n\nEl segundo: se pintan columnas, ventanas y paisajes en perspectiva para que la pared parezca abrirse y uno crea que está mirando afuera. Trampantojo puro.\n\nEl tercero: se abandona la ilusión. Fondo liso de un solo color, líneas finísimas y simétricas, y un cuadrito chico en el centro, como si fuera un cuadro colgado.\n\nY el cuarto, que es el que estaba de moda cuando el Vesubio los tapó a todos: mezcla todo lo anterior. Arquitecturas imposibles más escenas grandes, la pared convertida en un collage.\n\nCon eso ya podés fechar cualquier pared de las que veas hoy y mañana.\n\nAhora andá a buscar una mujer de espaldas sobre fondo verde. Se la conoce como Flora, o la Primavera de Estabia, y es de las cosas más delicadas que hay en este museo.\n\nEs una chica caminando que se aleja de vos. Lleva un cesto en el brazo izquierdo y, sin frenar, gira apenas el torso para cortar una flor blanca con la mano derecha. Ese movimiento de pasar y arrancar sin detenerse es todo el cuadro.\n\nMirá los pies. No hay piso. No hay sombra, no hay línea de tierra, nada: apenas un trazo blanco debajo. Está flotando sobre un fondo verde azulado que no es un lugar.\n\nLa encontraron en 1759 en un dormitorio de una villa de Estabia, a veinte kilómetros de acá, y no estaba sola: la pared tenía otras tres mujeres, Leda, Medea y Diana. Alguien eligió esas cuatro para dormir rodeado de ellas.\n\nQuién es exactamente, no se sabe. Le dicen Flora por la flor, pero podría ser una ninfa o Prosérpina. Nadie lo puede probar.",
      mirar: [
        "Los cuatro estilos: mármol falso, ventanas falsas, fondo liso con cuadrito, y el collage.",
        "Flora: gira el torso al pasar y corta la flor sin frenar.",
        "No tiene piso ni sombra. Flota sobre un fondo que no es ningún lugar."
      ]
    },
    {
      id: "nap3-06", tipo: "parada", orden: 6, sala: "Primer piso — frescos",
      titulo: "La madre con la espada y los panaderos que sabían leer", autor: "", fecha: "siglo I d.C.",
      guion: "Dos frescos más en esta sala, y los dos son sobre gente.\n\nEl primero: buscá una mujer de pie, quieta, con una espada en la mano.\n\nEs Medea, y para entender lo que estás viendo hace falta saber el final de la historia. Medea es una princesa extranjera que lo abandona todo por Jasón, el griego, y se va con él. Tienen dos hijos. Y años después Jasón la deja para casarse con otra, más conveniente. Medea se venga de la manera más atroz posible: mata a los dos chicos.\n\nAhora mirá el fresco de nuevo.\n\nElla está parada, con la espada, mirando fijo hacia adelante. Y sus dos hijos están jugando a las tabas en el suelo, sin enterarse de nada, con un viejo pedagogo al lado que los mira jugar.\n\nNo pasa nada. Eso es lo terrible. El pintor eligió el momento de antes, cuando la única persona en la habitación que sabe lo que va a suceder es ella. Todo el horror está en una cara quieta.\n\nEl segundo fresco está cerca y es completamente distinto: un matrimonio, los dos mirando al frente, como una foto.\n\nSe los conoce como Terentius Neo y su mujer, aunque el nombre es probable y no seguro: sale de una pintada electoral en la fachada de la casa. Durante décadas se los llamó por otro apellido, equivocado.\n\nÉl era panadero. La casa tenía el horno incorporado. Clase media comercial de Pompeya, ni pobres ni nobles.\n\nY ahora mirá lo que eligieron para retratarse, porque es el dato.\n\nÉl sostiene un rollo de papiro cerrado, con el sello a la vista. Ella tiene tablillas de cera en una mano y un punzón de escribir apoyado en el labio, en gesto de estar pensando qué escribir.\n\nDos panaderos se hacen pintar en la pared de su casa, y en vez de aparecer con el horno o con el pan, aparecen con los instrumentos de la escritura. Es lo que querían que se viera de ellos.\n\nY fijate en algo más: ella está adelante. No atrás, no al costado. Adelante, con el punzón en la boca.\n\nEso te dice bastante sobre esa ciudad. Saber leer y escribir no era privilegio de aristócratas, era un símbolo de estatus al que aspiraba un panadero, y una mujer podía ser retratada como la letrada de la pareja sin que a nadie le pareciera raro.\n\nUn aviso: si viste circular por internet un retrato parecido de una chica con un punzón llamado «Safo», es otro fresco, también de este museo. No es ella.",
      mirar: [
        "Medea con la espada, y los chicos jugando a las tabas sin saber nada.",
        "La pareja de panaderos se retrató con un rollo y un punzón, no con el horno.",
        "Ella está adelante, con el punzón en el labio. Era la letrada de los dos."
      ]
    },
    {
      id: "nap3-07", tipo: "parada", orden: 7, sala: "Villa dei Papiri",
      titulo: "La biblioteca quemada que se está leyendo ahora", autor: "", fecha: "siglo I d.C.",
      guion: "Esta sala abre a las diez, así que dejala para después de la Farnesiana. Y no te la saltees, porque acá hay algo que está pasando en este momento.\n\nTodo lo que ves salió de una sola casa: una villa enorme frente al mar en Herculano, el pueblo vecino de Pompeya. La sepultó la misma erupción del 79, pero de otra manera: a Pompeya la tapó la ceniza, a Herculano lo tapó una avalancha de barro y roca que al enfriarse quedó dura como cemento. Veintisiete metros de piedra encima.\n\nPor eso no se excavó a cielo abierto. En 1750 un ingeniero militar, Karl Weber, la exploró haciendo túneles, por abajo, a oscuras, como una mina. Así sacaron los bronces que estás viendo, que son el conjunto de bronces romanos más importante que sobrevivió en el mundo.\n\nBuscá cuatro bustos de bronce con el nombre grabado: Epicuro, Zenón, Hermarco, Demóstenes. Filósofos y oradores.\n\nNo eran adornos. Eran carteles de estantería. Marcaban dónde estaba cada autor en la biblioteca de la casa. Es un sistema de clasificación de biblioteca, del siglo primero antes de Cristo, hecho en bronce.\n\nPorque esa villa tenía biblioteca. Más de mil ochocientos rollos de papiro.\n\nY acá viene lo bueno. El calor no los destruyó: los carbonizó. Quedaron convertidos en cilindros negros, quebradizos, imposibles de abrir sin que se deshagan en escamas. Durante doscientos cincuenta años se intentó de todo: máquinas de desenrollar, productos químicos, cuchillos. Se destruyeron cientos en el intento.\n\nHasta que alguien tuvo otra idea: no abrirlos. Escanearlos con rayos X en un acelerador de partículas y después usar inteligencia artificial para encontrar, en esas imágenes, el rastro casi invisible de la tinta.\n\nEl 25 de junio de este año se anunció que por primera vez se leyó un rollo entero sin abrirlo. Uno solo, de mil ochocientos. Resultó ser un tratado de filosofía del siglo segundo antes de Cristo sobre la naturaleza humana y el progreso moral.\n\nY con una sorpresa: se daba por hecho que la biblioteca era toda epicúrea, de una escuela filosófica. El primer rollo leído es estoico, que es la escuela rival.\n\nLos rollos están hoy en la Biblioteca Nacional, acá en Nápoles, a quince minutos. Los que no se abrieron siguen cerrados, esperando.",
      mirar: [
        "Los cuatro bustos con nombre eran los carteles de las estanterías de la biblioteca.",
        "La villa se excavó con túneles, a oscuras, como una mina.",
        "En junio de este año se leyó el primer rollo entero sin abrirlo. Quedan 1.800."
      ]
    },
    {
      id: "nap3-08", tipo: "parada", orden: 8, sala: "Sótano — sección egipcia y Templo de Isis",
      titulo: "Egipto no quedaba lejos", autor: "", fecha: "",
      guion: "Bajá al sótano si te queda tiempo, porque hay una idea acá que cambia cómo mirás todo lo demás.\n\nEsta es la segunda colección egipcia de Italia, después de la de Turín. Siete salas. Se armó entre 1817 y 1821, comprando colecciones privadas enteras: la primera mitad del siglo diecinueve fue una fiebre de comprar y vender Egipto, y los museos europeos se llenaron así.\n\nLa pieza a buscar se llama el Naóforo Farnese. Es un hombre arrodillado que sostiene con las dos manos un templo en miniatura, con el dios Osiris adentro. «Naóforo» quiere decir portador de templo. Es un tipo cargando a su dios, literalmente, y es un tipo de estatua que en Egipto se hacía para dejar en un templo, como quien deja una foto.\n\nPero lo que quiero que te lleves de acá es otra cosa, y la vas a ver arriba.\n\nEste museo tiene, además, el Templo de Isis de Pompeya: la decoración entera de un templo egipcio que funcionaba en Pompeya cuando reventó el Vesubio. No una imitación, no una moda decorativa: un templo con sacerdotes, con ceremonias diarias, con fieles.\n\nIsis era una diosa egipcia, y su culto se expandió por todo el Imperio Romano. En Pompeya, una ciudad de veinte mil habitantes en la costa italiana, había un templo suyo en funcionamiento, y fue de los primeros edificios que se reconstruyeron después del terremoto del 62, antes que muchos templos romanos. O sea que la comunidad que lo bancaba tenía plata y tenía prisa.\n\nLa conclusión es la que te decía. Nosotros pensamos el mundo antiguo como compartimentos: los griegos por un lado, los romanos por otro, los egipcios allá lejos. No era así. Había egipcios viviendo en Nápoles, un dios del Nilo con estatua en una esquina del centro —el que viste el lunes de noche—, y un templo egipcio funcionando en Pompeya.\n\nEl Mediterráneo era un solo lugar y la gente se movía por él todo el tiempo.",
      mirar: [
        "El Naóforo Farnese: un hombre arrodillado cargando un templo con Osiris adentro.",
        "Arriba está el Templo de Isis de Pompeya, completo. Era un templo en uso.",
        "Se reconstruyó antes que templos romanos: la comunidad egipcia tenía plata."
      ]
    },
    {
      id: "nap3-09", tipo: "parada", orden: 9, sala: "Piazza Bellini",
      titulo: "La ciudad está tres metros abajo", autor: "", fecha: "siglo IV a.C.",
      guion: "Tomate el café acá, sentado, porque a tres metros de tus pies hay un pedazo de muralla griega y se ve desde la mesa.\n\nEn el medio de la plaza hay un hueco excavado con una reja. Asomate. Abajo vas a ver bloques de piedra amarilla, escuadrados, puestos en hiladas horizontales, formando dos paredes paralelas.\n\nEs la muralla de Neápolis, la ciudad griega de la que te hablé el lunes. Se calcula que este tramo es del siglo cuarto antes de Cristo, aunque hay quien lo tira un siglo más atrás. Apareció por casualidad en 1954, cavando para poner una cabina eléctrica.\n\nFijate en un detalle, en el extremo del tramo visible: el muro hace un quiebre. Ese codo es la marca de que ahí hubo una puerta de la ciudad, con una torre al lado. La torre ya no está. La puerta abría justo sobre la calle por la que vas a caminar en un rato.\n\nY si te acercás bien a los bloques, algunos tienen letras griegas grabadas: marcas que hacían los canteros al sacar la piedra, para que les pagaran por pieza.\n\nAhora la pregunta que importa: ¿por qué está tres metros abajo?\n\nLa respuesta no es que la ciudad se hundió. Es que el suelo subió, y subió por cuatro motivos que se acumularon durante veinticinco siglos. Uno: Nápoles nunca se abandonó, así que cada edificio que se caía se aplanaba y se construía encima; el escombro es relleno. Dos: las erupciones, sobre todo la de 1631, que dejó capas de ceniza. Tres: el material que bajó de las colinas con cada temporal. Y cuatro: rellenos hechos a propósito para obras.\n\nY ojo con esto, porque lo que ves es solo la parte de arriba del muro: el piso por donde caminaba la gente en esa época está unos diez metros más abajo. Sigue enterrado.\n\nUna última cosa sobre la piedra, que es la que ata todo el día.\n\nSe llama tufo amarillo napolitano y se formó hace quince mil años en una erupción. Es blanda cuando la cortás y se endurece al aire. O sea: es fácil de excavar y sirve para construir.\n\nNápoles está construida con la piedra que sacó de abajo de sí misma. La muralla que estás mirando y las cuevas donde vas a bajar a la tarde son el mismo acto: sacaste el bloque, lo pusiste arriba, y abajo te quedó el agujero.",
      mirar: [
        "El quiebre del muro marca dónde hubo una puerta con torre.",
        "Algunos bloques tienen letras griegas: marcas de los canteros.",
        "El piso de la ciudad antigua está diez metros abajo, no tres."
      ]
    },
    {
      id: "nap3-10", tipo: "tramo", orden: 10, sala: "Via dei Tribunali",
      titulo: "El decumano y las calaveras lustradas", autor: "", fecha: "",
      guion: "Estás en la calle principal de la Nápoles griega. El lunes caminaste la de abajo, Spaccanapoli; esta es la de arriba, la más importante de las tres, y en griego se llamaba plateia. Lo de «decumano» es la palabra romana, que vino después.\n\nLlevaba al ágora, la plaza pública, que es la actual Piazza San Gaetano, adonde vas a ir a la tarde. Los romanos la convirtieron en su foro y le pusieron encima un templo a Cástor y Pólux.\n\nEl nombre de hoy es mucho más tardío y bastante sombrío. En el siglo dieciséis el virrey español don Pedro de Toledo —el mismo de Via Toledo y de los Quartieri— concentró todos los tribunales de la ciudad en un solo edificio al final de esta calle, el Castel Capuano. Cinco tribunales temidos, en un lugar. La gente empezó a nombrar la calle por eso y el nombre quedó.\n\nTres cosas para mirar mientras caminás.\n\nLa primera está en Piazza San Gaetano, en la fachada de la iglesia de San Paolo Maggiore. Vas a ver dos columnas enormes incrustadas en el frente, de unos once metros. Son romanas de verdad, del templo de Cástor y Pólux del siglo primero. Ese templo tenía seis columnas y un frontón, y se mantuvo en pie hasta el terremoto de 1688. O sea que hasta hace trescientos años acá había un templo romano completo. Quedaron dos columnas y están ahí, en la calle, gratis.\n\nLa segunda no te la pierdas, y también es de afuera. Buscá una iglesia que se llama Santa Maria delle Anime del Purgatorio ad Arco. En la balaustrada de la fachada hay calaveras de bronce. Están negras por el tiempo, salvo la coronilla, que está brillante y lustrada de tanto que la gente las toca al pasar, desde hace siglos.\n\nLo que hay debajo de esa iglesia explica el brillo. Se construyó en 1616 para enterrar a los pobres de la ciudad, los que morían sin familia y sin casa. Y los napolitanos armaron con eso una costumbre propia: bajaban al subsuelo, adoptaban una calavera anónima, la limpiaban, le ponían un pañuelo, le armaban una casita con velas, y rezaban por esa alma para sacarla antes del purgatorio. A cambio, el alma agradecida tenía que devolver favores: protección, ayuda y, con toda seriedad, números de lotería en sueños.\n\nEra un contrato entre un vivo y un muerto que no se conocían. Y sigue habiendo flores frescas.\n\nOjo con el horario: el subsuelo abre solo hasta las dos de la tarde los miércoles. La iglesia de arriba es gratis, y las calaveras de la fachada están siempre.",
      mirar: [
        "Las dos columnas de San Paolo Maggiore son de un templo romano que cayó en 1688.",
        "Las calaveras de bronce del Purgatorio ad Arco: la coronilla lustrada de tocarlas.",
        "Abajo se adoptaban calaveras anónimas a cambio de favores. Todavía hay flores."
      ]

    {
      id: "nap3-11", tipo: "parada", orden: 11, sala: "Pio Monte della Misericordia",
      titulo: "El Caravaggio que nunca se movió", autor: "Caravaggio", fecha: "1607",
      guion: "Esto no está en tu plan y son diez euros y media hora. Decidilo vos, pero escuchá primero, porque es de esas cosas que no se repiten.\n\nAcá adentro hay un cuadro de Caravaggio que está en el mismo altar donde él lo dejó, en enero de 1607. No pasó por un museo, no se vendió, no viajó. Lo mirás en el lugar y con la luz para la que fue pensado. Eso casi no existe.\n\nEmpecemos por qué hacía Caravaggio en Nápoles.\n\nEl 28 de mayo de 1606, en Roma, mató a un hombre en una pelea. Lo condenaron en ausencia a algo que hay que explicar bien, porque no era solo pena de muerte: era una licencia pública. Cualquier persona en territorio del Papa podía matarlo legalmente y cobrar recompensa presentando su cabeza.\n\nSe escapó. Y vino acá porque Nápoles era territorio español, fuera de la jurisdicción papal. Llegó a fines de septiembre de 1606 y se quedó menos de un año. Murió en 1610, a los treinta y ocho, viajando por mar hacia Roma para buscar un perdón que nunca llegó a usar.\n\nEl cuadro se llama «Las siete obras de misericordia». Casi cuatro metros de alto. Le pagaron cuatrocientos ducados, una fortuna.\n\nLas siete obras de misericordia son siete mandatos cristianos de caridad: dar de comer, dar de beber, vestir, alojar, visitar enfermos, visitar presos, enterrar muertos. Hasta ese momento se pintaban como siete escenas separadas, ordenaditas.\n\nCaravaggio las metió todas juntas en un callejón napolitano, de noche. Un solo instante, apretado, caótico, iluminado por una antorcha. Los personajes no son santos idealizados: son gente de la calle, con los pies sucios.\n\nQué buscar, en orden.\n\nA la derecha, un hombre cargando un cadáver del que solo se ven los pies saliendo del cuadro. Eso es enterrar a los muertos.\n\nEn el centro, un tipo cortándose la capa con la espada: es San Martín vistiendo al desnudo.\n\nY a la derecha, la escena que hay que mirar de cerca: una mujer joven amamantando a un viejo a través de los barrotes de una prisión.\n\nEs una historia clásica. El viejo es Cimón, condenado a morir de hambre. La mujer es su hija, que lo visita y lo mantiene vivo a escondidas. Y con esa sola escena Caravaggio resuelve dos obras de un saque: dar de comer al hambriento y visitar al preso.\n\nAcercate. Se ve la leche cayendo sobre la barba del viejo. En un altar de iglesia, en 1607. No insinúa nada: lo muestra.\n\nArriba está la Virgen mirando. Y fijate en un detalle que no falla: su sombra cae sobre el muro de la prisión. No está en un cielo aparte. Está en el mismo callejón sucio.\n\nDos cosas prácticas. En 1613 la institución decretó que el cuadro no podía venderse a ningún precio: por eso sigue acá. Y cuando termines abajo, subí al primer piso: hay una ventanita desde la que los directores oían misa sin ser vistos, y desde ahí se ve el cuadro de arriba y de cerca. La mayoría entra, lo mira desde el piso y se va sin subir.",

        "La sombra de la Virgen cae sobre el muro: está en el mismo callejón."
      ]

    {
      id: "nap3-12", tipo: "tramo", orden: 12, sala: "Antes de bajar — Napoli Sotterranea",
      titulo: "El fantasma era el plomero", autor: "", fecha: "",
      guion: "En un rato bajás ciento treinta y seis escalones hasta unos cuarenta metros bajo la calle, con un guía en inglés. Te cuento ahora lo que probablemente no te van a contar bien, para que vayas sabiendo qué mirás.\n\nArranquemos por la idea que ata todo, la misma del café de la mañana. Los griegos sacaron de acá abajo el tufo para construir la ciudad de arriba. El subsuelo de Nápoles es el negativo exacto de Nápoles. Cada bloque que ves en una pared dejó un hueco debajo.\n\nDespués esos huecos se reutilizaron, y ahí está la historia.\n\nPrimero fueron cisternas de agua. Los romanos trajeron agua desde el río Serino, a unos setenta kilómetros, por un acueducto que en total pasaba los cien kilómetros y era el más largo del imperio. Esa agua llenaba estas cavidades.\n\nY acá va el detalle que tenés que buscar cuando estés abajo: en el techo de los túneles vas a ver agujeros. Son las bocas de los pozos que subían hasta las casas. Cada edificio de la ciudad tenía su pozo bajando hasta acá.\n\nO sea que durante casi dos mil años, en Nápoles, el agua no venía por una cañería: venía de abajo, y la subías con un balde.\n\nUn sistema así necesita mantenimiento, y de eso se encargaba un oficio que hoy nadie recuerda: los pozzari. Eran los tipos que bajaban por los pozos y se movían por estos túneles arreglando filtraciones. Vivían prácticamente ahí abajo. Andaban con una capucha que los hacía parecer frailes.\n\nY podían subir por cualquier pozo hasta adentro de cualquier casa.\n\nAhora pensá cómo se ve eso desde arriba. Una familia napolitana escucha ruidos de noche, aparece un tipo chiquito con capucha adentro de la casa, desaparecen cosas, a veces aparece algo de plata.\n\nDe ahí sale el munaciello, el «monjecito»: el duende más famoso de Nápoles, que entra en las casas, roba objetos chicos, mueve cosas y a veces deja dinero. El fantasma más conocido de la ciudad era, casi seguro, el plomero.\n\nEso último es la explicación más aceptada, no un hecho probado. Pero es difícil que sea casualidad.\n\nEn 1885 se hizo el acueducto nuevo y los pozos quedaron obsoletos. Las cuevas volvieron a servir una vez más: en 1943, durante los bombardeos, se convirtieron en refugios antiaéreos. Vas a ver grafitis en las paredes, restos de camas, juguetes y muros pintados de rojo. Miles de personas vivieron abajo durante semanas.\n\nY al final está el teatro romano donde cantó Nerón, hacia el año 64. Cantó acá y no en Roma a propósito: quería debutar ante público griego, el único que según él sabía escuchar. Durante la función hubo un terremoto y siguió cantando. Lo cuentan Suetonio y Tácito.\n\nLo mejor: el teatro nunca se excavó. Se construyeron casas encima y adentro. Se entra a las gradas por una trampilla en el piso de una casa particular.\n\nUn aviso: el pasaje angosto, donde hay que pasar de costado, es opcional. Si no te copa, esperás afuera.",
      mirar: [

      ]

    {
      id: "nap3-13", tipo: "parada", orden: 13, sala: "Antes de entrar — Cappella Sansevero",
      titulo: "El príncipe que quería que lo creyeran brujo", autor: "Raimondo di Sangro", fecha: "1710–1771",
      guion: "Adentro tenés audioguía en español, así que este audio es para antes de entrar, y es para dos cosas: que sepas de quién fue esta capilla, y que no te crean el cuento del velo.\n\nEl dueño se llamaba Raimondo di Sangro, séptimo príncipe de Sansevero, nacido en 1710 y muerto en 1771. Esta capilla era el panteón de su familia y él la convirtió en otra cosa.\n\nQuién era: un noble del siglo dieciocho con un laboratorio en su casa y una cabeza que no paraba. Esto está documentado, con fechas: en 1739 inventó un arma que disparaba con pólvora o con aire comprimido por el mismo caño. En 1748 hizo una tela impermeable y le regaló un piloto al rey. En 1752 fabricó una lámpara que ardió más de tres meses sin perder peso. En 1770 construyó una carroza anfibia con ruedas de paletas y navegó con ella frente a Posillipo. Hizo piedras preciosas artificiales, una imprenta que imprimía a varios colores de una sola pasada, y un reloj que tocaba melodías y se oía a kilómetros.\n\nTambién fue el primer gran maestre de la masonería napolitana, lo excomulgaron por eso, y consiguió que le levantaran la excomunión.\n\nY después está la leyenda negra: que mataba sirvientes para experimentar, que fabricaba sangre humana, que replicó el milagro de la sangre de San Gennaro con mercurio para demostrar que era un truco. Eso último sí lo hizo, y le costó carísimo con la Iglesia.\n\nLo interesante del tipo es que cultivaba su propia fama de brujo. Le convenía. Guardaba sus fórmulas en secreto a propósito, y un montón de inventos suyos se murieron con él porque nunca los escribió.\n\nAhora lo del velo, que es la razón principal de este audio.\n\nAdentro está el Cristo Velado, de Giuseppe Sanmartino, de 1753: un Cristo muerto de tamaño natural cubierto por un sudario transparente. Es de las cosas más impresionantes que vas a ver en el viaje.\n\nY hace dos siglos y medio que se cuenta que el príncipe puso encima una tela de verdad y la convirtió en piedra con un proceso alquímico. Te lo van a decir en la calle, lo vas a leer en diez lugares.\n\nEs falso, y hay papeles.\n\nExiste un documento del Banco di Napoli del 16 de diciembre de 1752, firmado por el príncipe, en el que encarga «la estatua de Nuestro Señor muerto cubierto por un velo también de mármol». Lo escribió él, antes de que la obra existiera. Y lo repitió por escrito dos veces más, en cartas a un físico francés y a un erudito italiano.\n\nO sea que el príncipe, que vivía de su fama de alquimista, podría haber dejado correr la leyenda y no lo hizo: dejó constancia tres veces de que era mármol.\n\nLo cual hace el asunto mejor, no peor. Porque significa que Sanmartino talló primero el cuerpo entero, con las venas y los agujeros de los clavos, y después le puso el velo encima en el mismo bloque, calculando el espesor. Esculpió el mismo cuerpo dos veces, una debajo de la otra.\n\nQué mirar: no la tela, sino dónde el mármol se hunde. Las cuencas de los ojos, la boca entreabierta, el hueco entre las costillas. Ahí se ve que el velo sigue el hueso de abajo.\n\nY abajo, en el sótano, están las máquinas anatómicas: dos esqueletos de pie con el sistema de venas y arterias completo. La leyenda dice que inyectó a dos sirvientes. Los estudios dicen que las venas son de cera y alambre. No hay magia; hay una habilidad que todavía no se termina de explicar.\n\nÚltima cosa: prohíben fotos, en serio. No pierdas tiempo.",
      mirar: [
        "El velo es mármol y hay documentos firmados por él que lo dicen.",
        "Mirá dónde el mármol se hunde: los ojos, la boca, el hueco entre las costillas.",
        "Las máquinas anatómicas del sótano son cera y alambre, no sirvientes inyectados."
      ]
    },
    {
      id: "nap3-14", tipo: "tramo", orden: 14, sala: "Metro Línea 1",
      titulo: "Bajate en Toledo, no en Dante", autor: "", fecha: "2001–2012",
      guion: "Un consejo antes de que tomes el metro, y te va a costar cinco minutos de caminata más y cero euros.\n\nEl plan dice tomarlo en Dante. Caminá un poco más y tomalo en Toledo, que queda para el otro lado. Si subís en Dante, te perdés la mejor estación de metro de Europa, que está a dos paradas.\n\nLa Línea 1 de Nápoles tiene un puñado de estaciones que se llaman «estaciones del arte»: en vez de decorarlas, les encargaron el diseño a arquitectos y artistas contemporáneos. No es arte colgado en una pared: la estación entera es la obra.\n\nToledo la hizo el arquitecto catalán Óscar Tusquets Blanca y se inauguró en 2012. Está a unos cuarenta metros de profundidad, la más honda de la red.\n\nQué hacer cuando entres: pararte al pie de la escalera mecánica y mirar para arriba.\n\nHay un cono ovalado que atraviesa todos los niveles, forrado en mosaico azul, con luz cayendo desde arriba. Le dicen el «cráter de luz».\n\nY la idea es la que ya venís caminando todo el día. Las paredes cambian de color a medida que bajás: arrancan marrón oscuro, como la tierra; después ocre, como el tufo amarillo que viste en Piazza Bellini; y abajo del todo, azul, como el mar. Estás bajando por un corte del suelo de Nápoles, en orden.\n\nEn el camino te cruzás además con restos de la muralla aragonesa del siglo quince, que aparecieron al excavar y los dejaron a la vista.\n\nEl Telegraph la eligió la estación más linda de Europa y la CNN la más impresionante. Ganó premios de arquitectura en 2013 y de ingeniería de túneles en 2015.\n\nY de ahí hasta Vanvitelli pasás por cuatro más, que también son estaciones de arte y se ven desde el andén.\n\nEn Dante hay un neón blanco en el vestíbulo con una frase de Dante, y un panel de acero con zapatos, sombreros y abrigos colgados.\n\nEn Museo hay una copia del Hércules Farnesio a tamaño real, el mismo que viste a la mañana, esperando en el atrio.\n\nEn Materdei, dibujos murales que cubren todo un pasillo.\n\nEn Salvator Rosa hay una mano gigante en el jardín de arriba y juegos —el ta-te-ti, la rayuela— incrustados en el piso.\n\nY en Quattro Giornate, cuarenta y cuatro metros bajo tierra, todo está dedicado a las Cuatro Jornadas de septiembre de 1943, cuando la gente de Nápoles se sacó a los alemanes de encima sola, peleando en la calle, antes de que llegaran los aliados. Fue la primera ciudad europea en liberarse por su cuenta.\n\nAhí vas a ver cuatro figuras femeninas blancas. Se llaman «Combatientes».",
      mirar: [

      ]

    {
      id: "nap3-15", tipo: "parada", orden: 15, sala: "Castel Sant'Elmo",
      titulo: "Una estrella de seis puntas apuntando a la ciudad", autor: "Pedro Luis Escrivá", fecha: "1537–1546",
      guion: "Doscientos cincuenta metros sobre el mar y una fortaleza que desde adentro no se entiende, porque su forma solo se ve desde arriba. Te la explico y después mirás.\n\nAcá hubo algo fortificado desde 1275. En 1329 Roberto de Anjou —el mismo rey de Santa Chiara, el de la iglesia que ardió— mandó ampliarlo. Se terminó en 1343.\n\nEl nombre no tiene que ver con yelmos ni armaduras, aunque suene. Viene de una iglesia del siglo diez dedicada a Sant'Erasmo, que en el habla se fue gastando: Eramo, Ermo, Elmo. Está documentado.\n\nPero lo que estás pisando es de doscientos años después. Entre 1537 y 1546, el virrey español don Pedro de Toledo —te lo volvés a cruzar, el tercer día seguido— lo hizo reconstruir de cero por un ingeniero militar valenciano, Pedro Luis Escrivá. Y le dio la forma que tiene: una estrella de seis puntas.\n\nPor qué una estrella, y esto es lo interesante del edificio.\n\nEl castillo medieval, el de las torres redondas y los muros altos, funcionaba contra catapultas y escaleras. Contra el cañón de pólvora dejó de servir, por dos motivos.\n\nEl primero: un muro alto y vertical es un blanco perfecto. El cañón lo voltea. La solución fue al revés de lo que uno esperaría: muros bajos, gruesos e inclinados, metidos en un foso. Lo que no sobresale, no se derriba.\n\nEl segundo es más sutil. Desde una muralla curva no podés disparar a lo largo de tu propia muralla. El que ataca se pega al pie del muro y ahí no le llega nada.\n\nLa solución la inventaron los italianos a fines del siglo quince y se difundió por Europa justo en las décadas en que se construyó esto. Se cambia la torre redonda por una punta de diamante. Y el truco es que desde la base de cada punta los cañones barren en línea recta el flanco de la punta vecina, que a su vez es cubierta por la siguiente. Nadie puede acercarse a un muro sin quedar bajo fuego cruzado de dos lados.\n\nSe pasa de aguantar a responder. Eso es esta forma.\n\nDos cosas para mirar. El foso no está construido: está excavado en la roca, y la piedra que sacaron es con la que levantaron el castillo — otra vez lo mismo de todo el día. Y la rampa cubierta por la que subís, larga y en pendiente, se hizo para que subieran carros de suministro. A los costados están las celdas.\n\nPorque esto fue cárcel política durante siglos, y ahí hay una historia que vale.\n\nEn enero de 1799 los revolucionarios napolitanos, inspirados en Francia, tomaron este castillo y el 22 de enero izaron acá arriba la bandera de la República Napolitana. El rey ya se había escapado a Palermo en un barco inglés.\n\nDuró menos de seis meses. Un cardenal armó desde Calabria un ejército campesino contrarrevolucionario y en junio la república cayó. Hubo unos ocho mil presos políticos y noventa y nueve ejecuciones. Entre los ejecutados había médicos, juristas, una poeta que dirigía el diario de la revolución, nobles ilustrados.\n\nFue una república de intelectuales que nunca consiguió que el campo la siguiera, y terminó con sus fundadores colgados en una plaza del puerto. Muchos pasaron antes por las celdas de esta rampa.\n\nUn dato más, de 1587: un rayo cayó en el polvorín y lo hizo volar. Unos ciento cincuenta muertos. Voló la iglesia, la casa del comandante y los alojamientos de los oficiales.",
      mirar: [
        "El foso está excavado en la roca: la piedra que sacaron es el castillo.",
        "Las puntas se cubren entre sí a cañonazos. Por eso la estrella.",
        "En enero de 1799 izaron acá la bandera de la República. Duró cinco meses."
      ]
    },
    {
      id: "nap3-16", tipo: "parada", orden: 16, sala: "Piazza d'Armi — la explanada",
      titulo: "Desde acá se ve la calle del lunes", autor: "", fecha: "",
      guion: "Subí a la explanada de arriba y date una vuelta completa. Esta es la mejor vista de Nápoles y tenés tiempo de sobra: el sol se pone seis y media y el castillo cierra siete y media.\n\nEmpecemos por lo que casi nadie sabe mirar.\n\nMirá hacia abajo, hacia el centro histórico, al este. Vas a ver un amontonamiento de techos, y una raya recta y oscura que lo corta de lado a lado, como un tajo.\n\nEsa es Spaccanapoli. La calle por la que caminaste el lunes a la noche.\n\nY ahora entendés el nombre. Spaccanapoli quiere decir «parte Nápoles», y se llama así precisamente por esta vista: desde acá arriba parece partir la ciudad en dos. El nombre de la calle nació de este punto de observación. Son dos kilómetros de una calle trazada hace más de dos mil cuatrocientos años que sigue exactamente donde la pusieron.\n\nSi mirás con atención vas a ver las callecitas que la cruzan en perpendicular. Una de esas es San Gregorio Armeno, la de los pesebres, donde estuviste hoy a la tarde.\n\nAhora girá hacia el este, del otro lado del golfo: el Vesubio.\n\nMil doscientos ochenta y un metros. Fijate en la silueta, que es doble: está el cono principal y, a la izquierda, un borde semicircular más bajo que lo abraza. Eso se llama Monte Somma y es lo que quedó del volcán viejo, el que voló en el año 79 y enterró Pompeya. El cono que ves en el medio creció adentro del cráter del anterior.\n\nNo está extinto. Está dormido. La última erupción fue en marzo de 1944, y hoy viven unas setecientas mil personas en la zona de riesgo. Mañana vas a estar parado en el borde de ese cráter.\n\nSeguí girando hacia el sur. Abajo, sobre el agua, vas a ver una masa cuadrada de piedra sobre un islote unido por un pasito: es el Castel dell'Ovo, el castillo más viejo de la ciudad. Más allá, el puerto, con los ferries a Capri y los cruceros.\n\nY en el horizonte, si el aire está limpio, Capri: una silueta baja y alargada con dos jorobas, a unos treinta kilómetros. El viernes vas a estar ahí. Si hay bruma no aparece; en octubre suele verse.\n\nA la derecha, cerrando todo, la loma verde de Posillipo con las casas colgadas. Y ahí es donde se pone el sol: no se hunde en el mar abierto, se esconde detrás de esa loma.\n\nSobre el reloj, para que lo aproveches bien.\n\nHasta las seis y media tenés luz dorada de costado, que es cuando mejor se ve Spaccanapoli, porque la sombra larga marca la calle.\n\nA las seis y treinta y seis se pone el sol.\n\nY entre esa hora y las siete pasa lo mejor, que casi nadie se queda a ver: el cielo todavía está claro, el Vesubio queda en silueta negra contra el azul, y la ciudad se empieza a encender de a pedazos.\n\nQuedate para eso. Tenés hasta las siete y media.",
      mirar: [
        "La raya recta que corta el centro es Spaccanapoli. El nombre salió de esta vista.",
        "El Vesubio tiene silueta doble: el borde de la izquierda es el volcán viejo del año 79.",
        "Entre 18:36 y 19:00 se enciende la ciudad y el Vesubio queda negro. Quedate."
      ]
    }

      id: "nap4-01", tipo: "tramo", orden: 1, sala: "Circumvesuviana a Ercolano",
      titulo: "Eso no es una montaña", autor: "", fecha: "",
      guion: "Veinticinco minutos de tren y el volcán va a estar a tu derecha casi todo el camino. Mirá por la ventanilla mientras te cuento qué es exactamente eso a lo que vas a subir.\n\nLo primero: no es una montaña. Es una máquina, y hay que entender cómo funciona.\n\nEl Vesubio es lo que se llama un estratovolcán: un cono construido por capas, como una cebolla. Una capa de lava, una de ceniza, otra de lava. Cada capa es una erupción.\n\nEso define cómo mata. Un volcán de lava líquida, como los de Hawái, hace ríos de roca derretida que se pueden esquivar caminando. Un estratovolcán no hace eso. El magma de acá es espeso, pastoso y cargado de gas. El gas no puede salir, se acumula bajo presión durante siglos, y cuando el tapón cede el volcán no derrama: estalla para arriba. Una columna de gas y roca pulverizada que sube treinta kilómetros.\n\nEso se llama erupción pliniana, y se llama así por un chico de diecisiete años.\n\nEl año 79, Plinio el Joven estaba del otro lado de la bahía leyendo. Su tío, Plinio el Viejo, era el comandante de la flota imperial romana. Vio la columna desde el mar y la describió con una comparación que le quedó para siempre: como un pino piñonero. Un tronco larguísimo que sube recto y arriba se abre en ramas horizontales.\n\nEs una descripción exacta. Eso es lo que hace una columna cuando llega al techo de la atmósfera y no puede subir más: se aplana y se abre.\n\nEl tío salió con las naves, y no por curiosidad: una mujer le mandó un pedido de auxilio desde la costa. Cruzó la bahía hacia el volcán mientras todos huían. Desembarcó, cenó tranquilo para calmar a los demás, se fue a dormir, y murió ahí al día siguiente.\n\nAños después el historiador Tácito le pidió al sobrino que escribiera qué había pasado. Le mandó dos cartas. Sin proponérselo, escribió el primer informe científico de una erupción de la historia.\n\nPor eso hoy, cuando un vulcanólogo ve una columna de treinta kilómetros en cualquier volcán del planeta, la llama pliniana. Por un adolescente romano que no se subió al barco con su tío.\n\nAhora mirá el perfil por la ventanilla, porque no es un cono: son dos cosas.\n\nA la izquierda, más bajo y con forma de medialuna, está el Monte Somma. A la derecha, el cono limpio, es el Vesubio.\n\nEl Somma es el cadáver del volcán viejo. Hace unos veintidós mil años hubo una erupción tan brutal que la cámara de magma se vació y la montaña se hundió sobre sí misma. Eso deja un cráter enorme, una caldera, y el Somma es la única pared que quedó parada.\n\nY adentro de esa caldera creció un cono nuevo. Ese es el que vas a subir: un volcán joven adentro del esqueleto de uno viejo.",
