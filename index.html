    {
      id: "mad4-09", tipo: "parada", orden: 5, sala: "Cava Baja — las posadas",
      titulo: "Comer arriba de la muralla", autor: "", fecha: "siglos XVII–XIX",
      guion: "Ahora, por qué esta calle está llena de restaurantes desde mucho antes de que existieran los restaurantes.\n\nLa Cava Baja quedaba justo afuera de la muralla, sobre el camino de entrada y salida hacia Toledo, por la Puerta de Moros. Y afuera de la muralla había algo que adentro no había: espacio.\n\nLos que llegaban a Madrid llegaban con carros, con mulas, con mercadería. Todo eso necesitaba patio, cuadra y cochera, y eso no entraba en las calles de adentro. Así que la hostelería se quedó a las puertas de la ciudad.\n\nHubo más de una docena de posadas documentadas por nombre. En 1833 quedaban cinco anunciándose en el diario.\n\nAhora, cómo reconocer una desde la vereda. Buscá tres marcas.\n\nUn portón de piedra mucho más ancho que una puerta normal: tenía que pasar un carro. Un patio que se adivina por el zaguán. Y planta baja de techos bajos, que era donde iban las cuadras.\n\nCon eso vas a identificar varias caminando.\n\nEn el número nueve está la Posada de la Villa, de 1642, la más vieja que sobrevive, con su horno de leña todavía encendido. En el treinta y cinco está Casa Lucio, que funciona en el local del viejo Mesón del Segoviano, documentado desde 1720, donde paraban los coches de mulas y de correos.\n\nPero la que tenés que pisar, aunque sea para tomar una caña, es la Posada del León de Oro, en el número doce.\n\nLa muralla del siglo doce, la del foso, atraviesa el edificio por debajo. Y cuando lo restauraron pusieron un piso de vidrio para que se vea.\n\nSe come parado arriba de doce metros de muralla del siglo doce, con medio cubo de torre y todo. Y no hace falta entrada ni reserva: entrás, pedís algo y mirás para abajo.\n\nEs la mejor manera de ver la muralla cristiana en todo Madrid, y está adentro de un bar.\n\nDos cosas más para el rato que estés acá.\n\nUna: los huevos de Casa Lucio. Lucio no los inventó, eso es mito. Lo que hizo fue volverlos famosos por cómo los sirve: los rompe en la mesa, delante tuyo, sobre las papas. La casa los llama huevos estrellados. Un domingo a las dos sin reserva es difícil conseguir mesa, pero la barra no necesita reserva.\n\nY dos: a un minuto de acá hay una plaza que se llama Plaza de los Carros. Se llama así porque hasta principios del siglo veinte era donde se juntaban los carros y las carretas.\n\nO sea que la historia que te acabo de contar tiene la prueba a la vuelta de la esquina, con nombre y cartel.",
      mirar: [
        "Portón ancho de piedra, patio y techos bajos: eso fue una posada.",
        "Número 12, Posada del León de Oro: piso de vidrio sobre la muralla del siglo XII.",
        "La Plaza de los Carros, a un minuto, se llama así por los carros de las posadas."
      ]
    },
    {
      id: "mad4-10", tipo: "tramo", orden: 6, sala: "San Andrés, la Plaza de la Paja y la Morería",
      titulo: "El santo que se mudó tres veces", autor: "", fecha: "siglo XII",
      guion: "Si te sobran veinte minutos antes de seguir, esta manzana es la más vieja de Madrid y se camina sola. Tres cosas.\n\nLa primera: la Plaza de la Paja, a media cuadra. Hoy es una plaza en cuesta con terrazas. En los siglos trece y catorce fue el centro comercial y civil de Madrid, el mercado principal, lo que después fue la Plaza Mayor. Perdió el puesto cuando en el siglo quince se armó la plaza del arrabal, que terminó siendo la Mayor.\n\nAhí abajo hay un jardín chiquito, el del Príncipe de Anglona, de 1761, que es de los pocos jardines nobiliarios del siglo dieciocho que quedan en Madrid. Es gratis y abre domingo.\n\nLa segunda es la iglesia de San Andrés, con su capilla enorme de cúpula que se ve desde la Plaza de los Carros. Y ahí hay una historia que vale.\n\nSan Isidro es el patrono de Madrid y no era rey, ni obispo, ni guerrero: era un peón de campo. Nació acá alrededor de 1082, cuando Madrid todavía era territorio musulmán, trabajaba la tierra para un señor llamado Vargas, y estaba casado con una mujer que también terminó siendo santa.\n\nY acá está lo interesante, que casi nadie cuenta: de su vida no se sabe casi nada. La única fuente antigua es un códice escrito alrededor de 1275, cien años después de que muriera, y registra cinco milagros y poco más. Todo lo demás —los ángeles arando mientras él rezaba, la fuente milagrosa, el pozo del que subió el agua para salvar a su hijo— se reconstruyó en el siglo dieciséis, cuando Madrid empujó su canonización.\n\nO sea que el patrono de la ciudad es, en buena medida, una biografía escrita cuatro siglos después.\n\nAhora, el cuerpo. Ese es el mejor dato de la manzana.\n\nLo enterraron acá en 1172. En 1213 le hicieron una capilla. En 1535 lo trasladaron a la capilla de al lado, la del Obispo, y veinticuatro años después lo trajeron de vuelta porque los curas de San Andrés no querían perderlo: era un imán de peregrinos. Después le construyeron, entre 1643 y 1669, esa capilla gigante que estás mirando, veintiséis años de obra, para guardarlo.\n\nY en 1769 Carlos III lo mandó a otra iglesia, en la calle Toledo, donde sigue.\n\nVeintiséis años de obra para un cuerpo que se llevaron cien años después. La capilla quedó vacía y ahí está.\n\nLa tercera cosa es lo que no vas a ver. Bajando hacia las Vistillas estaba la Morería, el barrio donde quedó confinada la población musulmana después de 1083. No sobrevive ni una mezquita, ni un palacio, ni unos baños. Lo único que queda es el plano: calles angostas, torcidas, en cuesta, sin alineación. La morería sobrevive como forma, no como edificio.\n\nSalvo por una cosa. En la Costanilla de San Pedro está la torre de San Pedro el Viejo, de ladrillo, de mediados del siglo catorce, levantada por albañiles musulmanes. Mirá arriba: el campanario de encima es del siglo diecisiete y se ve el injerto a simple vista.\n\nEsa torre es mano de obra de la morería, todavía parada.",
      mirar: [
        "San Isidro era un peón de campo y casi nada de su vida está documentado.",
        "La capilla enorme se construyó 26 años para un cuerpo que se llevaron en 1769.",
        "La torre de ladrillo de San Pedro el Viejo la levantaron albañiles musulmanes."
      ]
    },
    {
      id: "mad4-06", tipo: "tramo", orden: 7, sala: "Calle de Embajadores",
      titulo: "Embajadores y la Tabacalera", autor: "", fecha: "1790–hoy",
      guion: "De la Cava Baja al Matadero hay media hora caminando o unas paradas de metro. Si las piernas están bien, caminá: es el mejor corte transversal del Madrid obrero que vas a tener en todo el viaje, y hay tres cosas en el camino.\n\nCasi todo el tramo es una sola calle, Embajadores, que baja desde el centro hasta la antigua periferia industrial. Es la columna vertebral de Lavapiés.\n\nLo primero, en el número quince, es la Iglesia de San Cayetano. Vas a ver una fachada de granito con ocho columnas robustas, barroca, terminada en 1761 por Francisco de Moradillo.\n\nPero lo que ves es solo la fachada, y hay una razón. El 19 de julio de 1936, el día siguiente al golpe militar que empezó la Guerra Civil, un grupo entró y le prendió fuego a la iglesia. Se quemó entera. Lo único que quedó en pie fue el frente de piedra. La reconstruyeron recién en los años sesenta y volvió a abrir en 1962.\n\nAsí que estás mirando una fachada del siglo dieciocho con un edificio de los años sesenta atrás. En Madrid hay bastante de eso y casi nunca está señalizado.\n\nLo segundo, en el cuarenta y uno, es el Mercado de San Fernando. Es un mercado de barrio de los años cuarenta que se fue reconvirtiendo: quedan puestos de toda la vida al lado de bares nuevos y librerías de saldo. Si querés parar a tomar algo, es un lugar mucho más honesto que el Mercado de San Miguel del primer día, y cuesta la cuarta parte.\n\nY lo tercero, en el cincuenta y uno, es el edificio grande: la Tabacalera.\n\nLo mandó construir Carlos III y se terminó en 1790, pero no para tabaco. Se hizo como Real Fábrica de Aguardientes: un depósito para los productos que el Estado vendía en monopolio, o sea aguardiente, licores y —esto es real— barajas de naipes.\n\nEn 1809, durante la ocupación francesa, José Bonaparte lo convirtió en fábrica de cigarrillos con ochocientas trabajadoras. Desde 1825 quedó como fábrica de tabaco y funcionó así más de siglo y medio.\n\nY acá está lo que hay que saber del edificio, que son las cigarreras.\n\nEran mujeres, miles, reclutadas desde chicas. Ochocientas en 1809, tres mil en 1853, seis mil trescientas en 1890. Seis mil mujeres en un solo edificio, liando tabaco a mano, en una España donde casi ninguna mujer trabajaba fuera de su casa.\n\nEso produjo algo que no estaba en los planes de nadie: fueron de los primeros colectivos obreros organizados del país. Paraban, se plantaban, negociaban y ganaban. Tenían fama de intratables y la tenían bien ganada. Cuando se lee la historia del movimiento obrero español, las cigarreras aparecen antes que casi todo el mundo.\n\nHoy el edificio está partido en dos: una mitad es sala de exposiciones del Estado y la otra es un centro social autogestionado, con talleres, huerto y murales. Se entra gratis a las dos. Si está abierto, metete aunque sea diez minutos al patio: se ve la escala de la fábrica.\n\nDe ahí seguís por el Paseo de las Delicias y en un rato tenés el Museo del Ferrocarril a la derecha.",
      mirar: [
        "San Cayetano: la fachada es de 1761 y todo lo de atrás, de los años sesenta.",
        "El Mercado de San Fernando: puestos viejos y bares nuevos, a precio de barrio.",
        "La Tabacalera: seis mil mujeres trabajaban ahí en 1890."
      ]
    },
    {
      id: "mad4-03", tipo: "parada", orden: 8, sala: "Matadero Madrid",
      titulo: "El Matadero", autor: "Luis Bellido", fecha: "1911–1925",
      guion: "Un conjunto de naves de ladrillo rojo, enormes, con techos altos y patios entre medio. Durante ochenta años acá se mataron vacas. Hoy es el centro cultural más grande de Madrid.\n\nEl complejo lo diseñó el arquitecto municipal Luis Bellido y se construyó entre 1911 y 1925. No era solo un matadero: era el matadero y mercado de ganado de toda la ciudad, cuarenta y ocho edificios sobre más de dieciséis hectáreas, con su propio sistema de rieles, corrales, establos y cámaras frigoríficas. Funcionó hasta 1996.\n\nMirá el estilo, porque es muy español y tiene nombre: neomudéjar. El mudéjar era la forma de construir de los albañiles musulmanes que se quedaron a vivir en los reinos cristianos después de la Reconquista, y su marca es el ladrillo visto trabajado en dibujos geométricos, sin piedra y sin mármol, porque era barato y rápido. A fines del siglo diecinueve los arquitectos españoles lo recuperaron para edificios industriales y populares —fábricas, plazas de toros, estaciones— justamente porque era económico. Fijate en los frisos, los arcos y las cenefas: todo está hecho con ladrillos puestos de distinta manera. No hay ningún material caro en todo el edificio.\n\nY ahora lo que hace especial al lugar hoy. Cuando lo convirtieron en centro cultural, a partir de 2006, tomaron una decisión que no es la habitual: no lo maquillaron. No taparon nada. Dejaron los rieles en el piso por donde corrían las reses colgadas, los ganchos, los azulejos blancos lavables de las salas de faena, las canaletas de desagüe, las inscripciones pintadas en las paredes. Entrás a una sala de exposiciones y estás parado adentro de una cámara de despiece, y se nota.\n\nEsa honestidad es rarísima y es lo que hay que ir a ver, más que la muestra que haya esa tarde. Caminá los patios entre naves, metete en las que estén abiertas y mirá el piso y los techos.\n\nEs gratis, es enorme y los domingos a la tarde está lleno de familias del barrio. No intentes verlo entero: entrá en dos o tres naves y seguí, porque a diez minutos caminando tenés el río.",
      mirar: [
        "Los rieles y ganchos en el techo por donde iban las reses colgadas.",
        "Los azulejos blancos y las canaletas de las salas de faena.",
        "El ladrillo trabajado en dibujos: neomudéjar, sin un solo material caro."

      id: "mad4-11", tipo: "parada", orden: 9, sala: "Matadero — las naves por dentro",
      titulo: "Juntos pero no revueltos", autor: "", fecha: "2006–hoy",
      guion: "Entrá a cualquiera de las naves y vas a ver algo que probablemente te parezca inacabado: paredes descascaradas, ladrillo pelado, azulejos rotos, manchas negras en el techo, y al lado una estructura nueva de acero o de madera sin disimular.\n\nEso no es falta de plata ni obra a medio hacer. Es la decisión más interesante de este lugar y tiene dos reglas escritas.\n\nLa primera: la piel exterior de cada edificio no se toca. Ni una ventana, ni un ladrillo.\n\nLa segunda, que es la buena: todo lo que se agregue tiene que poder desarmarse. Si mañana hiciera falta devolver una nave a como estaba, se desmonta y listo. Nada se clava para siempre.\n\nEsa palabra —reversibilidad— explica todo lo que estás viendo. Lo nuevo no se disfraza de viejo y lo viejo no se maquilla de nuevo. Los arquitectos que hicieron la primera nave lo resumieron en una frase que quedó: juntos pero no revueltos.\n\nHay una diferencia de fondo acá, y vale para todo el viaje.\n\nRestaurar es imaginar cómo era el edificio en su mejor momento y dejarlo así, como nuevo. El problema es que en esa operación se borra todo lo que le pasó después: que fue un matadero sesenta años, que se incendió, que estuvo abandonado.\n\nConservar es dejar que el edificio siga contando lo que le pasó, y poner lo nuevo al lado, visiblemente nuevo.\n\nAcá eligieron lo segundo. Y ahora que lo sabés, buscá estas tres cosas.\n\nUna: en una de las naves hay un muro entero hecho de tejas viejas apiladas de canto. Son las tejas del techo arruinado de ese mismo edificio: las bajaron, las amontonaron y las metieron adentro como tabique. El escombro del edificio se volvió material del edificio.\n\nDos: en la Nave 0, que era la cámara frigorífica del matadero, vas a ver manchas negras de humo en las paredes y el techo. Son de un incendio de los años noventa y están ahí a propósito, sin restaurar. Ahí adentro hay una exposición, gratis, de viernes a domingo hasta las nueve de la noche, y funciona sobre ese fondo quemado. El programa se llama Abierto por Obras y la idea es exactamente esa: el artista trabaja con las grietas, no las tapa.\n\nY tres: en la Cineteca, el interior está forrado con mangueras industriales naranjas. Nada más lejos de un cine clásico, y nada más fácil de sacar.\n\nUn aviso para que no la busques en vano: el invernadero de cristal que está acá al lado cierra los domingos a las dos de la tarde. A esta hora está cerrado.",

      guion: "Estás caminando por un parque de seis kilómetros junto al río, y abajo tuyo, a unos metros, pasan ocho carriles de autopista. Esa es toda la historia de este lugar, y es una de las obras urbanas más grandes que se hicieron en Europa en este siglo.\n\nEmpecemos por el río, que necesita una aclaración. El Manzanares es célebre en España por ser un río malísimo. Durante siglos fue objeto de burla: los escritores del Siglo de Oro se reían de que Madrid tuviera un puente monumental y un hilo de agua abajo. Le decían aprendiz de río. Es un chiste viejo y sigue vigente.\n\nDurante la segunda mitad del siglo veinte, a ese río pobre le pusieron al lado una autopista, la M-30, que es el anillo de circunvalación de Madrid. O sea que entre la ciudad y su río había ocho carriles de autos a toda velocidad. El río quedó como el fondo de la ciudad: nadie iba, nadie lo miraba.\n\nEntonces se hizo algo carísimo y bastante radical: enterrar la autopista. Entre 2004 y 2007 metieron el tramo que va junto al río en túneles por debajo del suelo, y entre 2007 y 2011 construyeron este parque encima, donde antes había asfalto. Costó miles de millones de euros, fue muy discutido mientras se hacía —tres años de obra y de caos en toda la ciudad— y hoy nadie en Madrid lo cambiaría.\n\nDe lo que vas a ver mientras caminás, quedate con tres cosas.\n\nLos puentes viejos, sobre todo el Puente de Segovia y el Puente de Toledo. El de Toledo es de principios del siglo dieciocho, barroco, con hornacinas y estatuas, y es exactamente el puente monumental del que se burlaban los escritores.\n\nEl Puente de Arganzuela, que es el nuevo: dos espirales metálicas entrelazadas, del arquitecto francés Dominique Perrault. Si podés, cruzalo por dentro y mirá cómo la estructura gira alrededor tuyo.\n\nY el río mismo. En 2016 se tomó otra decisión importante: abrir las compuertas de las represas que lo mantenían artificialmente ancho y quieto, como un lago falso, y dejar que corriera como un río de verdad. Bajó el nivel, aparecieron islas de arena y vegetación, y volvieron los patos, las garzas y los peces. Hoy el Manzanares se parece por primera vez en siglos a un río.\n\nCaminá hacia el sur con el sol bajando. Es la última tarde del viaje en España por ahora, y mañana a las siete y media salís para Nápoles.",

      guion: "Estás sobre nueve arcos de granito, a doce metros del agua, en un puente que es desmesurado para el río que cruza. Y la explicación no es la que te van a contar.\n\nLa versión popular dice que se burlaban de él: un puente enorme para un río ridículo. Esa burla existe, es famosa, y es sobre otro puente. Góngora, Lope, Quevedo, todos le pegaron al Manzanares y a su puente entre 1590 y 1640 — pero ese era el Puente de Segovia, y este todavía no existía. Se terminó en 1732, casi un siglo después.\n\nLa razón real de que sea así de bestia es mucho mejor.\n\nEl río se llevó los tres anteriores.\n\nEl primero lo mandó hacer Felipe IV alrededor de 1650, para unir Madrid con Toledo. Se lo llevó una crecida. El segundo se hizo en los años setenta del siglo diecisiete y se lo llevó otra crecida el mismo año en que se terminó. El tercero, de 1684, aguantó hasta que una avenida lo dañó en 1720.\n\nEntonces llamaron a Pedro de Ribera y le hicieron uno que no se moviera nunca más. Catorce años de obra. Nueve arcos de sillería de granito. En las puntas, el tablero se abre de nueve a treinta y cinco metros de ancho.\n\nNo es vanidad barroca. Es un tipo al que se le cayeron tres puentes y sobredimensionó el cuarto.\n\nY funcionó: lleva casi trescientos años.\n\nAhora, qué mirar, y son dos cosas.\n\nLa primera son los dos templetes del medio, uno a cada lado, enfrentados. Ahí adentro están San Isidro y su mujer, Santa María de la Cabeza —el mismo peón de campo del que te hablé al mediodía—. Los pusieron ahí para poner la obra bajo la protección del patrono de la ciudad.\n\nDespués de que el río se llevara tres puentes, le pidieron ayuda al santo. Ese chiste se cuenta solo.\n\nY fijate en la proporción: el puente entero es sobrio, casi de ingeniería, y todo el adorno está concentrado en esos dos bultos. Estípites, querubines, volutas, guirnaldas, columnas retorcidas. Ribera puso el noventa y cinco por ciento de la decoración en el cinco por ciento del puente.\n\nLa segunda cosa es lo que hay debajo y no se ve. En 2007, cuando enterraron la autopista, aparecieron los restos de seis pilas del puente anterior, ocho metros por debajo del nivel de la calle.\n\nDebajo del puente que estás pisando hay otro puente, enterrado.\n\nUn último dato, para dimensionar lo que cambió. Entre 1974 y 2011 este puente estuvo rodeado de autopista, con los autos pasándole por los costados. Durante casi cuarenta años fue un obstáculo de tránsito y no un monumento. Volvió a ser un puente para caminar recién en 2011, doscientos setenta y nueve años después de que lo terminaran.\n\nSi llegaste cerca de las siete y cuarto, quedate. El sol bajo les pega de costado a los templetes y es la única hora del día en que se ve lo que Ribera talló: cada moldura tira su propia sombra. A mediodía es una mancha blanca y plana.",

malla a lo largo del tubo y te proyecta la trama encima y sobre el piso de madera. Es el único momento del día en que hace eso.\n\nSi te da el reloj, entrá a ese puente alrededor de las siete y cuarto y después caminá al Puente de Toledo, que está a un kilómetro. Vas a tener la trama de metal primero y los templetes con luz rasante después.\n\nY una cosa del suelo que pisás todo el tiempo. Los pinos del parque —más de ocho mil— están plantados arriba del techo de la autopista. No están en fila: están en grupos, torcidos, a distintas alturas, a propósito. Los diseñadores lo llaman una coreografía.\n\nEstás caminando sobre una autopista de ocho carriles, y los árboles también.",

      titulo: "La nutria", autor: "", fecha: "abril de 2026",
      guion: "Último audio de Madrid. Bajá a la orilla, quedate mirando el agua, y te cuento cómo termina la historia del río del que se burlaba todo el Siglo de Oro.\n\nEn 1940 le pusieron al Manzanares nueve presas en su tramo urbano. La idea era que se viera lindo: que hubiera agua quieta y ancha en vez de un hilo de barro. El resultado fue una cadena de embalses chicos, con agua parada, olor, mosquitos, casi nada de vegetación y prácticamente ningún bicho.\n\nDurante setenta y cinco años el río de Madrid fue eso: una pileta larga.\n\nY en mayo de 2016 el ayuntamiento hizo algo que casi no se hace nunca en una obra pública. Abrió las compuertas y las dejó abiertas.\n\nNo plantaron nada. No construyeron nada. Solo dejaron que el agua volviera a correr por siete kilómetros y medio, y se fueron.\n\nLo que pasó después no lo diseñó nadie.\n\nEl río empezó a formar bancos de arena e islas, porque un río que corre erosiona en un lado y deposita en el otro. Crecieron solos juncos, sauces y fresnos en las orillas. Y detrás vino todo lo demás.\n\nHoy hay más de cincuenta especies de aves en el tramo urbano. Ánades, gallinetas, garzas, garcetas, martinetes, cormoranes, y martín pescador, que es un pájaro turquesa que no vive en agua sucia. Si se te cruza un destello celeste sobre el agua, es él.\n\nVolvieron los peces: barbos, que se están reproduciendo acá adentro, y en mayo de este año soltaron doscientos ejemplares de cuatro especies autóctonas que estaban extinguidas en el río desde mediados del siglo veinte.\n\nY soltaron galápagos.\n\nPero el dato es de este año y es el que cierra todo.\n\nEl 19 de abril de 2026, una cámara municipal filmó una nutria nadando en el Manzanares. Acá, en el tramo urbano, a unos cientos de metros de donde estás parado, río arriba, cerca del Puente de Toledo.\n\nEs la primera confirmación en cincuenta años.\n\nY lo que la hace importante no es que sea simpática. La nutria es lo que los biólogos llaman una especie indicadora: no aparece si no hay agua limpia, suficientes peces y lugares donde esconderse. No se la puede traer ni convencer. Aparece sola cuando el sistema funciona, y no antes.\n\nO sea que hay una nutria viviendo arriba del techo de una autopista de ocho carriles, en el río del que Góngora escribió que no daba ni para media puente.\n\nY fijate en el método, porque es el mismo del Matadero. Ahí no restauraron: dejaron las paredes quemadas a la vista y pusieron lo nuevo al costado, sin disimular. Acá no rediseñaron el río: abrieron seis compuertas y dejaron de hacer.\n\nLas dos cosas que viste esta tarde salieron de la misma idea. Dejar que la cosa muestre lo que es.\n\nQuedate hasta las ocho y veinte. El sol se pone menos cinco, pero la media hora de después es la mejor luz del día, y el agua la devuelve entera.\n\nMañana a las diez y media volás a Nápoles.",

      id: "tol-01", tipo: "parada", orden: 1, sala: "Subiendo desde la estación",

      guion: "Antes de que empieces a subir, unos minutos de contexto que van a hacer que el resto del día tenga sentido. Porque Toledo no es un pueblo bonito: es una capital fracasada, y eso es exactamente lo que la volvió interesante.\n\nPrimero, la geografía, porque lo explica todo. Toledo está encima de un peñón de granito, y el río Tajo lo rodea por tres lados metido en un barranco profundo. O sea que es una fortaleza natural: por tres lados no se puede atacar, y por el cuarto se pone una muralla y listo. Cualquiera que quisiera controlar el centro de la península quería este peñón.\n\nY todos lo tuvieron. Los romanos, primero. Después los visigodos, que eran un pueblo germánico que se quedó con España cuando el Imperio Romano se cayó, y que en el siglo seis hicieron de Toledo la capital de su reino. Después, en el 711, llegaron los musulmanes desde el norte de África y Toledo fue una ciudad islámica durante casi cuatrocientos años. Y en 1085 la tomó el rey cristiano Alfonso VI —el mismo que de paso se había quedado con Madrid— y volvió a ser capital, ahora del reino de Castilla.\n\nAhora viene lo bueno, y es la razón por la que a Toledo la llaman la ciudad de las tres culturas. Después de la conquista cristiana no echaron a nadie. Siguieron viviendo acá cristianos, musulmanes y judíos, en barrios separados, con sus templos, sus leyes y sus idiomas. No era un paraíso de convivencia —había impuestos distintos, humillaciones y estallidos de violencia— pero durante trescientos años las tres comunidades compartieron la misma ciudad. La judía era una de las más grandes e importantes de Europa.\n\nY de esa mezcla salió algo que le cambió la cabeza al continente entero. En los siglos doce y trece funcionó acá lo que se llama la Escuela de Traductores de Toledo: equipos de judíos, musulmanes y cristianos que tradujeron al latín los libros que estaban en árabe. Y en árabe estaba casi todo: la medicina, la astronomía, las matemáticas, y sobre todo los filósofos griegos, que en Europa se habían perdido y que los árabes habían conservado y comentado durante siglos. Aristóteles vuelve a Europa por acá. Un solo traductor, Gerardo de Cremona, que era italiano y se vino a vivir a Toledo justamente porque acá estaban los libros, tradujo él solo más de ochenta obras: el tratado de astronomía de Ptolomeo que ordenaba el cielo entero, el manual de medicina de Avicena que se usó en las universidades europeas durante quinientos años, matemáticas, óptica, alquimia. Esta ciudad fue durante un par de siglos el lugar donde el conocimiento cambiaba de idioma, y después se repartía por toda Europa.\n\n¿Y qué pasó? Dos golpes. En 1492 los Reyes Católicos expulsaron a los judíos de España: la comunidad que había estado acá ochocientos años tuvo cuatro meses para irse o convertirse. Y en 1561 el rey Felipe II se llevó la corte a Madrid, sesenta y cinco kilómetros al norte. Toledo dejó de ser capital de un día para el otro.\n\nY ahí está la clave de lo que vas a ver hoy. Cuando una ciudad pierde el poder, deja de construirse encima de sí misma. Toledo se congeló en el siglo dieciséis. Por eso las calles siguen siendo medievales, por eso las sinagogas siguen en pie, por eso la ciudad entera es patrimonio de la humanidad. Madrid ganó y se llenó de edificios nuevos. Toledo perdió y por eso todavía está acá.",

      titulo: "La subida", autor: "", fecha: "",
      guion: "Bajaste del tren y tenés veintidós minutos de caminata hasta la primera visita. Es una subida y vale la pena, porque entrás a la ciudad por la puerta por la que se entraba hace quinientos años.\n\nPero antes de salir, date vuelta y mirá la estación de la que acabás de salir. No te la pierdas, que es de los mejores edificios ferroviarios de España.\n\nEs de 1919 y la hizo Narciso Clavería. Tiene torre de reloj, arcos recortados con forma de pétalos, almenas escalonadas, azulejos por todos lados y, adentro, una reja de hierro forjado que es una obra de arte en sí misma. Está declarada monumento desde 1991.\n\nY acá está lo interesante, que es una pequeña trampa. El edificio parece medieval y no lo es: tiene cien años. Está hecho en un estilo que se llama neomudéjar, que es la copia moderna del mudéjar auténtico que vas a ver todo el día. O sea que lo primero que ve el que llega a Toledo es una imitación. La hicieron a propósito, para que el turista bajara del tren y ya sintiera que había llegado a la ciudad de las tres culturas.\n\nNo es un engaño, es escenografía. Pero conviene saberlo, porque hoy vas a ver la cosa real y la diferencia se nota.\n\nAhora empezá a caminar. Vas a cruzar el Tajo por el puente de Azarquiel, que ese sí es moderno de verdad, de los años ochenta, de hormigón. Lo que vale es el nombre.\n\nAzarquiel fue un astrónomo que vivió en Toledo en el siglo once. Construía instrumentos para medir la posición de las estrellas, mejoró el astrolabio hasta que funcionó en cualquier latitud del planeta, y armó unas tablas astronómicas —las Tablas Toledanas— que en Europa se usaron durante siglos para saber dónde iba a estar cada astro en cada fecha. Trabajaba desde este peñón. Los mismos libros que él escribió en árabe son los que después se tradujeron al latín acá mismo.\n\nO sea que cruzás el río sobre un puente que lleva el nombre del hombre que midió el cielo desde la piedra que estás por subir. Mientras cruzás, mirá el barranco: eso es lo que hizo a Toledo inexpugnable.\n\nDel otro lado aparece una puerta grande de piedra con un escudo enorme tallado arriba: es la Puerta de Bisagra Nueva. La hizo Alonso de Covarrubias en 1559 y el escudo es el del emperador Carlos V, con el águila de dos cabezas. Era la entrada de gala de la ciudad: por acá entraban los reyes.\n\nFijate que la puerta tiene dos cuerpos con un patio en el medio. Eso no es decorativo: era una trampa. El que entraba quedaba encerrado en ese patio, con gente arriba, antes de poder pasar a la ciudad.\n\nSeguís por la Calle Real del Arrabal, que es la cuesta. Arrabal quiere decir el barrio de afuera de la muralla, y eso es exactamente lo que estás cruzando. A mitad de camino, a la derecha, vas a tener una iglesia de ladrillo con la torre cuadrada: Santiago del Arrabal, del siglo trece.\n\nPará medio minuto y mirá el ladrillo. Está puesto formando dibujos geométricos, arcos ciegos y cintas, sin una sola piedra tallada. Eso es mudéjar de verdad: albañiles musulmanes construyendo iglesias cristianas, con la técnica y el vocabulario decorativo que sabían. Es la misma idea que la estación imita, pero setecientos años antes y en serio.\n\nUn poco más arriba pasás por otra puerta, más chica y más linda que la de Bisagra: la Puerta del Sol. Es del siglo catorce, la levantaron los caballeros de la Orden de San Juan, y es de ladrillo y piedra con arcos superpuestos. Buscá el medallón de mármol que tiene en el medio: alrededor hay un sol y una luna, y de ahí le viene el nombre.\n\nDe ahí ya estás adentro de la medina, o sea de la ciudad musulmana, y la Mezquita del Cristo de la Luz está a dos pasos.\n\nUn aviso sobre las piernas: esto es todo cuesta arriba y el día son nueve horas caminando. Si preferís ahorrarte la subida, Toledo tiene escaleras mecánicas públicas que suben desde la zona de la estación hasta el casco. Son gratis y no es hacer trampa. Perdés estas puertas, eso sí.",
      mirar: [
        "La estación es neomudéjar de 1919: una imitación, y está bien hecha.",
        "El escudo de Carlos V sobre la Puerta de Bisagra, y el patio-trampa del medio.",
        "El ladrillo de Santiago del Arrabal: mudéjar auténtico, sin una piedra tallada."
      ]
    },
    {
      id: "tol-02", tipo: "parada", orden: 3, sala: "Mezquita del Cristo de la Luz",
      titulo: "La mezquita del año 999", autor: "Musa Ibn Ali, para Ahmad Ibn Hadidi", fecha: "999",
      guion: "Es un edificio chiquito, casi un cubo de ladrillo, al que le pasarías por al lado sin mirarlo. Tiene mil veintisiete años y es el edificio más antiguo que vas a ver hoy, más viejo que la catedral por doscientos treinta años.\n\nSe construyó en el año 999 como mezquita de barrio, y sabemos la fecha exacta porque está escrita en la pared. Mirá la fachada del lado suroeste: hay una inscripción en ladrillo, en escritura árabe, que dice quién la pagó —un vecino llamado Ahmad Ibn Hadidi— y quién la construyó. Es como una placa de obra, puesta hace mil años.\n\nSe llamaba mezquita de Bab al-Mardum, por la puerta de la muralla que tenía al lado.\n\nAhora entrá y mirá para arriba, porque ahí está lo extraordinario. El espacio es minúsculo: cuatro columnas en el medio dividen el interior en nueve cuadraditos. Y cada uno de esos nueve tiene una bóveda distinta. Nueve bóvedas, nueve diseños diferentes, ninguno repetido, hechas con nervios de ladrillo que se cruzan formando estrellas.\n\nEso, en el año 999, era alarde puro. El arquitecto estaba demostrando que podía resolver nueve veces el mismo problema de nueve maneras distintas, en un edificio del tamaño de un garaje. Y esos nervios cruzados son la misma idea que doscientos años después va a hacer posibles las catedrales góticas enormes como la que vas a ver en un rato. Acá está el germen, en miniatura.\n\nFijate también en los arcos de las tres fachadas: son todos distintos entre sí. Los hay de herradura, que es la forma típica del arte islámico español, y los hay lobulados, con los bordes recortados como pétalos.\n\nY ahora la parte cristiana. En 1085 Toledo pasó a manos cristianas, y en 1186 el rey Alfonso VIII le entregó el edificio a los caballeros de la Orden de San Juan, que lo convirtieron en iglesia. Para eso tiraron abajo la pared del fondo —la que miraba hacia La Meca— y le pegaron un ábside, que es esa parte semicircular que ves al fondo. Lo hicieron en estilo mudéjar, o sea con albañiles musulmanes trabajando para patrones cristianos, y por eso combina tan bien que casi no se nota el agregado.\n\nMirá la juntura entre lo viejo y lo nuevo. Ese edificio es, literalmente, las dos religiones pegadas.\n\nY la leyenda, que te la van a contar sí o sí. Dicen que cuando Alfonso VI entró a Toledo en 1085, su caballo se arrodilló justo acá y no quiso avanzar. Al revisar, encontraron un crucifijo escondido en el muro con una lámpara todavía encendida al lado, que los cristianos habrían dejado ahí antes de la llegada de los musulmanes. De ahí el nombre: Cristo de la Luz.",
      mirar: [
        "La inscripción árabe en ladrillo de la fachada: dice quién la pagó, en 999.",
        "Las nueve bóvedas del techo: cada una con un diseño distinto.",
        "El ábside del fondo, agregado en 1186 donde estaba el muro hacia La Meca."
      ]

    {
      id: "tol-13", tipo: "tramo", orden: 4, sala: "Del Cristo de la Luz a la Catedral",
      titulo: "Por dentro de la medina", autor: "", fecha: "",
      guion: "Son nueve minutos hasta la catedral y el camino tiene una sola cosa que entender, pero es la que explica toda la ciudad.\n\nMirá las calles por las que vas. Son angostas, torcidas, en cuesta, y de golpe se abren a una plaza minúscula o se terminan en un muro. No hay ninguna calle derecha. No hay ninguna esquina en ángulo recto.\n\nEso no es desorden ni casualidad. Estás caminando por la medina, que es la ciudad musulmana, y así se construían: la calle no era un espacio público con forma, era lo que quedaba entre las casas. Las casas daban a patios interiores y a la calle le presentaban un muro ciego. El trazado lo iba definiendo el uso, generación tras generación.\n\nCuando Toledo pasó a manos cristianas en 1085 nadie rehízo el plano. Se siguieron usando las mismas calles. Por eso el casco de Toledo tiene forma de ciudad islámica aunque hace novecientos años que no lo es.\n\nY acordate de lo otro: en 1561 la corte se fue a Madrid y la ciudad se congeló. Si hubiera seguido siendo capital, a esta altura habría avenidas abiertas a cañonazos en el medio, como se hizo en todas las capitales europeas del siglo diecinueve. No las hay porque no hubo plata ni motivo.\n\nVas a pasar por Alfileritos y la Plaza de San Vicente. Después, en un momento, la calle se mete por debajo de un arco que cruza de un edificio al otro por encima de tu cabeza: es el Arco de Palacio. El palacio es el Arzobispal, del arzobispo de Toledo, que necesitaba pasar de un lado al otro sin bajar a la calle y directamente se construyó el paso por arriba. Da una idea bastante exacta de cuánto poder tenía.\n\nY entonces se te abre la Plaza del Ayuntamiento, que es donde termina el tramo.\n\nEl edificio con dos torres rematadas en chapiteles de pizarra negra es el Ayuntamiento. Las obras empezaron en 1575 con planos de Juan de Herrera, que es el arquitecto de El Escorial, el monasterio-palacio gigante que Felipe II se hizo cerca de Madrid. Su estilo es severo, simétrico, sin adornos, y en España se lo llama herreriano. La obra tardó tanto que recién se terminó en 1703, y para entonces ya la remataron con esos chapiteles barrocos.\n\nEnfrente tenés el Palacio Arzobispal, el del arco, y al costado la catedral.\n\nAhora date vuelta y mirá bien, porque este es el único lugar de Toledo desde donde se puede ver la fachada de la catedral entera y de frente. Desde cualquier otro punto de la ciudad la catedral se te aparece de costado, por un pedazo, al final de un callejón, o directamente no se ve.\n\nEso tiene una explicación y es la mejor parte. Una catedral europea normal está en el medio de una plaza grande, hecha para que se la vea. Esta no: se construyó a partir de 1226 encima de la mezquita mayor, que a su vez estaba donde había estado la catedral visigoda, en el medio de una medina ya construida y apretada. Nadie tiró el barrio abajo para darle aire. La catedral se metió adentro de la ciudad y la ciudad se le cerró encima.\n\nPor eso es enorme y casi no se la ve. Y por eso, cuando entres, el tamaño te va a agarrar de sorpresa.",
      mirar: [
        "Ninguna calle derecha y ningún ángulo recto: el trazado es el de la medina.",
        "El Arco de Palacio: el arzobispo cruzaba la calle por arriba.",
        "Desde la Plaza del Ayuntamiento es el único lugar donde se ve la fachada entera."
      ]
    },
    {
      id: "tol-03", tipo: "parada", orden: 5, sala: "Catedral Primada",
      titulo: "La catedral: por qué manda", autor: "Empezada por Maestro Martín", fecha: "1226–1493",
      guion: "Te vas a pasar dos horas acá adentro, así que vale la pena entender qué es este edificio antes de entrar, porque no es una catedral más.\n\nSe llama Catedral Primada, y primada quiere decir primera: manda sobre todas las demás iglesias de España. El arzobispo de Toledo es el jefe de la Iglesia española. Eso viene de los visigodos, en el siglo seis, cuando Toledo era la capital y acá se hacían los concilios que decidían la doctrina de todo el reino. Cuando Felipe II mudó la corte a Madrid, Toledo perdió el poder político pero se quedó con el religioso, y nunca lo soltó. Por eso Madrid no tuvo catedral hasta 1993.\n\nAhora, el suelo que estás pisando tiene tres capas. Primero hubo una iglesia visigoda, en el siglo seis. Cuando llegaron los musulmanes, la convirtieron en la mezquita principal de la ciudad. Y cuando los cristianos retomaron Toledo, la mezquita volvió a ser iglesia, hasta que en 1226 decidieron tirar todo y hacer esto.\n\nTardaron doscientos sesenta y siete años. Se terminó en 1493, un año después de que Colón llegara a América. O sea que hubo generaciones enteras de canteros que nacieron, trabajaron acá toda la vida y se murieron sin ver el edificio terminado. Eso es normal en las catedrales góticas y sin embargo cuesta hacerse a la idea.\n\nDos palabras sobre el gótico, porque el edificio es el mejor ejemplo español. El gótico es la forma de construir iglesias que se inventó en Francia en el siglo doce y que resolvió un problema viejo: cómo hacer edificios altísimos y llenos de luz sin que se caigan. La solución fue técnica —arcos en punta, nervaduras cruzadas en las bóvedas y contrafuertes por fuera que empujan las paredes hacia adentro— y el resultado es que los muros dejan de sostener el peso y se pueden abrir enteros en vidrio. De ahí los vitrales.\n\nEste tiene setecientos cincuenta vitrales, casi todos originales de los siglos catorce al dieciséis. Es uno de los conjuntos más grandes de Europa que sobrevivieron.\n\nY un detalle que delata el pasado del lugar. Los arcos de la catedral, en algunas zonas, son polilobulados: en vez de terminar en punta limpia, tienen el borde recortado en lóbulos, como los que acabás de ver en la mezquita. Eso no es gótico francés, es una cita directa al arte islámico. Los constructores cristianos usaron formas musulmanas dentro de la catedral más importante de España, y a nadie le pareció raro.\n\nAhora entrá y caminá primero por la nave central sin mirar nada en particular. Ochenta y ocho columnas, cinco naves, treinta metros de alto. Dejá que te impresione el tamaño antes de ponerte a buscar cosas: para eso están las tres paradas que siguen.",
      mirar: [
        "Los 750 vitrales, casi todos originales de los siglos XIV al XVI.",
        "Los arcos polilobulados: formas islámicas dentro de una catedral cristiana.",
        "Tardó 267 años: se terminó en 1493, un año después de Colón."
      ]
    },
    {
      id: "tol-04", tipo: "parada", orden: 6, sala: "Coro y Capilla Mayor",
      titulo: "El coro y el retablo", autor: "Rodrigo Alemán, Berruguete y Vigarny", fecha: "1489–1543",
      guion: "En el medio de la catedral hay una especie de caja cerrada de madera y mármol que te tapa la vista. Eso es el coro, y es lo más español que tiene el edificio.\n\nEn las catedrales francesas o inglesas, cuando entrás ves todo el largo de la nave hasta el altar. En España no: acá se metía el coro en el medio, cerrado con muros, porque era el lugar donde los curas cantaban las ocho veces al día que se rezaba. Te arruina la perspectiva y a cambio te da esto.\n\nMirá la sillería, que son los asientos de madera tallada. Hay dos filas, una arriba y otra abajo, y son de épocas y manos distintas.\n\nLa fila de abajo la talló Rodrigo Alemán entre 1489 y 1495, y es un documento histórico extraordinario: cada respaldo tiene tallada una escena de la conquista de Granada, que estaba pasando en ese momento. Granada era el último reino musulmán que quedaba en España y cayó en 1492. O sea que estos relieves son como un noticiero tallado en roble, hecho por alguien que se enteraba de las batallas mientras las esculpía. Están los campamentos, las murallas, los soldados. Es la única crónica visual contemporánea de esa guerra.\n\nY ahora agachate un poco y mirá debajo de los asientos, en la parte que se levanta. Ahí hay tallas escondidas que no tienen nada de religioso: monstruos, borrachos, curas gordos, escenas obscenas, gente haciendo cosas que no esperarías en una catedral. Los talladores medievales metían estos chistes en las partes que nadie mira. Buscalos: es de lo más divertido del edificio.\n\nLa fila de arriba es cuarenta años posterior, de los años 1539 a 1543, y la hicieron dos escultores compitiendo: Alonso Berruguete de un lado y Felipe Vigarny del otro. Son personajes de la Biblia, y se nota el cambio de época: las figuras de abajo son medievales, planas, narrativas; las de arriba son del Renacimiento, con cuerpos torcidos y musculosos, aprendidos en Italia. Cincuenta años y otro mundo.\n\nDate vuelta ahora hacia el altar, a la Capilla Mayor. Ese retablo enorme que ocupa la pared entera hasta el techo es de principios del siglo dieciséis, tallado en madera de alerce dorada, y cuenta la vida de Cristo en pisos, como una historieta que se lee de abajo hacia arriba. Es de los retablos góticos más grandes que existen.\n\nY abajo, a los pies, fijate en las tumbas: ahí están enterrados varios reyes de Castilla.",
      mirar: [
        "La fila baja del coro: la conquista de Granada tallada mientras pasaba.",
        "Debajo de los asientos: monstruos, borrachos y chistes obscenos.",
        "El retablo del altar: la vida de Cristo en pisos, de abajo hacia arriba."
      ]
    },
    {
      id: "tol-05", tipo: "parada", orden: 7, sala: "El Transparente",
      titulo: "El Transparente", autor: "Narciso Tomé y sus cuatro hijos", fecha: "1729–1732",
      guion: "Caminá por detrás del altar mayor, por el pasillo curvo que lo rodea, y en algún momento vas a llegar a algo que no se parece a nada que hayas visto en una iglesia. Mármoles, bronces, ángeles saliendo de las paredes, nubes de piedra, y un chorro de luz cayendo del techo como si alguien hubiera abierto un agujero al cielo.\n\nAlguien lo abrió. Literalmente.\n\nEl problema era este. Detrás del altar mayor está el sagrario, que es donde se guarda la hostia consagrada, lo más sagrado de una iglesia católica. Pero el retablo gigante que acabás de ver tapaba toda la luz, así que el sagrario quedaba en penumbra permanente, escondido atrás de una montaña de madera dorada. Al arzobispo de Toledo eso le parecía inaceptable.\n\nEn 1729 le encargó la solución a Narciso Tomé, un arquitecto y escultor que trabajó en esto con sus cuatro hijos: dos arquitectos, un pintor y un escultor. Una empresa familiar.\n\nY lo que hicieron fue de una audacia enorme: le hicieron un agujero a la catedral. Abrieron un tragaluz en la bóveda, allá arriba, a varios metros de altura, y otro agujero en la parte de atrás del retablo. La luz del sol entra por el techo, baja en diagonal, atraviesa la obra y va a dar justo sobre el sagrario, que se ilumina desde atrás. De ahí el nombre: transparente, porque la luz lo atraviesa.\n\nPará y mirá para arriba, hacia el tragaluz. Vas a ver que Tomé no dejó el agujero pelado: lo rodeó de ángeles, profetas y nubes esculpidas que parecen estar flotando alrededor de la luz que entra. Es una máquina hecha para que no parezca una máquina. Todo el aparato existe para que vos creas que ese rayo de sol es un milagro y no ingeniería.\n\nEsto es el barroco, que es el estilo que dominó Europa en los siglos diecisiete y dieciocho y que se caracteriza exactamente por esto: teatro, movimiento, emoción, y esconder el truco. La versión española del barroco más recargado se llama churrigueresco, y esto es su ejemplo más famoso.\n\nCuando se terminó, en 1732, hubo un escándalo. Media Toledo dijo que era una barbaridad haberle hecho un agujero a una catedral gótica de quinientos años para meter esa cosa recargada. La otra mitad lo llamó la octava maravilla del mundo y le escribió poemas. La discusión sigue: mucha gente todavía opina que está fuera de lugar.\n\nSi podés, volvé a mediodía, que es cuando el sol pega en el ángulo correcto y el efecto funciona como lo pensaron.",
      mirar: [
        "El tragaluz abierto en la bóveda, rodeado de ángeles y nubes de piedra.",
        "Dónde cae la luz: justo sobre el sagrario, iluminado desde atrás.",
        "A mediodía el efecto funciona; a otra hora es solo escultura."
      ]
    },
    {
      id: "tol-06", tipo: "parada", orden: 8, sala: "Sacristía",
      titulo: "La sacristía y El Greco", autor: "El Greco, Luca Giordano y otros", fecha: "1577–1579 el Expolio",
      guion: "La sacristía es el cuarto donde los curas se ponen la ropa para la misa. En cualquier iglesia es un cuarto de servicio. Acá es un museo de pintura, y de los buenos.\n\nApenas entrás, mirá para arriba: todo el techo está pintado al fresco por Luca Giordano, un napolitano del siglo diecisiete al que llamaban Fa Presto, que quiere decir hazlo rápido, porque pintaba a una velocidad que asustaba a sus contemporáneos.\n\nPero la obra por la que estás acá está al fondo, presidiendo la sala. Se llama El Expolio, que quiere decir el despojo, y la pintó El Greco entre 1577 y 1579.\n\nUn minuto para El Greco, porque lo vas a encontrar dos veces hoy y es el personaje del día. Se llamaba Doménikos Theotokópoulos, nació en la isla de Creta, se formó pintando iconos bizantinos, se fue a Venecia a aprender con los mejores pintores de su época, pasó por Roma, y terminó acá, en Toledo, donde vivió el resto de su vida. Los españoles no podían con su apellido, así que lo llamaron simplemente El Greco: el griego. Es el pintor de Toledo.\n\nEsta fue su primera obra importante en España, apenas llegó. Y le trajo un juicio.\n\nEl cuadro muestra el momento en que a Cristo le arrancan la ropa antes de crucificarlo. Y lo que hizo El Greco fue meterlo a él en el medio de una multitud que lo aprieta: cabezas, armaduras, lanzas, gente empujándose. Cristo está ahí adentro, con una túnica roja intensa, mirando para arriba con una calma absoluta mientras todos le gritan alrededor.\n\nEl rojo de esa túnica es lo que tenés que mirar. Es el único color fuerte del cuadro y te lleva el ojo directo al centro sin que te des cuenta. Todo lo demás es gris, acero, marrón.\n\nAhora, el juicio. Los canónigos de la catedral, que eran los que le pagaban, se enojaron por dos cosas. Primero, que las cabezas de la multitud estuvieran más altas que la de Cristo, lo que les parecía una falta de respeto. Y segundo, que abajo a la izquierda aparecieran las tres Marías, porque según los evangelios ellas no estuvieron en esa escena. Le hicieron juicio para bajarle el precio. El Greco se negó a cambiar el cuadro y terminó cobrando bastante menos de lo que pedía. Era un tipo difícil y murió endeudado.\n\nEn la misma sala hay más: un Goya, un Tiziano, un Van Dyck y una colección larga de retratos de apóstoles del propio Greco. Si te sobra tiempo, dales una vuelta.",
      mirar: [
        "El techo entero pintado al fresco por Luca Giordano.",
        "En El Expolio: el rojo de la túnica, el único color fuerte del cuadro.",
        "Las cabezas de la multitud más altas que la de Cristo: por eso lo demandaron."
      ]
    },
    {
      id: "tol-15", tipo: "parada", orden: 9, sala: "Tesoro",
      titulo: "La Custodia de Arfe", autor: "Enrique de Arfe", fecha: "1515–1523",
      guion: "En una sala aparte, dentro de una vitrina, hay una torre de plata de casi tres metros. Es probablemente la pieza de orfebrería más impresionante de España y la gente le dedica treinta segundos porque ya viene cansada de mirar cosas.\n\nDale cinco minutos. Vale la pena y te digo qué mirar.\n\nSe llama custodia, y una custodia es el objeto donde se expone la hostia consagrada para que la vea la gente. O sea que todo esto —toda esta arquitectura de plata— existe para sostener un disco de pan del tamaño de una moneda.\n\nLa hizo Enrique de Arfe entre 1515 y 1523. Ocho años. Arfe era alemán, de Colonia, y se vino a España a trabajar; por eso la custodia no parece española: parece una catedral gótica del norte de Europa, con sus agujas, sus arbotantes y sus pináculos, pero en miniatura y en metal.\n\nLos números son absurdos. Ciento ochenta y tres kilos de plata y dieciocho kilos de oro. Alrededor de cinco mil seiscientas piezas ensambladas, casi todas atornilladas o encastradas, no soldadas. Doscientas sesenta figuritas: apóstoles, ángeles, profetas, escenas enteras, cada una tallada aparte.\n\nAcercate a la vitrina todo lo que te dejen y mirá una sola de esas figuras. Miden pocos centímetros y tienen cara, ropa con pliegues y gesto. Después alejate y mirá el conjunto. Esa es la única forma de entender el trabajo que hay ahí adentro: no es una pieza grande, son miles de piezas chiquitas hechas una por una.\n\nY ahora la muñeca rusa, que es lo mejor.\n\nAdentro de esa custodia hay otra custodia más chica, anterior, de oro. Esa es de fines del siglo quince y era de Isabel la Católica, la reina que financió los viajes de Colón. Mide noventa y ocho centímetros y pesa casi diecisiete kilos, todo de oro. Cuando la reina murió, la catedral la compró, y Arfe construyó la torre de plata alrededor para contenerla.\n\nDe las perlas y las piedras que tiene esa custodia interior se dice que están entre las primeras que Colón trajo de América. Es lo que se cuenta y lo vas a leer en todos lados; documentado del todo no está, así que quedate con que es verosímil y muy repetido.\n\nUna última cosa, para que te la imagines en movimiento. Esto no es una pieza de museo: sale a la calle. Desde 1585, todos los años, la custodia recorre Toledo en la procesión del Corpus Christi, arriba de una carroza hecha en 1781 que empujan personas. Doscientos kilos de plata y oro andando por estas calles angostas que subiste a la mañana.\n\nSi alguna vez volvés a Toledo en junio, es eso lo que hay que ver.",
      mirar: [
        "Una figurita sola de cerca, y después el conjunto de lejos.",
        "Adentro hay otra custodia de oro: era de Isabel la Católica.",
        "Cinco mil seiscientas piezas, casi todas atornilladas, no soldadas."
      ]
    },
    {
      id: "tol-16", tipo: "parada", orden: 10, sala: "Capilla Mozárabe",
      titulo: "La misa que no se dejó morir", autor: "Cardenal Cisneros", fecha: "1502–1510",
      guion: "A los pies de la catedral, bajo una cúpula, hay una capilla que se usa todas las mañanas para dar una misa en un rito que en el resto del mundo se extinguió hace novecientos años. Es la última que queda, y esta capilla existe exactamente para que no desapareciera.\n\nVamos por partes, porque la historia es de las mejores de Toledo.\n\nUn rito es la forma concreta de celebrar la misa: los textos, el orden, los cantos, los gestos. Hoy casi toda la Iglesia católica usa el rito romano, el de Roma. Pero no siempre fue así. Antes de que Roma lo unificara todo, cada región tenía el suyo.\n\nEspaña tenía el suyo propio, heredado de los visigodos, con sus propios textos y su propia música. Se venía celebrando desde el siglo sexto.\n\nY cuando llegaron los musulmanes en el 711, los cristianos que se quedaron a vivir bajo dominio islámico lo siguieron usando. A esos cristianos se los llama mozárabes: conservaron su religión, pero adoptaron el árabe como idioma y buena parte de las costumbres de alrededor. Cuatro siglos así. El rito sobrevivió todo ese tiempo.\n\nLo que casi lo mata no fue el islam. Fue Roma.\n\nAlrededor de 1080, el papa presionó a los reinos cristianos españoles para que abandonaran su rito propio y adoptaran el romano, como parte de una reforma que buscaba unificar la Iglesia entera. Los reyes aceptaron. El rito hispano quedó prohibido de hecho en casi todo el país.\n\nAcá va la leyenda, que se cuenta siempre y conviene marcar como lo que es. Dicen que para decidir la cuestión se hizo un juicio de Dios: se tiraron a una hoguera un libro del rito romano y uno del rito hispano, y que salga el que Dios quiera. Salió intacto el hispano. Y lo adoptaron igual el romano. No hay forma de documentarlo, pero como síntesis de lo que pasó es bastante exacta.\n\nCuando Toledo volvió a manos cristianas en 1085, se negoció que seis parroquias de la ciudad pudieran seguir con el rito viejo. Solo seis, solo acá. Durante cuatrocientos años fue apagándose de a poco: quedaban pocas familias, los libros se perdían y ya casi nadie sabía cantarlo.\n\nY ahí aparece el cardenal Cisneros, que era el arzobispo de Toledo y el hombre más poderoso de España después de los reyes. En 1500 mandó imprimir los libros del rito, que estaban a punto de perderse. Y en 1502 mandó construir esta capilla y la dotó con dinero para pagar capellanes con una sola obligación: celebrar acá el rito mozárabe todos los días, para siempre.\n\nSe sigue cumpliendo. Cada mañana, en este recinto, se dice esa misa. Es el rito cristiano en uso más antiguo de Occidente y lo estás mirando.\n\nDe lo que hay que ver adentro, tres cosas.\n\nLos frescos de las paredes, de Juan de Borgoña. Ojo con el tema, que es raro para una capilla: no son santos, es una batalla. Cuentan la toma de Orán, en el norte de África, en 1509 —una campaña militar que Cisneros financió y en la que participó él mismo a los setenta y tres años. O sea que el cardenal se pintó su propia guerra en la capilla que fundó.\n\nLa cúpula. La original se quemó en 1622 y la que ves la rehizo Jorge Manuel Theotocópuli, que era el hijo de El Greco y trabajaba de arquitecto de la catedral. Se terminó en 1631.\n\nY la reja de entrada y el techo de estrellas, que vienen de la antigua sala capitular y son anteriores a la capilla.\n\nSi pasás a la mañana temprano y la reja está cerrada con gente adentro, no entres: se está diciendo la misa. Escuchá desde afuera, que el canto también es de entonces.",
      mirar: [
        "Los frescos no son santos: es la toma de Orán, la guerra del propio Cisneros.",
        "La cúpula la rehizo el hijo de El Greco después del incendio de 1622.",
        "Si hay gente adentro a la mañana, es la misa mozárabe. Escuchá desde afuera."
      ]
    },
    {
      id: "tol-17", tipo: "parada", orden: 11, sala: "Sala Capitular y claustro",
      titulo: "Las dos salas que casi nadie mira", autor: "Cisneros y el cardenal Tenorio", fecha: "1389 y 1504",
      guion: "Antes de salir quedan dos espacios que están en el recorrido y por los que casi todo el mundo pasa de largo, porque a esta altura ya viene saturado. Son los dos mejores ratos tranquilos de la catedral.\n\nEl primero es la Sala Capitular. Capítulo es la reunión de los canónigos —los curas que administran la catedral— así que esta era, lisa y llanamente, la sala de reuniones. La mandó hacer el cardenal Cisneros entre 1504 y 1512; es el mismo de la capilla mozárabe.\n\nApenas entres, mirá para arriba. El techo es un artesonado: un armazón de madera ensamblada formando figuras geométricas, dorado a la hoja y pintado de colores. Lo hicieron Diego López y Francisco de Lara alrededor de 1510. Es mudéjar, otra vez: la técnica de los carpinteros musulmanes, trabajando para el hombre más poderoso de la Iglesia española. A esta altura del día ya lo venís viendo en todos lados, y por eso Toledo es Toledo.\n\nLas paredes las pintó Juan de Borgoña, que es el mismo de la capilla mozárabe. Trece escenas de la vida de la Virgen y de la Pasión de Cristo, con arquitecturas pintadas alrededor que fingen que la sala sigue hacia adentro. Pará y comprobá el truco: las columnas pintadas parecen de verdad.\n\nPero lo que hay que mirar de verdad es la franja de abajo, que es rarísima y es una idea que no vas a ver en otro lado.\n\nDando la vuelta a la sala, a la altura de la cabeza, hay una hilera de retratos. Son todos los arzobispos de Toledo, uno detrás de otro, en orden, desde el primero. Y el primero es san Eugenio, que según la tradición fue obispo acá en el siglo primero.\n\nO sea que nadie tenía la menor idea de qué cara tenía. El pintor se la inventó. Y después de él, decenas de caras inventadas más, hasta que la serie llega a una época en que sí se sabía cómo era cada uno y los retratos empiezan a ser retratos.\n\nLa serie se fue continuando durante siglos, arzobispo tras arzobispo. Caminá los primeros metros mirando las caras: se nota el momento exacto en que dejan de ser un tipo genérico con barba y pasan a ser una persona concreta.\n\nEl segundo espacio es el claustro, y es donde tenés que respirar antes de salir.\n\nLo empezó el cardenal Pedro Tenorio en 1389 y se terminó en el siglo quince. Es un patio cuadrado con galerías alrededor, un jardín en el medio con cipreses y naranjos, y tumbas medievales en el piso y en las paredes.\n\nLos frescos de las galerías son mucho más nuevos: los pintó Francisco Bayeu a fines del siglo dieciocho, veintisiete escenas en total. Bayeu era el cuñado de Goya, y fue quien lo metió a trabajar en la corte. Mañana en el Prado vas a ver a los dos.\n\nY una historia sobre este patio, que se cuenta siempre y conviene marcar: dicen que acá no había un terreno vacío sino el alcaná, el mercado de los comerciantes judíos, y que el cardenal se quedó con el solar después de que ardiera en los ataques de 1391, los mismos que arrasaron la judería por la que vas a bajar a la tarde. Los libros locales lo repiten; la propia catedral no lo menciona. Quedate con que es la versión que circula.\n\nSi te queda tiempo, en el claustro está la capilla de San Blas, donde se enterraron los arzobispos de la Edad Media, con pinturas italianas de principios del siglo quince. Y también se puede bajar a la cripta, debajo del altar mayor.\n\nSentate un rato en el claustro. Llevás dos horas mirando hacia arriba.",
      mirar: [
        "El artesonado dorado de la Sala Capitular: carpintería mudéjar de 1510.",
        "La hilera de arzobispos: los primeros son caras inventadas.",
        "Los frescos del claustro son de Bayeu, el cuñado de Goya."
      ]
    },
    {
      id: "tol-14", tipo: "tramo", orden: 12, sala: "De la Catedral a la judería",
      titulo: "Bajando a la judería", autor: "", fecha: "",
      guion: "Salís de la catedral y bajás hacia el oeste de la ciudad. Ese barrio al que vas tenía, hace seiscientos años, una de las comunidades judías más grandes de Europa. Es donde vas a pasar el resto de la tarde y conviene llegar sabiendo qué estás mirando.\n\nPrimero el dato duro, que es incómodo. En el Toledo medieval vivían varios miles de judíos y había, según las cuentas, alrededor de diez sinagogas. Hoy quedan dos edificios en pie. Los dos que vas a visitar.\n\nY sobrevivieron por una razón que da que pensar: porque los convirtieron en iglesias. Las sinagogas que siguieron siendo sinagogas desaparecieron. Las que cambiaron de religión se conservaron. Tenés eso presente cuando entres y mires las paredes.\n\nEl final fue en dos tiempos. En 1391 hubo una ola de asaltos antijudíos que arrasó las juderías de media España, y la de Toledo quedó destrozada; muchos se convirtieron al cristianismo para salvar la vida. Y en 1492 los Reyes Católicos firmaron la expulsión: cuatro meses para irse del país o bautizarse. Ochocientos años de comunidad terminaron con una firma.\n\nAhora, lo que vas viendo mientras bajás.\n\nVas a cruzar la Plaza del Conde, que es chiquita. Ahí están, pegados uno al otro, la Iglesia de Santo Tomé —donde volvés a las cuatro de la tarde a ver el cuadro de El Greco, así que hoy solo la pasás— y un palacio grande de ladrillo y piedra con una portada tallada.\n\nEse palacio es el de Fuensalida, de 1440, y adentro pasó algo que cambió la historia de la Iglesia.\n\nCarlos V, el emperador, vivió acá mientras le terminaban el Alcázar, que es la fortaleza enorme que corona la ciudad. Y en 1539, estando él de viaje, su mujer, la emperatriz Isabel de Portugal, se murió en este edificio. Tenía treinta y cinco años.\n\nHubo que llevar el cuerpo a Granada para enterrarlo, y le encargaron la escolta a un noble joven llamado Francisco de Borja. Al llegar, el protocolo exigía abrir el féretro y jurar que el cuerpo era el de la emperatriz. Habían pasado dos semanas de camino. Lo que Borja vio al abrirlo lo dejó sin poder jurar nada.\n\nSegún él mismo contó después, ahí decidió no volver a servir nunca más a un señor que se le pudiera morir. Dejó todo, se metió a jesuita, llegó a dirigir la orden entera y terminó siendo santo.\n\nTodo eso arranca detrás de esa puerta por la que vas a pasar de largo.\n\nSeguís y salís a la Calle de los Reyes Católicos, que es la columna vertebral de la judería y la que te lleva a las dos sinagogas.\n\nUn aviso, para que no te lo vendan mal. En este tramo hay un Museo del Greco, y mucha gente cree que es la casa donde vivió el pintor. No lo es. Se armó en 1911, sobre unas casas antiguas, cuando un aristócrata quiso montarle a El Greco una casa-museo que quedara bonita. El Greco vivió en este barrio, eso sí, pero no en ese edificio. El museo está bien y tiene obra buena; simplemente no es su casa.\n\nBajando un poco más, con el Tajo abajo a la derecha, llegás a la Sinagoga del Tránsito.",
      mirar: [
        "Había una decena de sinagogas: quedan dos, y porque las hicieron iglesias.",
        "El Palacio de Fuensalida, en la Plaza del Conde: ahí murió la emperatriz en 1539.",
        "El Museo del Greco no es la casa de El Greco: se armó en 1911."
      ]
    },
    {
      id: "tol-07", tipo: "parada", orden: 13, sala: "Sinagoga del Tránsito",
      titulo: "La sinagoga del tesorero", autor: "Samuel ha-Leví", fecha: "1355–1357",
      guion: "Entrás a una sala rectangular con las paredes cubiertas de yeso tallado hasta el techo y un artesonado de madera arriba. Si no supieras dónde estás, jurarías que es un palacio musulmán. Es una sinagoga, la construyó un judío, y trabajaron en ella artesanos musulmanes para un rey cristiano.\n\nEso es Toledo en un solo edificio.\n\nLa mandó hacer entre 1355 y 1357 Samuel ha-Leví, que era el tesorero del rey Pedro I de Castilla. O sea: el hombre que manejaba la plata del reino era judío, y el rey le permitió construirse una sinagoga privada de este tamaño, cosa que legalmente estaba bastante restringida. Eso te dice hasta dónde llegaba la posición de la comunidad judía toledana.\n\nLa historia de Samuel ha-Leví termina mal, para que no te ilusiones: el rey terminó desconfiando de él, lo mandó detener, lo torturaron en Sevilla para que confesara dónde tenía escondido el dinero y murió en el tormento. Sus bienes pasaron a la corona.\n\nAhora mirá las paredes. El estilo es mudéjar, que ya viste hoy: artesanos musulmanes trabajando con materiales baratos —ladrillo, yeso, madera— pero con una destreza que deja sin aliento. No hay mármol ni piedra tallada en esta sala. Todo eso que parece encaje es yeso.\n\nY en medio de los dibujos geométricos y vegetales, buscá las letras. Hay inscripciones en hebreo corriendo por las paredes como frisos: son salmos y textos que cuentan quién construyó el edificio y bajo qué rey. Un especialista las llamó las inscripciones judías más hermosas de la Edad Media. Pero acá viene el detalle que a mí me parece increíble: también hay inscripciones en árabe. En una sinagoga. Alabando a un rey cristiano. Las tres culturas escritas en la misma pared.\n\nArriba, el artesonado: madera de conífera policromada, encajada en dibujos geométricos sin un solo clavo.\n\nY ahora lo que pasó después. En 1492 los Reyes Católicos dieron a los judíos españoles cuatro meses para convertirse al cristianismo o irse del país. La comunidad que llevaba ochocientos años acá desapareció. A los que se fueron y siguieron hablando español por el mundo se los llama sefardíes, de Sefarad, que es como llamaban ellos a España; todavía hoy, quinientos años después, hay gente en Turquía, Grecia o Israel que habla un castellano antiguo que se llevaron de acá.\n\nEl edificio pasó a manos de una orden militar cristiana y se convirtió en iglesia. De esa época viene el nombre raro: del Tránsito, por un cuadro que colgaron adentro.\n\nHoy es el Museo Sefardí, desde 1964. Date una vuelta por las salas del costado: hay objetos, documentos y trajes de la vida judía española, y explican mucho mejor que yo lo que se perdió acá.",
      mirar: [
        "Las inscripciones en hebreo corriendo como frisos por las paredes.",
        "Las inscripciones en árabe: en una sinagoga, alabando a un rey cristiano.",
        "Todo eso que parece encaje es yeso, no piedra: material barato, manos enormes."
      ]
    },
    {
      id: "tol-08", tipo: "parada", orden: 14, sala: "Santa María la Blanca",
      titulo: "Santa María la Blanca", autor: "Sinagoga mayor de Toledo", fecha: "hacia 1180–1200",
      guion: "Esta es la sorpresa del día. Entrás y lo que ves es un bosque de columnas blancas con arcos de herradura, todo encalado, sin un mueble, sin un cuadro, sin casi nada. Es lo más parecido a una mezquita que vas a ver hoy, es en realidad una sinagoga, y hoy es una iglesia.\n\nTiene unos ochocientos cuarenta años: se construyó alrededor del 1180, o sea casi dos siglos antes que la del Tránsito, y era la sinagoga mayor de Toledo, la principal de la comunidad.\n\nEl estilo es almohade, que era la forma de construir del imperio musulmán que dominaba el sur de España en ese momento. Y ahí está lo desconcertante: una sinagoga judía, construida en territorio cristiano, con la arquitectura del enemigo militar de los cristianos. A nadie le pareció contradictorio porque simplemente era la manera de construir bien que había en el lugar.\n\nAhora contá las columnas mientras caminás. Hay treinta y dos, en cinco naves, y todas son octogonales y están pintadas de blanco. Mirá los capiteles, esos remates de arriba: son de yeso tallado con piñas y volutas, y aunque parecen todos iguales, si prestás atención vas a ver que hay variaciones. Y por encima de los arcos hay una franja de yesería calada, tallada como un encaje.\n\nEl efecto del conjunto es lo importante. No hay color, no hay imágenes, no hay oro. Hay ritmo: columna, arco, columna, arco, repetido hasta el fondo. Es un espacio que no te dice nada y te deja en silencio, y eso es rarísimo entre todo lo que vas a ver hoy.\n\nLa historia de cómo dejó de ser sinagoga es fea y conviene contarla. En 1391 hubo una ola de ataques contra las juderías de toda España, con matanzas y conversiones forzadas; en Toledo la comunidad quedó destrozada. Poco después el edificio le fue quitado a los judíos y convertido en iglesia cristiana, casi cien años antes de la expulsión de 1492. El nombre actual, Santa María la Blanca, es de esa época.\n\nDespués tuvo una vida bastante indigna: fue cuartel, depósito de armas y hasta almacén. Recién en el siglo diecinueve la declararon monumento y la empezaron a cuidar.\n\nUna cosa práctica: no hay bancos ni recorrido marcado. Caminá hasta el fondo, date vuelta y mirá el conjunto desde ahí. Son diez minutos y es la foto más linda que vas a sacar en Toledo.",
      mirar: [
        "Las 32 columnas octogonales blancas y los arcos de herradura.",
        "La franja de yeso calado por encima de los arcos, como un encaje.",
        "Caminá al fondo y date vuelta: desde ahí se ve el conjunto entero."
      ]
    },
    {
      id: "tol-09", tipo: "parada", orden: 15, sala: "Iglesia de Santo Tomé",
      titulo: "El entierro del Conde de Orgaz", autor: "El Greco", fecha: "1586–1588",
      guion: "Este cuadro está en una salita al lado de una iglesia, mide casi cinco metros, y la mitad de la gente que entra no sabe que está mirando el resultado de un juicio.\n\nVa la historia. En 1323 se muere don Gonzalo Ruiz, señor de Orgaz, un tipo importante de Toledo, y le deja plata a esta parroquia para siempre. Dos siglos y medio después, el pueblo de Orgaz había dejado de pagar. El cura de Santo Tomé les hizo juicio, ganó, y con esa plata se dio un gusto: le encargó un cuadro enorme a El Greco para que nadie se olvidara de por qué había que pagar.\n\nEl tema es lo que supuestamente pasó en ese entierro. Según la tradición toledana, cuando estaban por meter el cuerpo en la tumba bajaron del cielo San Esteban y San Agustín en persona y lo depositaron ellos mismos. En Toledo lo daban por cierto y el cura quería eso pintado, grande, en la pared.\n\nAhora el juego. El cuadro tiene dos pisos: abajo el entierro, con cuarenta señores de negro parados como en un velorio; arriba el cielo, todo torcido. Buscá tres cosas.\n\nEl nene de abajo a la izquierda, el único que te mira a vos y señala la escena con el dedo: es el hijo del Greco, tenía ocho años. En el pañuelo que le asoma del bolsillo el padre le pintó su fecha de nacimiento, 1578, y esa es la única firma del cuadro.\n\nMás arriba, entre los caballeros de negro, otro que te mira de frente con la cara pálida, justo encima de San Esteban: ese es El Greco.\n\nY fijate cómo cambia la pintura de un piso al otro. Abajo todo es nítido: las caras son retratos de vecinos suyos, con arrugas y ojeras, y las armaduras y los bordados brillan. Arriba se le va la mano: los cuerpos se estiran como si fueran de goma, las nubes parecen humo, nada tiene borde. No es que pintara peor arriba. Está pintando dos cosas distintas: una es Toledo un martes a la tarde, la otra no.\n\nDos cosas más para el final. La primera: esa manera de estirar los cuerpos no era un error ni una moda de la época. Viene de los iconos bizantinos con los que El Greco se formó de chico en Creta, donde la figura no obedece a la anatomía sino al significado. A sus contemporáneos les pareció extravagante. Trescientos años después, los pintores de vanguardia del siglo veinte lo adoptaron como un antepasado: Cézanne lo copió y Picasso estudió esta época del Greco antes de pintar su cuadro más rupturista.\n\nY la segunda: el cuadro sigue en el lugar exacto para el que fue pintado, en la pared para la que se encargó, a la altura para la que se pensó. Casi ningún cuadro famoso del mundo puede decir eso. Los demás están en museos.",
      mirar: [
        "El nene de abajo a la izquierda: el hijo del Greco, con la firma en el pañuelo.",
        "El señor pálido que te mira de frente, encima de San Esteban: es El Greco.",
        "El cambio entre los dos pisos: abajo nítido y real, arriba estirado y sin bordes."
      ]
    },
    {
      id: "tol-10", tipo: "parada", orden: 16, sala: "San Juan de los Reyes",

e madera, o sea otra vez artesanos musulmanes trabajando en el edificio más triunfalmente católico de la ciudad.\n\nY buscá los bichos. Entre la decoración de piedra hay animales por todos lados: monos, lagartijas, aves, monstruos, plantas. Los canteros se divertían. Es el mismo chiste que los asientos del coro de la catedral, pero al aire libre.\n\nUn detalle que cierra la historia. Isabel quería que este fuera su tumba y la de Fernando. Nunca los enterraron acá. En 1492 cayó Granada, el último reino musulmán de la península, y la reina decidió que ese era el lugar que valía la pena: están los dos en la catedral de Granada. Este monasterio enorme se construyó para un funeral que nunca se hizo.",

      guion: "Cruzaste el río, subiste la ladera de enfrente y ahora tenés Toledo entero delante. Esta es la vista que pintó El Greco y la que sale en todas las fotos. Vale la pena quedarse un rato largo, así que sentate.\n\nUbicá primero lo grande. El edificio cuadrado con cuatro torres en las esquinas, arriba de todo, es el Alcázar: fue fortaleza romana, después palacio musulmán, después residencia de Carlos V, y hoy es una biblioteca y un museo del ejército. Está en el punto más alto de la ciudad, que es el punto más alto del peñón.\n\nLa torre alta y delgada que asoma a la izquierda del Alcázar es la de la catedral, de noventa y dos metros. Desde acá se entiende una cosa que adentro no se nota: la catedral está metida entre casas, sin ninguna plaza delante. Es enorme y está escondida. Eso pasa porque cuando se construyó, la ciudad ya estaba apretada alrededor y no había lugar.\n\nAbajo, el Tajo. Mirá cómo lo rodea: es un meandro, o sea una curva cerrada del río, que abraza la ciudad por el este, el sur y el oeste. Solo el lado norte está en tierra firme, y por ahí estaba la muralla. Toledo es prácticamente una isla, y eso es lo que la hizo capital durante mil quinientos años.\n\nBuscá también los dos puentes históricos, uno a cada lado: el de Alcántara, que es romano de origen y fue por donde entró todo el mundo durante siglos, y el de San Martín, medieval, del lado opuesto.\n\nY ahora mirá los colores: el ocre de la piedra, el verde oscuro de la ladera, el gris del río. Es exactamente la paleta con la que El Greco pintó Toledo una y otra vez. Cuando veas un cuadro suyo con esta ciudad bajo un cielo de tormenta, vas a reconocer este lugar.\n\nDos consejos prácticos. Vení con la tarde caída, no con el sol alto: la luz rasante marca los relieves y la ciudad se pone dorada. Y si podés esperar a que se prendan las luces, hacelo, porque Toledo iluminada desde acá es una de las imágenes que te vas a llevar del viaje.\n\nDespués bajá, cená sin apuro en el casco viejo —       guion: "Spaccanapoli cambia de nombre varias veces a lo largo de su recorrido. Este tramo se llama Via San Biagio dei Librai, la calle de los libreros, porque acá estaban los que copiaban, encuadernaban y vendían libros.\n\nDe noche la mayoría está cerrado, así que esto es para que sepas por delante de qué estás pasando y qué te conviene venir a ver de día. Vivís a tres cuadras: tenés cinco días.\n\nLo primero, en el número treinta y nueve, es un palacio grande con un portón de piedra: el Palazzo Marigliano, del siglo dieciséis. Adentro, en el patio, funciona el Ospedale delle Bambole. El hospital de las muñecas.\n\nEs exactamente lo que suena. Un taller donde se reparan muñecas rotas, desde 1895.\n\nLo fundó Luigi Grassi, que no era juguetero sino escenógrafo: hacía decorados para los teatros de la corte y para los teatritos de títeres napolitanos. Tenía un taller lleno de brazos, cabezas y piezas sueltas. Un día una vecina le llevó una muñeca rota de su hija y él se la arregló. Después otra. Como andaba siempre con guardapolvo blanco y el local estaba lleno de partes de cuerpo en frascos, el barrio empezó a llamarlo el hospital de las muñecas, medio en broma.\n\nEl nombre le quedó y el oficio también. Lo sigue llevando la misma familia: la cuarta generación, con la quinta ya adentro. Hoy es taller y museo a la vez, y lo que entra por la puerta no son juguetes: son objetos de gente que no los quiere perder.\n\nAbre a la mañana, hasta la una y media. Si te interesa, es una mañana cualquiera.\n\nY un poco antes, en la Piazzetta Nilo donde acabás de estar, hay una iglesia chica que se llama Sant'Angelo a Nilo. Por fuera no es nada. Adentro tiene una tumba de mármol del cardenal Brancaccio hecha entre 1426 y 1428 por Donatello y Michelozzo.\n\nDonatello es el escultor que abre el Renacimiento florentino, el que te va a aparecer en Florencia dentro de diez días. La talló en un taller que alquilaron en Pisa, porque de ahí el mármol de Carrara estaba cerca y el barco a Nápoles salía directo, y la mandaron armada por mar en 1428.\n\nO sea que hay un Donatello en una iglesia de barrio en la que no entra nadie, a cien metros de donde dormís. La parte suya es el relieve del frente del sarcófago, plano y bajísimo, con la Virgen subiendo al cielo: esa técnica de tallar casi sin relieve y aun así dar profundidad es marca registrada de él.\n\nEsa también es de mañana. Anotátela.",
