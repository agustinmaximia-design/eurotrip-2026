<style>
  :root {
    --bg: #EDEFEC;
    --surface: #FFFFFF;
    --surface-2: #F4F6F3;
    --ink: #13181A;
    --muted: #4E5956;
    --faint: #6C7671;
    --line: #D3D9D4;
    --line-soft: #E3E7E3;
    --accent: #14604F;
    --accent-soft: #DCEBE5;
    --signal: #8A5000;
    --signal-soft: #F5E9D5;
    --alert: #97281F;
    --alert-soft: #F6E1DE;
    --shadow: 0 1px 2px rgba(19,24,26,.06), 0 8px 24px -12px rgba(19,24,26,.18);
    --ff-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ff-text: "Spectral", Georgia, "Times New Roman", serif;
    --ff-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181A;
      --surface: #1B2023;
      --surface-2: #222829;
      --ink: #DCE3DF;
      --muted: #A3AEA9;
      --faint: #838E89;
      --line: #2A3134;
      --line-soft: #222829;
      --accent: #5FB9A8;
      --accent-soft: #14302B;
      --signal: #E0A63A;
      --signal-soft: #32260F;
      --alert: #E0655A;
      --alert-soft: #35201D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181A;
    --surface: #1B2023;
    --surface-2: #222829;
    --ink: #DCE3DF;
    --muted: #A3AEA9;
    --faint: #838E89;
    --line: #2A3134;
    --line-soft: #222829;
    --accent: #5FB9A8;
    --accent-soft: #14302B;
    --signal: #E0A63A;
    --signal-soft: #32260F;
    --alert: #E0655A;
    --alert-soft: #35201D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ff-ui);
    font-size: 16.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px;
    padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  body.con-player .wrap { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }

  /* ---- header ---- */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft);
  }
  .top-in { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 12px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand h1 {
    font-family: var(--ff-text); font-weight: 600; font-size: 23px; margin: 0;
    letter-spacing: -.01em;
  }
  .countdown {
    font-family: var(--ff-mono); font-size: 12px; font-weight: 500;
    color: var(--signal); letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .brand h1 { transition: opacity .18s ease; }




  .tic { appearance: none; cursor: pointer; font: inherit; font-size: 11px; line-height: 1;
    width: 20px; height: 20px; flex: 0 0 20px; margin-right: 10px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--surface); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
  .tic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .tic:active { transform: scale(.88); }
  .fila-t { display: flex; align-items: flex-start; }
  .fila.hecha .fila-t span { color: var(--faint); text-decoration: line-through; }
  .fila.hecha .fila-d { opacity: .5; }

  .prac { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 15px 16px; margin-bottom: 9px; }
  .prac-q { font-size: 17px; font-weight: 600; }
  .prac-c { font-size: 14px; color: var(--accent); margin-top: 4px; line-height: 1.5; }
  .prac-n { font-size: 14.5px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
  .crit { background: var(--surface); border: 1px solid var(--line-soft);
    border-left: 3px solid var(--alert); border-radius: 3px;
    padding: 14px 15px; margin-bottom: 8px; }
  .crit.pasado { border-left-color: var(--line); opacity: .5; }
  .crit-cab { display: flex; gap: 9px; align-items: baseline; }
  .crit-f { font-size: 13px; color: var(--faint); }
  .crit-h { font-family: var(--ff-mono); font-size: 14px; font-weight: 600; color: var(--alert); }
  .crit.pasado .crit-h { color: var(--faint); }
  .crit-q { font-size: 16px; margin-top: 4px; line-height: 1.45; }

  /* ---- itinerario por día ---- */
  .alo { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 12px 14px; margin-bottom: 10px; }
  .alo-t { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .alo-s { font-size: 14.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  .dia { background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 3px; margin-bottom: 10px; overflow: hidden;
    /* la cabecera es sticky: sin esto el título del día queda tapado */
    scroll-margin-top: 74px; }
  .dia.abierto { border-color: var(--line); box-shadow: var(--shadow); }
  .dia-cab { appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
    display: block; width: 100%; text-align: left; padding: 17px 42px 17px 16px;
    position: relative; color: var(--ink); }
  .dia-cab:active { background: var(--surface-2); }
  .dia-top { display: flex; gap: 9px; align-items: baseline; }
  .dia-n { font-family: var(--ff-mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .dia-f { font-size: 13px; color: var(--faint); }
  .dia-cab h3 { margin: 5px 0 0; font-family: var(--ff-text); font-size: 19px;
    font-weight: 600; letter-spacing: -.01em; }
  .dia-tags { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .dia-flecha { position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--faint); font-size: 13px; transition: transform .2s ease; }
  .dia.abierto .dia-flecha { transform: translateY(-50%) rotate(180deg); }
  .dia-cuerpo { border-top: 1px solid var(--line-soft); }

  .linea { padding: 4px 0; }
  .fila { display: grid; grid-template-columns: 56px 1fr; gap: 6px;
    padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .fila:last-child { border-bottom: 0; }
  .fila-h { font-family: var(--ff-mono); font-size: 13px; font-weight: 500;
    color: var(--faint); padding-top: 1px; }
  .fila-t { font-size: 16px; line-height: 1.5; }
  .fila-d { font-size: 14.5px; color: var(--muted); margin-top: 5px; line-height: 1.55; }
  .fila-tipo { font-family: var(--ff-mono); font-size: 11px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .fila-cod { font-family: var(--ff-mono); font-size: 14px; color: var(--accent);
    margin-top: 3px; user-select: text; letter-spacing: .04em; }
  .pase-fila { background: var(--accent-soft); }
  .fila-audio { display: grid; gap: 5px; margin-top: 8px; }
  .mini-play { appearance: none; cursor: pointer; font: inherit; text-align: left;
    display: grid; grid-template-columns: 18px 1fr auto; gap: 9px; align-items: start;
    padding: 10px 12px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); }
  .mini-play:active { transform: scale(.99); }
  .mp-ico { color: var(--accent); font-size: 11px; text-align: center; padding-top: 4px; }
  .mp-t { font-size: 14.5px; line-height: 1.4; }
  .mp-m { font-family: var(--ff-mono); font-size: 11.5px; color: var(--faint);
    padding-top: 3px; white-space: nowrap; }
  .mini-play.listo .mp-t { color: var(--muted); }
  .mini-play.ver { background: var(--surface); border-color: var(--accent); }
  .mini-play.resumen { border-style: dashed; }
  .mini-play.tramo { border-color: color-mix(in srgb, var(--linea) 70%, transparent);
    background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .mp-tipo { display: block; font-family: var(--ff-mono); font-size: 10.5px;
    letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }
  .dia-play { display: inline-block; margin-top: 9px; font-family: var(--ff-mono);
    font-size: 12px; letter-spacing: .03em; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px; }
  .dia-notas { padding: 13px 16px; border-top: 1px solid var(--line-soft);
    font-size: 14.5px; line-height: 1.55; color: var(--muted); background: var(--surface-2); }
  .dia-notas div + div { margin-top: 4px; }
  .hoja-par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hoja-par label { margin-top: 14px; }

  /* ---- pases ---- */
  .pases-top { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 4px; }
  .vacio { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 18px; margin-top: 14px; font-size: 15px; color: var(--muted); line-height: 1.6; }
  .vacio b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 7px; }
  .pase { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 13px 15px; margin-bottom: 9px; }
  .pase-cab { display: flex; justify-content: space-between; align-items: center; }
  .pase-tipo { font-family: var(--ff-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint); }
  .pase-n { font-family: var(--ff-mono); font-size: 10.5px; color: var(--faint); }
  .pase-t { font-size: 17.5px; font-weight: 600; margin: 6px 0 0; letter-spacing: -.01em; }
  .pase-cod { font-family: var(--ff-mono); font-size: 14.5px; color: var(--accent);
    margin-top: 5px; user-select: text; letter-spacing: .04em; }
  .pase-nota { font-size: 14.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .pase-acc { display: flex; gap: 8px; margin-top: 11px; }
  .pase-acc button { appearance: none; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 600; padding: 7px 14px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); }
  .pase-acc .pase-ver { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pase-acc button:active { transform: scale(.97); }
  .pase-pie { margin-top: 18px; }

  /* ---- hoja de alta ---- */
  body.sin-scroll { overflow: hidden; }
  .hoja { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; }
  .hoja-in { background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: 14px 14px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: subir .22s ease; }
  .hoja-in h3 { margin: 0 0 4px; font-family: var(--ff-text); font-size: 19px; font-weight: 600; }
  .hoja-in label { display: block; margin-top: 14px; font-size: 12px; font-weight: 600;
    letter-spacing: .02em; color: var(--muted); }
  .hoja-in .opt { font-weight: 400; color: var(--faint); }
  .hoja-in input, .hoja-in select { display: block; width: 100%; margin-top: 5px;
    font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    -webkit-user-select: text; user-select: text; }
  .hoja-acc { display: flex; gap: 8px; margin-top: 20px; }
  .hoja-acc .desc-btn { flex: 1; padding: 12px; }

  /* ---- visor a pantalla completa ---- */
  .visor { position: fixed; inset: 0; z-index: 95; background: #fff;
    display: flex; flex-direction: column; }
  .visor-bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: #fff; color: #13181A; border-bottom: 1px solid #E3E7E3; }
  .visor-bar span:first-child { flex: 1; font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #visor-n { font-family: var(--ff-mono); font-size: 11px; color: #8B948F; }
  #visor-cerrar { appearance: none; border: 0; background: none; cursor: pointer;
    font-size: 26px; line-height: 1; color: #5C6763; padding: 0 2px; }
  .visor-img { flex: 1; overflow: auto; display: flex; align-items: center;
    justify-content: center; background: #fff; }
  .visor-img img { max-width: 100%; height: auto; display: block; }
  .visor-nav { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 18px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #D3D9D4;
    background: rgba(255,255,255,.9); color: #13181A; font-size: 22px; cursor: pointer; }
  .visor-nav.sig { left: auto; right: 18px; }

  /* ---- barra de navegación inferior, al alcance del pulgar ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px) saturate(140%);
    border-top: 1px solid var(--line-soft);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 7px; color: var(--faint);
    font-family: var(--ff-ui); font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
    transition: color .18s ease;
  }
  .tab svg { width: 23px; height: 23px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: translateY(-1px) scale(1.06); }
  .tab:active svg { transform: scale(.9); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 8px; }

  /* ---- generic ---- */
  .eyebrow {
    font-family: var(--ff-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
  }
  h2.sec { font-family: var(--ff-ui); font-size: 13.5px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
  .muted { color: var(--muted); }

  /* ---- avisos ---- */
  .avisos { display: grid; gap: 8px; margin-top: 18px; }
  .aviso {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
    padding: 11px 13px; border-radius: 3px; font-size: 13.5px; line-height: 1.45;
    background: var(--surface); border: 1px solid var(--line-soft);
    border-left: 3px solid var(--line);
  }
  .aviso .dot { font-family: var(--ff-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
  .aviso.pendiente { border-left-color: var(--alert); }
  .aviso.pendiente .dot { color: var(--alert); }
  .aviso.atencion { border-left-color: var(--signal); }
  .aviso.atencion .dot { color: var(--signal); }
  .aviso.dato { border-left-color: var(--accent); }
  .aviso.dato .dot { color: var(--accent); }

  /* ---- ciudades ---- */
  .ciudad { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .ciudad-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ciudad-head h3 { font-family: var(--ff-text); font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.015em; }
  .ciudad-head .pais { font-size: 12px; color: var(--faint); }
  .ciudad-meta { font-family: var(--ff-mono); font-size: 11.5px; color: var(--muted);
    margin-top: 3px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 13px 14px; margin-top: 10px; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
  .card-sub { font-size: 13px; color: var(--muted); line-height: 1.45; }

  /* ---- transporte: tablero de salidas ---- */
  .leg { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    margin-top: 10px; overflow: hidden; }
  .leg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 13px 8px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .leg-op { font-family: var(--ff-mono); font-size: 12px; font-weight: 600; color: var(--signal);
    letter-spacing: .05em; }
  .leg-date { font-family: var(--ff-mono); font-size: 11px; color: var(--faint);
    letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .leg-route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
    padding: 11px 13px; }
  .leg-pt .time { font-family: var(--ff-mono); font-size: 19px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .leg-pt .place { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
  .leg-pt.to { text-align: right; }
  .leg-arrow { color: var(--faint); font-family: var(--ff-mono); font-size: 13px; }
  .leg-foot { padding: 0 13px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 13px 12px; }

      guion: "Estás parado frente a lo más viejo que queda en pie en Madrid, y es una pared. Vale la pena, porque esta pared te explica por qué existe la ciudad.\n\nMadrid no es una ciudad romana. No es visigoda. No tiene un pasado antiguo glorioso que le hayan tapado. Madrid es un cuartel musulmán, y esto es lo único que sobró de él.\n\nPongámoslo en contexto. En el año 711 los musulmanes cruzaron desde el norte de África y en pocos años se quedaron con casi toda la península. Fundaron un estado con capital en Córdoba que duró siglos. Arriba, en el norte, quedaron unos reinos cristianos chicos que durante setecientos años fueron empujando hacia el sur. Esa pelea larga es lo que después llamaron la Reconquista, y esta pared es una pieza de esa pelea.\n\nA mediados del siglo nueve el emir de Córdoba, Muhammad I, tenía un problema concreto: esos cristianos del norte bajaban a hacer razias y el objetivo grande era Toledo, que era la ciudad importante de la zona. Así que mandó levantar una línea de fortalezas para frenarlos antes de que llegaran. Una de ellas fue esta. Le pusieron Mayrit.\n\nY el nombre importa, porque explica la elección del lugar. La raíz tiene que ver con los canales de agua: acá abajo hay agua subterránea en cantidad, y los musulmanes armaron una red de galerías para sacarla. O sea que Madrid está donde está por el agua. No por el río, que es un chiste. Por lo que hay abajo.\n\nPensalo un segundo: es una de las poquísimas capitales europeas fundada por musulmanes. Londres es romana, París es romana, Roma es Roma. Madrid es un fortín de frontera del siglo nueve que puso un emir cordobés para cuidar Toledo.\n\nY ahí está la ironía. En 1085 el rey Alfonso VI pasó por acá, tomó Madrid casi de paso, siguió camino y se quedó con Toledo igual. Madrid quedó como un pueblo sin importancia durante casi quinientos años, hasta que en 1561 el rey Felipe II decidió traer acá la corte, que es el gobierno y toda la gente que vive de él. ¿El motivo? Que Madrid estaba en el medio geográfico del país y tenía agua. Lo mismo que había pensado el emir setecientos años antes.\n\nEl pueblito que cuidaba Toledo terminó reemplazándola. Y el sábado vas a Toledo y vas a ver lo que perdió.\n\nAhora mirá la pared. Se conservan unos ciento veinte metros y tiene dos metros sesenta de espesor: esto era en serio. Fijate abajo, en la parte de bloques grandes, oscuros e irregulares: eso es pedernal, una piedra muy dura, y es lo original del siglo nueve. Más arriba, donde los bloques son claros y están prolijamente escuadrados, es piedra caliza, y buena parte es reconstrucción posterior. La línea donde cambia el color es más o menos la línea entre lo que tocaron los albañiles de Muhammad y lo que tocaron los del siglo veinte.\n\nY una última cosa: fijate que estás mirando la muralla desde abajo, en un pozo verde, con la calle allá arriba. No es que la muralla esté hundida. Es que Madrid creció encima suyo durante mil años.",

rosa, como todas— dice que la pintó el propio Alfonso VI. No la pintó, pero la pintura es de verdad medieval y estuvo acá antes que todo lo demás.\n\nY un dato que cambia un poco la sensación del lugar: abajo tuyo hay más de mil personas enterradas. Esto es un cementerio activo de familias madrileñas, con nichos que se siguen usando. No es una cripta de museo.\n\nSon treinta minutos y es gratis, aunque piden un euro de colaboración para la luz. Dáselos: literalmente es lo que mantiene prendidas las lámparas que te dejan ver los capiteles.",

trabajando para patrones cristianos, y por eso combina tan bien que casi no se nota el agregado.\n\nMirá la juntura entre lo viejo y lo nuevo. Ese edificio es, literalmente, las dos religiones pegadas.\n\nY la leyenda, que te la van a contar sí o sí. Dicen que cuando Alfonso VI entró a Toledo en 1085, su caballo se arrodilló justo acá y no quiso avanzar. Al revisar, encontraron un crucifijo escondido en el muro con una lámpara todavía encendida al lado, que los cristianos habrían dejado ahí antes de la llegada de los musulmanes. De ahí el nombre: Cristo de la Luz.",

        "La inscripción árabe en ladrillo de la fachada: dice quién la pagó, en 999.",
        "Las nueve bóvedas del techo: cada una con un diseño distinto.",
        "El ábside del fondo, agregado en 1186 donde estaba el muro hacia La Meca."
      ]
    },
    {
      id: "tol-03", orden: 3, sala: "Catedral Primada",
      titulo: "La catedral: por qué manda", autor: "Empezada por Maestro Martín", fecha: "1226–1493",
      guion: "Te vas a pasar dos horas acá adentro, así que vale la pena entender qué es este edificio antes de entrar, porque no es una catedral más.\n\nSe llama Catedral Primada, y primada quiere decir primera: manda sobre todas las demás iglesias de España. El arzobispo de Toledo es el jefe de la Iglesia española. Eso viene de los visigodos, en el siglo seis, cuando Toledo era la capital y acá se hacían los concilios que decidían la doctrina de todo el reino. Cuando Felipe II mudó la corte a Madrid, Toledo perdió el poder político pero se quedó con el religioso, y nunca lo soltó. Por eso Madrid no tuvo catedral hasta 1993.\n\nAhora, el suelo que estás pisando tiene tres capas. Primero hubo una iglesia visigoda, en el siglo seis. Cuando llegaron los musulmanes, la convirtieron en la mezquita principal de la ciudad. Y cuando los cristianos retomaron Toledo, la mezquita volvió a ser iglesia, hasta que en 1226 decidieron tirar todo y hacer esto.\n\nTardaron doscientos sesenta y siete años. Se terminó en 1493, un año después de que Colón llegara a América. O sea que hubo generaciones enteras de canteros que nacieron, trabajaron acá toda la vida y se murieron sin ver el edificio terminado. Eso es normal en las catedrales góticas y sin embargo cuesta hacerse a la idea.\n\nDos palabras sobre el gótico, porque el edificio es el mejor ejemplo español. El gótico es la forma de construir iglesias que se inventó en Francia en el siglo doce y que resolvió un problema viejo: cómo hacer edificios altísimos y llenos de luz sin que se caigan. La solución fue técnica —arcos en punta, nervaduras cruzadas en las bóvedas y contrafuertes por fuera que empujan las paredes hacia adentro— y el resultado es que los muros dejan de sostener el peso y se pueden abrir enteros en vidrio. De ahí los vitrales.\n\nEste tiene setecientos cincuenta vitrales, casi todos originales de los siglos catorce al dieciséis. Es uno de los conjuntos más grandes de Europa que sobrevivieron.\n\nY un detalle que delata el pasado del lugar. Los arcos de la catedral, en algunas zonas, son polilobulados: en vez de terminar en punta limpia, tienen el borde recortado en lóbulos, como los que acabás de ver en la mezquita. Eso no es gótico francés, es una cita directa al arte islámico. Los constructores cristianos usaron formas musulmanas dentro de la catedral más importante de España, y a nadie le pareció raro.\n\nAhora entrá y caminá primero por la nave central sin mirar nada en particular. Ochenta y ocho columnas, cinco naves, treinta metros de alto. Dejá que te impresione el tamaño antes de ponerte a buscar cosas: para eso están las tres paradas que siguen.",
      mirar: [
        "Los 750 vitrales, casi todos originales de los siglos XIV al XVI.",
        "Los arcos polilobulados: formas islámicas dentro de una catedral cristiana.",
        "Tardó 267 años: se terminó en 1493, un año después de Colón."
      ]
    },
    {
      id: "tol-04", orden: 4, sala: "Coro y Capilla Mayor",
      titulo: "El coro y el retablo", autor: "Rodrigo Alemán, Berruguete y Vigarny", fecha: "1489–1543",
      guion: "En el medio de la catedral hay una especie de caja cerrada de madera y mármol que te tapa la vista. Eso es el coro, y es lo más español que tiene el edificio.\n\nEn las catedrales francesas o inglesas, cuando entrás ves todo el largo de la nave hasta el altar. En España no: acá se metía el coro en el medio, cerrado con muros, porque era el lugar donde los curas cantaban las ocho veces al día que se rezaba. Te arruina la perspectiva y a cambio te da esto.\n\nMirá la sillería, que son los asientos de madera tallada. Hay dos filas, una arriba y otra abajo, y son de épocas y manos distintas.\n\nLa fila de abajo la talló Rodrigo Alemán entre 1489 y 1495, y es un documento histórico extraordinario: cada respaldo tiene tallada una escena de la conquista de Granada, que estaba pasando en ese momento. Granada era el último reino musulmán que quedaba en España y cayó en 1492. O sea que estos relieves son como un noticiero tallado en roble, hecho por alguien que se enteraba de las batallas mientras las esculpía. Están los campamentos, las murallas, los soldados. Es la única crónica visual contemporánea de esa guerra.\n\nY ahora agachate un poco y mirá debajo de los asientos, en la parte que se levanta. Ahí hay tallas escondidas que no tienen nada de religioso: monstruos, borrachos, curas gordos, escenas obscenas, gente haciendo cosas que no esperarías en una catedral. Los talladores medievales metían estos chistes en las partes que nadie mira. Buscalos: es de lo más divertido del edificio.\n\nLa fila de arriba es cuarenta años posterior, de los años 1539 a 1543, y la hicieron dos escultores compitiendo: Alonso Berruguete de un lado y Felipe Vigarny del otro. Son personajes de la Biblia, y se nota el cambio de época: las figuras de abajo son medievales, planas, narrativas; las de arriba son del Renacimiento, con cuerpos torcidos y musculosos, aprendidos en Italia. Cincuenta años y otro mundo.\n\nDate vuelta ahora hacia el altar, a la Capilla Mayor. Ese retablo enorme que ocupa la pared entera hasta el techo es de principios del siglo dieciséis, tallado en madera de alerce dorada, y cuenta la vida de Cristo en pisos, como una historieta que se lee de abajo hacia arriba. Es de los retablos góticos más grandes que existen.\n\nY abajo, a los pies, fijate en las tumbas: ahí están enterrados varios reyes de Castilla.",
      mirar: [
        "La fila baja del coro: la conquista de Granada tallada mientras pasaba.",
        "Debajo de los asientos: monstruos, borrachos y chistes obscenos.",
        "El retablo del altar: la vida de Cristo en pisos, de abajo hacia arriba."
      ]
    },
    {
      id: "tol-05", orden: 5, sala: "El Transparente",
      titulo: "El Transparente", autor: "Narciso Tomé y sus cuatro hijos", fecha: "1729–1732",
      guion: "Caminá por detrás del altar mayor, por el pasillo curvo que lo rodea, y en algún momento vas a llegar a algo que no se parece a nada que hayas visto en una iglesia. Mármoles, bronces, ángeles saliendo de las paredes, nubes de piedra, y un chorro de luz cayendo del techo como si alguien hubiera abierto un agujero al cielo.\n\nAlguien lo abrió. Literalmente.\n\nEl problema era este. Detrás del altar mayor está el sagrario, que es donde se guarda la hostia consagrada, lo más sagrado de una iglesia católica. Pero el retablo gigante que acabás de ver tapaba toda la luz, así que el sagrario quedaba en penumbra permanente, escondido atrás de una montaña de madera dorada. Al arzobispo de Toledo eso le parecía inaceptable.\n\nEn 1729 le encargó la solución a Narciso Tomé, un arquitecto y escultor que trabajó en esto con sus cuatro hijos: dos arquitectos, un pintor y un escultor. Una empresa familiar.\n\nY lo que hicieron fue de una audacia enorme: le hicieron un agujero a la catedral. Abrieron un tragaluz en la bóveda, allá arriba, a varios metros de altura, y otro agujero en la parte de atrás del retablo. La luz del sol entra por el techo, baja en diagonal, atraviesa la obra y va a dar justo sobre el sagrario, que se ilumina desde atrás. De ahí el nombre: transparente, porque la luz lo atraviesa.\n\nPará y mirá para arriba, hacia el tragaluz. Vas a ver que Tomé no dejó el agujero pelado: lo rodeó de ángeles, profetas y nubes esculpidas que parecen estar flotando alrededor de la luz que entra. Es una máquina hecha para que no parezca una máquina. Todo el aparato existe para que vos creas que ese rayo de sol es un milagro y no ingeniería.\n\nEsto es el barroco, que es el estilo que dominó Europa en los siglos diecisiete y dieciocho y que se caracteriza exactamente por esto: teatro, movimiento, emoción, y esconder el truco. La versión española del barroco más recargado se llama churrigueresco, y esto es su ejemplo más famoso.\n\nCuando se terminó, en 1732, hubo un escándalo. Media Toledo dijo que era una barbaridad haberle hecho un agujero a una catedral gótica de quinientos años para meter esa cosa recargada. La otra mitad lo llamó la octava maravilla del mundo y le escribió poemas. La discusión sigue: mucha gente todavía opina que está fuera de lugar.\n\nSi podés, volvé a mediodía, que es cuando el sol pega en el ángulo correcto y el efecto funciona como lo pensaron.",
      mirar: [
        "El tragaluz abierto en la bóveda, rodeado de ángeles y nubes de piedra.",
        "Dónde cae la luz: justo sobre el sagrario, iluminado desde atrás.",
        "A mediodía el efecto funciona; a otra hora es solo escultura."
      ]
    },
    {
      id: "tol-06", orden: 6, sala: "Sacristía",
      titulo: "La sacristía y El Greco", autor: "El Greco, Luca Giordano y otros", fecha: "1577–1579 el Expolio",
      guion: "La sacristía es el cuarto donde los curas se ponen la ropa para la misa. En cualquier iglesia es un cuarto de servicio. Acá es un museo de pintura, y de los buenos.\n\nApenas entrás, mirá para arriba: todo el techo está pintado al fresco por Luca Giordano, un napolitano del siglo diecisiete al que llamaban Fa Presto, que quiere decir hazlo rápido, porque pintaba a una velocidad que asustaba a sus contemporáneos.\n\nPero la obra por la que estás acá está al fondo, presidiendo la sala. Se llama El Expolio, que quiere decir el despojo, y la pintó El Greco entre 1577 y 1579.\n\nUn minuto para El Greco, porque lo vas a encontrar dos veces hoy y es el personaje del día. Se llamaba Doménikos Theotokópoulos, nació en la isla de Creta, se formó pintando iconos bizantinos, se fue a Venecia a aprender con los mejores pintores de su época, pasó por Roma, y terminó acá, en Toledo, donde vivió el resto de su vida. Los españoles no podían con su apellido, así que lo llamaron simplemente El Greco: el griego. Es el pintor de Toledo.\n\nEsta fue su primera obra importante en España, apenas llegó. Y le trajo un juicio.\n\nEl cuadro muestra el momento en que a Cristo le arrancan la ropa antes de crucificarlo. Y lo que hizo El Greco fue meterlo a él en el medio de una multitud que lo aprieta: cabezas, armaduras, lanzas, gente empujándose. Cristo está ahí adentro, con una túnica roja intensa, mirando para arriba con una calma absoluta mientras todos le gritan alrededor.\n\nEl rojo de esa túnica es lo que tenés que mirar. Es el único color fuerte del cuadro y te lleva el ojo directo al centro sin que te des cuenta. Todo lo demás es gris, acero, marrón.\n\nAhora, el juicio. Los canónigos de la catedral, que eran los que le pagaban, se enojaron por dos cosas. Primero, que las cabezas de la multitud estuvieran más altas que la de Cristo, lo que les parecía una falta de respeto. Y segundo, que abajo a la izquierda aparecieran las tres Marías, porque según los evangelios ellas no estuvieron en esa escena. Le hicieron juicio para bajarle el precio. El Greco se negó a cambiar el cuadro y terminó cobrando bastante menos de lo que pedía. Era un tipo difícil y murió endeudado.\n\nEn la misma sala hay más: un Goya, un Tiziano, un Van Dyck y una colección larga de retratos de apóstoles del propio Greco. Si te sobra tiempo, dales una vuelta.",
      mirar: [
        "El techo entero pintado al fresco por Luca Giordano.",
        "En El Expolio: el rojo de la túnica, el único color fuerte del cuadro.",
        "Las cabezas de la multitud más altas que la de Cristo: por eso lo demandaron."
      ]
    },
    {
      id: "tol-07", orden: 7, sala: "Sinagoga del Tránsito",
      titulo: "La sinagoga del tesorero", autor: "Samuel ha-Leví", fecha: "1355–1357",
      guion: "Entrás a una sala rectangular con las paredes cubiertas de yeso tallado hasta el techo y un artesonado de madera arriba. Si no supieras dónde estás, jurarías que es un palacio musulmán. Es una sinagoga, la construyó un judío, y trabajaron en ella artesanos musulmanes para un rey cristiano.\n\nEso es Toledo en un solo edificio.\n\nLa mandó hacer entre 1355 y 1357 Samuel ha-Leví, que era el tesorero del rey Pedro I de Castilla. O sea: el hombre que manejaba la plata del reino era judío, y el rey le permitió construirse una sinagoga privada de este tamaño, cosa que legalmente estaba bastante restringida. Eso te dice hasta dónde llegaba la posición de la comunidad judía toledana.\n\nLa historia de Samuel ha-Leví termina mal, para que no te ilusiones: el rey terminó desconfiando de él, lo mandó detener, lo torturaron en Sevilla para que confesara dónde tenía escondido el dinero y murió en el tormento. Sus bienes pasaron a la corona.\n\nAhora mirá las paredes. El estilo es mudéjar, que ya viste hoy: artesanos musulmanes trabajando con materiales baratos —ladrillo, yeso, madera— pero con una destreza que deja sin aliento. No hay mármol ni piedra tallada en esta sala. Todo eso que parece encaje es yeso.\n\nY en medio de los dibujos geométricos y vegetales, buscá las letras. Hay inscripciones en hebreo corriendo por las paredes como frisos: son salmos y textos que cuentan quién construyó el edificio y bajo qué rey. Un especialista las llamó las inscripciones judías más hermosas de la Edad Media. Pero acá viene el detalle que a mí me parece increíble: también hay inscripciones en árabe. En una sinagoga. Alabando a un rey cristiano. Las tres culturas escritas en la misma pared.\n\nArriba, el artesonado: madera de conífera policromada, encajada en dibujos geométricos sin un solo clavo.\n\nY ahora lo que pasó después. En 1492 los Reyes Católicos dieron a los judíos españoles cuatro meses para convertirse al cristianismo o irse del país. La comunidad que llevaba ochocientos años acá desapareció. A los que se fueron y siguieron hablando español por el mundo se los llama sefardíes, de Sefarad, que es como llamaban ellos a España; todavía hoy, quinientos años después, hay gente en Turquía, Grecia o Israel que habla un castellano antiguo que se llevaron de acá.\n\nEl edificio pasó a manos de una orden militar cristiana y se convirtió en iglesia. De esa época viene el nombre raro: del Tránsito, por un cuadro que colgaron adentro.\n\nHoy es el Museo Sefardí, desde 1964. Date una vuelta por las salas del costado: hay objetos, documentos y trajes de la vida judía española, y explican mucho mejor que yo lo que se perdió acá.",
      mirar: [
        "Las inscripciones en hebreo corriendo como frisos por las paredes.",
        "Las inscripciones en árabe: en una sinagoga, alabando a un rey cristiano.",
        "Todo eso que parece encaje es yeso, no piedra: material barato, manos enormes."
      ]
    },
    {
      id: "tol-08", orden: 8, sala: "Santa María la Blanca",
      titulo: "Santa María la Blanca", autor: "Sinagoga mayor de Toledo", fecha: "hacia 1180–1200",
      guion: "Esta es la sorpresa del día. Entrás y lo que ves es un bosque de columnas blancas con arcos de herradura, todo encalado, sin un mueble, sin un cuadro, sin casi nada. Es lo más parecido a una mezquita que vas a ver hoy, es en realidad una sinagoga, y hoy es una iglesia.\n\nTiene unos ochocientos cuarenta años: se construyó alrededor del 1180, o sea casi dos siglos antes que la del Tránsito, y era la sinagoga mayor de Toledo, la principal de la comunidad.\n\nEl estilo es almohade, que era la forma de construir del imperio musulmán que dominaba el sur de España en ese momento. Y ahí está lo desconcertante: una sinagoga judía, construida en territorio cristiano, con la arquitectura del enemigo militar de los cristianos. A nadie le pareció contradictorio porque simplemente era la manera de construir bien que había en el lugar.\n\nAhora contá las columnas mientras caminás. Hay treinta y dos, en cinco naves, y todas son octogonales y están pintadas de blanco. Mirá los capiteles, esos remates de arriba: son de yeso tallado con piñas y volutas, y aunque parecen todos iguales, si prestás atención vas a ver que hay variaciones. Y por encima de los arcos hay una franja de yesería calada, tallada como un encaje.\n\nEl efecto del conjunto es lo importante. No hay color, no hay imágenes, no hay oro. Hay ritmo: columna, arco, columna, arco, repetido hasta el fondo. Es un espacio que no te dice nada y te deja en silencio, y eso es rarísimo entre todo lo que vas a ver hoy.\n\nLa historia de cómo dejó de ser sinagoga es fea y conviene contarla. En 1391 hubo una ola de ataques contra las juderías de toda España, con matanzas y conversiones forzadas; en Toledo la comunidad quedó destrozada. Poco después el edificio le fue quitado a los judíos y convertido en iglesia cristiana, casi cien años antes de la expulsión de 1492. El nombre actual, Santa María la Blanca, es de esa época.\n\nDespués tuvo una vida bastante indigna: fue cuartel, depósito de armas y hasta almacén. Recién en el siglo diecinueve la declararon monumento y la empezaron a cuidar.\n\nUna cosa práctica: no hay bancos ni recorrido marcado. Caminá hasta el fondo, date vuelta y mirá el conjunto desde ahí. Son diez minutos y es la foto más linda que vas a sacar en Toledo.",
      mirar: [
        "Las 32 columnas octogonales blancas y los arcos de herradura.",
        "La franja de yeso calado por encima de los arcos, como un encaje.",
        "Caminá al fondo y date vuelta: desde ahí se ve el conjunto entero."
      ]
    },
    {
      id: "tol-09", orden: 9, sala: "Iglesia de Santo Tomé",
      titulo: "El entierro del Conde de Orgaz", autor: "El Greco", fecha: "1586–1588",
      guion: "Este cuadro está en una salita al lado de una iglesia, mide casi cinco metros, y la mitad de la gente que entra no sabe que está mirando el resultado de un juicio.\n\nVa la historia. En 1323 se muere don Gonzalo Ruiz, señor de Orgaz, un tipo importante de Toledo, y le deja plata a esta parroquia para siempre. Dos siglos y medio después, el pueblo de Orgaz había dejado de pagar. El cura de Santo Tomé les hizo juicio, ganó, y con esa plata se dio un gusto: le encargó un cuadro enorme a El Greco para que nadie se olvidara de por qué había que pagar.\n\nEl tema es lo que supuestamente pasó en ese entierro. Según la tradición toledana, cuando estaban por meter el cuerpo en la tumba bajaron del cielo San Esteban y San Agustín en persona y lo depositaron ellos mismos. En Toledo lo daban por cierto y el cura quería eso pintado, grande, en la pared.\n\nAhora el juego. El cuadro tiene dos pisos: abajo el entierro, con cuarenta señores de negro parados como en un velorio; arriba el cielo, todo torcido. Buscá tres cosas.\n\nEl nene de abajo a la izquierda, el único que te mira a vos y señala la escena con el dedo: es el hijo del Greco, tenía ocho años. En el pañuelo que le asoma del bolsillo el padre le pintó su fecha de nacimiento, 1578, y esa es la única firma del cuadro.\n\nMás arriba, entre los caballeros de negro, otro que te mira de frente con la cara pálida, justo encima de San Esteban: ese es El Greco.\n\nY fijate cómo cambia la pintura de un piso al otro. Abajo todo es nítido: las caras son retratos de vecinos suyos, con arrugas y ojeras, y las armaduras y los bordados brillan. Arriba se le va la mano: los cuerpos se estiran como si fueran de goma, las nubes parecen humo, nada tiene borde. No es que pintara peor arriba. Está pintando dos cosas distintas: una es Toledo un martes a la tarde, la otra no.\n\nDos cosas más para el final. La primera: esa manera de estirar los cuerpos no era un error ni una moda de la época. Viene de los iconos bizantinos con los que El Greco se formó de chico en Creta, donde la figura no obedece a la anatomía sino al significado. A sus contemporáneos les pareció extravagante. Trescientos años después, los pintores de vanguardia del siglo veinte lo adoptaron como un antepasado: Cézanne lo copió y Picasso estudió esta época del Greco antes de pintar su cuadro más rupturista.\n\nY la segunda: el cuadro sigue en el lugar exacto para el que fue pintado, en la pared para la que se encargó, a la altura para la que se pensó. Casi ningún cuadro famoso del mundo puede decir eso. Los demás están en museos.",
      mirar: [
        "El nene de abajo a la izquierda: el hijo del Greco, con la firma en el pañuelo.",
        "El señor pálido que te mira de frente, encima de San Esteban: es El Greco.",
        "El cambio entre los dos pisos: abajo nítido y real, arriba estirado y sin bordes."
      ]
    },
    {
      id: "tol-10", orden: 10, sala: "San Juan de los Reyes",
      titulo: "San Juan de los Reyes", autor: "Juan Guas", fecha: "1477–1495",
      guion: "Antes de entrar, parate en la calle y mirá la pared de afuera. Hay cadenas de hierro colgadas, muchas, oxidadas, atadas al muro. No son decorativas.\n\nSon las cadenas de prisioneros cristianos que estuvieron cautivos en territorio musulmán y quedaron libres cuando los Reyes Católicos tomaron las ciudades de Málaga y Baeza, a fines del siglo quince. Los liberados las colgaron acá como ofrenda. Llevan quinientos años en esa pared.\n\nY eso te explica de qué se trata el edificio entero, que es propaganda en piedra de muy alto nivel.\n\nLos Reyes Católicos fueron Isabel de Castilla y Fernando de Aragón, que se casaron y al unir sus dos reinos armaron lo que después sería España. Son los mismos que en 1492 financiaron a Colón, tomaron Granada y expulsaron a los judíos: el año más cargado de la historia española. Pero antes de todo eso tuvieron que pelear una guerra para que Isabel pudiera ser reina, porque su derecho al trono estaba discutido. Esa guerra se decidió en la batalla de Toro, en 1476.\n\nEste monasterio se mandó construir para celebrar esa victoria. Empezó en 1477 y lo dirigió Juan Guas, el arquitecto de confianza de Isabel.\n\nEl estilo se llama gótico isabelino, por ella, y es una mezcla muy española: la estructura gótica de siempre, pero con una decoración desbordada que toma cosas del mudéjar musulmán y del Renacimiento italiano. Cuando entres a la iglesia mirá las paredes del crucero: están cubiertas de escudos gigantes de los reyes, con el águila de San Juan, sostenidos por leones, repetidos hasta arriba. No es decoración religiosa: es una declaración de quién manda.\n\nY ahora lo mejor, que es el claustro. Pasá al patio y tomate diez minutos ahí, porque es de los espacios más lindos de España.\n\nUn claustro es el patio cuadrado rodeado de galerías donde los monjes caminaban y rezaban. Este es de dos pisos. Abajo, arcos góticos con una tracería finísima y, en las paredes, hornacinas con estatuas de santos. Arriba, un artesonado mudéjar de madera, o sea otra vez artesanos musulmanes trabajando en el edificio más triunfalmente católico de la ciudad.\n\nY buscá los bichos. Entre la decoración de piedra hay animales por todos lados: monos, lagartijas, aves, monstruos, plantas. Los canteros se divertían. Es el mismo chiste que los asientos del coro de la catedral, pero al aire libre.\n\nUn detalle que cierra la historia. Isabel quería que este fuera su tumba y la de Fernando. Nunca los enterraron acá. En 1492 cayó Granada, el último reino musulmán de la península, y la reina decidió que ese era el lugar que valía la pena: están los dos en la catedral de Granada. Este monasterio enorme se construyó para un funeral que nunca se hizo.",
      mirar: [
        "Las cadenas en la pared de afuera: de cautivos liberados en Málaga y Baeza.",
        "En el claustro, los animales tallados entre la decoración: monos, lagartijas.",
        "El artesonado mudéjar del piso de arriba del claustro."
      ]
    },
    {
      id: "tol-11", orden: 11, sala: "Mirador del Valle",
      titulo: "El Mirador del Valle", autor: "La vista", fecha: null,
      guion: "Cruzaste el río, subiste la ladera de enfrente y ahora tenés Toledo entero delante. Esta es la vista que pintó El Greco y la que sale en todas las fotos. Vale la pena quedarse un rato largo, así que sentate.\n\nUbicá primero lo grande. El edificio cuadrado con cuatro torres en las esquinas, arriba de todo, es el Alcázar: fue fortaleza romana, después palacio musulmán, después residencia de Carlos V, y hoy es una biblioteca y un museo del ejército. Está en el punto más alto de la ciudad, que es el punto más alto del peñón.\n\nLa torre alta y delgada que asoma a la izquierda del Alcázar es la de la catedral, de noventa y dos metros. Desde acá se entiende una cosa que adentro no se nota: la catedral está metida entre casas, sin ninguna plaza delante. Es enorme y está escondida. Eso pasa porque cuando se construyó, la ciudad ya estaba apretada alrededor y no había lugar.\n\nAbajo, el Tajo. Mirá cómo lo rodea: es un meandro, o sea una curva cerrada del río, que abraza la ciudad por el este, el sur y el oeste. Solo el lado norte está en tierra firme, y por ahí estaba la muralla. Toledo es prácticamente una isla, y eso es lo que la hizo capital durante mil quinientos años.\n\nBuscá también los dos puentes históricos, uno a cada lado: el de Alcántara, que es romano de origen y fue por donde entró todo el mundo durante siglos, y el de San Martín, medieval, del lado opuesto.\n\nY ahora mirá los colores: el ocre de la piedra, el verde oscuro de la ladera, el gris del río. Es exactamente la paleta con la que El Greco pintó Toledo una y otra vez. Cuando veas un cuadro suyo con esta ciudad bajo un cielo de tormenta, vas a reconocer este lugar.\n\nDos consejos prácticos. Vení con la tarde caída, no con el sol alto: la luz rasante marca los relieves y la ciudad se pone dorada. Y si podés esperar a que se prendan las luces, hacelo, porque Toledo iluminada desde acá es una de las imágenes que te vas a llevar del viaje.\n\nDespués bajá, cená sin apuro en el casco viejo —que a esa hora ya se vació de excursiones— y acordate del tren de las 21:37, que es el último del sábado y no tiene repuesto.",
      mirar: [
        "El Alcázar cuadrado arriba de todo y, a su izquierda, la torre de la catedral.",
        "El meandro del Tajo abrazando la ciudad por tres lados.",
        "Los puentes de Alcántara, romano, y de San Martín, medieval."
      ]
    }
  ]
};

</script>

<script>
/* ========= configuración de audio =========
   Si al lado de este archivo existe una carpeta "audio" con los MP3
   generados (audio/prado-01.mp3, etc.), la app los usa.
   Si no encuentra el archivo, lee el guion con la voz del dispositivo. */
var AUDIO_BASE = "audio/";

(function () {
  "use strict";

  var GUIAS = [GUIA_MADRID_D1, GUIA_MADRID_D2, GUIA_TOLEDO, GUIA_MADRID_D4];
  /* Cada guía se narra con una voz. Se copia a cada parada porque la huella
     del MP3 la incluye: si le cambio la voz a una guía, cambia la URL y el
     teléfono se baja SOLO esas pistas, sin tocar las demás. */
  GUIAS.forEach(function (g) {
    g.paradas.forEach(function (p) { p.voz = g.voz || ""; });
  });
  var IT = ITINERARIO;

  /* ---------- almacenamiento tolerante a fallos ---------- */
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem("eurotrip." + k); return v === null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem("eurotrip." + k, JSON.stringify(v)); } catch (e) {}
    }
  };
  var hechas = store.get("hechas", {});

  /* ---------- utilidades ---------- */
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  /* nombres cortos de los días. Ojo: DIAS a secas son los del viaje,
     que vienen de dias.js. */
  var DIA_SEM = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fechaCorta(s) { var d = parseISO(s); return DIA_SEM[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parrafos(t) {
    return String(t).split("\n\n").map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  }
  function el(id) { return document.getElementById(id); }

  /* ---------- cuenta regresiva ---------- */
  (function () {
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var salida = new Date(2026, 8, 30);
    var fin = parseISO(IT.fin);
    var dias = Math.round((salida - hoy) / 86400000);
    var txt;
    if (dias > 1) txt = "faltan " + dias + " días";
    else if (dias === 1) txt = "salís mañana";
    else if (dias === 0) txt = "salís hoy";
    else if (hoy <= fin) {
      var n = Math.round((hoy - parseISO(IT.inicio)) / 86400000) + 1;
      txt = "día " + n + " de 35";
    } else txt = "viaje terminado";
    el("countdown").textContent = txt;
  })();

  /* ================= VISTA: ITINERARIO ================= */
  /* ================= ITINERARIO POR DÍA =================
     La pestaña principal: cada día se despliega y muestra su línea de tiempo
     con TODO junto — actividades, audioguías y pases —, ordenado por hora.
     Las pestañas Audioguías y Pases siguen existiendo como listas sueltas,
     pero el día es el lugar donde uno mira cuando está viajando. */

  var pasesCache = [];
  /* undefined = todavía no se calculó el día por defecto.
     null = el usuario cerró todo a propósito. Distinguirlos importa: si se
     usa null para las dos cosas, el día por defecto no se puede compactar
     porque renderItin lo vuelve a abrir en el acto. */
  var diaAbierto;

  function paradaPorId(id) {
    for (var i = 0; i < GUIAS.length; i++) {
      var g = GUIAS[i];
      for (var k = 0; k < g.paradas.length; k++) {
        if (g.paradas[k].id === id) return { guia: g, idx: k, p: g.paradas[k] };
      }
    }
    return null;
  }

  /* Reproduce una parada desde donde sea, sin pasar por la pestaña de guías. */
  function tocarParadaPorId(id) {
    var r = paradaPorId(id);
    if (!r) return;
    guiaActual = r.guia;
    cargarParada(r.idx);
  }

  /* Todos los audios de un día, en el orden en que los vas a caminar. No es
     el orden de la guía: un día puede cruzar guías y mezcla paradas y tramos. */
  function paradasDelDia(fecha) {
    var d = DIAS.filter(function (x) { return x.fecha === fecha; })[0];
    if (!d) return [];
    var out = [];
    (d.actividades || []).forEach(function (a) {
      (a.paradas || []).forEach(function (id) {
        var r = paradaPorId(id);
        if (r) out.push(r.p);
      });
    });
    return out;
  }

  function minutosDeParada(p) {
    return Math.max(1, Math.round(p.guion.length / CARACTERES_POR_MINUTO));
  }

  function hoyISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }

  function diaPorDefecto() {
    var hoy = hoyISO();
    for (var i = 0; i < DIAS.length; i++) if (DIAS[i].fecha >= hoy) return DIAS[i].fecha;
    return DIAS.length ? DIAS[DIAS.length - 1].fecha : null;
  }

  function pasesDelDia(fecha) {
    return pasesCache.filter(function (p) { return p.fecha === fecha; });
  }

  /* Las actividades se marcan como hechas con un toque en el círculo. La clave
     es fecha + posición: los días vienen de dias.js y no tienen id propio. */
  var actHechas = store.get("actHechas", {});

  function claveAct(fecha, i) { return fecha + "#" + i; }

  /* Qué bloques de audio se abrieron a mano. Un bloque con 3 o más audios
     arranca colapsado: si no, una sala de museo te empuja el día entero. */
  var audiosAbiertos = {};

  function filaActividad(a, fecha, i) {
    var k = claveAct(fecha, i);
    var lista = !!actHechas[k];
    var h = '<div class="fila' + (lista ? " hecha" : "") + '">';
    h += '<div class="fila-h">' + esc(a.hora) + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-t"><button class="tic" data-act="' + esc(k) + '" ' +
         'aria-pressed="' + lista + '" aria-label="Marcar como hecha">' +
         (lista ? "&#10003;" : "") + "</button>";
    h += "<span>" + esc(a.titulo) + "</span></div>";
    (a.detalle || []).forEach(function (d) {
      h += '<div class="fila-d">' + esc(d) + "</div>";
    });
    var pegados = pasesDelDia(fecha).filter(function (x) { return x.actividad === k; });
    if ((a.paradas && a.paradas.length) || pegados.length) {
      h += '<div class="fila-audio">';
      pegados.forEach(function (x) {
        h += '<button class="mini-play ver" data-verpase="' + esc(x.id) + '">';
        h += '<span class="mp-ico">&#9744;</span>';
        h += '<span class="mp-t">' + esc(x.titulo) + "</span>";
        h += '<span class="mp-m">' + esc(nombreTipo(x.tipo).toLowerCase()) + "</span></button>";
      });
      var refs = (a.paradas || []).map(paradaPorId).filter(Boolean);
      var mins = refs.reduce(function (s2, r) { return s2 + minutosDeParada(r.p); }, 0);
      if (refs.length >= 3 && !audiosAbiertos[k]) {
        h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
        h += '<span class="mp-ico">&#9835;</span>';
        h += '<span class="mp-t">' + refs.length + " audios &middot; " + mins + " min</span>";
        h += '<span class="mp-m">ver</span></button>';
      } else {
        refs.forEach(function (r) {
          var id = r.p.id, listo = hechas[id], esTramo = r.p.tipo === "tramo";
          h += '<button class="mini-play' + (listo ? " listo" : "") +
               (esTramo ? " tramo" : "") + '" data-tocar="' + esc(id) + '">';
          h += '<span class="mp-ico">' +
               (listo ? "&#10003;" : esTramo ? "&#8599;" : "&#9654;") + "</span>";
          h += '<span class="mp-t">' + esc(r.p.titulo);
          /* Solo el tramo necesita aclaración: la parada es el caso normal, y
             ponerle "parate acá" a todo hacía el día más alto y más ruidoso. */
          if (esTramo) h += '<span class="mp-tipo">mientras caminás</span>';
          h += "</span>";
          h += '<span class="mp-m">' + minutosDeParada(r.p) + " min</span>";
          h += "</button>";
        });
        if (refs.length >= 3) {
          h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
          h += '<span class="mp-ico">&#9652;</span><span class="mp-t">Ocultar</span>';
          h += '<span class="mp-m"></span></button>';
        }
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }

  function filaPase(p) {
    var h = '<div class="fila pase-fila">';
    h += '<div class="fila-h">' + esc(p.hora || "") + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-tipo">' + esc(nombreTipo(p.tipo)) + " &middot; pase</div>";
    h += '<div class="fila-t">' + esc(p.titulo) + "</div>";
    if (p.codigo) h += '<div class="fila-cod">' + esc(p.codigo) + "</div>";
    if (p.nota) h += '<div class="fila-d">' + esc(p.nota) + "</div>";
    h += '<div class="fila-audio"><button class="mini-play ver" data-verpase="' + esc(p.id) + '">';
    h += '<span class="mp-ico">&#9744;</span><span class="mp-t">Ver el pase</span></button></div>';
    h += "</div></div>";
    return h;
  }

  function cuerpoDia(d) {
    var items = [];
    (d.actividades || []).forEach(function (a, i) {
      items.push({ hora: a.hora || "99:99", html: filaActividad(a, d.fecha, i) });
    });
    /* Los pases enganchados a una actividad ya se dibujaron dentro de ella.
       Los sueltos van por hora, y los que no tienen hora al final — antes
       caían primeros y te aparecía el pase arriba de todo el día. */
    pasesDelDia(d.fecha).forEach(function (p) {
      if (p.actividad) return;
      items.push({ hora: p.hora || "99:98", html: filaPase(p) });
    });
    items.sort(function (a, b) { return a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0; });

    var h = '<div class="linea">' + items.map(function (x) { return x.html; }).join("") + "</div>";
    if (d.notas && d.notas.length) {
      h += '<div class="dia-notas">';
      d.notas.forEach(function (n) { h += "<div>" + esc(n) + "</div>"; });
      h += "</div>";
    }
    return h;
  }

  function cabeceraDia(d) {
    var nAud = (d.actividades || []).reduce(function (s, a) {
      return s + ((a.paradas && a.paradas.length) || 0);
    }, 0);
    var nPas = pasesDelDia(d.fecha).length;
    var total = (d.actividades || []).length;
    var listas = 0;
    for (var i = 0; i < total; i++) if (actHechas[claveAct(d.fecha, i)]) listas++;
    var partes = [listas ? listas + " de " + total + " hechas" : total + " actividades"];
    if (nAud) partes.push(nAud + (nAud === 1 ? " audioguía" : " audioguías"));
    if (nPas) partes.push(nPas + (nPas === 1 ? " pase" : " pases"));

    var h = '<button class="dia-cab">';
    h += '<div class="dia-top"><span class="dia-n">Día ' + d.n + "</span>";
    h += '<span class="dia-f">' + esc(fechaLarga(d.fecha)) + "</span></div>";
    h += "<h3>" + esc(d.titulo) + "</h3>";
    h += '<div class="dia-tags">' + esc(partes.join(" · ")) + "</div>";
    if (nAud) {
      var minDia = paradasDelDia(d.fecha).reduce(function (s2, p) {
        return s2 + minutosDeParada(p);
      }, 0);
      h += '<span class="dia-play" data-diaplay="' + esc(d.fecha) + '">' +
           "&#9654; Reproducir el día &middot; " + minDia + " min</span>";
    }
    h += '<span class="dia-flecha">&#9662;</span>';
    h += "</button>";
    return h;
  }

  function renderItin() {
    if (diaAbierto === undefined) diaAbierto = diaPorDefecto();
    /* El itinerario es la lista de días y nada más. Los avisos y los tramos
       viven en Práctico: acá estorbaban arriba de todo. */
    var h = "";

    IT.ciudades.forEach(function (c) {
      var dd = DIAS.filter(function (x) { return x.ciudad === c.id; });
      if (!dd.length) return;

      h += '<h2 class="sec">' + esc(c.nombre) + " &middot; " + fechaCorta(c.desde) +
           " &rarr; " + fechaCorta(c.hasta) + "</h2>";

      var alo = IT.alojamientos.filter(function (a) { return a.ciudad === c.id; })[0];
      if (alo) {
        h += '<div class="alo">';
        if (alo.estado === "reservado") {
          h += '<div class="eyebrow">Alojamiento</div><div class="alo-t">' + esc(alo.nombre) + "</div>";
          var bits = [];
          if (alo.zona) bits.push(alo.zona);
          if (alo.plataforma) bits.push(alo.plataforma);
          if (alo.checkin) bits.push("check-in " + alo.checkin);
          h += '<div class="alo-s">' + esc(bits.join(" · ")) + "</div>";
        } else {
          h += '<div class="eyebrow" style="color:var(--alert)">Alojamiento sin reservar</div>';
          h += '<div class="alo-s">' + esc(alo.nota || "") + "</div>";
        }
        h += "</div>";
      }

      dd.forEach(function (d) {
        var abierto = d.fecha === diaAbierto;
        h += '<article class="dia' + (abierto ? " abierto" : "") + '" data-dia="' + esc(d.fecha) + '">';
        h += cabeceraDia(d);
        h += '<div class="dia-cuerpo"' + (abierto ? "" : " hidden") + ">";
        h += abierto ? cuerpoDia(d) : "";
        h += "</div></article>";
      });
    });

    el("view-itin").innerHTML = h;
  }
  function legHTML(t, etiqueta) {
    if (!t) return "";
    var h = '<div class="leg">';
    h += '<div class="leg-top"><span class="leg-op">' + esc(t.operador) + '</span>';
    h += '<span class="leg-date">' + fechaCorta(t.fecha) + "</span></div>";
    h += '<div class="leg-route">';
    h += '<div class="leg-pt from"><div class="time">' + esc(t.sale) + '</div><div class="place">' + esc(t.desde) + "</div></div>";
    h += '<div class="leg-arrow">&#9679;&mdash;&#9679;</div>';
    h += '<div class="leg-pt to"><div class="time">' + esc(t.llega) + '</div><div class="place">' + esc(t.hasta) + "</div></div>";
    h += "</div>";
    if (t.detalle) h += '<div class="leg-foot">' + esc(t.detalle) + "</div>";
    h += '<div class="chips">';
    h += t.estado === "comprado" ? '<span class="chip ok">comprado</span>' : '<span class="chip wait">falta comprar</span>';
    if (t.codigo) h += '<span class="chip code">' + esc(t.codigo) + "</span>";
    if (t.precio) h += '<span class="chip">' + esc(t.precio) + "</span>";
    h += "</div></div>";
    return h;
  }

  /* ================= VISTA: AUDIOGUÍAS ================= */
  /* Huella del texto de cada parada. Si reescribo un guion, cambia la huella,
     cambia la URL del MP3 y el celular se baja SOLO esa pista de nuevo.
     Es FNV-1a de 32 bits: el mismo algoritmo está en generar_audio.py. */
  function huella(texto) {
    var bytes = unescape(encodeURIComponent(texto));
    var h = 0x811c9dc5;
    for (var i = 0; i < bytes.length; i++) {
      h ^= bytes.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ("0000000" + h.toString(16)).slice(-8);
  }

  function urlParada(p) {
    return "audio/" + p.id + ".mp3?v=" + huella((p.voz || "") + "\n" + p.guion);
  }

  /* ===== descargas para usar sin conexión ===== */
  var BYTES_POR_CARACTER = 243;   // medido sobre los MP3 reales a velocidad 1,1
  var sw = null;
  var progresos = {};
  var estadosCache = {};

  function grupos() {
    var g = {};
    GUIAS.forEach(function (guia) {
      var k = guia.ciudad;
      if (!g[k]) g[k] = { ciudad: k, nombre: nombreCiudad(k), paradas: [], chars: 0 };
      guia.paradas.forEach(function (p) {
        g[k].paradas.push(urlParada(p));
        g[k].chars += p.guion.length;
      });
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  }

  function urlsDe(grupo) {
    return grupo.paradas.map(function (u) { return new URL(u, location.href).href; });
  }

  function todasLasUrls() {
    var out = [];
    grupos().forEach(function (g) { out = out.concat(urlsDe(g)); });
    return out;
  }

  function mb(bytes) { return (bytes / 1048576).toFixed(1).replace(".", ",") + " MB"; }

  function preguntarSW(msg) {
    return new Promise(function (res) {
      if (!sw) return res(null);
      var ch = new MessageChannel();
      var listo = false;
      ch.port1.onmessage = function (e) { listo = true; res(e.data); };
      try { sw.postMessage(msg, [ch.port2]); } catch (e) { return res(null); }
      setTimeout(function () { if (!listo) res(null); }, 8000);
    });
  }

  function renderOffline() {
    var cont = el("offline-box");
    if (!cont) return;
    if (!sw) {
      cont.innerHTML = '<h3>Audio sin conexión</h3><div class="nota">' +
        "Esta función necesita que abras la app desde su dirección de internet, " +
        "no desde un archivo suelto. Mientras tanto, las paradas se leen con la voz del equipo.</div>";
      return;
    }
    var h = '<h3>Audio sin conexión</h3>';
    h += '<div class="nota">Descargá el audio con wifi antes de viajar. ' +
         "Una vez guardado queda en el teléfono y funciona sin señal y sin datos.</div>";
    grupos().forEach(function (g) {
      var est = mb(g.chars * BYTES_POR_CARACTER);
      var pr = progresos[g.ciudad];
      var guardadas = estadosCache[g.ciudad] === undefined ? null : estadosCache[g.ciudad];
      var completo = guardadas === g.paradas.length;
      h += '<div class="desc-fila' + (completo ? " lista" : "") + '" data-ciudad="' + esc(g.ciudad) + '">';
      h += "<div><div class=\"desc-nom\">" + esc(g.nombre) + "</div>";
      h += '<div class="desc-det">' + g.paradas.length + " pistas · " + est +
           (guardadas === null ? "" : completo ? " · guardado" : " · " + guardadas + " de " + g.paradas.length) +
           "</div></div>";
      if (pr) {
        h += '<button class="desc-btn" disabled>' + pr.hechas + "/" + pr.total + "</button>";
        h += '<div class="desc-barra"><i style="width:' +
             Math.round(pr.hechas / pr.total * 100) + '%"></i></div>';
      } else if (completo) {
        h += '<button class="desc-btn sec" data-borrar="' + esc(g.ciudad) + '">Borrar</button>';
      } else {
        h += '<button class="desc-btn" data-bajar="' + esc(g.ciudad) + '">Descargar</button>';
      }
      h += "</div>";
    });
    h += '<button class="desc-btn sec" id="diag-btn" style="margin-top:12px">Verificar audio guardado</button>';
    h += '<pre id="diag-out" class="diag" hidden></pre>';
    cont.innerHTML = h;
  }

  /* Comprueba que lo que la app pide sea exactamente lo que el service worker
     guardó. Si alguna vez vuelve a sonar la voz del equipo estando offline,
     esto dice por qué en una pantalla. */
  function diagnosticar() {
    var out = el("diag-out");
    if (!out) return;
    out.hidden = false;
    out.textContent = "Probando...";
    var gs = grupos();
    if (!gs.length || !sw) { out.textContent = "Sin service worker."; return; }
    var urls = urlsDe(gs[0]).slice(0, 3);
    preguntarSW({ tipo: "probar", urls: urls }).then(function (r) {
      if (!r) { out.textContent = "El service worker no respondio."; return; }
      if (r.error) { out.textContent = "Error: " + r.error; return; }
      var t = "guardadas: " + r.guardadas + "\n";
      t += "conexion: " + (navigator.onLine ? "si" : "no") + "\n";
      t += "ejemplo guardado:\n  " + (r.ejemplo || "(ninguno)") + "\n\n";
      (r.pruebas || []).forEach(function (x) {
        t += (x.ok ? "OK  " : "NO  ") + x.url.split("/").pop() + "\n";
        if (x.ok) t += "     " + x.tipo + " - " + x.bytes + " bytes\n";
      });
      out.textContent = t;
    });
  }

  function refrescarEstados() {
    var gs = grupos();
    var pend = gs.length;
    if (!pend || !sw) { renderOffline(); return; }
    gs.forEach(function (g) {
      preguntarSW({ tipo: "estado", urls: urlsDe(g) }).then(function (r) {
        g.guardadas = r ? r.guardadas : 0;
        estadosCache[g.ciudad] = g.guardadas;
        if (--pend === 0) {
          renderOffline();
          preguntarSW({ tipo: "limpiar", urls: todasLasUrls() });
        }
      });
    });
  }

  /* Medido sobre el MP3 real: 2492 caracteres = 175,5 s a velocidad 0,95,
     o sea unos 986 caracteres por minuto a la velocidad actual de 1,1. */
  var CARACTERES_POR_MINUTO = 986;

  function duracionGuia(g) {
    var chars = 0;
    g.paradas.forEach(function (p) { chars += p.guion.length; });
    var min = Math.round(chars / CARACTERES_POR_MINUTO);
    return g.paradas.length + " paradas · " + min + " min de audio";
  }

    var c = IT.ciudades.filter(function (x) { return x.id === id; })[0];

      h += "<span><span class=\"parada-t\">" + esc(p.titulo) + "</span>";

      h += '<span class="parada-sala">' + esc(p.sala) + (p.planta ? " &middot; " + esc(p.planta) : "") + "</span></span>";

  /* ================= VISTA: PENDIENTES ================= */
