</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #EDEFEC;
    --surface: #FFFFFF;
    --surface-2: #F4F6F3;
    --ink: #13181A;
    --muted: #4E5956;
    --faint: #6C7671;
    --line: #D3D9D4;
    --line-soft: #E3E7E3;
    --accent: #14604F;
    --accent-soft: #DCEBE5;
    --signal: #8A5000;
    --signal-soft: #F5E9D5;
    --alert: #97281F;
    --alert-soft: #F6E1DE;
    --shadow: 0 1px 2px rgba(19,24,26,.06), 0 8px 24px -12px rgba(19,24,26,.18);
    --ff-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ff-text: "Spectral", Georgia, "Times New Roman", serif;
    --ff-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181A;
      --surface: #1B2023;
      --surface-2: #222829;
      --ink: #DCE3DF;
      --muted: #A3AEA9;
      --faint: #838E89;
      --line: #2A3134;
      --line-soft: #222829;
      --accent: #5FB9A8;
      --accent-soft: #14302B;
      --signal: #E0A63A;
      --signal-soft: #32260F;
      --alert: #E0655A;
      --alert-soft: #35201D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181A;
    --surface: #1B2023;
    --surface-2: #222829;
    --ink: #DCE3DF;
    --muted: #A3AEA9;
    --faint: #838E89;
    --line: #2A3134;
    --line-soft: #222829;
    --accent: #5FB9A8;
    --accent-soft: #14302B;
    --signal: #E0A63A;
    --signal-soft: #32260F;
    --alert: #E0655A;
    --alert-soft: #35201D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ff-ui);
    font-size: 16.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px;
    padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  body.con-player .wrap { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }

  /* ---- header ---- */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft);
  }
  .top-in { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 12px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand h1 {
    font-family: var(--ff-text); font-weight: 600; font-size: 23px; margin: 0;
    letter-spacing: -.01em;
  }
  .countdown {
    font-family: var(--ff-mono); font-size: 12px; font-weight: 500;
    color: var(--signal); letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .brand h1 { transition: opacity .18s ease; }




  .tic { appearance: none; cursor: pointer; font: inherit; font-size: 11px; line-height: 1;
    width: 20px; height: 20px; flex: 0 0 20px; margin-right: 10px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--surface); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
  .tic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .tic:active { transform: scale(.88); }
  .fila-t { display: flex; align-items: flex-start; }
  .fila.hecha .fila-t span { color: var(--faint); text-decoration: line-through; }
  .fila.hecha .fila-d { opacity: .5; }

  .prac { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 15px 16px; margin-bottom: 9px; }
  .prac-q { font-size: 17px; font-weight: 600; }
  .prac-c { font-size: 14px; color: var(--accent); margin-top: 4px; line-height: 1.5; }
  .prac-n { font-size: 14.5px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
  .crit { background: var(--surface); border: 1px solid var(--line-soft);
    border-left: 3px solid var(--alert); border-radius: 3px;
    padding: 14px 15px; margin-bottom: 8px; }
  .crit.pasado { border-left-color: var(--line); opacity: .5; }
  .crit-cab { display: flex; gap: 9px; align-items: baseline; }
  .crit-f { font-size: 13px; color: var(--faint); }
  .crit-h { font-family: var(--ff-mono); font-size: 14px; font-weight: 600; color: var(--alert); }
  .crit.pasado .crit-h { color: var(--faint); }
  .crit-q { font-size: 16px; margin-top: 4px; line-height: 1.45; }

  /* ---- itinerario por día ---- */
  .alo { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 12px 14px; margin-bottom: 10px; }
  .alo-t { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .alo-s { font-size: 14.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  .dia { background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 3px; margin-bottom: 10px; overflow: hidden;
    /* la cabecera es sticky: sin esto el título del día queda tapado */
    scroll-margin-top: 74px; }
  .dia.abierto { border-color: var(--line); box-shadow: var(--shadow); }
  .dia-cab { appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
    display: block; width: 100%; text-align: left; padding: 17px 42px 17px 16px;
    position: relative; color: var(--ink); }
  .dia-cab:active { background: var(--surface-2); }
  .dia-top { display: flex; gap: 9px; align-items: baseline; }
  .dia-n { font-family: var(--ff-mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .dia-f { font-size: 13px; color: var(--faint); }
  .dia-cab h3 { margin: 5px 0 0; font-family: var(--ff-text); font-size: 19px;
    font-weight: 600; letter-spacing: -.01em; }
  .dia-tags { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .dia-flecha { position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--faint); font-size: 13px; transition: transform .2s ease; }
  .dia.abierto .dia-flecha { transform: translateY(-50%) rotate(180deg); }
  .dia-cuerpo { border-top: 1px solid var(--line-soft); }

  .linea { padding: 4px 0; }
  .fila { display: grid; grid-template-columns: 56px 1fr; gap: 6px;
    padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .fila:last-child { border-bottom: 0; }
  .fila-h { font-family: var(--ff-mono); font-size: 13px; font-weight: 500;
    color: var(--faint); padding-top: 1px; }
  .fila-t { font-size: 16px; line-height: 1.5; }
  .fila-d { font-size: 14.5px; color: var(--muted); margin-top: 5px; line-height: 1.55; }
  .fila-tipo { font-family: var(--ff-mono); font-size: 11px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .fila-cod { font-family: var(--ff-mono); font-size: 14px; color: var(--accent);
    margin-top: 3px; user-select: text; letter-spacing: .04em; }
  .pase-fila { background: var(--signal-soft); box-shadow: inset 3px 0 0 var(--signal); }
  .fila-audio { display: grid; gap: 5px; margin-top: 8px; }
  .mini-play { appearance: none; cursor: pointer; font: inherit; text-align: left;
    display: grid; grid-template-columns: 18px 1fr auto; gap: 9px; align-items: start;
    padding: 10px 12px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); }
  .mini-play:active { transform: scale(.99); }
  .mp-ico { color: var(--accent); font-size: 11px; text-align: center; padding-top: 4px; }
  .mp-t { font-size: 14.5px; line-height: 1.4; }
  .mp-m { font-family: var(--ff-mono); font-size: 11.5px; color: var(--faint);
    padding-top: 3px; white-space: nowrap; }
  .mini-play.listo .mp-t { color: var(--muted); }
  /* Dentro de un día conviven tres cosas y hay que distinguirlas sin leer:
       parada  fondo neutro          te parás y escuchás
       tramo   verde tenue           se escucha caminando
       pase    arena + barra al lado NO es una audioguía, es una entrada
     El verde es la familia de las audioguías, así que el tramo se queda
     adentro de esa familia y el pase se va al otro extremo del círculo. */
  .mini-play.resumen { border-style: dashed; }
  .mini-play.tramo { background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .mini-play.ver { background: var(--signal-soft); border-color: transparent;
    border-left: 3px solid var(--signal); padding-left: 11px; }
  .mini-play.ver .mp-ico { color: var(--signal); }
  .mini-play.ver .mp-t { font-weight: 600; }
  .mini-play.ver .mp-m { color: var(--signal); font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px;
    padding-top: 5px; }
  .mp-tipo { display: block; font-family: var(--ff-mono); font-size: 10.5px;
    letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }
  .dia-play { display: inline-block; margin-top: 9px; font-family: var(--ff-mono);
    font-size: 12px; letter-spacing: .03em; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 5px 11px; }
  .dia-notas { padding: 13px 16px; border-top: 1px solid var(--line-soft);
    font-size: 14.5px; line-height: 1.55; color: var(--muted); background: var(--surface-2); }
  .dia-notas div + div { margin-top: 4px; }
  .hoja-par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hoja-par label { margin-top: 14px; }

  /* ---- pases ---- */
  .pases-top { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 4px; }
  .vacio { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 18px; margin-top: 14px; font-size: 15px; color: var(--muted); line-height: 1.6; }
  .vacio b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 7px; }
  .pase { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 13px 15px; margin-bottom: 9px; }
  .pase-cab { display: flex; justify-content: space-between; align-items: center; }
  .pase-tipo { font-family: var(--ff-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint); }
  .pase-n { font-family: var(--ff-mono); font-size: 10.5px; color: var(--faint); }
  .pase-t { font-size: 17.5px; font-weight: 600; margin: 6px 0 0; letter-spacing: -.01em; }
  .pase-cod { font-family: var(--ff-mono); font-size: 14.5px; color: var(--accent);
    margin-top: 5px; user-select: text; letter-spacing: .04em; }
  .pase-nota { font-size: 14.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .pase-acc { display: flex; gap: 8px; margin-top: 11px; }
  .pase-acc button { appearance: none; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 600; padding: 7px 14px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); }
  .pase-acc .pase-ver { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pase-acc button:active { transform: scale(.97); }
  .pase-pie { margin-top: 18px; }

  /* ---- hoja de alta ---- */
  body.sin-scroll { overflow: hidden; }
  .hoja { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; }
  .hoja-in { background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: 14px 14px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: subir .22s ease; }
  .hoja-in h3 { margin: 0 0 4px; font-family: var(--ff-text); font-size: 19px; font-weight: 600; }
  .hoja-in label { display: block; margin-top: 14px; font-size: 12px; font-weight: 600;
    letter-spacing: .02em; color: var(--muted); }
  .hoja-in .opt { font-weight: 400; color: var(--faint); }
  .hoja-in input, .hoja-in select { display: block; width: 100%; margin-top: 5px;
    font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    -webkit-user-select: text; user-select: text; }
  .hoja-acc { display: flex; gap: 8px; margin-top: 20px; }
  .hoja-acc .desc-btn { flex: 1; padding: 12px; }

  /* ---- visor a pantalla completa ---- */
  .visor { position: fixed; inset: 0; z-index: 95; background: #fff;
    display: flex; flex-direction: column; }
  .visor-bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: #fff; color: #13181A; border-bottom: 1px solid #E3E7E3; }
  .visor-bar span:first-child { flex: 1; font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #visor-n { font-family: var(--ff-mono); font-size: 11px; color: #8B948F; }
  #visor-cerrar { appearance: none; border: 0; background: none; cursor: pointer;
    font-size: 26px; line-height: 1; color: #5C6763; padding: 0 2px; }
  .visor-img { flex: 1; overflow: auto; display: flex; align-items: center;
    justify-content: center; background: #fff; }
  .visor-img img { max-width: 100%; height: auto; display: block; }
  .visor-nav { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 18px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #D3D9D4;
    background: rgba(255,255,255,.9); color: #13181A; font-size: 22px; cursor: pointer; }
  .visor-nav.sig { left: auto; right: 18px; }

  /* ---- barra de navegación inferior, al alcance del pulgar ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px) saturate(140%);
    border-top: 1px solid var(--line-soft);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 7px; color: var(--faint);
    font-family: var(--ff-ui); font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
    transition: color .18s ease;
  }
  .tab svg { width: 23px; height: 23px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: translateY(-1px) scale(1.06); }
  .tab:active svg { transform: scale(.9); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 8px; }

  /* ---- generic ---- */
  .eyebrow {
    font-family: var(--ff-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
  }
  h2.sec { font-family: var(--ff-ui); font-size: 13.5px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
  .muted { color: var(--muted); }

  /* ---- avisos ---- */
  .avisos { display: grid; gap: 8px; margin-top: 18px; }
  .aviso {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
    padding: 11px 13px; border-radius: 3px; font-size: 13.5px; line-height: 1.45;
    background: var(--surface); border: 1px solid var(--line-soft);
    border-left: 3px solid var(--line);
  }
  .aviso .dot { font-family: var(--ff-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
  .aviso.pendiente { border-left-color: var(--alert); }
  .aviso.pendiente .dot { color: var(--alert); }
  .aviso.atencion { border-left-color: var(--signal); }
  .aviso.atencion .dot { color: var(--signal); }
  .aviso.dato { border-left-color: var(--accent); }
  .aviso.dato .dot { color: var(--accent); }

  /* ---- ciudades ---- */
  .ciudad { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .ciudad-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ciudad-head h3 { font-family: var(--ff-text); font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.015em; }
  .ciudad-head .pais { font-size: 12px; color: var(--faint); }
  .ciudad-meta { font-family: var(--ff-mono); font-size: 11.5px; color: var(--muted);
    margin-top: 3px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    padding: 13px 14px; margin-top: 10px; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
  .card-sub { font-size: 13px; color: var(--muted); line-height: 1.45; }

  /* ---- transporte: tablero de salidas ---- */
  .leg { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px;
    margin-top: 10px; overflow: hidden; }
  .leg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 13px 8px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .leg-op { font-family: var(--ff-mono); font-size: 12px; font-weight: 600; color: var(--signal);
    letter-spacing: .05em; }
  .leg-date { font-family: var(--ff-mono); font-size: 11px; color: var(--faint);
    letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

  .bar-hit { position: relative; padding: 11px 0; cursor: pointer; touch-action: none; }

  .knob { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;

  .ctrls { display: flex; align-items: center; gap: 5px; }
  .ctrls .ctrl { flex: 1 1 0; min-width: 0; padding: 0 4px; }

  .ctrl { appearance: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer;

    font: inherit; font-size: 12px; font-weight: 600; padding: 0 9px; }
  .ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctrl.main { background: var(--accent); border-color: var(--accent); color: var(--bg); min-width: 52px; }
  .ctrl.main:hover { opacity: .9; color: var(--bg); }

  .spacer { flex: 1; }

  /* ---- práctico tab ---- */
  .kv { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 8px; }
  .kv-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 11px 0;

  .kv-row dt { font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: .08em;

  .kv-row dd { margin: 0; line-height: 1.5; color: var(--muted); }
  .kv-row dd b { color: var(--ink); font-weight: 600; }

  .note { font-size: 12.5px; color: var(--faint); line-height: 1.5; margin-top: 20px;
    padding-top: 14px; border-top: 1px solid var(--line-soft); max-width: 62ch; }

  /* ---- movimiento: lo que separa una app de una página ---- */
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  main > section { animation: entrar .26s cubic-bezier(.22,1,.36,1); }

  .guia-card, .card, .leg, .aviso, .parada { animation: entrar .3s cubic-bezier(.22,1,.36,1) backwards; }

  .guia-card, .parada-btn, .desc-btn, .ctrl, .marcar, .back {

  .guia-card:active, .desc-btn:active:not([disabled]), .marcar:active { transform: scale(.985); }

  .parada-btn:active { transform: scale(.995); }

  .parada-body { animation: entrar .24s cubic-bezier(.22,1,.36,1); }
  .play-dot { transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease; }

   "guion": "Estás parado frente a lo más viejo que queda en pie en Madrid, y es una pared. Vale la pena, porque esta pared te explica por qué existe la ciudad.\n\nMadrid no es una ciudad romana. No es visigoda. No tiene un pasado antiguo glorioso que le hayan tapado. Madrid es un cuartel musulmán, y esto es lo único que sobró de él.\n\nPongámoslo en contexto. En el año 711 los musulmanes cruzaron desde el norte de África y en pocos años se quedaron con casi toda la península. Fundaron un estado con capital en Córdoba que duró siglos. Arriba, en el norte, quedaron unos reinos cristianos chicos que durante setecientos años fueron empujando hacia el sur. Esa pelea larga es lo que después llamaron la Reconquista, y esta pared es una pieza de esa pelea.\n\nA mediados del siglo nueve el emir de Córdoba, Muhammad I, tenía un problema concreto: esos cristianos del norte bajaban a hacer razias y el objetivo grande era Toledo, que era la ciudad importante de la zona. Así que mandó levantar una línea de fortalezas para frenarlos antes de que llegaran. Una de ellas fue esta. Le pusieron Mayrit.\n\nY el nombre importa, porque explica la elección del lugar. La raíz tiene que ver con los canales de agua: acá abajo hay agua subterránea en cantidad, y los musulmanes armaron una red de galerías para sacarla. O sea que Madrid está donde está por el agua. No por el río, que es un chiste. Por lo que hay abajo.\n\nPensalo un segundo: es una de las poquísimas capitales europeas fundada por musulmanes. Londres es romana, París es romana, Roma es Roma. Madrid es un fortín de frontera del siglo nueve que puso un emir cordobés para cuidar Toledo.\n\nY ahí está la ironía. En 1085 el rey Alfonso VI pasó por acá, tomó Madrid casi de paso, siguió camino y se quedó con Toledo igual. Madrid quedó como un pueblo sin importancia durante casi quinientos años, hasta que en 1561 el rey Felipe II decidió traer acá la corte, que es el gobierno y toda la gente que vive de él. ¿El motivo? Que Madrid estaba    "sala": "Cúpula y museo de la catedral",
   "titulo": "La catedral de arriba",
   "autor": "Cubas, y después Chueca Goitia",
   "fecha": "1883–1993",
   "guion": "Subís ocho euros de escalera y lo que te vas a encontrar es la catedral más rara de España. Te lo aviso para que la disfrutes en vez de que te desconcierte.\n\nEmpecemos por el dato que no cierra: Madrid, capital de un país profundamente católico, no tuvo catedral hasta 1993. Hace treinta años. Una catedral, para ser precisos, no es una iglesia grande: es la iglesia donde tiene su silla el obispo, y por lo tanto la iglesia principal de una zona. Madrid no tenía obispo propio.\n\nLa razón es puro orgullo institucional. Cuando Felipe II trajo la corte acá en 1561, Madrid era un pueblo de veinte mil habitantes que dependía religiosamente de Toledo. Y Toledo venía siendo la sede religiosa más importante de España desde los visigodos, mil años antes, y no pensaba ceder un centímetro de rango. Así que Madrid fue capital política sin ser nunca capital religiosa. El obispado propio se creó recién en 1885.\n\nLas obras arrancaron en 1883 con un proyecto neogótico del marqués de Cubas —neogótico quiere decir una imitación del gótico medieval, con arcos en punta y mucha altura—, se frenaron con la Guerra Civil, que fue la guerra entre españoles de 1936 a 1939, y cuando se retomaron en los años cincuenta alguien tomó una decisión rara: el arquitecto Fernando Chueca Goitia rediseñó el exterior en neoclásico, que es el estilo sobrio de columnas y frontones, para que combinara con el Palacio Real, que está enfrente. Resultado: por fuera es neoclásica y por dentro es neogótica. Son dos edificios distintos pegados.\n\nY adentro hay una tercera capa, que es la que divide a la gente. Las bóvedas, los vitrales y el techo se decoraron en los años noventa, con colores fuertes y geometrías contemporáneas, nada que ver con una catedral medieval. A mucha gente le parece feo. A mí me parece lo único honesto del edificio: es una catedral construida en el siglo veinte que no finge ser del catorce. Miralo con esos ojos y funciona.\n\nDe lo que hay en el museo, lo que vale son las vistas del recorrido. Subís por las galerías altas y terminás asomado a la plaza de la Armería con el Palacio Real enfrente. Desde arriba se entiende la escena completa: el palacio y la catedral mirándose a la cara, que es exactamente lo que Chueca Goitia quería que pasara.\n\nDos datos para cerrar. La consagró el papa Juan Pablo II en 1993, y es la única catedral española consagrada por un papa. Y acá se casaron el actual rey Felipe VI y Letizia en 2004, la primera boda real en Madrid en casi un siglo.\n\nOjo con el reloj: cierra a las 14:30 en punto y no abre los domingos.",

    "Las bóvedas y vitrales de los años noventa, con colores fuertes.",
    "Desde las galerías altas, el Palacio Real enfrente cruzando la plaza."

   "fecha": "20 de julio de 1936",
   "guion": "Son diecisiete minutos y el itinerario te dice que no te demores, así que te lo cuento mientras caminás.\n\nVas subiendo hacia Plaza de España y de ahí a un parque en alto donde está el templo egipcio. Ese parque se llama Parque de la Montaña. Hasta hace poco más de cincuenta años no era un parque: era un cuartel del ejército.\n\nEl Cuartel de la Montaña. Y lo que pasó ahí es el comienzo de la Guerra Civil española en Madrid.\n\nEl contexto rápido, porque hace falta. En julio de 1936 una parte del ejército se sublevó contra el gobierno de la República, que era el gobierno elegido en las urnas. En varias ciudades la sublevación triunfó en horas. En Madrid no.\n\nEl general que la comandaba acá se encerró en este cuartel con unos mil quinientos hombres y proclamó el estado de guerra. Era el 19 de julio. Al amanecer del 20 empezó el ataque: tropas leales al gobierno y miles de civiles armados rodearon el edificio y lo bombardearon. Los de adentro resistieron unas horas. Cuando cayó, hubo entre quinientos y novecientos muertos.\n\nEl cuartel quedó destruido. El solar estuvo vacío décadas mientras se discutía qué hacer con él, hasta que se lo cedieron al ayuntamiento para hacer un parque público.\n\nY acá viene la parte difícil de creer. El parque se inauguró el 20 de julio de 1972, y el mismo día se inauguró el templo de Debod, que está montado exactamente sobre el solar donde estaba el cuartel. Veinte de julio. Treinta y seis años justos, al día, de la mañana del asalto.\n\nNo encontré nada que diga si fue deliberado o si fue casualidad de calendario, así que no te lo voy a vender como intención. Pero cuando llegues arriba y veas un templo egipcio de dos mil años en un parque tranquilo lleno de gente sentada en el pasto, vale la pena saber qué había abajo.",

   "fecha": "Trasladado en 1970–1972",
   "guion": "Terminás el primer día mirando el atardecer desde un templo egipcio de más de dos mil años que está en un parque de Madrid. Y sí, es egipcio de verdad. No es una réplica.\n\nLa historia de cómo llegó acá es de las mejores del viaje.\n\nEn los años sesenta Egipto decidió construir una represa gigante sobre el Nilo, la presa de Asuán, para controlar las crecidas y generar electricidad. El problema es que el embalse iba a inundar una región entera río arriba llamada Nubia, que hoy queda entre el sur de Egipto y Sudán, y ahí había decenas de templos antiguos que se iban a perder abajo del agua para siempre. Entre ellos Abu Simbel, que es el más famoso.\n\nLa UNESCO, que es el organismo de la ONU que se ocupa del patrimonio, lanzó una campaña internacional para salvarlos. Varios países mandaron ingenieros, plata y equipos, y lo que se hizo fue literalmente desarmar los templos piedra por piedra, numerarlas y volver a armarlos más arriba. España participó y mandó gente.\n\nComo agradecimiento, Egipto regaló cuatro templos a los cuatro países que más habían ayudado. Uno fue a Estados Unidos, y está en el museo Metropolitan de Nueva York. Otro a Italia, y está en Turín —donde vos vas a estar el mes que viene—. Otro a los Países Bajos, en Leiden. Y este a España.\n\nSe desarmó, se embarcó por el Nilo hasta Alejandría, cruzó el Mediterráneo hasta Valencia y llegó a Madrid en mil trescientas cajas. Lo volvieron a montar acá y se inauguró en 1972. Está orientado de este a oeste, igual que estaba en Nubia.\n\nDel templo en sí: lo empezó a construir en el siglo dos antes de Cristo un rey nubio llamado Adijalamani, y estaba dedicado a los dioses Amón e Isis. Después lo fueron agrandando los Ptolomeos, que eran la dinastía griega que gobernó Egipto después de Alejandro Magno —Cleopatra era la última de esa familia— y más tarde los emperadores romanos Augusto y Tiberio. O sea que en esas piedras hay tres imperios encima.\n\nSi está abierto, entrá: adentro quedan relieves originales, bastante gastados. El aire seco de Nubia los conservó dos mil años y el clima de Madrid los está desgastando mucho más rápido en cincuenta. Es de las cosas tristes del traslado.\n\nGuardate una cosa para después: a la tarde volvés a este mismo parque, pero por fuera, a ver el atardecer desde la explanada. El templo por dentro y el templo contra el cielo naranja son dos visitas distintas.",

   "fecha": "1738–1764",
   "guion": "Estás por entrar al palacio real más grande de Europa occidental: ciento treinta y cinco mil metros cuadrados y unas tres mil cuatrocientas habitaciones. Versalles tiene más jardín; como edificio, este es más grande. Y el rey no vive acá.\n\nDos cosas antes de entrar, porque las dos explican lo que vas a ver.\n\nLa primera es un incendio. Acá estaba el Real Alcázar, que había empezado siendo aquella fortaleza musulmana y con los siglos se había convertido en el palacio de los reyes. Ahí adentro trabajó toda su vida Velázquez, el pintor más importante de España, y ahí colgaba Las meninas, su cuadro más famoso. La Nochebuena de 1734 el Alcázar se prendió fuego y ardió cuatro días. Se perdieron más de quinientos cuadros. Se salvaron los que alcanzaron a descolgar y tirar por las ventanas, y Las meninas fue uno de ellos: salió con un agujero en la cara de la infanta que restauraron poco después y que hoy no se nota.\n\nLa segunda es un cambio de familia. Durante casi dos siglos España la gobernó la dinastía de los Habsburgo, unos reyes austríacos que se casaban tanto entre primos que el último murió sin poder tener hijos. Eso desató una guerra europea por la corona española que duró trece años, y la ganó un príncipe francés, nieto del rey Luis XIV de Francia. Ese es Felipe V, el primer Borbón, la dinastía que sigue reinando hoy. Felipe V era francés, se había criado en Versalles, y cuando se le quemó el palacio viejo aprovechó para construir algo a la altura de lo que él consideraba un palacio.\n\nLe encargó el proyecto a Filippo Juvarra, un arquitecto siciliano, que murió al poco tiempo; lo continuó su discípulo Sacchetti. Y tomaron una decisión que se nota apenas entrás: se ordenó construirlo todo de obra, con los techos abovedados en piedra y ladrillo en vez de armados con vigas, para que no volviera a arder. Queda madera en puertas, ventanas y algunas cubiertas, pero la estructura que sostiene el edificio no tiene nada que pueda incendiarse. Por eso los techos son bóvedas.\n\nDe lo que vas a recorrer, quedate con cuatro cosas.\n\nLa escalera principal, apenas entrás: mármol, y en el techo un fresco enorme de Corrado Giaquinto. Fresco quiere decir pintado directamente sobre el revoque húmedo de la pared, así que el color queda adentro del muro y no se puede corregir: hay que acertar a la primera.\n\nEl Salón del Trono, todo terciopelo rojo y espejos venecianos, con un techo pintado por Tiepolo. Tiepolo era el pintor veneciano más cotizado del siglo dieciocho; lo trajeron a Madrid y terminó muriéndose acá. Acostate mentalmente a mirar ese techo: es la joya del palacio.\n\nEl Salón de Porcelana, que es exactamente eso: una habitación con las paredes cubiertas enteras de placas de porcelana blanca y verde con relieves. Es delirante y no se parece a nada.\n\nY el Comedor de Gala, con una mesa para más de cien personas que todavía se usa en cenas de Estado.\n\nUn dato para cerrar: el rey no vive acá desde hace cincuenta años. La familia real vive en el palacio de la Zarzuela, a las afueras, que es mucho más chico. Este se usa para actos oficiales y para que entres vos.",

    "Todo es piedra y ladrillo, sin madera: la lección del incendio de 1734."

   "autor": "Sabatini, Giaquinto y Tiepolo",
   "fecha": "1760–1764",
   "guion": "El recorrido es de sentido único: entrás por una punta y salís por la otra, sin poder volver atrás. Así que te voy contando en el orden en que las vas a pisar. Primero, la escalera.\n\nPará abajo de todo y mirá para arriba antes de subir un escalón. Es de mármol, la diseñó Francesco Sabatini en 1760, y está hecha para una sola cosa: que el que subía se sintiera chico.\n\nEso no es una metáfora. En un palacio del siglo dieciocho la escalera era el primer acto de la ceremonia. El embajador que venía a ver al rey subía estos escalones despacio, mirado desde arriba, con la corte asomada. Para cuando llegaba al primer piso ya se había hecho una idea bastante clara de su lugar en el mundo.\n\nFijate en los dos leones de mármol al pie y en la anchura de los escalones: son bajos y muy profundos, para obligarte a subir lento. No podés apurar esta escalera aunque quieras. Probá.\n\nEn el techo hay un fresco enorme de Corrado Giaquinto, un pintor napolitano al que Fernando VI trajo a Madrid para que dirigiera la decoración del palacio. Representa a la Religión y la Iglesia triunfando, con España al lado. El mensaje también es sencillo: quien reina acá reina con permiso del cielo.\n\nArriba entrás al Salón de Alabarderos, que era el cuarto de guardia. Los alabarderos eran la guardia personal del rey, y se llaman así por el arma que llevaban: la alabarda, un palo largo con un hacha y una punta en el extremo. Eran los que estaban parados acá cuando alguien quería pasar.\n\nEs un cuarto de espera con un techo de Giambattista Tiepolo, el pintor veneciano más caro de Europa en ese momento. Pintó a Venus pidiéndole a Vulcano, el dios herrero, que le fabrique unas armas a su hijo Eneas. O sea: hasta la sala de la guardia tiene una escena mitológica sobre fabricar armas. Nada acá es casual, todo el palacio está pensado como un discurso.\n\nY del salón de la guardia pasás al Salón de Columnas, que es el más grande de este tramo. Se usó durante más de un siglo para los bailes y los banquetes de la corte.\n\nPero lo que hace especial a esta sala es lo que pasó adentro hace poco, y es casi toda la historia de la España moderna en una sola habitación.\n\nAcá se veló el cuerpo de Franco en 1975, después de cuarenta años de dictadura. Acá, diez años después, el 12 de junio de 1985, España firmó el acta de entrada a la Comunidad Europea, que es el acto con el que el país volvió a Europa. Acá se hizo en 1991 la Conferencia de Paz de Madrid, el primer intento serio de sentar en la misma mesa a israelíes y palestinos. Y acá, en 2014, el rey Juan Carlos firmó su abdicación para dejarle el trono a su hijo.\n\nCuatro momentos, cuatro Españas distintas, la misma alfombra.\n\nAhora seguí, que la sala que viene es la principal.",

   "autor": "Giambattista Tiepolo",
   "fecha": "1772",
   "guion": "Entrás y es rojo entero. Terciopelo carmesí en todas las paredes, bordado con hilo de plata, espejos gigantes enfrentados, bronces dorados y un techo que parece que se abrió. Esta es la sala más importante del palacio y la única que sigue usándose exactamente para lo mismo que el día que se hizo.\n\nEmpecemos por abajo y terminemos por arriba, que es donde está lo bueno.\n\nEl terciopelo vino de Génova, en Italia, y se hizo a medida para estas paredes. Los espejos son de la Real Fábrica de La Granja, que Felipe V fundó justamente porque los espejos grandes los monopolizaban los venecianos y salían una fortuna. Están puestos enfrentados a propósito: multiplican la sala y multiplican las velas.\n\nEl trono está sobre una tarima, bajo un dosel, con cuatro leones de bronce dorado custodiándolo. Los leones son el símbolo del reino de León y aparecen en el escudo de España; los vas a ver repetidos por todo el palacio.\n\nY ahora acostate mentalmente en el piso y mirá el techo, que es la joya de todo el edificio.\n\nLo pintó Giambattista Tiepolo en 1772. Tiepolo era veneciano y era, sin discusión, el mejor pintor de techos de Europa. Tenía setenta y dos años cuando Carlos III lo trajo a Madrid, vino con dos de sus hijos, pintó este techo y se murió acá sin volver a Venecia.\n\nEl tema es \"la grandeza y el poder de la monarquía española\". Fijate cómo está resuelto, porque es un truco de composición formidable: el centro del techo está casi vacío, es puro cielo y luz, y todas las figuras están apretadas contra los bordes, como si se asomaran por una baranda. Eso hace que el techo parezca mucho más alto de lo que es. Te están mostrando un agujero al cielo.\n\nEn esos bordes están representados los territorios de la monarquía española, y ahí aparece América. Buscá las figuras con plumas, los animales exóticos y el oro. Vale la pena mirarlas un rato: es cómo se veía a sí mismo el imperio en 1772, contado por un italiano para que lo mirara un rey desde un trono.\n\nY acá va lo que hace distinto a este cuarto de cualquier otro que vayas a ver hoy: no es un museo. Esta sala está en uso. Cuando un embajador nuevo llega a España, presenta sus credenciales al rey acá, de pie, en este piso. Se sigue haciendo varias veces al año.\n\nO sea que el techo que estás mirando lo miran los embajadores mientras esperan, igual que vos ahora.",

   "autor": "Mattia Gasparini",
   "fecha": "década de 1760",
   "guion": "Si hay una sala de este palacio que no vas a ver en ningún otro lado del mundo, es esta. Y la mayoría de la gente la cruza en treinta segundos porque viene aturdida del Salón del Trono.\n\nPará acá. Es chica y hay que mirarla despacio.\n\nLo primero: no hay una sola superficie plana. Las paredes están cubiertas de seda bordada a mano con hilos de colores y de plata, las molduras son de estuco —que es yeso modelado— y todo se retuerce en hojas, ramas, flores y figuras que salen del muro hacia adentro del cuarto. El techo sigue el mismo dibujo. Y el piso, que es de mármoles de colores encastrados, repite exactamente el diseño del techo, en espejo.\n\nLevantá la vista, bajala al piso, y vas a ver el mismo dibujo dos veces. Eso es lo que hay que mirar acá.\n\nLo hizo Mattia Gasparini, un italiano que dirigió la decoración del palacio para Carlos III, y por eso la sala lleva su nombre. Se hizo en los años sesenta del siglo dieciocho.\n\nEl estilo tiene nombre y conviene tenerlo: es rococó. Después del barroco, que era grandilocuente y dramático, vino el rococó, que agarró esas mismas curvas y las volvió livianas, chiquitas, caprichosas y llenas de detalle. Y arriba de eso Gasparini le metió chinoiserie, que era la moda europea de imitar lo chino: palmeras, pagodas, monos, pájaros exóticos. Europa estaba fascinada con Asia y la copiaba sin haber ido nunca.\n\nBuscá los monos y los pájaros entre el follaje de las paredes. Están, y son el detalle que más gente se pierde.\n\nAhora, para qué servía este cuarto, que es la mejor parte.\n\nEra el vestidor del rey. Acá Carlos III se vestía.\n\nY no se vestía solo. En la corte española, como en la francesa, vestir al rey era una ceremonia pública con público: un grupo de nobles entraba, se ordenaba por rango y cada uno tenía derecho a alcanzarle una prenda concreta. Acercarle la camisa al rey era un privilegio por el que se peleaba en serio. El que se la alcanzaba era, ese día, más importante que el que le alcanzaba las medias.\n\nO sea que toda esta explosión de seda y estuco es el decorado de un hombre poniéndose la ropa delante de veinte personas que se disputaban el honor de mirarlo.",

   "autor": "Real Fábrica del Buen Retiro",
   "fecha": "1760s y 1879",
   "guion": "Dos salas seguidas y muy distintas entre sí. Una es un capricho del siglo dieciocho y la otra es una sala de trabajo que se sigue usando.\n\nLa primera es el Salón de Porcelana, y es exactamente lo que dice el nombre: un cuarto con las paredes y el techo cubiertos enteros de placas de porcelana. Verde, blanco y dorado, con relieves de figuras, guirnaldas y chinerías que sobresalen varios centímetros del muro.\n\nAcercate y fijate en las juntas entre placa y placa. Son más de doscientas piezas y están encastradas de manera que la unión casi no se ve: el cuarto parece hecho de una sola pieza. Ese era el punto.\n\nLa porcelana salió de la Real Fábrica del Buen Retiro, que Carlos III fundó en Madrid, dentro de los jardines del Retiro por donde vas a andar mañana a la mañana. Carlos III era fanático de la porcelana: antes de ser rey de España había sido rey de Nápoles y allá había fundado otra fábrica, y cuando se vino a Madrid se trajo a los operarios y hasta las fórmulas.\n\nPor qué tanto lío con la porcelana. En el siglo dieciocho Europa llevaba doscientos años tratando de copiar la porcelana china y no podía: no sabían la receta. El que la descubriera tenía una mina de oro. Cuando finalmente se logró, cada corte quiso su fábrica propia, y tener una sala entera forrada en porcelana era la forma más cara posible de decir que la tuya funcionaba.\n\nLa fábrica del Buen Retiro duró poco: la destruyeron en la guerra contra Napoleón. Así que lo que estás mirando es de las pocas cosas que quedan de ella.\n\nDe ahí pasás al Comedor de Gala, y el cambio de tono es fuerte.\n\nEs una sala larguísima con una mesa para ciento cuarenta y cuatro personas. No es del siglo dieciocho: se armó en 1879, tirando abajo los tabiques de varias habitaciones, para el casamiento de Alfonso XII. O sea que es cien años más nuevo que casi todo lo demás.\n\nMirá tres cosas. Los tapices de las paredes, que son de los siglos dieciséis y diecisiete. Las quince arañas de cristal colgando en fila, que de noche encendidas deben ser una cosa seria. Y la vajilla puesta en la mesa, si está: cada plato, copa y cubierto tiene su lugar medido.\n\nEsta sala también se sigue usando. Las cenas de Estado —cuando España recibe a un jefe de gobierno extranjero— se hacen acá, con la mesa completa. Es probablemente la mesa formal más grande que vas a ver en tu vida.",

ue vas a pasar hoy mismo a la tarde.\n\nY la tercera es la comparación. Acá Velázquez Bosco resolvió el problema con muros de ladrillo y techo de vidrio. En el Palacio de Cristal, dos años más tarde, se animó a hacerlo todo de vidrio, paredes incluidas. Caminás cien metros y ves a un mismo arquitecto dando un paso más.\n\nHoy es sala de exposiciones del Museo Reina Sofía, se entra gratis y casi siempre está vacío. Puede haber adentro algo que te guste o algo que no entiendas nada. No importa: entrá igual, aunque sea cinco minutos, porque el espacio vacío ya vale.",

      id: "mad2-02", tipo: "parada", orden: 4, sala: "Palacio de Cristal",
      titulo: "El Palacio de Cristal", autor: "Ricardo Velázquez Bosco", fecha: "1887",
      guion: "Un edificio hecho enteramente de hierro y vidrio, parado en medio de un parque, reflejándose en un estanque con patos. Es la foto más linda de Madrid y casi nadie sabe para qué se construyó.\n\nSe hizo en 1887 para una exposición sobre las Filipinas. Filipinas era colonia española desde el siglo dieciséis y lo siguió siendo hasta 1898, cuando España la perdió junto con Cuba y Puerto Rico en una guerra contra Estados Unidos. En 1887 todavía era española, y se montó una gran muestra para exhibir plantas, animales y —esto es lo incómodo— también personas traídas de allá, que vivieron acá durante meses expuestas al público. Era una práctica común en la Europa de la época y hoy se lee como lo que era.\n\nEl edificio se pensó como un invernadero: por eso todo vidrio, para que las plantas tropicales sobrevivieran al invierno madrileño. Lo diseñó Ricardo Velázquez Bosco inspirándose en el Crystal Palace de Londres, un edificio gigantesco de hierro y vidrio que los ingleses habían levantado en 1851 y que dejó a media Europa queriendo uno parecido.\n\nMirá la estructura. Hierro fundido y vidrio, con una cúpula central y planta de cruz. En el siglo diecinueve esto era tecnología de punta: recién ahí se había aprendido a producir hierro barato y en cantidad, y de golpe se podían hacer edificios que antes eran imposibles, con muy poco muro y muchísima luz. Es la misma revolución que dio las grandes estaciones de tren, y de hecho el mismo día 4 vas a ver una, la de Delicias.\n\nHoy funciona como sala de exposiciones del Museo Reina Sofía, es gratis, y suele haber una sola obra contemporánea adentro. Puede tocarte algo que te guste o algo que te parezca una tomada de pelo. No importa mucho: el edificio vacío, con la luz entrando de todos lados, ya vale la entrada que no pagás.",
      mirar: [
        "La cúpula central y la estructura de hierro fundido.",
        "El reflejo en el estanque, que es la foto.",
        "Se construyó como invernadero para plantas de Filipinas."
      ]
    },
    {
      id: "mad2-09", tipo: "parada", orden: 5, sala: "La Rosaleda",
      titulo: "La Rosaleda", autor: "Cecilio Rodríguez", fecha: "1915",
      guion: "Bajando del Palacio de Cristal hacia el Ángel Caído tenés un jardín ovalado, hundido respecto del paseo, con pérgolas y una fuente en el medio. Son diez minutos y arranco por la parte honesta, porque si no te vas a decepcionar.\n\nLas rosas de acá florecen en mayo y junio. Vos estás en octubre. Vas a encontrar un jardín impecablemente cuidado y bastante poco florecido, con suerte alguna floración tardía suelta.\n\nAun así entrá, y te digo por qué: lo que hay que mirar acá no son las flores, es el diseño. Está pensado como una habitación al aire libre. Se baja un escalón y el ruido del parque se corta; el óvalo te encierra, las pérgolas hacen de paredes y la fuente del medio es el centro exacto de la figura. Eso funciona con rosas y sin rosas.\n\nLa historia es corta y tiene un viaje. En 1915 el alcalde de Madrid le encargó una rosaleda al jardinero mayor de la ciudad, Cecilio Rodríguez. Rodríguez se fue a París a ver la Roseraie de Bagatelle, que está en el Bois de Boulogne y era en ese momento el jardín de rosas más célebre de Europa, y volvió a hacer el suyo. Era una moda del momento: la rosaleda como tipo de jardín público, con las variedades ordenadas y etiquetadas para que la gente las comparara, es un invento francés de fines del siglo diecinueve.\n\nDespués vino la Guerra Civil, que en Madrid duró casi tres años con la ciudad sitiada y bombardeada, y el jardín quedó destruido. Se replantó en 1941 con cuatro mil rosales. Entre 2001 y 2006 lo restauraron entero y hoy tiene unos cinco mil quinientos rosales de ciento treinta variedades distintas, altos y trepadores.\n\nSi te cruzás con algún cartelito al pie de un rosal, fijate: cada variedad tiene nombre propio y año, como un cuadro. Esa manía de etiquetar es justamente la que trajeron de Bagatelle.\n\nY si llegás a volver a Madrid en mayo, este lugar es otra cosa por completo.",
      mirar: [
        "El óvalo hundido: se baja un escalón y el ruido del parque se corta.",
        "Las pérgolas haciendo de paredes y la fuente en el centro exacto.",
        "Los carteles al pie de los rosales: cada variedad tiene nombre y año."
      ]
    },
    {
      id: "mad2-03", tipo: "parada", orden: 6, sala: "Glorieta del Ángel Caído",
      titulo: "El Ángel Caído", autor: "Ricardo Bellver", fecha: "1877, colocado en 1885",
      guion: "Estás frente a una de las poquísimas estatuas públicas del mundo dedicadas al diablo. En un parque municipal. Pagada por el Estado español, en un país católico. Ya por eso vale el desvío.\n\nLa hizo Ricardo Bellver, un escultor madrileño que estaba estudiando en Roma con una beca. Modeló el yeso en 1877 y eligió un tema arriesgado: el momento exacto en que Lucifer, que era un ángel, cae del cielo.\n\nSe basó en El paraíso perdido, un poema larguísimo que el inglés John Milton escribió en 1667 y que cuenta la rebelión de los ángeles contra Dios y la expulsión de Adán y Eva. En ese poema Lucifer no es un monstruo con cuernos: es una criatura magnífica que se rebela por orgullo y pierde. Bellver eligió pintar —esculpir— ese instante, no el resultado.\n\nY eso es lo que hay que mirar. El ángel está cayendo de espaldas, con las alas abiertas y el cuerpo torcido. Tiene la cara desencajada y la boca abierta. Y fijate abajo, alrededor de las piernas y el brazo: hay serpientes que se le están enroscando. La caída no terminó todavía; el castigo está empezando. Un cuerpo joven y hermoso que se está convirtiendo en otra cosa mientras lo mirás.\n\nLa obra se mandó a la Exposición Universal de París de 1878 —una especie de feria mundial donde cada país mostraba lo mejor que tenía— y gustó tanto que el Estado la fundió en bronce y la instaló acá en 1885.\n\nAhora, la leyenda. Se dice mucho que la estatua está a exactamente 666 metros sobre el nivel del mar, que es el número asociado al diablo en la Biblia. Te lo van a repetir mil veces. La verdad es más sosa: el observatorio meteorológico que está acá al lado mide 656,8 metros, así que la cifra es verosímil pero nadie la verificó nunca. Lo más probable es que sea una casualidad que alguien redondeó para que quedara mejor la anécdota. Cosa que, honestamente, está bien: la anécdota queda mejor.",
      mirar: [
        "Las serpientes enroscándose en las piernas y el brazo.",
        "La cara: boca abierta, cayendo de espaldas, todavía en el aire.",
        "Lo de los 666 metros es leyenda: al lado miden 656,8."
      ]

    {
      id: "mad2-04", tipo: "tramo", orden: 7, sala: "Puerta de Alcalá y Cibeles",
      titulo: "Alcalá y Cibeles, de paso", autor: "Sabatini y Ventura Rodríguez", fecha: "1778 y 1782",
      guion: "Salís del Retiro y en diez minutos pasás por las dos postales de Madrid. Como vas caminando hacia el Prado, te las cuento en el orden en que aparecen.\n\nPrimero la Puerta de Alcalá, ese arco enorme de piedra en medio de una rotonda. Lo hizo Francesco Sabatini en 1778 —el mismo de las caballerizas del palacio— por encargo del rey Carlos III.\n\nPará un segundo en Carlos III, porque es el rey que hizo Madrid. Gobernó entre 1759 y 1788 y llegó decidido a convertir un pueblo sucio en una capital europea: empedró y alumbró las calles, prohibió tirar la basura por la ventana —que era lo normal—, hizo el alcantarillado, el Jardín Botánico, el Museo del Prado y esta puerta. Los madrileños lo bautizaron el mejor alcalde de Madrid, y el apodo le quedó para siempre.\n\nLo curioso del arco es que no es un arco de triunfo. Los arcos de triunfo se construyen para celebrar una victoria militar; este es simplemente una puerta de la ciudad, de las cinco que tenía la cerca que rodeaba Madrid, y estaba ahí para controlar quién entraba y cobrar impuestos a la mercadería. Lo que pasa es que Sabatini la hizo monumental, y hoy nadie diría que es una aduana.\n\nUn detalle que casi nadie nota y es de los mejores: las dos caras del arco son distintas entre sí. Cruzá al otro lado y comparalas.\n\nSeguro te van a contar que eso pasó porque a Carlos III le gustaron dos diseños y no supo cuál elegir. Es mentira, aunque se repite en todas las visitas. Hubo cuatro proyectos y el rey eligió el definitivo sin dudar, en 1769. Lo que cambia entre una cara y la otra es la escultura: de un lado hay trofeos militares, o sea armas y armaduras talladas en piedra, y del otro hay figuras de las cuatro virtudes cardinales. Hacer distintas las dos caras de una puerta de ciudad era lo normal en la época: cada una le hablaba a un público, la de afuera al que llegaba y la de adentro al que vivía en Madrid.\n\nSeguís bajando y llegás a Cibeles. La fuente es de 1782, también de la época de Carlos III. Cibeles era la diosa romana de la tierra y la fertilidad, y va en un carro tirado por dos leones. Los leones, según el mito, son una pareja de amantes que ofendieron a los dioses y fueron convertidos en bestias como castigo. Acá festeja sus títulos el Real Madrid, así que si ves la fuente vallada es por eso.\n\nY ese palacio blanco enorme con torres que parece una catedral: no es un palacio ni una catedral. Se construyó en 1919 como oficina de correos, y era tan desproporcionadamente lujosa para lo que era que los madrileños la llamaban con sorna Nuestra Señora de las Comunicaciones. Hoy es la sede del gobierno de la ciudad.",
      mirar: [
        "Las dos caras de la Puerta de Alcalá son distintas: cruzá y compará.",
        "No es un arco de triunfo: era una aduana para cobrar impuestos.",
        "El palacio blanco de Cibeles era la oficina de correos."
      ]
    },
    {
      id: "mad2-10", tipo: "tramo", orden: 8, sala: "De Cibeles a San Jerónimo",
      titulo: "El Paseo del Prado", autor: "José de Hermosilla y Ventura Rodríguez", fecha: "1767",
      guion: "Vas bajando por lo que a primera vista es una avenida con tráfico, árboles y tres fuentes. Es, desde 2021, Patrimonio Mundial de la Unesco.\n\nAclaremos qué significa eso, porque se usa mucho y se explica poco. La Unesco es el organismo de las Naciones Unidas que se ocupa de cultura, y mantiene una lista de lugares que considera valiosos para toda la humanidad y no solo para el país que los tiene. Entrar a esa lista es difícil: hay que demostrar por qué el lugar es único en el mundo.\n\nY lo que se declaró acá no es un edificio. Es el paseo entero junto con el Retiro donde estuviste a la mañana: doscientas hectáreas, más de cien elementos entre monumentos, edificios y hasta árboles concretos. El nombre oficial es largo, pero la parte que importa es cómo termina: paisaje de las artes y las ciencias. Madrid lo publicita como el Paisaje de la Luz.\n\n¿Y qué tiene de único? Esto.\n\nA mediados del siglo dieciocho todo esto era literalmente un prado: un descampado en el borde de la ciudad, con un arroyo, adonde la gente venía a pasear porque no había otra cosa. De ahí el nombre, que en español quiere decir eso, un campo de pasto. Estaba fuera de la ciudad, era polvoriento, y de noche no iba nadie.\n\nEn 1767 Carlos III —el rey que ya te apareció en la Puerta de Alcalá, el que empedró y alumbró Madrid— le encargó al arquitecto José de Hermosilla que lo convirtiera en un paseo de verdad.\n\nHermosilla lo diseñó como un salón al aire libre. Esa es la palabra que usaban: el Salón del Prado. Le dio forma alargada con las puntas redondeadas, imitando un circo romano, lo plantó de árboles, lo niveló y lo dotó de agua. Y puso tres fuentes sobre el mismo eje, todas con dioses de la mitología: Cibeles en una punta, Neptuno en la otra y Apolo en el medio. El programa de las fuentes lo dirigió Ventura Rodríguez.\n\nHasta acá es un paseo bonito y nada más. Lo que lo vuelve distinto es lo que Carlos III mandó construir alrededor.\n\nPuso el Jardín Botánico, para clasificar las plantas que llegaban de las expediciones científicas. Puso el Observatorio Astronómico, para mirar el cielo. Y puso un edificio grande destinado a guardar y exhibir la colección de historia natural del reino: minerales, animales, fósiles.\n\nEse último edificio es el Museo del Prado.\n\nLeíste bien. El Prado se construyó para ser un museo de ciencias naturales. Lo proyectó Juan de Villanueva en 1785 con esa función. Lo que pasó es que llegó la invasión de Napoleón, la obra quedó a medio hacer y bastante arruinada —los franceses le sacaron hasta el plomo del techo—, y cuando la guerra terminó el rey Fernando VII decidió usarlo para otra cosa: colgar ahí los cuadros de la colección real, que hasta entonces estaban repartidos por los palacios y no los veía nadie. Abrió como museo de pintura en 1819 y nunca volvió atrás.\n\nO sea que el paseo entero fue pensado como un aparato para que la gente común aprendiera. La idea era muy del siglo dieciocho: si el conocimiento se pone en la calle, ordenado y gratis, la sociedad mejora sola. Caminabas por una avenida y tenías las plantas, las estrellas y los minerales de la corona, uno al lado del otro, al aire libre.\n\nEso es lo que la Unesco reconoció: fue la primera vez que una ciudad europea hizo una avenida para la ciencia y el paseo público al mismo tiempo, y el modelo se copió después en varias capitales de América Latina.\n\nY el museo de pintura más famoso de España está ahí, en el medio, por accidente.\n\nAhora seguí caminando, que en el próximo audio te voy contando lo que vas pasando.",
      mirar: [
        "El Prado se construyó para ser museo de ciencias naturales, no de pintura.",
        "Las tres fuentes están sobre un mismo eje: Cibeles, Apolo y Neptuno.",
        "Botánico, Observatorio y Prado: la ciencia del reino puesta en la calle."
      ]
    },
    {
      id: "mad2-12", tipo: "tramo", orden: 9, sala: "De Cibeles a San Jerónimo",
      titulo: "Bajando por el paseo", autor: "", fecha: "",
      guion: "Ahora lo que te va apareciendo mientras bajás, en el orden en que lo vas a ver.\n\nEl edificio enorme de la esquina de Cibeles, con rejas, cúpula y aire de fortaleza, es el Banco de España. Es el banco central del país: el que emite el dinero y guarda las reservas.\n\nDebajo, a unos treinta y cinco metros bajo la plaza que estás mirando, está la cámara acorazada donde se guarda buena parte de las reservas de oro de España. Se construyó en los años treinta, justo antes de la Guerra Civil. La puerta principal pesa dieciséis toneladas y media y detrás hay otras varias de entre nueve y catorce.\n\nY tiene un sistema que suena a película pero está documentado: si alguien entra por donde no debe, el foso de acceso se inunda por completo. El agua no viene de un tanque. Viene de dos arroyos subterráneos que pasan por ahí abajo, y uno de ellos es el que alimenta la fuente de Cibeles.\n\nO sea que esa fuente que mirás desde la vereda es, literalmente, parte del sistema de seguridad del oro del país.\n\nSeguí por el medio del paseo. Ahí aparece la fuente de Apolo, que también se conoce como la de las Cuatro Estaciones por las cuatro figuras que tiene al pie, una por estación. Es la del centro del eje de Hermosilla, la que estaba en el medio del salón, y es la que menos gente mira de las tres.\n\nA la izquierda se te abre una plaza con un obelisco de piedra: es la Plaza de la Lealtad. Ese monumento recuerda a los fusilados el 2 de mayo de 1808, el día en que Madrid se levantó contra las tropas de Napoleón.\n\nVale la pena que sepas qué pasó ese día, porque esta tarde lo vas a ver pintado. Napoleón había entrado en España con la excusa de pasar hacia Portugal y se estaba quedando con el país. El 2 de mayo el pueblo de Madrid salió a la calle con navajas y palos contra el ejército más profesional de Europa. La represión fue inmediata: esa misma noche y la madrugada siguiente fusilaron a cientos de personas en las afueras de la ciudad.\n\nSeis años después, Goya pintó los dos cuadros: la pelea del día 2 y los fusilamientos de la madrugada del 3. Están los dos en el Prado, a diez minutos de acá, y son de lo mejor que vas a ver adentro. El de los fusilamientos cambió para siempre la forma de pintar la guerra: no hay héroes, no hay gloria, hay un tipo con los brazos abiertos y una fila de soldados sin cara.\n\nEn esa misma plaza está la Bolsa de Madrid, el edificio con columnas y frontón triangular, de fines del siglo diecinueve.\n\nUn poco más abajo llegás a Neptuno, el dios del mar, con el tridente y un carro tirado por caballos con cola de pez. Detalle de fútbol, por si te lo preguntan: en Cibeles festeja el Real Madrid y acá el Atlético. Están a cuatrocientos metros y no se mezclan nunca.\n\nY sobre la mano derecha, en el número ocho, el Museo Thyssen-Bornemisza. Es el tercero del llamado triángulo del arte, junto con el Prado y el Reina Sofía.\n\nLa historia de cómo llegó es buena. La colección la juntaron un industrial alemán y después su hijo, a lo largo del siglo veinte, y terminó siendo una de las colecciones privadas de pintura más importantes que llegaron a existir: ochocientos años de arte europeo, desde los primitivos italianos hasta el pop. Varios países se pelearon por quedársela. España la trajo prestada en 1992 y al año siguiente le compró setecientas setenta y cinco obras por unos trescientos millones de euros.\n\nEstá en el Palacio de Villahermosa, un edificio de principios del siglo diecinueve que adaptó Rafael Moneo, el mismo arquitecto de la ampliación del Prado del que te voy a hablar en San Jerónimo. Hoy no entrás, pero ahora sabés qué es ese edificio.\n\nCruzá y subí por la calle de Felipe IV, que te deja en la puerta de San Jerónimo.",
      mirar: [
        "El foso del Banco de España se inunda con el agua de la fuente de Cibeles.",
        "El obelisco de la Plaza de la Lealtad: el 2 de mayo que pintó Goya.",
        "La fuente de Apolo es la del medio del eje y casi nadie la mira."
      ]
    },
    {
      id: "mad2-05", tipo: "parada", orden: 10, sala: "San Jerónimo el Real",
      titulo: "San Jerónimo el Real", autor: "Iglesia de los reyes", fecha: "siglo XVI, rehecha en el XIX",
      guion: "Es la iglesia que está justo atrás del Prado, subiendo unas escaleras. Entrás veinte minutos y es gratis, y lo que vale acá no es tanto el edificio como lo que pasó adentro.\n\nEsta fue durante siglos la iglesia de los reyes españoles. No la catedral —ya vimos que Madrid no tuvo catedral hasta 1993— sino la iglesia donde la monarquía hacía sus ceremonias. Acá se proclamaban los reyes al asumir, se casaban, se bautizaban los herederos y se hacían los funerales de Estado.\n\nLa lista es larga. Acá se casó Alfonso XII. Acá se casó Alfonso XIII en 1906, y ese día pasó lo peor que pasó nunca en una boda española: mientras el cortejo volvía de la iglesia al palacio, un anarquista llamado Mateo Morral tiró desde una ventana de la calle Mayor una bomba escondida en un ramo de flores. Murieron veinticuatro personas y hubo más de cien heridos. Los novios se salvaron. Y en noviembre de 1975, dos días después de que muriera Franco, Juan Carlos I fue proclamado rey ante el parlamento; la ceremonia religiosa que selló esa asunción se hizo acá, cinco días más tarde.\n\nEl edificio original es de principios del siglo dieciséis, de estilo gótico tardío, y formaba parte de un monasterio de la orden de los jerónimos. De ese monasterio viene todo: el barrio se llama Los Jerónimos y el Retiro se construyó pegado porque los reyes ya venían a retirarse acá.\n\nPero ojo, porque lo que ves no es del siglo dieciséis. La iglesia quedó bastante destruida —otra vez, la invasión de Napoleón, que la usó como cuartel— y en el siglo diecinueve la rehicieron casi entera imitando el gótico. Las dos torres de la fachada, que parecen lo más medieval, son del siglo diecinueve. Adentro, en cambio, la estructura sí conserva bastante de lo antiguo.\n\nY un detalle de arquitectura que vale la pena saber si te gustó el Prado: cuando se amplió el museo en 2007, el arquitecto Rafael Moneo metió el edificio nuevo dentro del claustro del monasterio, que estaba en ruinas. Lo desarmó piedra por piedra, lo restauró y lo montó adentro del edificio moderno, como una caja dentro de otra. Si estuviste en el Prado, pasaste por ahí abajo.",
      mirar: [
        "Las dos torres de la fachada son del siglo XIX, no medievales.",
        "Acá se proclamó rey Juan Carlos I en 1975, dos días después de Franco.",
        "El claustro del monasterio está adentro de la ampliación del Prado."
      ]
    },
    {
      id: "mad2-11", tipo: "tramo", orden: 11, sala: "Del Prado a la Glorieta de Carlos V",
      titulo: "Del Prado a Atocha", autor: "", fecha: "1781–2008",
      guion: "Salís del Prado con dos horas de cuadros encima y tenés diez minutos hasta el metro. Es un buen tramo para despejarse y pasás por tres cosas que valen la pena aunque no entres a ninguna.\n\nLo primero, pegado al museo, es el Real Jardín Botánico, el segundo de los tres edificios de ciencia que Carlos III puso sobre este paseo. Está acá desde 1781. Lo empezó Francesco Sabatini y lo terminó Juan de Villanueva, el mismo del Prado. Está organizado en tres terrazas que van bajando.\n\nNo era decorativo: era un laboratorio. España mandaba expediciones a América y al Pacífico que volvían con cajones de plantas desconocidas, y acá se las clasificaba, se las dibujaba y se las intentaba cultivar. Hoy sigue siendo un centro de investigación. No está en el plan de hoy, pero lo vas viendo por encima de la reja.\n\nLo segundo es la Cuesta de Moyano, la calle en subida con casetas de madera verdes a un costado: puestos de libros usados y antiguos, ahí desde 1925. Las diseñó Luis Bellido, el arquitecto municipal, el mismo del Matadero que vas a ver el domingo.\n\nSon treinta casetas como máximo, y le decían la feria del boquerón porque los libros se vendían a quince céntimos, que era lo que costaba un boquerón. Hoy no está tan regalado, pero sigue siendo el lugar de Madrid para encontrar una edición vieja por poca plata. Si te gusta el asunto son diez minutos bien gastados; si no, caminá mirando las casetas, que son de las últimas de su tipo que quedan en Europa.\n\nLo tercero es el edificio más raro del paseo: el CaixaForum. Lo vas a reconocer enseguida porque parece que estuviera flotando.\n\nEra una central eléctrica de 1900, de ladrillo, que estuvo abandonada décadas. La reformaron los arquitectos suizos Herzog y de Meuron, los mismos que convirtieron una central eléctrica de Londres en el Tate Modern. Acá hicieron dos cosas. Le sacaron el zócalo de granito de la base, así que el ladrillo queda apoyado sobre nada y parece levitar. Y encima le agregaron dos pisos de hierro oxidado, de un color que se parece al ladrillo pero se nota que es de otra época. Abrió en 2008.\n\nY al lado, sobre la pared ciega del edificio vecino, está el jardín vertical. Lo hizo el botánico francés Patrick Blanc y es una pared entera cubierta de plantas vivas: cuatrocientos sesenta metros cuadrados y unas quince mil plantas. Lo interesante es cómo funciona: no hay tierra. Las raíces viven metidas en capas de fieltro pegadas a la pared, y por arriba gotea agua con los nutrientes disueltos. Se llama hidroponía, lo mismo que se usa para cultivar tomates en invernadero. La pared y el hall del edificio son gratis.\n\nLlegás a una rotonda enorme, la Glorieta de Carlos V, y ahí termina el paseo.\n\nA la derecha tenés el Museo Reina Sofía, el tercero del triángulo del arte, donde está el Guernica de Picasso. El edificio era el hospital general de Madrid, del siglo dieciocho, y la cara actual se la dan los dos ascensores de vidrio y acero que le colgaron por fuera en los años ochenta.\n\nEnfrente está la estación de Atocha. La nave vieja, de hierro y vidrio, es de 1892, y la cubierta la calculó Alberto de Palacio: el ingeniero del Palacio de Velázquez, donde estuviste esta mañana. Adentro de esa nave, cuando dejó de recibir trenes, plantaron un jardín tropical con palmeras. Ojo con esto: está en obras desde 2025 y no sé cómo va a estar en octubre. Si ves que se puede entrar, asomate cinco minutos, que es de esos lugares que no se parecen a nada.\n\nEn los jardines de la estación hay un monumento a las víctimas del 11 de marzo de 2004, el día en que estallaron varias bombas en trenes de cercanías que venían hacia acá y murieron ciento noventa y tres personas. Es un cilindro de vidrio y se entra desde abajo, desde la estación.\n\nEl metro que tenés que tomar es la línea 1 y la estación se llama Estación del Arte. Se llamaba Atocha hasta 2019: le cambiaron el nombre por los tres museos que acabás de caminar.",
