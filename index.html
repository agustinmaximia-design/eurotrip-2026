    {
      id: "rom1-11",
      tipo: "parada",
      orden: 11,
      sala: "La Passeggiata del Gianicolo, entre los bustos",
      titulo: "Ochenta y cuatro caras",
      autor: "",
      fecha: "1849",
      guion: "Caminá por el paseo mirando los bustos de mármol alineados entre los árboles. Caras con barba, muchas con la nariz rota. Son ochenta y cuatro.\n\nToda esta colina es un monumento a una derrota, y vale la pena saber a cuál.\n\nA mediados del siglo diecinueve Italia no existía como país: era un rompecabezas de reinos y ducados, y en el medio una franja enorme que gobernaba directamente el Papa, como monarca. El movimiento para unificar todo eso se llama Risorgimento. Y el Papa era, físicamente, el obstáculo en el mapa.\n\nEn noviembre de mil ochocientos cuarenta y ocho estalla la revolución en Roma y el papa Pío nono se escapa de la ciudad disfrazado. En febrero del cuarenta y nueve se proclama la República Romana: un estado laico, con sufragio universal masculino, que abolió la pena de muerte y la censura. La figura central es Mazzini.\n\nDuró cinco meses.\n\nEn abril, Francia, que era una república también, manda un ejército a restaurar al Papa. Llegan diez mil hombres. El treinta de abril atacan acá arriba, contra la Porta San Pancrazio, que está al sur, y Garibaldi los rechaza. Victoria completa; los franceses no lo podían creer.\n\nEntonces negocian, ganan tiempo y vuelven con treinta mil hombres y artillería pesada. Del otro lado hay unos siete mil defensores, casi todos voluntarios llegados de toda Italia, muchos estudiantes, muchos de veintipico. La noche del dos al tres de junio los franceses toman la Villa Corsini, que está acá nomás, y desde ahí bombardean esta colina un mes entero.\n\nEl primero de julio hay tregua. El dos, Garibaldi se retira de Roma con unos cuatro mil hombres. El tres entran los franceses y vuelve el Papa.\n\nLo que Garibaldi les dijo a sus hombres antes de irse es lo más famoso del episodio: no les ofreció ni paga, ni cuarteles, ni comida. Les ofreció hambre, sed, marchas forzadas, combates y muerte. Y que el que quisiera la patria, lo siguiera. Cuatro mil lo siguieron.\n\nLos bustos son de esa gente y de los que vinieron después. Un aviso, porque es un error frecuente: no son todos caídos del cuarenta y nueve. Son garibaldinos y patriotas del Risorgimento en general, de mil ochocientos cuarenta y ocho, de las campañas del cincuenta y nueve al sesenta y seis, y extranjeros que se sumaron a la causa italiana.\n\nLa serie la decretó la propia República en el cuarenta y nueve: mandó hacer bustos de mármol de sus héroes y alcanzaron a hacerse unos cincuenta y dos. Cuando Pío nono volvió, en el cincuenta y uno, los mandó colocar pero sacó a varios porque eran ateos. Los que ves hoy se instalaron sobre todo entre mil ochocientos ochenta y cinco y ochenta y ocho, ya con Italia unificada y con el paseo recién construido, y se siguieron agregando durante el siglo veinte.\n\nBuscá tres. Goffredo Mameli, que escribió la letra del himno nacional italiano y murió en julio del cuarenta y nueve por la infección de una herida recibida defendiendo esta colina, con poco más de veinte años. Colomba Antonietti, que se vistió de soldado para pelear al lado de su marido y murió por una bala de cañón en junio. Y Ugo Bassi, el cura capellán de Garibaldi, al que fusilaron.\n\nLas narices rotas son vandalismo crónico de décadas, no daño de guerra. Hubo una restauración general en dos mil diez y once, para los ciento cincuenta años de la unificación.\n\nSon ochenta y cuatro caras y casi ninguna es famosa. Es un cementerio simbólico de gente que perdió una guerra en cinco meses y que veinte años después se convirtió en la mitología fundacional de un país.\n\nPorque eso es lo que pasó. La República perdió, pero veintiún años más tarde, el veinte de septiembre de mil ochocientos setenta, el ejército italiano abrió una brecha en la muralla de Roma y terminó el poder temporal del Papa. Y a partir de ahí la Italia unificada convirtió a estos perdedores en sus santos fundadores.",
      mirar: [
        "Son 84 bustos. No son todos caídos de 1849: es el Risorgimento entero.",
        "Buscá a Goffredo Mameli, que escribió la letra del himno italiano.",
        "Y a Colomba Antonietti, que se vistió de soldado para pelear con su marido.",
        "Las narices rotas son vandalismo de décadas, no daño de guerra."

    {
      id: "rom1-12",
      tipo: "parada",
      orden: 12,
      sala: "Monumento a Garibaldi y monumento a Anita",
      titulo: "El caballo, la tumba y el cañón",
      autor: "Emilio Gallori y Mario Rutelli",
      fecha: "1895 y 1932",
      guion: "Ahora el caballo.\n\nEl monumento ecuestre es de Emilio Gallori y lo inauguraron el veinte de septiembre de mil ochocientos noventa y cinco: exactamente el vigésimo quinto aniversario del día en que el ejército italiano entró en Roma y le terminó el poder temporal al Papa. La fecha no es casual. Es un acto político.\n\nMirá los cuatro grupos de bronce de las esquinas de la base. En los lados largos están Europa y América. América está ahí porque Garibaldi peleó en Sudamérica antes que en Italia. En los lados cortos, la defensa de Roma en mil ochocientos cuarenta y nueve y la batalla de Calatafimi.\n\nEn mil novecientos siete, la masonería italiana, con Ettore Ferrari a la cabeza, puso en los escalones una corona con el lema garibaldino «O Roma o morte». Anotate ese nombre, Ettore Ferrari, porque esta noche te lo vas a volver a encontrar en una plaza del centro. Es el mismo proyecto político.\n\nY dicen los romanos que Garibaldi mira fijo al Vaticano, a propósito. Es la leyenda más repetida de la colina y no aparece en ninguna de las fuentes oficiales. Contala como lo que es: dicen los romanos.\n\nUnos metros más allá está Anita, que es otra historia y bastante más incómoda.\n\nAnita Garibaldi era brasileña y guerrillera ella misma. Estaba embarazada y acompañó a Garibaldi en la retirada de Roma. Murió durante la fuga, cerca de Rávena, en agosto de mil ochocientos cuarenta y nueve.\n\nLa estatua la muestra a caballo encabritado, con una pistola en la mano derecha y su bebé Menotti en el brazo izquierdo. Ojo con la escena, porque induce al error: no es de mil ochocientos cuarenta y nueve. Es de Brasil, de la Guerra de los Farrapos.\n\nDos cosas más, y son las que importan. Primera: es una tumba de verdad. Los restos de Anita los exhumaron de su tumba en Niza y los trajeron a Roma en un tren especial el dos de junio de mil novecientos treinta y dos, dos días antes de la inauguración, y están enterrados en la base del monumento. Estás parado al lado de una tumba.\n\nSegunda: este monumento es una operación del fascismo. Mussolini aprobó personalmente el diseño, aportó setecientas cincuenta mil liras y dio el discurso inaugural. Y según la documentación, fue él quien decidió agregarle el bebé en brazos.\n\nFijate en el bebé: esa no fue idea del escultor. La estatua es de mil novecientos treinta y dos, y al régimen le interesaba mucho que las heroínas italianas fueran, antes que nada, madres. Anita peleaba a caballo con un arma; se la muestra peleando a caballo con un arma y un bebé.\n\nY ahora el cañón, que está en la terraza de abajo del Piazzale Garibaldi, apuntando a la ciudad. Es el que escuchaste al mediodía mientras almorzabas en Trastevere.\n\nLo ordenó el papa Pío nono, el mismo que se escapó de Roma un año después. El primer disparo fue el primero de diciembre de mil ochocientos cuarenta y siete. ¿Para qué? Porque las campanas de las iglesias de Roma tocaban el mediodía cada una a su hora, y era un quilombo: no había hora oficial en la ciudad. El cañonazo dio una sola señal para que todas arrancaran juntas.\n\nLo que había antes es buenísimo: en la iglesia de Sant'Ignazio izaban en un mástil una canasta con una bola negra adentro, y la dejaban caer a las doce. Una señal visual, que funcionaba si estabas mirando. El cañón la reemplazó porque se oye igual si no mirás.\n\nEstuvo en Castel Sant'Angelo hasta mil novecientos tres y está acá desde enero de mil novecientos cuatro. Durante la Segunda Guerra lo callaron por seguridad y lo reemplazaron por sirenas antiaéreas. Volvió en mil novecientos cincuenta y nueve, el día del cumpleaños número dos mil setecientos doce de Roma, por la campaña de un conductor de televisión.\n\nHoy es un obús de la Segunda Guerra, en servicio desde mil novecientos noventa y uno, que dispara una dotación de cinco artilleros con aproximadamente un kilo de pólvora. De fogueo.",
      mirar: [
        "Los cuatro grupos de bronce de la base: Europa, América y dos batallas.",
        "El monumento se inauguró el 20/9/1895, 25° aniversario de la toma de Roma.",
        "Anita: el bebé en brazos lo decidió Mussolini. Y sus restos están en la base.",
        "El cañón, en la terraza de abajo: el del mediodía. Obús de la Segunda Guerra."
      ]

    {
      id: "rom1-13",
      tipo: "parada",
      orden: 13,
      sala: "Faro del Gianicolo",
      titulo: "El monumento más argentino de Roma",
      autor: "Manfredo Manfredi",
      fecha: "1911",
      guion: "Unos metros al norte del Piazzale Garibaldi hay un faro.\n\nUn faro. De verdad, con linterna arriba, veinte metros de alto, en el medio de Roma, a treinta kilómetros del mar más cercano. No ilumina ningún puerto ni orienta a ningún barco. Está ahí, mirando la ciudad.\n\nY lo pagaron ustedes. O más precisamente: lo pagaron los italianos que se habían ido a Buenos Aires.\n\nEn mil novecientos once se cumplían cincuenta años de la unificación de Italia. Un comité con sede en Buenos Aires juntó plata entre la colectividad y se lo regaló a Roma. El arquitecto fue Manfredo Manfredi. La inauguración oficial se demoró hasta mil novecientos veinte por la Primera Guerra.\n\nLa linterna original tenía tres sectores de vidrio que proyectaban verde, blanco y rojo. La bandera italiana, encendida y girando sobre Roma, pagada desde la Argentina por gente que se había tenido que ir de Italia porque no había trabajo. Hoy se enciende solo en ocasiones especiales, por problemas de mantenimiento.\n\nPensalo un segundo, porque es una de esas cosas que se queda. A fines del siglo diecinueve y principios del veinte, millones de italianos se subieron a un barco en Génova o en Nápoles y cruzaron el Atlántico. Muchos de ellos son los bisabuelos de medio Buenos Aires. Probablemente alguno sea tuyo.\n\nY esa gente, que se había ido porque acá no podía comer, cincuenta años después juntó plata desde el otro lado del mundo para regalarle a la ciudad que los expulsó un faro que no le sirve para nada, salvo para que se vea desde lejos que Italia existe.\n\nEs probablemente el monumento más argentino de Roma. Y casi ningún romano sabe de dónde salió.\n\nDesde acá, además, o caminando un poco más al norte, es donde se te empieza a abrir la vista hacia el Vaticano: la cúpula de San Pedro que no veías desde la balaustrada de Garibaldi. Buscá el claro entre los árboles.\n\nY después bajá tranquilo. Te esperan la consigna, una ducha, y a las cinco un free tour que arranca en la Plaza de España.",
      mirar: [
        "Un faro de 20 m a 30 km del mar. Donado desde Buenos Aires en 1911.",

    {
      id: "rom1-14",
      tipo: "parada",
      orden: 14,
      sala: "Campo de' Fiori, junto a la estatua",
      titulo: "Giordano Bruno",
      autor: "",
      fecha: "quemado el 17 de febrero de 1600",
      guion: "Saliste de Piazza Navona, caminaste cinco minutos y caíste en una plaza rectangular llena de bares. En el centro exacto hay una estatua de bronce oscuro, casi negra.\n\nAcercate. Es una figura encapuchada, de pie, con hábito de fraile, la cabeza baja y los brazos cruzados sobre un libro cerrado. No hay gesto heroico, no hay espada, no hay caballo: está mirando el piso. Rodeala y mirale la cara de frente desde abajo. La expresión es de rabia contenida.\n\nSe llamaba Giordano Bruno y lo quemaron vivo acá, en este lugar exacto, el diecisiete de febrero de mil seiscientos.\n\nLa historia, corta. Nació Filippo Bruno, en Nola, cerca de Nápoles, en mil quinientos cuarenta y ocho. A los diecisiete entró de dominico: la orden que manejaba la Inquisición. A los pocos años lo empezaron a investigar por ideas raras, y en mil quinientos setenta y seis se escapó de la orden y quedó excomulgado y prófugo.\n\nPasó catorce años dando vueltas por Europa. Daba clases, publicaba libros, se peleaba con todo el mundo y se iba a otra ciudad. En mil quinientos noventa y uno volvió a Venecia, invitado por un noble que quería que le enseñara el arte de la memoria. Se pelearon, y el noble lo denunció a la Inquisición. Venecia lo entregó a Roma y el juicio duró siete años.\n\nEl catorce de enero de mil quinientos noventa y nueve el Santo Oficio aprueba una lista de ocho proposiciones heréticas. El veintiuno de diciembre Bruno se niega a retractarse: dice que no necesita ni quiere retractarse, porque no tiene de qué. El veinte de enero de mil seiscientos el papa Clemente octavo lo entrega al brazo secular como hereje impenitente, pertinaz y obstinado. Un mes después lo queman acá.\n\nAhora las dos correcciones, que es donde esto se pone bueno.\n\nPrimera: Bruno no era científico. Sostenía cosas enormes, eso sí. Que el universo es infinito, no una esfera cerrada con la Tierra o el Sol en el medio. Que hay infinitos sistemas solares, con infinitos mundos, muchos habitados. Que el universo es eterno y no fue creado en un momento. Que está vivo y animado, que tiene un alma universal y que hasta las piedras tienen un resto de vida. Y que Dios y el universo no son dos cosas separadas sino una sola sustancia.\n\nPero no hizo un solo experimento. No hizo una sola observación con instrumentos. No usó matemática. Llegó al universo infinito por razonamiento teológico: un Dios infinito tiene que producir un efecto infinito. Y su fuente de autoridad no era Aristóteles ni la observación: era Hermes Trismegisto, unos textos que él creía egipcios y más sabios que toda la filosofía griega. Eso se llama hermetismo y es esoterismo, no física. Que después haya resultado que tenía razón sobre las estrellas es, en buena medida, coincidencia.\n\nSegunda corrección, y más importante: no lo quemaron por copernicano. La condena fue teológica. Sobre la Trinidad, sobre la naturaleza de Cristo, sobre la trascendencia divina, sobre la eternidad del universo. Su cosmología era radical, pero el juicio giró alrededor de proposiciones metafísicas.\n\nY acá va el matiz más honesto de todos: la lista de las ocho proposiciones está perdida. No sobrevivió. Nadie sabe con certeza absoluta qué ocho cosas exactas le imputaron. Los historiadores lo reconstruyen de las actas parciales, y la conclusión es que lo teológico dominaba y lo cosmológico era, a lo sumo, secundario.\n\nEntonces, ¿el «mártir de la ciencia» es mentira? Es un recorte del siglo diecinueve, y ya vas a ver por qué justo del diecinueve. Bruno fue quemado vivo por no retractarse de sus ideas: eso es cierto, es monstruoso y no hace falta inventarle nada más. Lo que es falso es que haya muerto defendiendo un descubrimiento científico. A los cincuenta y un años, después de siete años preso, le dijeron «retractate» y contestó que no tenía de qué. Es un mártir del pensamiento libre, no de la astronomía.",
      mirar: [
        "La estatua: encapuchada, cabeza baja, brazos cruzados sobre un libro cerrado.",
        "Rodeala y mirale la cara desde abajo: la expresión es de rabia contenida.",
        "Está en el lugar exacto donde lo quemaron, el 17 de febrero de 1600.",
        "No era científico y no lo quemaron por copernicano. La lista de cargos se perdió."
      ]

    {
      id: "rom1-15",
      tipo: "parada",
      orden: 15,
      sala: "Campo de' Fiori, el pedestal y la plaza",
      titulo: "La estatua como provocación",
      autor: "Ettore Ferrari",
      fecha: "1889",
      guion: "Ahora la estatua en sí, que es otro capítulo entero y no tiene nada de homenaje académico. Es una provocación deliberada.\n\nFijate para dónde mira. Mira al Vaticano.\n\nEl contexto: cuando se inauguró, Roma había dejado de ser del Papa hacía apenas diecinueve años. El nuevo Estado laico y el Vaticano estaban en guerra fría abierta, el Papa se declaraba «prisionero en el Vaticano» y no reconocía a Italia. En ese clima, la campaña la arrancaron estudiantes de la Universidad de Roma por suscripción popular, y la empujó fuerte la masonería italiana.\n\nEl escultor fue Ettore Ferrari, que después llegó a Gran Maestre del Gran Oriente de Italia. Y es el mismo hombre que en mil novecientos siete puso la corona «O Roma o morte» en el monumento a Garibaldi del Gianicolo, donde estuviste esta tarde.\n\nMismo hombre, mismo proyecto político, dos monumentos en un día. Si te quedó la idea de que lo del Gianicolo era historia militar y esto es historia de las ideas, no: es la misma operación, la misma gente, veinte años después.\n\nLa inauguraron el nueve de junio de mil ochocientos ochenta y nueve, en el lugar exacto de la hoguera y mirando al Vaticano.\n\nLeé la inscripción del frente del pedestal. Dice: «A Bruno. El siglo que él adivinó. Aquí donde ardió la hoguera».\n\nFijate en quién habla. No dice «Roma le dedica esto». El sujeto de la frase es el siglo diecinueve, diciéndole a Bruno «vos nos anticipaste, y te lo ponemos donde te quemaron». Por eso el mártir de la ciencia es una construcción de ese siglo: está firmada acá, en la piedra.\n\nY mirá los ocho medallones de bronce del pedestal: son ocho perfiles de otros perseguidos por la Iglesia. Campanella, Miguel Servet, John Wycliffe y Jan Hus, entre otros. Un catálogo de mártires del disenso, para que el mensaje no dependiera de que supieras quién era Bruno. Y dentro de uno de los medallones escondieron un pequeño retrato de Martín Lutero.\n\nEl papa León trece condenó el monumento en una encíclica de mil ochocientos noventa, llamándolo «esa obra eminentemente sectaria», destinada a insultar al Papado.\n\nY sigue pasando: cada diecisiete de febrero se juntan acá librepensadores, masones y ateos, y el intendente de Roma deja una corona al pie.\n\nUna última cosa, y es de la plaza, no de la estatua. Date vuelta trescientos sesenta grados y mirá los edificios.\n\nNo hay ninguna iglesia.\n\nEn Roma eso es casi imposible: las plazas romanas nacen delante de una iglesia, como su patio. Primero la iglesia, después el espacio. Esta nació al revés. Hasta el siglo quince era un prado sin construir, y de ahí el nombre: campo de flores. La empedró el papa Calixto tercero en mil cuatrocientos cincuenta y seis, y a partir de ahí creció como espacio comercial: mercado, posadas, talleres. Nunca hubo una parroquia que la organizara, porque las parroquias ya estaban alrededor: hay una iglesia a treinta metros, metida adentro del palacio del lado norte, pero mirando para otro lado.\n\nY hay una segunda capa: esta era plaza de ejecuciones. No es donde uno pone el altar mayor.\n\nOjo con esto, que te lo doy como lo que es: que no haya iglesia es verificable, te paras y lo ves. La explicación de por qué no hay ninguna es una reconstrucción razonable, no un documento. Nadie dejó escrito el motivo, y la frase de que es «la única plaza de Roma sin iglesia» es un lugar común de guía sin respaldo.\n\nBruno no fue el único: acá se ejecutó gente durante siglos. Y el nueve de septiembre de mil quinientos cincuenta y tres, que era Rosh Hashaná, quemaron acá ejemplares del Talmud. La elección de la fecha fue deliberada.\n\nY el mercado de frutas y verduras que la gente asocia con esta plaza está desde mil ochocientos sesenta y nueve; antes funcionaba acá un mercado de caballos. A las dos de la tarde levantan todo y la plaza cambia de función: de mercado a bar. Eso es lo que estás viendo ahora.",
      mirar: [
        "Para dónde mira la estatua: al Vaticano. Y está donde estuvo la hoguera.",
        "La inscripción: el que habla es el siglo XIX, no Roma.",
        "Los ocho medallones: otros perseguidos por la Iglesia. En uno esconden a Lutero.",
        "Ettore Ferrari es el mismo de la corona del monumento a Garibaldi del Gianicolo.",
        "Date vuelta 360°: no hay ni una iglesia en toda la plaza."

    {
      id: "rom1-16",
      tipo: "parada",
      orden: 16,
      sala: "Largo di Torre Argentina, desde la baranda",
      titulo: "Cuatro templos con nombre de asiento de avión",
      autor: "",
      fecha: "s. IV a.C. – 101 a.C.",
      guion: "Apoyate en la baranda y mirá para abajo.\n\nEso es lo primero, antes que cualquier dato: estás mirando hacia abajo. Hay un pozo rectangular de ruinas en medio del tránsito, varios metros por debajo de la calle donde estás parado. Eso es Roma: el nivel del suelo subió durante veinte siglos y la ciudad antigua quedó en el subsuelo de la moderna. No te doy la profundidad exacta porque no la encontré en ninguna fuente seria.\n\nSe descubrió por accidente: en mil novecientos veintiséis, demoliendo el barrio viejo para hacer obra nueva en la Roma de Mussolini, aparecieron ruinas. Se excavó hasta el veintiocho. En el veintisiete aparecieron los fragmentos de una estatua colosal.\n\nAbajo hay cuatro templos, y se llaman A, B, C y D.\n\nNo es un apodo para turistas: se llaman así en la bibliografía académica y en los carteles. Y el motivo es hermoso. Cuando los desenterraron, nadie sabía a qué dioses estaban dedicados, y el turismo oficial de Roma sigue diciendo hoy que su identificación «todavía no es completamente cierta». Así que los arqueólogos hicieron lo que hace cualquiera con cuatro cosas sin nombre: les pusieron letras, en orden de norte a sur.\n\nY las letras quedaron. Cien años después, con identificaciones probables sobre la mesa, se siguen llamando por letra, porque así entraron en los libros. Es el único sitio arqueológico de Roma cuyos monumentos se llaman como los asientos de un avión.\n\nBuscá las columnas que están de pie. Las que forman una fila curva, en círculo, son el templo B: el único redondo. Es del año ciento uno antes de Cristo y probablemente estaba dedicado a Fortuna Huiusce Diei, que quiere decir «la Fortuna de este Día». La suerte de hoy, la del día puntual. Buen nombre para un templo. De ahí salió esa estatua colosal.\n\nEl más antiguo de los cuatro es el C, de fines del siglo cuarto antes de Cristo. El D, del siglo segundo, es el más grande de todos y sigue mayormente enterrado bajo la calle que estás pisando.\n\nY acá está el gancho: estos templos son de la República, no del Imperio. Son anteriores a los emperadores, al Coliseo y a todo lo que la gente asocia con la palabra «Roma». El más viejo de estos cuatro ya estaba en pie cuando Aníbal cruzó los Alpes.\n\nBuscá también los dos ábsides de ladrillo apoyados encima del templo A: restos de una iglesia medieval que construyeron arriba. Otra capa.\n\nY ahora lo importante. Mirá al fondo del recinto, del lado opuesto a la calle principal, detrás de los templos B y C. Buscá una plataforma maciza de piedra volcánica gris oscura, sin columnas. Se llama toba.\n\nEso es lo que queda de la Curia de Pompeyo. Y ahí adentro, el quince de marzo del año cuarenta y cuatro antes de Cristo, en los Idus de marzo, un grupo de senadores acuchilló a Julio César.\n\nPor qué el Senado estaba acá y no en el Foro: la Curia Hostilia, su sede habitual, estaba en obra, y se reunía provisoriamente en una sala anexa al complejo del Teatro de Pompeyo. O sea que a César lo mataron en una sala prestada, detrás de un teatro. Y según las fuentes antiguas, al pie de una estatua de Pompeyo: su antiguo aliado, después enemigo, al que él mismo había derrotado en la guerra civil.\n\nOjo con la precisión, porque acá muchos exageran. Lo identificado es el edificio: esa base es de la Curia, y lo afirma la fuente oficial. El punto exacto del piso donde cayó César no se puede determinar, porque de la sala solo queda el cimiento. Nadie puede pararse ahí y decir «cayó en esta baldosa».\n\nAsí que la formulación correcta es esta: estás mirando el edificio donde pasó. Y está a veinte metros y cuatro escalones de donde estás parado, con los colectivos pasando por atrás.\n\nY una historia extra, con pinzas: las fuentes antiguas dicen que Augusto mandó tapiar la sala, y algunas versiones agregan que la convirtió en letrina para borrar el lugar. Muy citada, no verificada.",
      mirar: [
        "Primero el nivel: estás mirando hacia abajo. La ciudad antigua está en el subsuelo.",
        "Las columnas en fila curva: el templo B, el único redondo, del 101 a.C.",
        "Los dos ábsides de ladrillo encima de un templo: una iglesia medieval.",
        "Al fondo, detrás de B y C: una plataforma de piedra gris oscura sin columnas.",
        "Esa plataforma es la Curia de Pompeyo. Ahí mataron a César: el edificio, no la baldosa."
      ]

    {
      id: "rom1-17",
      tipo: "parada",
      orden: 17,
      sala: "Largo di Torre Argentina, los gatos",
      titulo: "Patrimonio bio-cultural",
      autor: "",
      fecha: "desde 1929",
      guion: "Antes de irte, quedate un minuto más en la baranda y mirá los gatos, que de noche se mueven entre las piedras iluminados por los reflectores del sitio.\n\nEsto no es una anécdota pintoresca ni un descuido municipal. Es una institución con casi un siglo de historia y conviene contarla en serio.\n\nLos gatos están acá desde mil novecientos veintinueve. O sea desde que se terminó la excavación: apenas quedó abierto el pozo, se metieron. Y es lógico: es un recinto de piedra que guarda el calor del día, sin perros, sin autos, con recovecos para esconderse y con ratones. Para un gato callejero de Roma, es el mejor departamento de la ciudad.\n\nDesde el veintinueve hasta mil novecientos noventa y tres los alimentó una sucesión ininterrumpida de gattare. Las gattare son las señoras que le dan de comer a los gatos callejeros de Roma, y es una figura social romana perfectamente reconocible, en algún punto entre el chiste y la institución. Sesenta y cuatro años de mujeres bajando con bolsas de comida, una detrás de la otra, sin que nadie las coordinara.\n\nLa actriz Anna Magnani les daba de comer en los años cincuenta, en los intervalos de las funciones en el Teatro Argentina, que es el teatro que tenés justo al lado. Imaginátela: la actriz más grande del cine italiano, entre dos actos, cruzando la calle con las sobras.\n\nEn mil novecientos noventa y tres, dos mujeres, Lia Dequel y Silvia Viviani, organizaron formalmente el refugio. Había unos noventa gatos. Hoy se suele hablar de alrededor de trescientos cincuenta, aunque esa cifra circula en enciclopedias y no en el sitio oficial de la asociación, así que tomala con pinzas. Funcionan con voluntarios, con programa de castración y adopción, y se financian con donaciones y padrinazgos a distancia: se puede apadrinar un gato de acá desde cualquier lado del mundo.\n\nY el remate, que es la parte que no se cree nadie: en dos mil uno, el Ayuntamiento de Roma declaró oficialmente a los gatos de la ciudad «patrimonio bio-cultural» de Roma. Por proclamación del concejo municipal. Están protegidos por ordenanza.\n\nSumá entonces lo que tenés enfrente, en un pozo de treinta metros por cuarenta en medio del tránsito. Un sitio arqueológico de la República romana, anterior a los emperadores. El edificio donde asesinaron a Julio César. Y una colonia felina protegida por ley municipal, con su refugio adentro del recinto.\n\nLas tres cosas a la vez, y ninguna cede ante la otra. No hay un cartel que diga «por favor no alimenten a los gatos, esto es un monumento»: el refugio está adentro del monumento y las dos cosas son oficiales.\n\nEso es Roma.",
      mirar: [
        "Los gatos están desde 1929, desde que se terminó la excavación.",
        "Anna Magnani les daba de comer en los 50, entre actos en el Teatro Argentina de al lado.",
        "El refugio se organizó en 1993 y está adentro del recinto arqueológico.",
        "En 2001 el Ayuntamiento los declaró patrimonio bio-cultural de Roma."

    {
      id: "rom1-18",
      tipo: "parada",
      orden: 18,
      sala: "Fontana di Trevi, desde el nivel alto de la plaza",
      titulo: "La fachada convertida en fuente",
      autor: "Pietro Bracci",
      fecha: "el acueducto, 19 a.C.",
      guion: "Ya la viste esta tarde con el guía, a las apuradas y con la plaza llena. Ahora es otra cosa. Después de las diez de la noche el perímetro pago cierra, la plaza queda libre, y vos estás llegando desde arriba.\n\nQuedate arriba un minuto antes de bajar, que es el motivo por el que esta parada existe. La plaza está en pendiente y la fuente está en el punto más bajo. Desde arriba se ve la composición completa; pegado a la baranda de abajo, se pierde.\n\nY lo primero es algo que casi nadie registra: la fuente está pegada a un edificio.\n\nNo es una fuente suelta en el medio de una plaza. Es la fachada de un palacio convertida en fuente. El edificio se llama Palazzo Poli y sigue siendo un edificio, con ventanas y con gente viviendo adentro. Mirá arriba de todo: hay ventanas de verdad. Alguien se despierta todas las mañanas con eso abajo del balcón.\n\nSegundo: la figura grande del centro no es Neptuno.\n\nEs el error más repetido de toda Roma y lo vas a escuchar decir tres veces esta noche en la plaza. Es Océano, de pie sobre un carro con forma de caracola, esculpido por Pietro Bracci. Neptuno es otro dios y no está acá.\n\nTercero, y esto es lo que hay que señalar con el dedo. Mirá los dos caballos que tiran del carro. Son hipocampos, caballos marinos, y cada uno lo conduce un tritón.\n\nUno está encabritado, revuelto, salvaje. El otro está tranquilo, dócil, con la cabeza baja.\n\nNo es un descuido del escultor: es el tema de toda la fuente. El mar bravo y el mar en calma, uno al lado del otro, tirando del mismo carro.\n\nEn los nichos laterales hay dos estatuas: la Abundancia y la Salubridad, o sea la salud. No te digo cuál va de cada lado porque no lo verifiqué, y en estas cosas prefiero no jugar. Y en la franja de arriba hay dos bajorrelieves: en uno, Agripa aprobando los planos de un acueducto; en el otro, una chica joven mostrándoles un manantial a unos soldados. Ya vas a ver por qué.\n\nPorque, otra vez, esto es la boca de un acueducto. Todas las fuentes grandes de Roma lo son, y cuando entendés eso la ciudad se reordena: no son adornos, son terminales de cañería, y son monumentales porque el agua era el logro político más grande que podía mostrar un gobierno.\n\nEsta es el final del Aqua Virgo, que construyó Agripa, el brazo derecho del emperador Augusto, e inauguró en el año diecinueve antes de Cristo para abastecer sus termas en el Campo de Marte. Mide veintidós kilómetros, casi todos subterráneos.\n\nY es el único acueducto de la Roma antigua que nunca dejó de funcionar del todo. El agua que estás mirando caer viene de ahí. Y el mismo caño alimenta además la Barcaccia, la fuente con forma de barco de la Escalinata de España donde arrancó el free tour hace cinco horas, y las fuentes de Piazza Navona donde terminó. Las tres cosas que caminaste esta tarde son bocas del mismo acueducto de hace dos mil años. No lo sabías y ya está: ahora lo sabés.\n\nLa leyenda del nombre es lo del bajorrelieve. Los soldados de Agripa andaban buscando agua, muertos de sed, y una chica joven, una virgen, les mostró un manantial a unos trece kilómetros de la ciudad. De ahí «Virgo», la virgen.\n\nCómo tomarla: no es un invento turístico moderno, es la explicación que daban los propios romanos antiguos para el nombre del acueducto. Pero es etimología, no crónica. Cuando un pueblo tiene que explicar un nombre, inventa una historia. Los romanos no eran distintos.",
      mirar: [
        "Quedate arriba antes de bajar: desde el nivel alto se ve la composición completa.",
        "La fuente es la fachada de un edificio. Mirá arriba: hay ventanas de verdad.",
        "La figura central NO es Neptuno: es Océano.",
        "Los dos caballos: uno encabritado y uno manso. El mar bravo y el mar en calma.",
        "El agua es del Aqua Virgo, del 19 a.C. El mismo caño alimenta la Barcaccia y Navona."

    {
      id: "rom1-19",
      tipo: "parada",
      orden: 19,
      sala: "Fontana di Trevi, abajo, contra la balaustrada",
      titulo: "Treinta años, tres papas y un jarrón",
      autor: "Nicola Salvi y Giuseppe Pannini",
      fecha: "1732-1762",
      guion: "Ya podés bajar. Y ahora la fuente en sí, del siglo dieciocho, que tiene una historia de obra muy romana.\n\nEn mil setecientos treinta el papa Clemente doce abre un concurso. Lo gana un florentino, Alessandro Galilei. Y los romanos se ofenden tanto de que la fuente más importante de Roma la haga un florentino que arman un escándalo, le sacan la obra y se la dan al romano Nicola Salvi.\n\nEmpieza en mil setecientos treinta y dos. En el cincuenta y uno Salvi se muere con la fuente por la mitad. La termina Giuseppe Pannini y se inaugura el veintidós de mayo de mil setecientos sesenta y dos.\n\nTreinta años de obra y tres papas. El que la encargó no la vio terminada y el que la diseñó tampoco. Mide veintiséis metros de alto por cuarenta y nueve de ancho y es la fuente barroca más grande de Roma.\n\nAhora buscá un detalle, y este te va a gustar. Del lado derecho de la fuente, hacia Via della Stamperia, arriba de la balaustrada: un jarrón grande de piedra, solo, que no parece tener nada que ver con el resto.\n\nSe lo llama «asso di coppe»: as de copas. Y sí, es literalmente el as de copas de la baraja española, que viene de la misma familia de naipes. Tiene esa forma exacta.\n\nLa historia dice así. Durante los treinta años de obra la plaza estaba llena de vecinos mirando. En la planta baja del palacio de la esquina, en la entrada de Via della Stamperia, había una barbería. El barbero se pasó años criticando la fuente y al arquitecto en voz alta, todos los días, a todo el que entraba a afeitarse.\n\nSalvi no discutió. Mandó poner ese jarrón de piedra enorme justo delante de la barbería, para que el tipo no pudiera ver la fuente nunca más.\n\nY ahora el estado de la historia. La fuente italiana especializada dice textualmente que no se conocen fuentes ciertas de esto: del barbero no hay ninguna prueba. Es leyenda.\n\nPero en la descripción que Nicola Salvi escribió de su propia obra, dice que ese jarrón lo puso «scherzosamente»: en broma.\n\nEntonces no sabemos de quién se estaba riendo, pero sabemos que se estaba riendo de alguien. Hay constancia de época, del propio arquitecto, de que el jarrón es un chiste. Falta el nombre de la víctima.\n\nY por último, la moneda. Ya que estás, tirala. El gesto es de espaldas a la fuente, con la mano derecha por encima del hombro izquierdo. La costumbre se popularizó en todo el mundo con una película de mil novecientos cincuenta y cuatro que se llamaba «Tres monedas en la fuente».\n\nPero sabé qué estás haciendo, porque es mejor de lo que parece.\n\nAcá se juntan más de un millón y medio de euros por año en monedas. En dos mil veintidós fue el récord: un millón cuatrocientos treinta y tres mil euros, unos treinta y tres mil kilos de monedas. En dos mil veintitrés, alrededor de un millón seiscientos mil.\n\nLas saca la empresa de aguas de Roma tres o más veces por semana, con supervisión policial. Y desde dos mil seis van enteras a Caritas de Roma. Un seis por ciento se va en juntarlas y clasificarlas; el resto financia cinco almacenes solidarios que asisten a unas dos mil familias, cincuenta y tres mil comidas al año en comedores sociales, programas de inserción laboral, ayuda para pagar facturas, centros de primera infancia, y una casa de día que atiende a veintiséis personas con Alzheimer.\n\nEs probablemente la superstición más útil del mundo.\n\nY con eso cerrás tu primer día en Roma. Llegaste a las diez y media de la mañana con las valijas y sin saber nada. Caminaste un barrio que se llama «del otro lado del río» y que se declaró a sí mismo el más romano de todos. Subiste la colina más alta de Roma, que no es una de las siete. Y estás terminando de noche, a las once, frente a la boca de un caño del año diecinueve antes de Cristo, tirando una moneda que mañana va a ser la comida de alguien.\n\nMañana, domingo, empieza temprano: Trevi otra vez a las nueve, pero vacía.",

      guion: "Estás bajando al Circo Massimo. La calle se llama Clivo dei Publicii, y el nombre viene de dos funcionarios plebeyos, los hermanos Publicio, que alrededor del año doscientos cuarenta antes de Cristo hicieron la primera calle por la que se podía subir al Aventino con carros. La pagaron con la plata de las multas que le cobraron a unos tipos por quedarse con terreno público. La primera calle que subió a esta colina se financió con multas a corruptos. Ojo, el trazado romano probablemente no coincide exacto con esta calle; el nombre sí.\n\nY ahora lo que tenés adelante, que parece un parque y es una de las cosas más difíciles de imaginar de Roma.\n\nEsto es un valle alargado de pasto, con un desnivel suave en los bordes. No hay casi ruinas. Y acá adentro entraban más de ciento cincuenta mil personas.\n\nEsa es la cifra que calculan los arqueólogos hoy. Los propios romanos decían doscientos cincuenta mil, y esa cifra la vas a leer en los carteles del lugar, porque la da Plinio y la repiten los paneles oficiales. La historiografía moderna la considera inflada. Quedate con las dos y elegí.\n\nPara que tenga escala: el Monumental entra ochenta y cuatro mil. Estás parado adentro de casi dos Monumentales.\n\nMedía unos seiscientos metros de largo por unos ciento treinta de ancho. Empezó con gradas de madera en época de los reyes, siguió con los cajones de largada en el trescientos veintinueve antes de Cristo, César lo hizo en mampostería, y en el año diez antes de Cristo Augusto plantó en el medio el primer obelisco egipcio que hubo en Roma.\n\nLas carreras. Cuadrigas, carros de cuatro caballos. Siete vueltas, unos cinco kilómetros, trece giros cerrados, ocho minutos por carrera. Hasta veinticuatro carreras en un día, lo que significa entre setecientos y ochocientos caballos por jornada. Doce cajones de largada que se abrían todos juntos cuando el magistrado dejaba caer un pañuelo blanco.\n\nY las hinchadas. Había cuatro facciones y se llamaban por colores: Azules, Verdes, Rojos y Blancos. En época imperial mandaban los Azules y los Verdes; los otros dos quedaron de relleno. Pero no eran clubes: eran empresas. Cada facción tenía caballos, gerentes, herreros, médicos y personal. Los caballos eran famosos y sus nombres quedaron escritos en mosaicos.\n\nEl mejor dato es este. Plinio el Joven se asombraba de que tantos miles de hombres volvieran una y otra vez a mirar lo mismo. Y hay registro de un caballero romano que soltaba palomas pintadas con los colores de su facción para avisarle el resultado a sus amigos que estaban lejos. Un servicio de resultados en vivo, en el siglo primero, con palomas.\n\nDos cosas para mirar antes de seguir.\n\nLos dos obeliscos que marcaban el eje de este pasto ya no están acá. El papa Sixto quinto los sacó en mil quinientos ochenta y siete: el de Augusto está hoy en Piazza del Popolo y el otro en San Giovanni in Laterano. Los vas a fotografiar en otro momento del viaje sin saber de dónde salieron.\n\nY la última carrera. Las cacerías se registran hasta el año quinientos veintitrés, y las últimas carreras fueron en el quinientos cuarenta y nueve, organizadas por Totila, el rey ostrogodo que había tomado Roma. Mil doscientos años de carreras, y el que las cierra no es romano.",
      mirar: [
        "El pasto no es plano: el talud de los bordes es lo que queda de las gradas.",
        "La franja levemente elevada del medio es la traza de la spina, con sus obeliscos.",
        "En el extremo curvo, la Torre della Moletta: medieval, mil años posterior al circo.",
        "La ladera del Palatino: esos arcos son los palacios. El emperador miraba de arriba."
      ]

      id: "rom2-07",

      sala: "La Bocca della Verità, en el pórtico",

      autor: "",
      fecha: "siglo I d.C.",
      guion: "Estás haciendo la cola de la Bocca della Verità. La leyenda la sabés: metés la mano, mentís, te la muerde. Lo que casi nadie sabe es qué es realmente ese disco, y es bastante mejor que la leyenda.\n\nEs una loza circular de mármol, de casi un metro ochenta de diámetro, y pesa alrededor de mil trescientos kilos. Una tonelada y cuarto. Cuando la mirás de frente parece una placa; mirala de costado y vas a ver el espesor. Eso no es un adorno: es una tapa.\n\nEs del siglo primero después de Cristo. Y acá viene un aviso: el sitio oficial de turismo de Roma dice que se remonta al reinado de Tarquinio el Soberbio, el último rey, o sea el siglo sexto antes de Cristo. Eso confunde la fecha de la Cloaca Maxima, que sí es de esa época, con la fecha del disco, que es seiscientos años posterior. No repitas la fecha de los reyes.\n\n¿Para qué servía? La hipótesis con más respaldo es la más prosaica: era la tapa de un sumidero de desagüe de agua de lluvia, probablemente conectado con el recorrido de la Cloaca Maxima, la gran cloaca que cruzaba el Foro y desembocaba en el Tíber acá nomás. En la Roma antigua había varias de estas tapas decoradas con relieves. Fijate en los ojos, la nariz y la boca: están calados de lado a lado, no tallados en hueco. Por ahí pasaba el agua.\n\nHay otras versiones. Que tapaba el desagüe del templo redondo que vas a ver en un rato, que tiene un óculo abierto por el que entra la lluvia. O que servía para drenar la sangre de los sacrificios de bueyes que se hacían acá. Y hay una tesis de autor, publicada por un arquitecto italiano, que sostiene que es el desagüe central del piso del Panteón, justo debajo del óculo: mismas medidas, mismo mármol. No es consenso académico, pero es una linda idea.\n\nLo honesto es esto: es una tapa de desagüe romana del siglo primero, de mármol caro, que pesa más de una tonelada. Qué tapaba exactamente, no está cerrado.\n\nLa cara. Tampoco hay acuerdo. Las identificaciones que circulan son Océano, Júpiter Amón, Ponto y Fauno. El argumento material más fuerte está a la vista: entre el pelo y la barba, arriba a los costados, hay pinzas de cangrejo. Las pinzas de cangrejo saliendo del pelo son el atributo estándar de Océano, el titán del gran río que según la geografía antigua rodeaba el mundo. Buscálas antes de meter la mano. Dato de color: el sitio de la propia iglesia se inclina por Fauno. Ni la iglesia que la tiene se pone de acuerdo con los arqueólogos.\n\nEstá acá desde mil seiscientos treinta y dos. Antes estaba apoyada contra el muro exterior. De dónde salió originalmente, no hay registro.\n\nLa leyenda de la mano se usaba sobre todo contra las mujeres acusadas de adulterio: el marido celoso la traía a jurar. Hay una historia clásica de una mujer que burla a la máscara: antes de jurar hace que un cómplice disfrazado de loco la abrace en público, y después jura que nunca la abrazó otro hombre más que su marido y ese loco. Técnicamente cierto. La boca no la muerde.\n\nVas a leer que la leyenda aparece en una guía medieval del siglo once. Lo busqué y no cierra: esa guía es de alrededor de mil ciento cuarenta, o sea del doce, y su índice no menciona la máscara. Lo único firme es que en mil cuatrocientos ochenta y cinco ya se la llamaba Bocca della Verità.\n\nY la película. En Vacaciones en Roma, de mil novecientos cincuenta y tres, Gregory Peck mete la mano y saca el brazo sin mano. La idea fue de él, copiada de un comediante de televisión. El guion pedía que fingiera brevemente; lo de esconder la mano en la manga lo agregó Peck. Y no le avisaron a Audrey Hepburn. Se filmó en una sola toma para eso. El grito es de verdad.",
      mirar: [

      id: "rom2-08",

      autor: "",
      fecha: "s. VI, reconstruida en 1123",
      guion: "La iglesia que tiene la Bocca en el pórtico se llama Santa Maria in Cosmedin y es mucho más interesante que su inquilina famosa.\n\nEmpecemos por el campanile, que se ve desde la vereda de enfrente. Es del siglo doce, mide treinta y cuatro metros y tiene siete pisos de ventanas. Contálos. Es de los campaniles románicos más altos de Roma, y hay una fuente que remarca algo increíble: no fue reparado ni restaurado desde el siglo doce. Ochocientos años sin que nadie le toque un ladrillo.\n\nEl nombre. «In Cosmedin» viene del griego, y hay dos explicaciones. La tradicional dice que viene de una palabra que significa «adorno», o sea Santa María la Adornada. La que prefieren los especialistas modernos es mejor: viene del monasterio del Kosmidion de Constantinopla, cuyos monjes huyeron a Roma. La comunidad griega que administraba esta iglesia le puso el nombre de su casa madre.\n\nPorque este barrio era griego. Se llamaba «Schola Graeca» y esta orilla del Tíber, «Ripa Graeca». Había una colonia bizantina grande, reforzada por monjes que se escapaban de la persecución de las imágenes en Oriente. La iglesia antes se llamaba «Santa María en la Escuela Griega».\n\nY no nació como parroquia. Nació en el siglo sexto como diaconía: un centro de asistencia. Reparto de comida, hospicio para peregrinos, atención a pobres. Empezó siendo una oficina de acción social con capilla.\n\nEn el año setecientos ochenta y dos el papa Adriano primero la amplió, y la construyó literalmente encima del Ara Maxima de Hércules, el altar arcaico más importante del Foro Boario, de los siglos sexto y quinto antes de Cristo. Bloques de toba de ese altar siguen adentro del edificio, y la cripta está excavada dentro de su podio. Una iglesia cristiana montada sobre el altar de Hércules.\n\nSi llegás a entrar, dos cosas.\n\nEl piso. Es un piso cosmatesco, y conviene que sepas qué es porque lo vas a ver diez veces más en este viaje. Los Cosmati eran familias de marmolistas romanos de los siglos doce y trece. En vez de hacer un mosaico con teselitas todas iguales, cortaban piezas de distintas formas y las encajaban como un rompecabezas: círculos grandes, triángulos, estrellas, cintas trenzadas, con pórfido rojo y verde, vidrio de color y oro.\n\nY acá está lo bueno: el material es reciclado de las ruinas romanas. Los discos grandes de pórfido son columnas antiguas cortadas transversalmente, en rodajas. Un piso medieval hecho con la Roma imperial cortada en fetas. Buscá el disco grande de pórfido púrpura del centro de la nave: el pórfido púrpura en la antigüedad estaba reservado a los emperadores.\n\nY buscá el ciborio, el baldaquino sobre el altar, de mil doscientos noventa y cuatro: está firmado por Deodato, hijo de Cosma el Joven. Hay una firma cosmatesca ahí adentro.\n\nÚltima cosa, y explica el ruido que vas a escuchar si es media mañana de domingo. Hoy la basílica está a cargo de la Iglesia greco-melquita: cristianos de rito bizantino, el mismo de los ortodoxos, que celebran en griego y en árabe, con iconos y sin órgano, pero en comunión con el Papa. Vienen de Siria, Líbano y Palestina. Los domingos la Divina Liturgia es a las diez y media y dura una hora y pico.\n\nO sea que la iglesia arrancó hace mil cuatrocientos años atendiendo a una comunidad de griegos orientales, y hoy vuelve a celebrarse en rito oriental. Si escuchás cantar en árabe adentro, no es una rareza: es la casa volviendo a su idioma.",

        "El ciborio de 1294 está firmado por Deodato, hijo de Cosma.",

    {
      id: "rom2-09",

      autor: "",
      fecha: "c. 120 a.C.",
      guion: "En la misma plaza, cruzando, hay dos templos romanos en pie. No ruinas: templos enteros, con techo. Empecemos por el redondo.\n\nDurante siglos se lo llamó «templo de Vesta». El motivo era puramente visual: es redondo, y el templo de Vesta del Foro Romano también lo era, así que los anticuarios del Renacimiento ataron cabos y le pusieron ese nombre. Estaba mal. Estaba dedicado a Hércules, que era el protector de los comerciantes de este mercado, y que además tenía acá al lado su altar más importante.\n\nEs de alrededor del año ciento veinte antes de Cristo, y tiene un dato que lo vuelve único: es el edificio de mármol más antiguo que se conserva en Roma. Lo dicen el turismo oficial, la Superintendencia y las enciclopedias.\n\nPero lo mejor es quién lo pagó. No fue un emperador ni un general victorioso. Fue Marco Octavio Herennio, un rico comerciante de aceite de oliva de Tívoli, de la corporación de los aceiteros. Un empresario del aceite.\n\nY este señor no usó piedra local. Importó mármol pentélico de Grecia, del mismo monte de donde salió el del Partenón, y contrató probablemente a un arquitecto griego. Doscientos años antes de que Roma tuviera canteras de prestigio propias, un comerciante de aceite se trajo mármol de Atenas para su templo. Eso es lo que estás mirando.\n\nQué buscar. Son veinte columnas corintias de más de diez metros. Mirá el color y el desgaste: once de ellas, y nueve capiteles, son de una restauración de época de Tiberio, del siglo primero después de Cristo, hechas en mármol de Carrara. O sea que hay columnas de dos siglos distintos en el mismo anillo, y se nota.\n\nMirá también lo que falta. Falta una columna y falta el entablamento, la cornisa que iba arriba de todo. Lo que ves encima es el tambor de la cella con un techo cónico, y ese techo es de mil novecientos noventa y seis. Es moderno, y desde acá se nota el contraste entre las tejas nuevas y el mármol griego de abajo.\n\n¿Por qué sobrevivió? Por la misma razón que sobrevivió casi todo lo que sobrevivió en Roma: lo convirtieron en iglesia. En el siglo doce lo consagraron como Santo Stefano delle Carrozze, y después pasó a llamarse Santa Maria del Sole. Adentro todavía hay un fresco de la Virgen de fines del siglo quince. Un templo de Hércules que estuvo mil años siendo una capilla de la Virgen, y por eso llegó entero.\n\nUn aviso práctico: las visitas al interior están suspendidas por obras de acondicionamiento del área, con fondos europeos. La obra empezó en abril de dos mil veinticinco y tenía fin previsto para junio de dos mil veintiséis, o sea unos meses antes de que ustedes lleguen. No pude averiguar si hay andamios o lonas que tapen la vista desde la vereda. Si hay, ya sabés por qué.",

    {

      autor: "",
      fecha: "c. 100 a.C.",
      guion: "A cuarenta metros del redondo está el otro, el rectangular. Es el templo de Portuno, y es uno de los edificios mejor conservados de toda la Roma antigua.\n\nPortuno era el dios de los puertos fluviales, y también de las puertas y las llaves. Su símbolo es una llave. Tenía su fiesta, las Portunalia, el diecisiete de agosto, en la que se tiraban llaves al fuego para tener suerte, en una ceremonia que las fuentes describen como solemne y medio lúgubre.\n\nY acá hay una cosa que explica el dios entero. En latín, «porta», puerta, y «portus», puerto, vienen de la misma raíz, que quiere decir «vado», el lugar por donde se cruza un río. El dios del puerto y el dios de la puerta son el mismo dios porque son la misma palabra.\n\n¿Por qué está acá? Porque esto que ves como una plaza con tránsito era el puerto de Roma. Acá estaban los muelles originales de la ciudad, al lado del primer puente de piedra que tuvo Roma, cuyo arco solitario todavía se ve en el río. Y era además el mercado de ganado: «Foro Boario» viene de «bos», buey. El mercado de vacas de la Roma antigua, con el puerto pegado.\n\nAsí que el templo de Portuno está literalmente en el muelle. Es el dios que te cuida el barco cuando entrás. Mirá hacia dónde apunta la fachada y buscá el Tíber a cien metros: está de frente al agua.\n\nY ahora el mejor detalle, que es el que lo pone en conversación con su vecino.\n\nEl templo redondo importó mármol de Grecia. Este está hecho de toba, que es piedra volcánica local y barata, y de travertino. Y lo recubrieron con estuco para que pareciera mármol.\n\nO sea: a cuarenta metros de distancia tenés el templo del que pudo pagar mármol de verdad y el templo del que lo fingió. El estuco se perdió con los siglos, así que lo que estás viendo es la trampa al descubierto. Acercate a la piedra y mirá la textura: es gris, porosa, nada que ver con el brillo del otro. Si encontrás algún resto de estuco blanco pegado en una cara protegida, ahí está la prueba.\n\nHay otro truco. El templo parece rodeado de columnas y no lo está. Adelante hay cuatro columnas sueltas, de verdad. En los costados y atrás, las columnas están pegadas a la pared: son medias columnas decorativas. Se llama pseudoperíptero, que es una palabra horrible para decir «finge tener columnas alrededor». Caminá por el costado y mirá de perfil: vas a ver las medias columnas hundidas en el muro.\n\nDos templos, dos formas de aparentar, y los dos siguen en pie dos mil cien años después.\n\nSobrevivió, otra vez, porque lo hicieron iglesia: en el año ochocientos setenta y dos. Adentro todavía hay frescos medievales con escenas de la vida de la Virgen, aparecidos durante las obras. En mil novecientos dieciséis lo desacralizaron y lo devolvieron a su aspecto antiguo. El interior está cerrado.",

    {
      id: "rom2-11",
      tipo: "tramo",
      orden: 11,
      sala: "Del Foro Boario al Celio",
      titulo: "La noche de las bombas",
      autor: "",
      fecha: "27 de julio de 1993",
      guion: "Ahora caminás unos veinticinco minutos hasta el Celio. Si te desviás dos minutos por Via del Velabro, hay algo que vale la pena, y no por lo que parece.\n\nVas a ver dos cosas pegadas. Una es el Arco di Giano: un arco cuadrado, macizo, con cuatro pasajes, del siglo cuarto después de Cristo. El nombre «de Jano» se lo pusieron anticuarios del siglo dieciséis que vieron los cuatro pasajes y pensaron en el dios de las dos caras. Pero hay otra explicación mejor: en latín «ianus» quiere decir simplemente «pasaje cubierto». O sea que «Arco de Jano» puede querer decir apenas «el arco pasaje».\n\nMirá dos cosas. Arriba, en las claves de la bóveda, hay cuatro figuras femeninas: Roma, Juno, y probablemente Minerva y Ceres. Y mirá lo alto del arco: está cortado plano y feo. Ahí había un piso más, un ático. Se lo demolieron en mil ochocientos treinta, durante una excavación, porque al verlo desnudo de ladrillo lo confundieron con un agregado medieval. Era antiguo. Le habían sacado el revestimiento de mármol, como a todo lo demás.\n\nAl lado está la iglesia de San Giorgio in Velabro, del siglo séptimo, con un pórtico del trece y un campanile románico. Y embutido en su fachada, medio incrustado, hay otro arco chiquito: el Arco degli Argentari, del año doscientos cuatro, que le dedicaron a la familia imperial los banqueros y los comerciantes de ganado de este mercado. En sus relieves buscá los huecos donde rasparon a martillazos una figura: es Geta, asesinado por su hermano Caracalla, al que le borraron la cara de todos los monumentos del imperio.\n\nPero lo que te traje a ver es otra cosa.\n\nEn la noche del veintisiete al veintiocho de julio de mil novecientos noventa y tres, alrededor de la medianoche, un coche bomba explotó frente a esta iglesia. Dejó un cráter de dos metros y el pórtico se derrumbó casi por completo. No hubo muertos.\n\nEsa misma madrugada estallaron bombas en San Giovanni in Laterano, en el Vicariato de Roma y, minutos antes, en Milán. Se la llamó la noche de los fuegos. Fue Cosa Nostra, la mafia siciliana, como represalia contra el Estado después de que el Estado reaccionara a los asesinatos de los jueces Falcone y Borsellino el año anterior. Una campaña de atentados de una organización criminal contra el patrimonio de su propio país.\n\nEl pórtico que estás mirando fue rearmado por anastilosis: juntaron los fragmentos originales de la explosión y los volvieron a colocar uno por uno. Los pedazos llenaron mil cincuenta cajones. Acercate y mirá las juntas y las diferencias de color entre las piezas: es un rompecabezas. Y algunos daños los dejaron sin restaurar a propósito, como memorial.\n\nLa iglesia reabrió en mil novecientos noventa y seis. El Arco di Giano, que quedó cerrado por la misma bomba, reabrió recién en dos mil veintiuno. Veintiocho años.\n\nDos monumentos a dos metros uno del otro, uno del siglo cuarto y otro del séptimo, los dos rotos la misma noche de mil novecientos noventa y tres. Seguí caminando.",
      mirar: [

        "En el arco chiquito de la fachada: los huecos donde rasparon a Geta.",

      guion: "Entraste a San Clemente. Vas a bajar dos veces, pero antes quedate acá arriba, porque esta iglesia sola ya justifica la entrada.\n\nPrimero, quién era Clemente. Fue el cuarto papa, a fines del siglo primero, o sea de los primerísimos. La tradición cuenta que lo desterraron a Crimea, lo condenaron a trabajos forzados en unas canteras, y que lo tiraron al mar Negro atado a un ancla. Por eso su símbolo es un ancla. Acordate del ancla, que vuelve.\n\nAhora mirá el fondo, el nicho semicircular detrás del altar. Eso es el mosaico del Triunfo de la Cruz, de los grandes mosaicos de Roma, del siglo doce.\n\nEn el centro hay una cruz con Cristo, y de la base de la cruz sale una mata de acanto, una planta de hojas grandes y rizadas. Y de esa mata salen espirales. Y las espirales se van enroscando y llenan todo el fondo de oro, y adentro de las espirales hay cosas: pájaros, animalitos, gente haciendo tareas, un pastor, plantas, escenas enteras de tamaño de moneda.\n\nLa idea es esta: de la cruz brota la vida, y la vida se ramifica hasta cubrir el mundo entero. No es un símbolo abstracto, es un dibujo que se puede recorrer con el dedo durante veinte minutos. Acercate lo más que puedas y andá siguiendo una espiral hasta el final. Vas a encontrar cosas que nadie mira.\n\nSegundo: el coro de mármol en medio de la nave. Ese recinto bajo, con paneles tallados y dos púlpitos, se llama schola cantorum y es donde cantaba el clero. Y tiene una particularidad enorme: no es de esta iglesia. Viene de la iglesia de abajo, la del siglo cuarto. Cuando construyeron esta, en el siglo doce, desarmaron el coro de la vieja, lo subieron pieza por pieza y lo volvieron a armar acá. Estás mirando el único mueble que se mudó de piso.\n\nTercero, si tenés tiempo: la capilla de Santa Catalina, con frescos de Masolino de alrededor de mil cuatrocientos veinticinco. Masolino trabajó con Masaccio, que es uno de los nombres con los que empieza el Renacimiento en Florencia. O sea que en esta iglesia tenés el momento en que la pintura empieza a tener perspectiva, a cincuenta metros del mosaico medieval del fondo y a ocho metros de profundidad de un templo pagano. Eso es Roma.\n\nY cuarto, buscá la capilla con placas en idiomas eslavos, que suele estar del lado derecho entrando. Ahí están las reliquias de san Cirilo.\n\nCirilo se llamaba en realidad Constantino y nació en Tesalónica, en Grecia. Junto con su hermano Metodio fue misionero entre los pueblos eslavos, y para poder predicarles inventó un alfabeto que transcribiera su lengua.\n\nY acá una corrección que conviene tener bien, porque casi todo el mundo la dice mal, y la corrige el propio Vaticano: Cirilo no inventó el alfabeto cirílico. Inventó el glagolítico. El cirílico es una modificación posterior, hecha por otros, que se llamó así en su honor. El alfabeto que lleva su nombre no es el que hizo.\n\nVino a Roma en el ochocientos sesenta y siete trayendo unas reliquias que había encontrado en Crimea: las de Clemente, el del ancla. Y vino además a dar una pelea. En el camino tuvo que discutir contra lo que se llamaba la herejía de las tres lenguas: la idea de que a Dios solo se le podía hablar en hebreo, en griego o en latín. Cirilo sostenía que se le podía hablar en la lengua de la gente. El papa le dio la razón.\n\nMurió en Roma en el ochocientos sesenta y nueve y lo enterraron acá. Guardate esa pelea, porque el piso de abajo la sigue.",

      guion: "Bajaste un piso y estás en una iglesia del siglo cuarto. Sobre tu cabeza hay otra iglesia entera. Eso ya es raro, pero no es lo mejor que hay acá abajo.\n\nLo mejor es un fresco, y hay que buscarlo. Está en la pared sur de la nave, junto a otro fresco de la leyenda de san Alejo. Si no lo encontrás, fijate en el plano del folleto que te dieron al entrar: no quiero mandarte a mirar la pared equivocada.\n\nEl fresco tiene dos escenas, una arriba de la otra.\n\nArriba, san Clemente celebrando misa adentro de su propia basílica, dibujada con detalle: la nave, las naves laterales, las lámparas, el altar con el libro y el cáliz. Una iglesia pintada adentro de la iglesia en la que estás parado.\n\nAbajo, la escena que importa. La historia es esta: Sisinio, un patricio pagano, sigue en secreto a su mujer Teodora, que es cristiana, hasta la iglesia. Adentro se queda ciego y sordo y no encuentra la salida. Clemente reza por él y lo cura. Y Sisinio, en vez de agradecer, se enfurece y les ordena a sus criados que lo arresten.\n\nLos criados agarran al santo. Solo que no agarran al santo: milagrosamente agarran una columna de mármol, y la arrastran con un esfuerzo tremendo convencidos de que están llevando a un hombre. Eso es lo que está pintado: tres tipos haciendo fuerza sobre una columna.\n\nY ahora lo que hace famoso a este fresco. Al lado de las cabezas de los personajes hay texto pintado. No en un cartel abajo: saliendo de sus bocas.\n\nSisinio grita, en romanesco: «Fili de le pute, traite! Gosmari, Albertel, traite! Falite dereto co lo palo, Carvoncelle!»\n\nQue quiere decir: «¡Hijos de puta, tiren! ¡Gosmario, Albertello, tiren! ¡Vos metele por atrás con la barra, Carboncello!»\n\nY san Clemente contesta, en latín: «Duritiam cordis vestris, saxa traere meruistis». «Por la dureza de sus corazones, merecieron arrastrar piedras».\n\nEl fresco es de entre mil sesenta y mil ochenta y seis.\n\nAhora, con cuidado, porque vas a leer en todos lados que este es el primer texto escrito en italiano. No lo es. Ese título se lo disputan un grafito en una catacumba romana de alrededor del año ochocientos y un documento notarial de Capua del novecientos sesenta. Y hay un acertijo veronés todavía anterior, pero los especialistas discuten si ya es italiano o todavía es latín.\n\nLo que sí es, y es una afirmación fuerte igual: es el primer caso documentado en que alguien usa la lengua de la calle a propósito, para que suene vulgar al lado del latín del santo. Los parlamentos en latín de Clemente citan casi textualmente un texto antiguo. El diálogo en romanesco no tiene ninguna fuente conocida: lo escribió alguien, para este fresco, para que sonara como habla la gente.\n\nY es, en los hechos, la primera historieta: texto que sale de la boca del que habla, al lado de su cabeza.\n\nBuscá también, abajo, una banda roja con una inscripción en latín correcto. Dice: «Yo, Beno de Rapiza, con María mi mujer, por amor de Dios y del beato Clemente, hice pintar esto». Son los que pagaron. Un matrimonio devoto puso su nombre a veinte centímetros de la puteada.\n\nY fijate lo que pasa acá abajo: en el piso de arriba te conté a Cirilo peleando por el derecho a rezar en la lengua de uno. Acá, en la misma iglesia, un siglo y medio después, la lengua de la calle entra a un muro sagrado por primera vez. Y entra puteando.",

      guion: "Bajaste otro piso. Ahora estás en el siglo primero, y en el medio de unos edificios romanos hay una sala chica, abovedada, con dos bancos largos de mampostería a los costados y un altar en el medio.\n\nEsto es un mitreo: un templo del dios Mitra. Y lo primero que hay que hacer es contar el espacio. En cada banco entraban unos seis hombres. Doce personas como máximo, apretadas. No es un templo: es una salita.\n\nAntes de ser esto era el patio de una casa de departamentos del siglo segundo. Lo techaron para que pareciera una gruta. Mirá la bóveda: es baja, de cañón, y estaba decorada con estrellas. Un cielo pintado, adentro de una cueva fabricada, en el patio de un edificio.\n\n¿Qué era el culto de Mitra? Acá tengo que ser honesto, porque el debate es el dato. La teoría tradicional dice que venía de Persia. Pero la arqueología la contradice: la enorme mayoría de los templos de Mitra aparecieron en Italia y en las provincias del Danubio, no en Oriente. La lectura más reciente es que algún fundador italiano desconocido tomó elementos estéticos persas y armó un culto exótico. O sea: una religión «oriental» inventada en Roma.\n\nY hay algo que impresiona más que cualquier dato: de este culto no sobrevivió ni un solo texto sagrado. Ni uno. Todo lo que sabemos de Mitra lo dedujimos de las imágenes. Estamos leyendo una religión entera a partir de sus dibujos.\n\nQuiénes entraban acá. Al principio soldados y oficiales del ejército; después, esclavos liberados que habían prosperado. Y las mujeres estaban excluidas por completo, sin excepción.\n\nPor qué los soldados: porque el culto funcionaba como una unidad militar. Había siete grados de iniciación, de menor a mayor: el Cuervo, el Novio, el Soldado, el León, el Persa, el Corredor del Sol y el Padre. Cada grado tenía su ropa y sus atributos. Las iniciaciones incluían vendarle los ojos al que entraba, arrodillarse ante los superiores y ritos de muerte y renacimiento. Se difundió por donde se movían las legiones. Se documentan más de doscientos templos.\n\nAhora el altar. Está en el medio, en su lugar original, tallado en las cuatro caras.\n\nEn la cara principal está la escena central de toda la religión, que se llama tauroctonía: Mitra de rodillas sobre un toro, clavándole un cuchillo en el cuello. Y fijate en un detalle: mientras lo mata, gira la cabeza para otro lado. No mira lo que está haciendo.\n\nAlrededor del toro hay un perro, una serpiente, un escorpión y un cuervo. El escorpión le ataca los testículos, el perro y la serpiente beben la sangre, y de la cola del toro brotan espigas de trigo. Es una escena de creación por sacrificio: de la muerte del toro brota la vida. Todos los animales tienen correspondencia con constelaciones, aunque cuál es cuál sigue en discusión.\n\nEn los laterales del altar buscá dos figuras con antorchas: Cautes y Cautopates. Uno la lleva para arriba y el otro para abajo. Amanecer y atardecer, o vida y muerte.\n\nY ahora el final, que es el motivo por el que esto sigue existiendo. Este culto compitió en serio con el cristianismo: los dos prometían salvación personal, los dos tenían comida ritual con pan y vino, iniciación por etapas y vida después de la muerte. Pero Mitra dejaba afuera a la mitad de la humanidad y era secreto. El cristianismo entraba por las casas.\n\nEste mitreo se abandonó a fines del siglo cuarto, justo cuando el imperio prohibió los cultos paganos. Después lo rellenaron. Y encima construyeron la iglesia. No al lado: encima. La discusión la ganó el piso de arriba.",

      guion: "Antes de subir, parate quieto un momento y escuchá.\n\nHay agua corriendo. Fuerte. Es lo que más impresiona de estar acá abajo, y es también el motivo por el que estás acá abajo.\n\nEn mil ochocientos cincuenta y siete, el prior de este convento, un fraile irlandés llamado Joseph Mullooly, escuchó desde su celda un sonido de agua corriendo debajo del edificio. Y se puso a excavar. Todo lo que viste en la última hora —la basílica del siglo cuarto, el fresco de Sisinio, el mitreo— salió a la luz porque un tipo escuchó un ruido y quiso saber qué era.\n\nCuando llegaron al mitreo, lo encontraron completamente inundado. Tuvieron que desviar el agua para poder entrar.\n\nAhora, qué es exactamente ese ruido, porque acá las guías inventan mucho.\n\nNo es un río antiguo. No es un acueducto romano: no hay ninguno en servicio en este punto. Y no es la Cloaca Maxima, que drena el valle del Foro, no este.\n\nLo que estás escuchando corre por un canal que hicieron los propios frailes. En mil novecientos ocho, otro dominico irlandés, el padre Nolan, resolvió el problema del agua cavando un canal de drenaje de más de seiscientos metros bajo tierra, hasta una cloaca antigua cerca del Coliseo. Después lo ampliaron. De dónde viene el agua no lo pude averiguar: lo más coherente con el terreno es que sea agua de napa de este valle, pero no encontré ninguna fuente que lo diga, así que no te lo doy por bueno.\n\nLo que sí es cierto, y es mejor: ese ruido es el origen de todo esto. Es lo que oyó Mullooly.\n\nY ahora, mientras subís, contá las capas, porque son la lección del lugar.\n\nAbajo de todo, edificios romanos del siglo primero: un depósito enorme, de casi treinta metros de ancho, y un edificio de departamentos alrededor de un patio. Ojo con un detalle: esto no es lo que se quemó en el incendio de Nerón del año sesenta y cuatro. Es lo que se construyó después, encima de lo que el fuego había arrasado. Roma no se reconstruye al lado: se reconstruye arriba.\n\nEn el patio de ese edificio, a fines del siglo segundo, meten el mitreo.\n\nEn el siglo cuarto, arriba de todo eso, levantan la basílica cristiana.\n\nEn mil ochenta y cuatro los normandos saquean Roma y dañan gravemente esa basílica. Y entonces, en vez de repararla, hacen lo que hizo siempre esta ciudad: la rellenan de escombro, la usan de cimiento y construyen una nueva encima. Eso se terminó hacia mil ciento veintiocho y es la iglesia por la que vas a salir.\n\nCuatro niveles, mil años de altura, y en cada uno alguien decidió que era más fácil subir el piso que limpiar el de abajo. Poné la mano en un muro de ladrillo del siglo primero y mirá para arriba: tenés tres iglesias encima de la cabeza.\n\nY de todas esas capas, la única que sigue en movimiento es el agua.",

      guion: "Saliste del Foro después de dos horas y media con el guía y estás caminando hacia Monti. Son nueve minutos, no veinte: te sobra tiempo.\n\nY vas a caminar por Via dei Fori Imperiali, que los domingos es peatonal de punta a punta, entre el Coliseo y Piazza Venezia. Aprovechala: es de los pocos ratos en que se puede caminar por el medio de una avenida romana sin que te toque bocina nadie.\n\nMonti es el rione uno, el primero de los veintidós barrios históricos de Roma. Hoy es el barrio de las tiendas de diseño, los bares de vinos y los alquileres carísimos. Hace dos mil años era exactamente lo contrario.\n\nEsto era la Suburra: el barrio popular, denso y con mala fama de la Roma antigua. Edificios de departamentos de varios pisos, mal construidos, que se incendiaban y se derrumbaban; calles angostas; prostíbulos; y una reputación de peligrosa que atraviesa toda la literatura latina. Era el reverso exacto del Palatino, que tenías ahí nomás, a quinientos metros.\n\nAhora, un aviso de domingo: las tiendas de Via del Boschetto y Via dei Serpenti, que son media gracia de caminar estas calles, hoy están cerradas. En Roma las tiendas independientes no abren los domingos. Si venías con ganas de vidriereo, el barrio te va a parecer apagado.\n\nPero hay una excepción, y es justamente lo que abre solo los fines de semana: el Mercato Monti, en Via Leonina cuarenta y seis. Sábados y domingos, de diez de la mañana a ocho de la noche, entrada libre. Vintage, diseño y artesanía. Queda de paso entre la plaza y San Pietro in Vincoli, así que no hay que desviarse: está en el camino.\n\nEl centro del barrio es Piazza della Madonna dei Monti, con su fuente en el medio. Es una plaza chica, con escalones alrededor de la fuente, y a la tarde se llena de gente sentada con un vaso. Es el mismo mecanismo que Piazza Trilussa en Trastevere: una superficie donde sentarse sin consumir nada.\n\nUn apunte de horario, porque conviene. El aperitivo romano arranca en serio entre las seis y       fecha: "1505-1545",
      guion: "Antes que nada, un aviso práctico: las fuentes discuten si esta iglesia cierra a las seis o a las siete de la tarde. Si llegaste tarde y está cerrada, ya sabés por qué. Por eso conviene venir apenas salís del Foro.\n\nY lo segundo: esta iglesia no existe por Miguel Ángel. Existe por unas cadenas, y llegaron mil cien años antes que él.\n\n«In vincoli» quiere decir «en cadenas». Abajo del altar mayor hay dos cadenas. Una es de Jerusalén, de cuando Pedro estuvo preso por orden de Herodes; la otra es de Roma, de la cárcel Mamertina. Son contables: la de Jerusalén tiene once eslabones chicos, la romana veintitrés anillos que terminan en un collar.\n\nLa leyenda dice que la emperatriz Eudocia recibió la cadena de Jerusalén en el año cuatrocientos treinta y dos y la mandó a Roma con su hija, y que cuando el papa juntó las dos cadenas se fundieron solas, de manera irreversible.\n\nY el punto de esa leyenda no es el truco mágico. Es político: dos hierros que se sueldan solos, uno de Oriente y otro de Occidente, justo en el siglo en que los dos imperios se estaban separando para siempre. La iglesia se construyó para alojar eso, en el cuatrocientos treinta y dos.\n\nAhora sí, el Moisés. Y la mejor historia de acá no es la estatua: es lo que pasó alrededor.\n\nEn mil quinientos cinco el papa Julio segundo le encargó a Miguel Ángel su tumba: un monumento exento, parado en el medio de la nueva basílica de San Pedro, de casi once metros por siete, con unas cuarenta estatuas colosales en tres pisos.\n\nJulio se muere en mil quinientos trece. Los herederos rehacen el proyecto: ya no va suelto, va contra una pared. Otro contrato reduce más. Otro lo rechazan. En el treinta y dos se acuerda mudar todo a esta iglesia, usando los mármoles ya tallados, y se instala en mil quinientos cuarenta y cinco.\n\nDe cuarenta estatuas quedaron siete. Contálas.\n\nY de esas siete, solo tres son de Miguel Ángel: el Moisés del centro y las dos figuras de los costados, Raquel y Lía. Las demás son de ayudantes, incluida la figura del papa acostado arriba. La diferencia de calidad se ve a simple vista.\n\nCuarenta años, desde el encargo hasta la colocación. Miguel Ángel tenía treinta cuando empezó y setenta cuando terminó. Su biógrafo recogió la frase con la que él mismo la llamaba: la tragedia de la sepultura.\n\nY el remate: Julio segundo no está enterrado acá. Nunca trasladaron el cuerpo. Sigue bajo el piso de San Pedro. La tumba más famosa de la historia del arte está vacía del hombre para el que se hizo.\n\nAhora el Moisés en sí. Los cuernos.\n\nEl pasaje del Éxodo dice que al bajar del Sinaí la cara de Moisés estaba distinta. La palabra hebrea viene de una raíz que significa a la vez «cuerno» y «rayo de luz». San Jerónimo, traduciendo al latín, escribió «su cara estaba cornuda». Hay discusión sobre si fue un error o si eligió conservar la imagen a propósito; lo cierto es que a partir del siglo once Europa se llenó de Moisés con cuernos. Para el Renacimiento ya se sabía que era un problema de traducción y se empezaron a reemplazar por rayos. Este Moisés es de los últimos con cuernos de la historia del arte.\n\nQué mirar. Freud le dedicó un ensayo entero y sostiene que la estatua no es el momento de la furia sino el inmediatamente posterior: Moisés acaba de ver a su pueblo adorando al becerro de oro, tuvo el impulso de romper las Tablas, y se aguantó. Mirá la mano izquierda metida en la barba: ahí está el esfuerzo. Y mirá los pies: el derecho plantado, el izquierdo apoyado apenas con los dedos, la pierna retraída. Por eso parece que se va a parar, o que se acaba de frenar.\n\nY una última cosa. Esta estatua se pensó para ir en alto, para verse desde abajo. Hoy la mirás casi a la altura de los ojos. Agachate un segundo y mirala desde abajo: desde ese ángulo, el original, los cuernos casi no se ven. El detalle más famoso de la escultura es un detalle que no se iba a ver.",

    "basilica": "Entrar es gratis y siempre lo fue. La reserva de basilicasanpietro.va da franja horaria y un recorrido con QR, pero el propio Vaticano aclara por escrito que NO saltea el control de seguridad: «Security checks remain mandatory for all visitors». Nadie se lo saltea. La basílica abre 7:00-20:00 con último ingreso 19:15.",
    "cupula": "🔴 La cúpula cierra 18:00 y el horario de verano rige hasta el 25 de octubre, así que el 12 todavía son las 18:00. Subir lleva alrededor de una hora y media puerta a puerta. Son 551 escalones en total, o 320 si se paga el ascensor: el ascensor llega solo a la terraza y los 320 de la cúpula se hacen a pie sí o sí.",
    "entrada": "Precio de la cúpula en disputa entre las fuentes: €8/€10 en boletería según páginas de 2025 y €10/€15 según páginas de mayo y junio de 2026. El precio ONLINE del Vaticano sí está confirmado: €17 escaleras y €22 ascensor, y ese incluye la basílica con audioguía. Llevá efectivo: hay una fuente que dice que en boletería no aceptan tarjeta.",
    "vestimenta": "Hombros y rodillas cubiertos, para los dos, y rige también para subir a la cúpula. Lo controlan de verdad en el ingreso y no hay discusión posible. Mochila grande y valija no entran.",

      "fecha": "desde 1929",
      "guion": "Vas camino al país más chico del mundo. Cuarenta y cuatro hectáreas. Menos de medio kilómetro cuadrado. Se cruza caminando en veinte minutos y entra cómodo adentro del barrio de Palermo.\n\nY es un país de verdad: tiene pasaporte, sellos postales, patente de auto, radio, diario, banco, farmacia, un supermercado y un heliporto. Lo que no tiene es maternidad ni cementerio, así que técnicamente nadie es vaticano de nacimiento.\n\nEs también el único país del mundo con la población casi entera de hombres solteros, y el único cuya nacionalidad se pierde cuando terminás el trabajo.\n\nAhora, lo importante: esto existe desde mil novecientos veintinueve, no desde siempre. Es mucho más nuevo de lo que parece.\n\nDurante mil años, hasta mil ochocientos setenta, el papa gobernaba un estado grande de verdad: los Estados Pontificios, una franja que cruzaba Italia de Roma al Adriático. Cuando Italia se unificó y le tomó Roma por la fuerza, el papa se declaró prisionero y se encerró en el Vaticano. Cincuenta y nueve años de encierro voluntario: ningún papa salió de ahí adentro entre mil ochocientos setenta y mil novecientos veintinueve.\n\nLo destrabó Mussolini con los Pactos de Letrán. Le reconoció al papa un estado diminuto pero soberano, le pagó una indemnización enorme por lo confiscado, y a cambio consiguió que la Iglesia reconociera al reino de Italia y, sobre todo, la foto de haber cerrado el conflicto más viejo del país. Los dos ganaron.\n\nDos cosas prácticas antes de llegar.\n\nPrimera: hoy entran por la puerta de los Museos, que es un edificio aparte, sobre Viale Vaticano, del otro lado de la colina. La basílica y la plaza son de la tarde. En la Sixtina no se habla y no se saca una sola foto: está prohibido y hay gente vigilando específicamente eso.\n\nSegunda, y es la única que vale la pena repetir: al guía, apenas arranque, preguntale si al terminar salen por la Scala Regia hacia la basílica. Hay dos versiones de este tour y solo la larga incluye ese pasaje. Si salen por ahí, entran a San Pedro sin hacer la cola de seguridad y ganan casi una hora. Si no, salen por Viale Vaticano y hay que ir hasta la plaza a hacer la fila como todo el mundo. Preguntalo al empezar, no al final, porque la respuesta cambia el resto del día.",
