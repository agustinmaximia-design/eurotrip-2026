      id: "nap4-02", tipo: "tramo", orden: 2, sala: "Minibús al cráter",
      titulo: "La funicular de la canción y los bombarderos", autor: "", fecha: "1880–1944",
      guion: "Media hora de subida por una carretera en zigzag. Dos historias para el camino, y las dos terminan con el volcán ganando.\n\nLa primera. En 1880 a un financista se le ocurrió que se podía llevar turistas al cráter colgados de un cable. Se construyó una funicular, con dos coches de cinco mil kilos movidos por máquinas de vapor. Se inauguró el 6 de junio de 1880.\n\nY no venía nadie. La gente tenía miedo de subir a un volcán colgada de un cable.\n\nEntonces a alguien se le ocurrió encargar una canción. Un músico, Luigi Denza, y un periodista, Peppino Turco, escribieron para la inauguración una canción sobre lo lindo que es subir en funicular.\n\nFuniculì, funiculà.\n\nEsa canción que conocés, que se canta en todo el mundo, que suena en las pizzerías, es literalmente un aviso publicitario de 1880 de una empresa de transporte napolitana. Es de los primeros jingles de la historia, y funcionó tan bien que se independizó del producto: hoy la canta cualquiera y casi nadie sabe qué es.\n\nEn 1888 la compró Thomas Cook, la agencia de viajes, y la electrificó.\n\nY ahí empieza la maldición. En 1906 una erupción sepultó las dos estaciones, la maquinaria y los coches bajo veinte o treinta metros de ceniza. La reconstruyeron. En 1911 un desprendimiento la cerró. Reabrió. Y en 1944 la última erupción la dañó de manera irreparable.\n\nLa reemplazaron por una telesilla, que funcionó hasta 1984, y después la cerraron porque ya existía la carretera por la que estás subiendo ahora.\n\nO sea: estás haciendo el viaje que en 1880 se hacía en funicular, y el motivo por el que esa funicular no existe es el mismo volcán al que estás subiendo.\n\nLa segunda historia es de esa erupción de 1944, y es de las cosas más raras que pasaron acá.\n\nMarzo de 1944. Italia está partida por la guerra, los aliados ocupan esta zona, y hay aeródromos improvisados en los campos alrededor del volcán. El 18 de marzo el Vesubio se despierta.\n\nLa lava bajó lento, entre cincuenta y trescientos metros por hora, o sea que se la veía avanzar caminando al lado. Iba derecho a dos pueblos. Y pasó algo que no había pasado nunca antes acá: las tropas norteamericanas organizaron la evacuación y sacaron a unas siete mil personas antes de que llegara. Los pueblos se perdieron, la gente no.\n\nPero lo mejor es lo que pasó con los aviones.\n\nA veinte kilómetros de acá había un aeródromo norteamericano con bombarderos B-25 estacionados. Quedó justo a favor del viento.\n\nLa ceniza caliente cayó sobre los aviones durante horas. Les quemó las superficies de control, que eran de tela. Les derritió y agrietó el vidrio de las cabinas. Y se acumuló tanto sobre los fuselajes que algunos aviones se dieron vuelta sobre la cola.\n\nSe destruyeron entre setenta y noventa bombarderos. No murió nadie: el saldo humano fue una muñeca esguinzada y algunos cortes. Trataron de repararlos, no se pudo, y cinco días después desmantelaron el aeródromo entero y se mudaron.\n\nEs, hasta donde se sabe, el único grupo de bombarderos de la historia aniquilado por un volcán.\n\nY el 7 de abril de 1944 el cráter quedó tapado. Desde entonces está callado.",
      mirar: [
        "«Funiculì, funiculà» es un jingle publicitario de 1880 para vender la funicular.",
        "El volcán la destruyó tres veces hasta que la dejaron.",
        "En 1944 la ceniza destruyó 70 a 90 bombarderos norteamericanos. Sin muertos."
      ]
    },
    {
      id: "nap4-03", tipo: "parada", orden: 3, sala: "Sendero 5 — la subida",
      titulo: "Lo que estás pisando", autor: "", fecha: "",
      guion: "El minibús te deja a mil metros. Desde acá son cuatro kilómetros ida y vuelta hasta los mil ciento setenta y cinco. Ciento setenta y cinco metros de desnivel. No es alpinismo, pero cansa más de lo que sugieren los números, y ahora te explico por qué.\n\nMirá lo que estás pisando. No es roca ni es tierra: es lapilli. Piedra volcánica suelta, gris oscuro, del tamaño de una lenteja, que cede bajo el pie. Cada paso resbala un poco para atrás.\n\nY acá va la conexión del día: eso es exactamente lo que llovió sobre Pompeya. La misma piedra, de otras erupciones. A la tarde vas a estar caminando sobre los cinco metros de esto que taparon una ciudad.\n\nSi ves que venden bastones al inicio del sendero, comprá uno. Para la bajada sirve de verdad.\n\nAhora, qué mirar mientras subís.\n\nDel lado de afuera, mirando hacia abajo, vas a ver lenguas de roca negra, rugosa, sin una sola planta encima, bajando por la ladera. Son las coladas de 1944, las de la historia que te conté recién. Ochenta y dos años sin que crezca nada. Eso te da una idea de cuánto tarda este paisaje en volver.\n\nY fijate en los colores de la roca, porque cada color es química.\n\nEl negro y el gris oscuro son basalto, roca reciente. El rojo ladrillo y el ocre son la misma roca oxidada: hierro que se cocinó con gas caliente y oxígeno, o sea óxido, herrumbre a escala de montaña. Y el amarillo pálido y el blanco que vas a ver alrededor de las grietas son azufre y sales que dejó el vapor al salir.\n\nEste volcán tiene doscientos treinta minerales catalogados, sesenta y dos de ellos que casi no aparecen en ningún otro lado. Es uno de los lugares con más variedad mineral de Europa, y el motivo es simple: llevó treinta y nueve mil años cocinando la misma roca de maneras distintas.\n\nUn aviso sobre el acompañamiento. Por encima de los mil metros hay guías obligatorios del parque. No es una visita guiada temática: es escolta de seguridad. No esperes que te cuenten nada. Para eso estoy yo.\n\nAndá tranquilo, que tenés tiempo. La franja del ticket tiene dos horas de tolerancia.",
      mirar: [
        "El piso es lapilli suelto: la misma piedra que enterró Pompeya.",
        "Las lenguas negras sin vegetación son la lava de 1944.",
        "Rojo es hierro oxidado, amarillo es azufre dejado por el vapor."
      ]
    },
    {
      id: "nap4-04", tipo: "parada", orden: 4, sala: "El borde del cráter",
      titulo: "Las fumarolas son lo que importa", autor: "", fecha: "",
      guion: "Llegaste. Tenés veinte minutos y hay tres cosas para hacer, en este orden.\n\nLa primera: mirá adentro. El cráter tiene cuatrocientos cincuenta metros de diámetro y trescientos de profundidad. Para que tengas una escala, podrías meter la Torre Eiffel adentro y sobraría lugar.\n\nLa segunda, y es lo más importante que vas a ver hoy aunque parezca lo menos espectacular: buscá las fumarolas.\n\nSon hilos finos de vapor que salen de grietas en la pared de adentro. No hacen ruido, no son dramáticas, mucha gente ni las registra.\n\nSon la prueba física de que esto no está apagado.\n\nAcá hay que precisar una palabra. El Vesubio no está extinto: está quiescente. Extinto quiere decir que el sistema se apagó. Quiescente quiere decir que la cámara de magma sigue ahí abajo, caliente, y que el volcán está en pausa.\n\nEsa pausa empezó el 7 de abril de 1944, cuando el conducto quedó tapado. Y ese detalle es más importante de lo que parece, porque durante los trescientos trece años anteriores, desde 1631, el conducto había estado abierto. El Vesubio humeaba todo el tiempo y tiraba lava cada tanto. Ese es el Vesubio de todos los cuadros y postales del siglo diecinueve: un volcán que humea.\n\nEsa etapa se terminó. Hoy está tapado, como estaba antes de 1631, que es cuando hizo la erupción que mató cuatro mil personas.\n\nEso no quiere decir que vaya a pasar algo. Quiere decir que nadie sabe. Si alguien te da una fecha, la está inventando.\n\nEsas fumarolas las mide el Observatorio Vesubiano, que es el observatorio volcánico más antiguo del mundo, las veinticuatro horas. Hoy el nivel de alerta es el más bajo que existe.\n\nY la tercera cosa: date vuelta y mirá para abajo.\n\nDe un lado tenés el golfo entero: Nápoles, Capri, la península de Sorrento, y con día claro Ischia y Prócida. Del otro, el Monte Somma y la llanura.\n\nPero mirá bien abajo, al pie del volcán, esa mancha continua de casas que llega hasta el mar sin un solo hueco.\n\nEso es la zona roja. Son veinticinco municipios donde, si esto se reactiva, la única protección posible es sacar a todo el mundo antes, porque contra una nube piroclástica no hay refugio que sirva. Ahí viven seiscientas setenta mil personas.\n\nEl plan de Protección Civil prevé evacuarlas a todas en setenta y dos horas seguidas, y cada municipio ya tiene asignada de antemano una región de Italia que lo recibe.\n\nEs uno de los planes de evacuación más grandes del mundo, y existe por ese hilito de vapor que estás mirando.",
      mirar: [
        "Las fumarolas: hilos de vapor en la pared interna. Es lo único que prueba que sigue vivo.",
        "El cráter mide 450 m de ancho y 300 de hondo.",
        "La mancha de casas de abajo es la zona roja: 670.000 personas a evacuar en 72 horas."
      ]
    },
    {
      id: "nap4-05", tipo: "tramo", orden: 5, sala: "Vuelta a Ercolano",
      titulo: "Los trescientos de la playa", autor: "", fecha: "1980",
      guion: "Volvés a Ercolano y de ahí seguís a Pompeya. No vas a entrar a las excavaciones de acá, pero conviene que sepas qué te estás salteando, porque Herculano es el más raro de los dos sitios.\n\nHerculano está seis minutos a pie de la estación, bajando. Pero no cuentes con verlo sin entrar: el mirador desde el que se ve la excavación entera está del lado de adentro del control de acceso, así que no lo metas en el plan de hoy.\n\nLo que hay que imaginarse es esto. La ciudad romana está veinte metros por debajo del nivel de la calle, o sea que el sitio es un pozo. Y pegada al borde de ese pozo está la ciudad moderna, con edificios de departamentos y ropa colgada a diez metros de las casas romanas.\n\nEse contraste explica por qué solo se excavó una parte: para seguir excavando Herculano habría que demoler Ercolano. La mayor parte de la ciudad antigua, incluida casi toda la villa de la biblioteca de la que te hablé ayer, sigue abajo y probablemente se quede abajo.\n\nAhora, por qué Herculano está mejor conservado que Pompeya. Se resume en dos palabras: calor sin oxígeno.\n\nA Pompeya le cayó piedra pómez seca desde arriba durante dieciocho horas, con aire entre medio. Unos tres metros. En esas condiciones la madera se pudre y desaparece, y lo que queda son las paredes y las pinturas.\n\nA Herculano no le cayó casi nada de eso, porque estaba a contraviento. Lo que le llegó fueron avalanchas de gas y barro a unos quinientos grados, que lo sellaron bajo veinte metros en cuestión de horas.\n\nSin oxígeno, la madera no se quema: se carboniza. Se convierte en carbón conservando la forma exacta.\n\nPor eso en Herculano hay cosas que en Pompeya directamente no existen. Segundos pisos completos, con sus balcones de madera. Camas, armarios, una puerta corrediza entera con sus herrajes de bronce. Pan, higos, granos en sus frascos. Todo negro, todo frágil, todo con la forma intacta.\n\nY hay una historia que da vuelta todo lo que se creía, y es reciente.\n\nDurante más de dos siglos se pensó que Herculano se había salvado, porque no aparecían cuerpos. La explicación parecía obvia: como no les cayó pómez, la gente tuvo tiempo de ver lo que venía y se fue.\n\nEn 1980 se empezó a excavar hacia la costa antigua.\n\nHerculano era un puerto, y en el frente marítimo había una hilera de doce cámaras abovedadas abiertas al mar, donde se guardaban las barcas.\n\nEl 21 de mayo de 1980 apareció el primer esqueleto. Después otro. Al final de la campaña habían salido unos trescientos.\n\nEstaban amontonados adentro de esas bóvedas. Familias enteras, algunos protegiendo a otros con el cuerpo, con sus joyas y sus llaves encima.\n\nLa ciudad no se había salvado. La gente había bajado a la playa a esperar los barcos, se había metido bajo las bóvedas, y ahí los alcanzó la primera nube, a las dos de la madrugada, a quinientos grados. Murieron todos en el mismo instante.\n\nDos años después apareció al lado la popa de una barca de nueve metros, dada vuelta. Y en 2021, restaurando, apareció uno más, con un bolso con sus cosas. Le dicen el último fugitivo.",
      mirar: [
        "El mirador del sitio está adentro del control: no cuentes con verlo de paso.",
        "Acá la madera no se quemó: se carbonizó. Hay camas, puertas y pan.",
        "En 1980 aparecieron 300 esqueletos en las bóvedas de la playa. Esperaban los barcos."
      ]
    },
    {
      id: "nap4-06", tipo: "tramo", orden: 6, sala: "Tren a Pompei Scavi",
      titulo: "Dieciocho horas, hora por hora", autor: "", fecha: "año 79",
      guion: "Media hora de tren hasta Pompeya. Te cuento qué pasó exactamente el día que la enterraron, porque la reconstrucción moderna no sale de los textos antiguos: sale de las capas.\n\nCuando un vulcanólogo hace un corte vertical en Pompeya, lee las capas como páginas. Pómez blanca abajo, pómez gris arriba, y encima de todo un estrato distinto, más fino y más oscuro. Cada capa es una fase, y el grosor dice cuánto duró. Con eso se armó una cronología hora por hora. Son unas dieciocho horas, y tiene dos actos completamente distintos.\n\nActo uno: la lluvia de piedras.\n\nAlrededor de la una de la tarde cede el tapón y sale la columna. En minutos está a veintisiete kilómetros de altura. El viento de arriba la empuja hacia el sudeste, o sea hacia Pompeya.\n\nY empieza a llover piedra. No ceniza suave: pómez, roca llena de burbujas, liviana, del tamaño de una nuez, cayendo a velocidad de granizo. En Pompeya se acumula doce a quince centímetros por hora. Hacé la cuenta: a las tres de la tarde hay treinta centímetros en la calle, a las seis casi un metro.\n\nY acá está la clave de todo. La pómez es liviana, no aplasta a una persona. Pero se acumula sobre los techos, y después de unas horas las tejas no aguantan y los techos se caen.\n\nO sea que la gente que se escondió adentro de las casas murió ahí. Y la gente que salió a la calle con una almohada atada a la cabeza, que eso lo cuenta Plinio, caminó sobre una alfombra de piedra que subía sola, y muchos se salvaron.\n\nAl final de esta fase Pompeya está bajo tres metros de pómez, pero todavía es una ciudad: las paredes están de pie y hay gente viva adentro.\n\nActo dos, y son noventa minutos.\n\nCerca de la una de la madrugada la columna se vuelve demasiado pesada para sostenerse y colapsa. Todo lo que estaba subiendo deja de subir y cae de golpe sobre el volcán. Y al caer, en vez de esparcirse, corre por las laderas para abajo como si fuera un líquido.\n\nEso es una corriente piroclástica: una avalancha de gas ardiendo, ceniza y roca que baja a más de cien kilómetros por hora. No se corre, no se esquiva, no se para con una pared.\n\nHubo seis. La primera, a la una de la madrugada, bajó por el otro lado y arrasó Herculano en cuatro minutos. A Pompeya la alcanzó la cuarta, a las siete y media de la mañana, y mató a todos los que quedaban.\n\nUna última cosa, y con esto probablemente sepas más que el guía.\n\nToda la vida se dijo que fue el 24 de agosto. En 2018 apareció en una pared una inscripción hecha con carbón con una fecha de octubre, y la prensa del mundo entero tituló que la fecha había cambiado.\n\nPues bien: el propio parque de Pompeya volvió a defender agosto. Hicieron un experimento —escribieron una inscripción idéntica con carbón en la misma pared y a los diez meses seguía perfecta— y concluyeron que ese grafito puede ser de once meses antes. Además, todos los manuscritos más viejos de Plinio dicen agosto.\n\nO sea que la fecha volvió a estar abierta. Si alguien te la afirma con seguridad, en cualquiera de las dos direcciones, está simplificando.",
      mirar: [
        "Dieciocho horas de lluvia de piedra, y después noventa minutos de avalancha.",
        "Los que salieron a la calle se salvaron; los que se escondieron murieron por los techos.",
        "La fecha volvió a estar discutida: el parque defiende agosto, no octubre."
      ]
    },
    {
      id: "nap4-07", tipo: "parada", orden: 7, sala: "Piazza Esedra — antes de entrar",
      titulo: "Cómo no arruinar Pompeya", autor: "", fecha: "",
      guion: "Antes de entrar, cuatro minutos de estrategia, porque Pompeya es el lugar donde más fácil se hace todo mal.\n\nPrimero, el dato que te ordena el día, y es una regla simple que conviene tener clara: las casas cierran seis y veinte; los espacios abiertos siguen hasta las siete.\n\nO sea que de dos a seis y veinte tenés que meter todo lo que es puerta adentro: las casas con frescos, las termas, el Lupanar, el Antiquarium.\n\nY de seis y veinte a siete te quedan abiertos, y esto es bastante más de lo que parece: el Foro entero con el templo de Júpiter y la Basílica, el Macellum que era el mercado, el Teatro Grande, el cuartel de los gladiadores, el Anfiteatro, el Orto dei Fuggiaschi y la Casa del Fauno.\n\nEso te ordena el recorrido solo: las casas primero, los monumentos al final.\n\nY esa última media hora no la desperdicies. Es la parte monumental, vacía, con luz de atardecer, y es el mejor momento del día para caminar la Via dell'Abbondanza sin nadie.\n\nSegundo, la audioguía. Se retira acá mismo, en Piazza Esedra. Son catorce euros las dos y piden documento. Si viste precios de treinta euros en internet, es porque incluyen la entrada, que vos ya tenés con la Artecard.\n\nTercero, la ruta. Piazza Esedra te deja en el extremo oeste. La lógica es hacer el eje de oeste a este y salir por la otra punta, no volver sobre tus pasos.\n\nDel Foro seguís al Antiquarium, que está ahí nomás y te da el contexto de todo lo demás. Después las Termas Estabianas, el Lupanar que está a media cuadra, la Casa del Fauno y la Casa de los Vetios hacia el norte. Después bajás a la Via dell'Abbondanza, que es la calle comercial, y la hacés entera hacia el este: los mostradores de los bares, las marcas de las ruedas de los carros en la piedra, los carteles electorales pintados en las paredes. Al final, el Orto dei Fuggiaschi, el memorial de los calcos en la Palestra Grande, el Anfiteatro, y salís por Piazza Anfiteatro.\n\nCuarto, y es lo más importante: qué NO vas a ver, y está bien.\n\nLa Villa dei Misteri queda seiscientos metros afuera de la puerta noroeste, es una hora de ida y vuelta, y encima la Artecard no la cubre. Con cuatro horas o hacés la ciudad o hacés la villa. Hacé la ciudad.\n\nLa zona nueva de excavación, donde están saliendo los descubrimientos de los últimos años, solo se visita con un tour que sale a las once de la mañana. Vos entrás a las dos. No llega. Dejalo.\n\nY la mitad norte de la ciudad, directamente, no.\n\nLa tentación de Pompeya es correr para ver todo, y no se puede ver todo: quedan más de cuarenta hectáreas excavadas. Con menos de cinco horas es infinitamente mejor ver diez cosas bien que treinta mal.\n\nLo primero que vas a hacer al entrar es subir por Porta Marina hasta el Foro. Cuando llegues, parate en el extremo sur y mirá hacia el norte: el templo de Júpiter al fondo y, alineado justo detrás, el Vesubio. Es la foto del día, y es también el resumen del día: la ciudad mirando de frente a lo que la mató.\n\nRecién estuviste arriba de eso.",
      mirar: [
        "Regla del día: las casas cierran 18:20, los espacios abiertos siguen hasta 19:00.",
        "La audioguía se retira acá: 14 euros las dos, con documento.",
        "Desde el Foro, el Vesubio queda alineado detrás del templo de Júpiter."
      ]
    },
    {
      id: "nap4-08", tipo: "parada", orden: 8, sala: "Los calcos",
      titulo: "Las personas que no están adentro", autor: "Giuseppe Fiorelli", fecha: "1863",
      guion: "Esto es lo más importante que hay en Pompeya y también lo más incómodo. Vas a verlos en varios lugares: en el Orto dei Fuggiaschi, en las Termas Estabianas, en el Antiquarium, y sobre todo en la Palestra Grande.\n\nPrimero, cómo existen.\n\nGiuseppe Fiorelli dirigió las excavaciones desde 1863. Antes de él Pompeya se excavaba como una cantera: se cavaba donde se sospechaba que había estatuas o bronces, se sacaba lo vendible y se tiraba el resto. Fiorelli cambió el método y, de paso, resolvió un problema que llevaba décadas.\n\nLos excavadores venían encontrando unas cavidades raras en la capa de ceniza, a veces con huesos adentro. Nadie sabía qué eran.\n\nFiorelli entendió. La ceniza fina de las últimas avalanchas había envuelto los cuerpos y se había endurecido alrededor como un molde. Después, con los siglos, el cuerpo se descompuso y desapareció. Lo que quedó fue un vacío con la forma exacta de una persona en el instante de morir, con los pliegues de la ropa y la posición de las manos.\n\nY la técnica es simple hasta la brutalidad. Cuando la pala encuentra un vacío, se para todo. Se hace un agujerito. Se vuelca yeso líquido adentro. Se espera a que fragüe. Y después se excava alrededor.\n\nEso no es una escultura. Es un molde natural. Los huesos, en general, siguen adentro del yeso.\n\nUn escritor de la época le escribió a Fiorelli que con esos calcos había descubierto el dolor humano. Fue el momento en que la arqueología dejó de ser coleccionismo.\n\nEn marzo de este año, hace seis meses, se inauguró en la Palestra Grande un montaje permanente con veintidós calcos. Y lo hicieron de una manera que vale la pena conocer antes de entrar: hay divisorias antes de la sección con restos humanos, a propósito, para que vos elijas si querés verlos o no.\n\nEl director lo explicó con una frase: los calcos no son objetos ni son obras de arte, son testimonios de nuestra fragilidad.\n\nPorque esta es la discusión, y conviene tenerla en la cabeza mientras los mirás. Son cuerpos de personas muertas, expuestos sin su consentimiento, en la postura de su peor momento, delante de millones de extraños por año. El argumento del otro lado es que no mostrarlos sería peor: que la única razón por la que a esta gente se la recuerda dos mil años después es porque se la puede ver, y que el anonimato sería la segunda muerte.\n\nNo hay respuesta correcta. Pero es una conversación más interesante que una selfie.\n\nY ahora lo que la audioguía oficial casi seguro no te va a decir, porque desarma historias muy queridas.\n\nEn noviembre de 2024 se publicó un estudio de ADN antiguo hecho sobre cinco individuos conservados en calcos, firmado por gente del Max Planck y de Harvard.\n\nLos calcos siempre se contaron como escenas. Esta es una madre abrazando a su hijo. Estas son dos hermanas que murieron juntas. Esas lecturas venían del siglo diecinueve, de la postura de los cuerpos, y nadie las había podido verificar.\n\nResultado uno. El adulto con un brazalete de oro y un chico en el regazo, una de las imágenes más reproducidas de Pompeya, la madre con su hijo: el adulto es un varón. Y el chico no tiene ningún parentesco con él.\n\nResultado dos. La pareja abrazada que se leía como dos hermanas, o madre e hija, o dos amantes: hay al menos un varón entre los dos.\n\nResultado tres. De un grupo de cuatro que se suponía una familia, tres no tienen parentesco entre sí.\n\nLo que muestra el estudio no es que los arqueólogos de antes fueran tontos. Muestra algo peor: que cuando miramos un cuerpo antiguo le proyectamos encima la familia que conocemos nosotros. Vimos una madre porque un adulto con una joya abrazando a un chico, para nosotros, es una madre.\n\nPudo ser un esclavo con el hijo del dueño. Un tío. Un vecino. O un desconocido que en los últimos treinta segundos de su vida agarró al chico que tenía al lado.\n\nEso último, probablemente, es mejor historia que la que reemplazó.",
      mirar: [
        "No son esculturas: son moldes del hueco que dejó el cuerpo, con los huesos adentro.",
        "En la Palestra Grande hay divisorias para que elijas si querés verlos.",
        "El ADN de 2024 desarmó a «la madre con su hijo»: es un varón sin parentesco con el chico."
      ]
    },
    {
      id: "nap4-09", tipo: "parada", orden: 9, sala: "El Lupanar",
      titulo: "Dos leyendas que te van a contar mal", autor: "", fecha: "c. 72 d.C.",
      guion: "Esta es la parada con más cola de Pompeya y la peor contada. Va lo que está documentado, y de paso dos leyendas que vas a escuchar sí o sí y son falsas.\n\nEl edificio. Es el burdel más grande identificado en Pompeya: diez cuartos, cinco abajo y cinco arriba. Cada cuarto tiene una plataforma de mampostería, y encima iba un colchón. Ese es todo el mobiliario.\n\nAhora mirá lo que no hay. No hay puertas, y no hay rastro de barras de cortina. Solo una ventanita enrejada alta para que entre luz. No había privacidad de ninguna clase.\n\nEn el corredor hay frescos eróticos, descubiertos en 1862, pintados hacia el año 72, siete años antes de la erupción.\n\nLeyenda número uno, la que cuentan todos los guías: que esos frescos eran un menú, un catálogo para que el cliente eligiera señalando.\n\nNo hay ninguna evidencia de eso. Es una interpretación moderna que suena bien y se repite. La lectura académica actual es que son publicidad idealizada: presentan un ambiente sexual limpio y elegante que no se parece en nada a las diez celdas sin puerta donde pasaban las cosas. La distancia entre la pintura y el cuarto es el dato.\n\nLeyenda número dos, la que se cuenta mirando el piso: que los falos tallados en el pavimento eran carteles que indicaban el camino al burdel.\n\nFalso, y por motivos concretos. Apuntan en todas las direcciones y a veces hay varios juntos, así que no pueden señalar todos el mismo lugar. En Pompeya la publicidad se hacía escrita en las paredes, a la altura de los ojos, con nombre y precio. Y hay más de noventa falos tallados en la Britania romana, donde no había nada de esto.\n\nLo que eran, ya te lo conté el lunes con el dios Nilo: el falo romano era un amuleto contra el mal de ojo. Se ponía en umbrales, puertas y hornos para atraer la mirada maligna y desviarla antes de que entrara. No era sexual: era un pararrayos de mala suerte. De ahí viene la palabra fascinar.\n\nEs la diferencia entre entender Pompeya y hacer chistes sobre Pompeya.\n\nY ya que estamos, la leyenda madre. Los primeros excavadores, con la moral del siglo diecinueve, clasificaron como burdel cualquier edificio con una pintura erótica, y llegaron a contar treinta y cinco. De ahí sale la fama de Pompeya como ciudad del vicio.\n\nCon criterios modernos quedó en uno, este, más unos nueve cuartos sueltos. Eso da aproximadamente un establecimiento cada doscientos ochenta y seis habitantes: comparable a cualquier ciudad portuaria del Mediterráneo de cualquier siglo. Pompeya no era Sodoma. Era un puerto.\n\nLo que sí hay acá, y es lo que de verdad importa, son las paredes escritas. Se transcribieron más de ciento cincuenta inscripciones, en latín, en griego y en osco, las tres lenguas de la ciudad. Escritas por clientes, por trabajadoras y por curiosos.\n\nAlgunas son exactamente lo que esperás. «Acá me cogí a un montón de chicas», dice una. Dos mil años y el grafiti de baño no cambió nada.\n\nPero las que importan son las que anotan precios.\n\nUna dice: Eutiquis, griega, dos ases, de buenos modales. Otra registra dieciséis ases, que es el precio más alto que aparece. Y hay uno, Menandro, que era varón, también a dos ases.\n\nPara que tengas la escala: dos ases era más o menos lo que salía un vaso de vino.\n\nPensalo un segundo. Un vaso de vino.\n\nEso te dice todo lo que hace falta saber sobre quiénes eran estas personas. La mayoría eran esclavas, muchas traídas de Oriente, compradas por el proxeneta por unos seiscientos sestercios. No cobraban nada: eran propiedad. Los dos ases no eran su tarifa, eran el rendimiento de un bien de capital.\n\nCuando entres a las celdas, no mires los frescos. Mirá el tamaño del cuarto y la falta de puerta.",

      guion: "Mirá hacia el noreste, hacia la punta más alta de ese lado de la isla. Ahí arriba, a trescientos treinta y cuatro metros, están las ruinas de la casa desde la que se gobernó el Imperio Romano durante once años.\n\nTiberio fue el segundo emperador, el que sucedió a Augusto. En el año 26 se fue de Roma, en el 27 se instaló acá, y no volvió nunca. Murió en el año 37 sin haber pisado Roma otra vez. Tenía sesenta y siete años cuando se vino.\n\nDesde una isla, sin teléfono ni correo rápido, gobernó el imperio más grande del mundo.\n\n¿Cómo? Con una torre de señales al sur de la villa, con fuego de noche y humo de día, encadenada con otras del continente. Órdenes en clave, rebotando de cerro en cerro hasta Roma.\n\nLa casa se llama Villa Jovis, la villa de Júpiter. Siete mil metros cuadrados, cuatro alas, cuarenta metros de desnivel interno, y un sistema de cisternas para juntar agua de lluvia de los techos, porque allá arriba no hay una sola vertiente. El historiador Tácito dice que Tiberio tenía doce villas en la isla. Arqueológicamente se identificaron algunas, no doce.\n\nY ahora la parte que vas a escuchar en cada esquina de la isla, y que conviene desarmar.\n\nSe cuenta que Tiberio convirtió Capri en un parque de depravación: orgías en las grutas, niños usados para su placer, crueldad sistemática. Y se cuenta que en un acantilado junto a la villa, el Salto de Tiberio, hacía tirar al mar a sus víctimas delante de él.\n\nCasi todo eso viene de un solo autor: Suetonio, que escribió su biografía alrededor del año 120, o sea ochenta años después de que Tiberio muriera.\n\n¿Por qué los historiadores desconfían?\n\nPrimero, porque no hay corroboración: nadie más lo cuenta.\n\nSegundo, y esto es lo decisivo: Tácito no lo menciona. Tácito escribió en la misma época, es mucho más confiable, y era hostil a Tiberio. Si hubiera creído esas historias las habría usado, porque le servían. Apenas insinúa que el viejo, aislado, se soltó con cosas que antes ocultaba. Nada de niños, nada de detalles.\n\nTercero, porque Suetonio no escribía historia sino biografía moralizante, y necesitaba mostrar a Tiberio como un sucesor indigno de Augusto. Y porque Tiberio se peleó con el Senado, ejecutó senadores y abandonó la ciudad: la clase que escribía la historia lo odiaba.\n\nY sobre el Salto de Tiberio hay algo mejor que un argumento: una prueba.\n\nEn el siglo diecinueve, un escritor francés, Maxime Du Camp, subió al borde y tiró piedras de distintos tamaños y formas para ver qué pasaba.\n\nNinguna llegó al agua. Todas se estrellaron contra la roca en la caída, porque la pared no es un plano vertical limpio: tiene repisas y salientes. Un cuerpo tirado desde ahí no cae al mar.\n\nEl lugar existe y se llama así. La práctica, casi con seguridad, no.\n\nY por las dudas: si alguien te habla de unas monedas pornográficas que Tiberio hizo acuñar para la isla, tampoco. Esas fichas existen y están en museos, pero el vínculo con Tiberio lo inventaron unos anticuarios en el siglo dieciséis. Nadie sabe para qué servían.",
      mirar: [
        "Hacia el noreste, la cima: desde ahí se gobernó el imperio once años, con señales de humo.",
        "Las orgías vienen de un solo autor, ochenta años después. Tácito, más confiable, no las menciona.",
        "Du Camp tiró piedras desde el Salto de Tiberio: ninguna llegó al agua."
      ]

      id: "nap5-07", tipo: "tramo", orden: 7, sala: "Camino al Arco Naturale",

      guion: "Arranca el mejor paseo de la isla y arranca con una aclaración, para que camines tranquilo.\n\nEste circuito completo —desde la Piazzetta hasta el Arco, bajar a Matermania, hacer el Pizzolungo y llegar a Tragara— son dos horas y cuarto yendo despacio y parando a mirar. Solo llegar al Arco ya son veinticinco minutos casi todo cuesta arriba.\n\nEso ya está contemplado en el plan: comés al salir de acá, a las dos y media, que en Italia es hora de almuerzo normal. Así que no mires el reloj, no apures el paso y parate donde quieras. Vas bien.\n\nY una regla del día: el sentido en el que vas es el correcto. Arco primero, después Matermania, después Pizzolungo hasta Tragara. Así la escalera dura se hace bajando.\n\nSobre esa escalera: es larga, empinada, de piedra irregular, sin baranda en varios tramos. No es peligrosa pero tampoco es un paseo de parque. Y ojo, no es bajada continua: después hay que volver a subir un tramo para retomar el sendero de la cornisa.\n\nAhora, el Arco.\n\nVas a llegar a un mirador y tener enfrente un arco de piedra colgado en el aire, con el mar de fondo. Doce metros de ancho, suspendido a unos dieciocho metros del suelo.\n\nLo que estás mirando es el techo de una cueva que ya no está.\n\nHace muchísimo tiempo, cuando el nivel del mar era mucho más alto, el agua se comió la caliza acá y formó una caverna marina. Después el nivel bajó y la caverna quedó en seco, colgada sobre el acantilado. Y con los siglos la bóveda se fue derrumbando hasta que se cayó casi entera.\n\nQuedó el arco de la entrada. Nada más.\n\nO sea que ese arco no se construyó ni se formó como arco: es lo último que quedó parado de algo mucho más grande. Estás viendo el borde de un agujero que se desintegró.\n\nY ese mismo proceso, en otra etapa, es el que hizo los Faraglioni que vas a ver en un rato. El mar se come lo blando y deja lo duro. Los Faraglioni eran parte del acantilado; el arco era parte de una cueva. Es la misma historia contada en dos momentos distintos.",

      titulo: "Un comedor para las ninfas", autor: "", fecha: "época romana",
      guion: "Bajaste la escalera y estás en la boca de una cueva grande, de unos treinta metros por veinte, con restos de construcción de ladrillo encajados adentro de la roca natural. Escalones, muros curvos, nichos.\n\nEso es romano, y es de las cosas más elegantes que hicieron acá.\n\nLa cueva la transformaron en un ninfeo. Un ninfeo era un santuario dedicado a las ninfas, las divinidades del agua, y en la práctica funcionaba como un comedor de lujo: se banqueteaba adentro, con agua corriendo, en un lugar fresco y oscuro, con las paredes revestidas de mosaicos de conchillas y probablemente una fuente.\n\nPensá el contraste. Afuera, el Mediterráneo y el sol a pleno. Adentro, sombra, humedad, agua cayendo y el sonido rebotando en la piedra. Eso era el lujo para un romano rico: no la vista, sino el refugio de la vista.\n\nLo que queda hoy es la estructura pelada. Los mosaicos no están.\n\nAhora lo interesante, que es que nadie sabe a qué dios estaba dedicada.\n\nEl nombre del lugar, Matermania, admite dos lecturas y las dos tienen defensores.\n\nUna: viene de Magna Mater, la Gran Madre, que era Cibeles, una diosa de origen frigio —de la actual Turquía— cuyo culto se volvió enorme en Roma.\n\nLa otra: viene de Mithraeum, o sea templo de Mitra. Mitra era un dios de origen persa, con un culto de iniciación secreto, muy popular entre los soldados romanos, y sus templos siempre estaban en cuevas o imitaban una cueva. Esta cueva encaja perfecto.\n\nNo hay manera de decidir. No apareció ninguna inscripción, ninguna imagen del dios, nada.\n\nY hay una tercera versión, más tardía y más divertida: la gente del lugar deformó el nombre a \"Matromania\" y le inventó ritos de fertilidad y de matrimonio. Eso es folklore de pueblo, no arqueología, pero explica por qué vas a encontrar el nombre escrito de tres maneras distintas.\n\nAsí que lo honesto es esto: que acá hubo un salón romano dedicado a las ninfas está documentado y lo estás viendo. Qué dios se veneraba, es un misterio abierto con dos sospechosos y ninguna prueba.",

        "El nombre apunta a la Gran Madre o a Mitra. No hay manera de saberlo."

      id: "nap5-09", tipo: "tramo", orden: 9, sala: "Via Pizzolungo",
      titulo: "La casa más rara del siglo XX", autor: "Curzio Malaparte", fecha: "1938–1942",
      guion: "Este tramo va colgado sobre el mar, bordeando el acantilado, entre mirto y pinos. Es la parte fácil del paseo y la más linda.\n\nY a mitad de camino, de golpe, sobre tu izquierda y abajo, va a aparecer algo que no parece una casa.\n\nUna caja de mampostería roja —rojo pompeyano otra vez, como la de Anacapri— apoyada directamente sobre la roca desnuda de un cabo que se mete en el mar. Sin jardín. Sin cerco. Sin nada alrededor. La roca, la caja, y el agua.\n\nEs la Casa Malaparte, y es una de las construcciones más famosas de la arquitectura del siglo veinte.\n\nLa hizo para sí mismo Curzio Malaparte, escritor y periodista italiano, un personaje complicadísimo: fascista temprano, después preso del régimen, después corresponsal de guerra, después cualquier otra cosa. La construyó entre 1938 y 1942, en gran medida discutiéndole al arquitecto que había contratado. Él la llamaba \"una casa como yo\".\n\nMirá dos cosas concretas.\n\nLa primera es la escalera. Toda la parte de atrás de la casa es una rampa de escalones trapezoidal e invertida: más ancha arriba que abajo, ensanchándose a medida que sube, hasta desembocar en la azotea. No es una escalera pegada a la casa: la escalera es la casa por ese lado.\n\nY la segunda es lo que hay en la azotea, que es lo mejor: una sola pared blanca, curva, exenta, parada en el medio de la terraza. No sostiene nada, no divide nada, no encierra nada. Es un muro solo.\n\nMalaparte decía que era un paravientos, y también que era una vela.\n\nSi te suena conocida de algún lado y no sabés de dónde, es por Godard. En 1963 filmó \"El desprecio\" —con Brigitte Bardot, Michel Piccoli y Fritz Lang haciendo de sí mismo— y la azotea de esta casa, con esa pared blanca, es prácticamente un personaje de la película. La escena de Bardot tomando sol ahí arriba es la razón por la que medio mundo conoce esta construcción sin saber cómo se llama.\n\nEstá cerrada. Es propiedad privada, no se visita, y solo se llega caminando una hora y media desde Capri o en barco por noventa y nueve escalones tallados en la roca, con permiso.\n\nDesde acá, desde este sendero, es de los mejores lugares para verla. Mejor incluso que desde el mirador al que vas ahora.",

      titulo: "Tres piedras y una lagartija", autor: "", fecha: "",
      guion: "Llegaste al mirador y tenés los Faraglioni de frente. Esta es la postal de Capri y ahora sabés cómo se hizo.\n\nSon tres, y el proceso es el mismo del Arco: el mar se come la roca blanda y deja parada la dura. Estos eran parte del acantilado; el acantilado retrocedió y ellos quedaron ahí, solos, en el agua.\n\nCada uno tiene nombre y cada uno tiene algo.\n\nEl primero, el más cercano, se llama Stella. Ciento nueve metros. Y fijate en un detalle: no está separado de la isla. Sigue unido por debajo. Técnicamente no es una isla, es una punta muy flaca.\n\nEl segundo, el del medio, se llama Faraglione di Mezzo. Unos ochenta metros. Y tiene lo que lo hace famoso: un túnel natural que lo atraviesa de lado a lado. Desde acá se ve el agujero de perfil. Las lanchas pasan por adentro, y hay una costumbre turística de besarse al cruzarlo, que es folklore moderno y no tradición antigua, pero si vas a hacer la vuelta en barco alguna vez, se hace.\n\nEl tercero, el más lejano, se llama Scopolo. Unos ciento cuatro metros.\n\nY ahí vive una lagartija azul.\n\nNo es una manera de hablar. En ese peñón, y en ningún otro lugar del planeta, vive una subespecie de lagartija que se llama Podarcis siculus coeruleus. Es la misma especie de lagartija común que hay en toda Italia, pero esta población quedó encerrada ahí hace miles de años, aislada del resto, y se volvió azul.\n\nLa describió un naturalista alemán en 1872.\n\n¿Por qué azul? La hipótesis más sostenida es térmica: los tonos oscuros absorben mejor el calor y le permiten empezar a cazar más temprano que a sus primas del continente. La otra es camuflaje: en un peñón donde no hay pasto, donde todo es roca gris y mar azul, ser verde es mala idea. Ninguna de las dos está probada.\n\nNo la vas a ver. Al Scopolo no se puede desembarcar, es zona protegida, y está a cientos de metros. Ni con binoculares.\n\nPero está ahí.\n\nUna cosa más sobre el nombre. Faraglione viene del griego pharos, faro. Los antiguos encendían fuego arriba de ellos para orientar a los que navegaban de noche. Eran señalizadores marítimos antes de ser una postal.\n\nAbajo, sobre las rocas, vas a ver dos clubes de playa con sombrillas. Son históricos y son caros. Se baja por una escalera larga desde acá, y a mediados de octubre cierran por temporada.",

      id: "nap5-11", tipo: "parada", orden: 11, sala: "Giardini di Augusto y Via Krupp",
      titulo: "El zigzag del millonario", autor: "Friedrich Alfred Krupp", fecha: "1902",
      guion: "Estos jardines en terrazas cuestan dos euros cincuenta y tienen, con justicia, la vista más fotografiada de la isla: los Faraglioni de un lado, Marina Piccola del otro, y en el medio, pegado al acantilado, un camino que baja haciendo eses imposibles.\n\nEse camino es la Via Krupp, y es por donde vas a bajar en un rato. Antes te cuento de dónde salió, porque es una historia mucho más oscura de lo que el paisaje sugiere.\n\nFriedrich Alfred Krupp era el dueño de la empresa Krupp, la acerera alemana que fabricaba los cañones del imperio alemán. Uno de los hombres más ricos de Europa. Venía a Capri seguido, se alojaba en un hotel de acá arriba, y tenía sus botes amarrados abajo, en Marina Piccola.\n\nEl problema era ir de un lado al otro. Entre el hotel y el agua hay cien metros de acantilado a pico.\n\nAsí que en 1902 pagó para que le construyeran un camino. Se lo hizo un ingeniero italiano, Emilio Mayer, y el resultado es lo que estás mirando: mil cuatrocientos metros de sendero tallado en la roca, de unos dos metros de ancho, bajando cien metros de desnivel en curvas tan cerradas que una pasa casi por encima de la otra. No es una carretera: es un camino a pie, y es célebre como obra de ingeniería por derecho propio.\n\nY el mismo año en que se terminó, Krupp se mató.\n\nLa historia corta es esta: la prensa italiana primero, y después la socialista alemana, publicaron acusaciones sobre su vida privada en Capri. Se armó un escándalo enorme en Alemania, donde era una figura pública de primera línea. Volvió a su país y murió poco después, oficialmente de un derrame. La familia consiguió que se cerrara el asunto rápido y la mayoría de los historiadores considera que fue un suicidio.\n\nO sea que el camino más bonito de la isla lo pagó un fabricante de cañones que se mató el mismo año, y se llama con su apellido.\n\nAhora lo práctico, y es importante.\n\nEsa bajada cierra seguido. Estuvo clausurada nueve años por riesgo de desprendimientos, reabrió, volvió a cerrar un mes en 2024, y cada invierno la cierran por mantenimiento. Y con lluvia o viento fuerte la cierran sin aviso.\n\nSi está abierta, bajás por ahí y son veinte minutos espectaculares.\n\nSi está cerrada, no hay drama pero hay que saberlo: volvés a Capri centro y tomás el bus a Marina Piccola. Son unos veinticinco minutos más de los que tenías previstos.\n\nFijate desde el mirador si hay gente caminando por el zigzag. Si no ves a nadie en todo el trazado, andá preguntando antes de bajar.",
      mirar: [
        "Las curvas se superponen una sobre otra: 1.400 m tallados en la roca para bajar 100.",
        "Lo pagó el dueño de la acerera Krupp, que se mató el mismo año, 1902.",
        "Mirá si hay gente caminando el zigzag. Si no hay nadie, preguntá antes de bajar."

    {
      id: "nap5-12", tipo: "parada", orden: 12, sala: "Marina Piccola",
      titulo: "La roca de las sirenas", autor: "", fecha: "",
      guion: "Llegaste abajo y esta es la última parada del viaje por Nápoles. Tenés hora y media acá y son para usarlas: el agua en octubre todavía anda por los veintidós grados.\n\nY hay un motivo para quedarse hasta tarde que no es solo vaguear. Marina Piccola mira al sur, así que a esta hora tenés el sol de frente y la mejor luz del día. Marina Grande, adonde volvés después, mira al norte y a las cinco de la tarde ya está en sombra. O sea que el atardecer bueno es este, acá, tirado.\n\nDos avisos antes. La playa es de canto rodado, no de arena: si no llevás ojotas o escarpines vas a entrar al agua haciendo equilibrio y puteando. Y hay tramos libres y tramos de clubes privados; los privados son carísimos y no hacen falta para nada.\n\nAhora mirá esa roca que parte la playa en dos, la que se mete en el agua separando las dos ensenadas.\n\nSe llama Scoglio delle Sirene, la roca de las sirenas.\n\nY acá cerramos un círculo que abriste el martes.\n\n¿Te acordás de las tres islitas que viste desde el ferry camino a Positano, Li Galli, y que los griegos llamaban Sirenuse porque decían que ahí vivían las sirenas de la Odisea? Bueno: la tradición local de Capri dice que fue acá. Que en esta roca estaban las sirenas cuando pasó Ulises atado al mástil.\n\nLas dos tradiciones existen y llevan siglos compitiendo, y por supuesto ninguna de las dos se puede probar, porque estamos hablando de un poema.\n\nPero fijate lo que significa esa pelea. Dos lugares distintos del mismo golfo se disputan, desde hace dos mil quinientos años, ser el escenario de una historia que nunca pasó. Y la siguen disputando en serio, con carteles y todo.\n\nEso, más que cualquier otra cosa, es lo que tiene este pedazo de mundo. Acá la mitología no es una decoración para turistas: es catastro. La gente discute dónde estuvieron las sirenas con la misma energía con la que se discute un límite de propiedad.\n\nLevantá la vista un segundo antes de meterte al agua. Desde acá se ven los Faraglioni desde el otro lado, y arriba, en el borde del acantilado, la línea del zigzag por el que bajaste.\n\nY después, cuando vuelvas a Marina Grande con el sol bajo, mirá el golfo por última vez. Cinco días atrás llegaste a esta bahía con las valijas sin saber nada de ella. Caminaste una calle griega, bajaste cuarenta metros bajo tierra, subiste un volcán, viste una ciudad que se paró en el año 79 y otra que se hundió en 1343.\n\nMañana te vas a Roma.",

      guion: "Acabás de dejar las valijas en la consigna y estás caminando por callecitas angostas con el piso de adoquines negros. Esos adoquines se llaman sampietrini, son bloques de basalto, y los tobillos se te los van a acordar toda la tarde. Bienvenido a Roma.\n\nAntes que nada, un aviso: si son cerca de las doce, en cualquier momento vas a escuchar un cañonazo. Un estampido seco, fuerte, que rebota entre los edificios. No pasa nada. Es un cañón del ejército italiano que dispara todos los días al mediodía desde la colina que tenés ahí arriba, la que vas a subir a la tarde. Después te cuento por qué existe.\n\nAhora, el barrio. Mirá las placas de mármol con el nombre de las calles. Arriba de cada una dice «Rione XIII Trastevere». Roma está dividida en veintidós rioni, que son los barrios históricos, y cada cartel lleva el número del suyo. Es el sistema de numeración más viejo de la ciudad.\n\nEl nombre es literal y no tiene nada de poético. En latín, trans Tiberim quiere decir «más allá del Tíber». Es una dirección postal. El que lo decía estaba parado del otro lado, en la Roma de verdad, señalando la orilla de enfrente.\n\nY esa es toda la clave del barrio: durante siglos, Trastevere fue lo que quedaba afuera.\n\nAntes de que Roma existiera, esta orilla era territorio etrusco. Los vecinos, la competencia. Se la llamaba Ripa Etrusca, la orilla etrusca. Los romanos la conquistaron no porque la quisieran sino para controlar el río desde las dos márgenes, y durante mucho tiempo no les interesó vivir acá. Había un solo puente, y era de madera.\n\nAsí que acá terminó viviendo el que no entraba en otro lado: marineros, pescadores, barqueros, gente del puerto, alfareros. Fijate en los nombres de las calles cuando pases por Via dei Vascellari: vascellari son los alfareros. Los nombres de calle de este barrio son el registro laboral de los que vivían en él.\n\nY sobre todo, inmigrantes de oriente. Judíos y sirios. La comunidad judía de Roma vivió acá hasta julio de mil quinientos cincuenta y cinco, cuando el papa Pablo IV la encerró por la fuerza en unas manzanas de la otra orilla. El veintiséis de julio los metieron a todos en una sola calle y dos meses después la amurallaron. Estuvieron encerrados más de trescientos años.\n\nCon los cristianos pasó lo mismo, antes: una religión ilegal de inmigrantes pobres se instala donde nadie mira. La iglesia a la que vamos en un rato reclama ser el primer lugar de culto cristiano oficial de Roma.\n\nY acá viene lo mejor del carácter del barrio. Los trasteverinos se llamaban a sí mismos noantri, que en dialecto romano es noi altri: «nosotros los otros». No era un insulto que les pusieron de afuera: era como se nombraban ellos. Y sostenían que los verdaderos romanos eran ellos, porque estando del lado de afuera se habían mezclado menos, habían recibido menos invasiones, menos cortesanos del papa, menos extranjeros ricos. Un barrio fundado por inmigrantes que dos mil años después se declara el más autóctono de todos. Muy romano.\n\nÚltima cosa, y es un número que conviene tener en la cabeza mientras caminás. Entre dos mil catorce y dos mil diecinueve, en cinco años, Trastevere perdió el cuarenta y tres por ciento de sus habitantes. Lo dice un informe del municipio de Roma. En el mismo período, la población total de la ciudad bajó menos del uno por ciento. O sea que la gente no se fue de Roma: se fue de acá.\n\nLo que vas a ver caminando, los bares, los restaurantes con menú en cuatro idiomas, los alquileres temporarios como el que vos mismo alquilaste, no está al lado del barrio popular. Lo reemplazó.",
      mirar: [
        "Los sampietrini: bloques de basalto negro. Calzado con suela, en serio.",
        "Las placas de las calles: arriba dice «RIONE XIII TRASTEVERE».",
        "Las plantas bajas: arcos tapiados y columnas antiguas metidas en muros modernos.",

      autor: "mosaico del siglo XII",
      fecha: "s. XII, retocado en el XIII",
      guion: "Pará en la plaza antes de entrar y mirá para arriba, a la franja dorada que está encima de las ventanas.\n\nEso es un mosaico. Por si nunca miraste uno de cerca: un mosaico es un dibujo hecho con miles de cubitos de piedra y de vidrio que se llaman teselas. Los dorados son vidrio con una lámina de oro de verdad adentro. Por eso brillan cuando les pega la luz y por eso no se destiñen nunca. Un fresco se apaga en doscientos años; esto tiene ochocientos y sigue encendido.\n\nEn el centro está la Virgen sentada amamantando al Niño. Y a los costados, cinco de cada lado, hay diez mujeres caminando hacia ella con una lámpara en la mano.\n\nAhora mirá las lámparas, una por una. Algunas están encendidas y otras están apagadas. Y fijate en las cabezas: algunas mujeres llevan corona y otras no.\n\nLa lectura de manual es la parábola de las diez vírgenes del evangelio: cinco llevaron aceite para sus lámparas y cinco se olvidaron, y cuando llegó el novio las descuidadas se quedaron afuera. Encaja bien y es lo que te va a decir cualquier guía.\n\nPero conviene decirlo con la duda incluida, porque la lectura está discutida. Algunas de las figuras que deberían ser las «necias» fueron retocadas con bastante torpeza en restauraciones posteriores, y hay especialistas que sostienen que originalmente no eran la parábola en absoluto: que eran mártires romanas, o damas de una corte imperial. Nadie cerró la discusión.\n\nMe gusta más así. Estás mirando diez mujeres con lámparas de hace ochocientos años y ni los que se dedican a esto se ponen de acuerdo en quiénes son.\n\nMirá también el campanario, a la derecha. Es románico, de ladrillo, del siglo doce, y tiene arriba un mosaico chiquito con una Virgen que hay que buscar con los ojos porque está alto y es fácil pasarlo por alto.\n\nY mirá la plaza entera un segundo. La fuente del centro es de las más viejas de Roma en funcionamiento continuo, y los escalones que la rodean son, desde hace siglos, el lugar donde el barrio se sienta. A esta hora vas a ver turistas; de noche vas a ver otra cosa.\n\nUna advertencia práctica antes de entrar: adentro está oscuro y los ojos tardan como un minuto en acostumbrarse. No saques conclusiones del interior durante ese minuto. Esperá parado, dejá que el ojo se abra, y recién después mirá el fondo. La iglesia está construida para eso.",

      fecha: "reconstrucción de 1140-1143",
      guion: "Ya adentro, antes de ir al fondo, mirá los dos fileras de columnas que separan el pasillo central de los laterales.\n\nY ahora fijate en una cosa: no hay dos iguales.\n\nDistinto grosor. Distinto color de granito. Distintos capiteles, que son las piezas talladas de arriba. Si las mirás una por una, vas a ver que la fila entera es un rejunte. Eso no es un descuido ni falta de plata: es una técnica, y tiene nombre.\n\nSe llama spolia, que viene de «despojos». Los romanos medievales que construyeron esta iglesia en el siglo doce no tenían canteras funcionando, no tenían dinero y no tenían la técnica del Imperio. Lo que sí tenían, al lado, era una ciudad imperial entera en ruinas. Así que la desarmaron y se la llevaron.\n\nSe considera que estas columnas vinieron de las Termas de Caracalla. Ojo con esto, porque hay una diferencia entre las fuentes: Wikipedia lo afirma directamente, pero el turismo oficial de Roma dice «probablemente». Quedate con la versión prudente: son columnas romanas paganas recicladas, de uno o varios edificios imperiales. De dónde exactamente, no está cerrado.\n\nHay otra discrepancia divertida, y es de conteo. El turismo de Roma dice que son veintidós columnas de granito. La base de datos especializada sobre las iglesias de Roma dice que son veintiuna, y explica por qué: el campanario ocupa el primer tramo del lado derecho, así que de ese lado falta una. Si tenés cinco minutos y ganas, contálas vos y decidí.\n\nPero lo que quiero que veas es otra cosa. Acercate a los capiteles y mirá bien entre las hojas talladas.\n\nHay caras. Caras humanas asomándose entre las hojas.\n\nSe las identifica como dioses egipcios: Isis, Serapis y Harpócrates. Egipcios en una iglesia cristiana, en Roma, en el siglo doce. Llegaron acá porque venían pegados a las columnas que se robaron, y a nadie le pareció un problema durante setecientos años.\n\nEstán dañadas. Y según la documentación, no las dañó el tiempo: se las mutiló a propósito en una restauración de mil ochocientos sesenta. O sea que aguantaron intactas la caída del Imperio, la Edad Media, el Renacimiento y el Barroco, y las vinieron a romper recién hace ciento sesenta años, cuando alguien decidió que dioses paganos en una iglesia ya no se podía.\n\nEsa es Roma en una columna: un templo pagano, reciclado por cristianos medievales que no tenían prejuicio, y censurado por cristianos modernos que sí.",

      autor: "",
      fecha: "1140-1143",
      guion: "Andá hasta el fondo, hasta el nicho semicircular que está detrás del altar. Eso se llama ábside, y en una iglesia es donde va la imagen que manda sobre todas las demás.\n\nMirá la parte de arriba, la curva. Sobre fondo de oro hay un grupo de figuras, y en el centro dos personas sentadas.\n\nFijate bien en cómo están sentadas: están en el mismo trono. Uno al lado del otro, a la misma altura. Y Cristo tiene el brazo pasado sobre el hombro de ella.\n\nEso es lo raro, y hay que detenerse. En el arte cristiano anterior, María aparece como madre, o como intercesora, o abajo, o arrodillada. Acá está sentada al lado de su hijo, en el mismo asiento, coronada, con el brazo de él encima. Es de las primeras veces en el arte monumental de Roma que se la representa así, y es una declaración: esta iglesia está dedicada a ella y lo está diciendo con la composición, no con un cartel.\n\nAhora buscá, a la izquierda del grupo, a un señor con ropa de obispo que sostiene con las dos manos una maqueta de un edificio.\n\nEse edificio es esta iglesia, y el señor es el papa Inocencio II, que fue el que la mandó reconstruir entre mil ciento cuarenta y mil ciento cuarenta y tres. Era trasteverino de nacimiento, de una familia del barrio, los Papareschi. Por eso está ahí arriba, en el mosaico, sosteniendo su obra como quien muestra una foto. Al lado hay una inscripción que dice, en latín, que «esto lo renovó Inocencio, papa segundo». No era gente tímida.\n\nY ahora bajá la vista a la franja horizontal que corre abajo de todo el ábside. Hay un cordero en el centro y doce ovejas caminando hacia él, seis de cada lado, saliendo de dos ciudades amuralladas.\n\nEl cordero es Cristo. Las doce ovejas son los apóstoles. Las dos ciudades son Jerusalén y Belén. Es un lenguaje de imágenes que ya era antiguo cuando hicieron este mosaico: viene de las basílicas paleocristianas de setecientos años antes. Lo repitieron acá porque servía, porque todo el mundo lo entendía sin saber leer, que es de lo que se trataba.\n\nFijate en el estilo general de todo lo de arriba: las figuras son planas, frontales, están todas quietas y todas mirando al frente. No es torpeza. Es a propósito. No era la época de que las figuras parecieran personas.\n\nAcordate de esto, porque en dos minutos vas a mirar cinco metros más abajo y va a ser otro mundo.",

      autor: "Pietro Cavallini",
      fecha: "1291",
      guion: "Sin moverte del lugar, bajá la vista. Debajo de la gran curva dorada hay seis paneles rectangulares, más chicos, con escenas.\n\nSon de Pietro Cavallini y son del año mil doscientos noventa y uno. Algunos catálogos los fechan unos años más tarde, entre mil doscientos noventa y seis y mil trescientos, pero la fecha mayoritaria es mil doscientos noventa y uno.\n\nLas escenas, en orden, son la vida de la Virgen: su nacimiento, la Anunciación, la Natividad, la Epifanía, la Presentación en el Templo y la Dormición. Y hay un séptimo panel, abajo de la ventana del centro, con el alma de María en brazos de Cristo.\n\nAhora hacé este ejercicio, que es el motivo por el que valía la pena entrar. Mirá arriba. Mirá abajo. Arriba. Abajo.\n\nEntre una cosa y la otra hay ciento cincuenta años.\n\nArriba las figuras son planas y frontales, no ocupan espacio, están pegadas al fondo de oro como recortes. Abajo, en los paneles de Cavallini, las figuras tienen volumen. Se dan vuelta. Se tapan unas a otras. Hay edificios dibujados con profundidad, hay cuerpos que pesan, hay caras con expresión. Alguien se sentó a mirar cómo es una persona parada en una habitación y trató de que se pareciera.\n\nCavallini estaba trabajando en Roma más o menos cuando Giotto empezaba en Asís. Estás mirando el momento exacto en que la pintura europea deja de representar ideas y empieza a mirar el mundo real.\n\nDicho corto: mirá los de arriba y después los de abajo. En esos ciento cincuenta años se inventa el Renacimiento.\n\nUn detalle más antes de seguir. Hay un panel aparte donde San Pedro y San Pablo presentan ante la Virgen a un señor arrodillado, más chico que ellos. Ese señor no es un santo: es Bertoldo Stefaneschi, el que puso la plata. Estaba vivo cuando se hizo el mosaico y quiso salir en él.\n\nNo es vanidad tonta, o no solo. En la Edad Media el que pagaba una obra sagrada compraba con eso una parte del mérito espiritual, y salir retratado adentro era la constancia. Es un recibo hecho de oro y vidrio.\n\nY mirá el techo antes de irte: artesonado dorado, con un octógono pintado en el centro, la Asunción de la Virgen, de Domenichino, mil seiscientos diecisiete. El dibujo geométrico de los casetones no es decorativo: reproduce el escudo de armas de la familia Aldobrandini, que fue la que pagó el techo. Otro recibo, tres siglos después y a cinco metros de distancia.",

    {
      id: "rom1-06",
      tipo: "parada",
      orden: 6,
      sala: "Santa Maria in Trastevere, el presbiterio",
      titulo: "La fuente de aceite",
      autor: "",
      fecha: "el prodigio, 38 a.C.",
      guion: "Antes de salir, buscá en el piso de la zona elevada del altar una inscripción de mármol que dice «FONS OLEI»: fuente de aceite. Está del lado derecho. Hay también una frase en latín que dice, más o menos, «de acá manó aceite cuando Cristo brilló desde la Virgen».\n\nEsta es la mejor historia del día, porque el hecho es real y la interpretación es inventada.\n\nEl hecho primero. El historiador cristiano Orosio, en el siglo quinto, escribió esto en latín: que en aquellos días, del otro lado del Tíber, de una posada brotó de la tierra una fuente de aceite, y que fluyó todo el día en un caudal abundantísimo.\n\nFijate en el detalle que hace toda la diferencia: la fuente antigua menciona la posada por su nombre, la taberna meritoria, que era el lugar donde paraban los soldados retirados y que estaba exactamente acá. No es una invención medieval. El prodigio lo registran también Casio Dión y Eusebio. La fecha que se le suele asignar es el año treinta y ocho antes de Cristo.\n\nAhora la interpretación. Los romanos anotaban los prodigios raros como presagios; era rutina administrativa, casi burocracia. Un siglo más tarde, los autores cristianos releyeron este en particular y la cuenta les cerró sola: «Cristo» quiere decir «el ungido», ungido con aceite. Entonces una fuente de aceite brotando en Roma tenía que haber anunciado su nacimiento. Y con el tiempo la historia se fue corriendo de «años antes» a «el día mismo».\n\nEl problema es aritmético y conviene decirlo: el año treinta y ocho antes de Cristo es, justamente, unos treinta y ocho años antes de Cristo. Las cuentas no dan. Y el propio Orosio escribe «en aquellos días», no «ese día».\n\nO sea: sí, brotó algo acá, y está anotado por historiadores romanos. Lo que no cierra es la fecha. La mancha de aceite es histórica; el milagro se lo agregaron después.\n\nY por si te interesa lo material: en el Lazio hay pequeños yacimientos de petróleo, el mayor a unos setenta kilómetros. Una filtración de hidrocarburo en esta zona no es imposible en absoluto.\n\nAprovecho para cerrar la cuestión de la fundación, que va en la misma línea. La tradición dice que hacia el año doscientos veinte el papa Calixto primero fundó acá una iglesia doméstica sobre el sitio de esta misma posada. Pero la historia documentada dice otra cosa: el registro oficial de los papas atribuye la basílica al papa Julio primero, que gobernó entre el trescientos treinta y siete y el trescientos cincuenta y dos. En un sínodo del año cuatrocientos noventa y nueve figura como «la iglesia de Julio», y recién casi un siglo más tarde aparece con los dos nombres. La arqueología acompaña una fundación de mediados del siglo cuarto.\n\nAsí que Calixto es tradición posterior y Julio es el fundador documentado. La iglesia es del siglo cuarto, que ya es una barbaridad; la parte del siglo tercero es reclamo, no dato.\n\nHay una última anécdota buenísima que conviene contar como lo que es. Dice que hubo un pleito entre los cristianos y los dueños de la taberna por este terreno, y que el emperador Alejandro Severo falló a favor de los cristianos diciendo que era mejor que ahí se adorara a un dios de cualquier manera antes que se siguiera bebiendo. Es una gran historia. Viene de la Historia Augusta, que es una fuente célebre por estar llena de invenciones. Contala en la mesa, no en un examen.",
      mirar: [

        "La frase latina: «Hinc oleum fluxit, cum Christus Virgine luxit».",

    {
      id: "rom1-07",
      tipo: "parada",
      orden: 7,
      sala: "Piazza Trilussa",
      titulo: "La fuente que se mudó",
      autor: "Giovanni Fontana y Giovanni Vasanzio",
      fecha: "1613, rearmada acá en 1898",
      guion: "Estás en Piazza Trilussa, al pie de Ponte Sisto. Esta plaza es el living de Trastevere, y hay tres cosas para mirar.\n\nPrimero, la escalinata. Quince escalones, ancha, orientada hacia la plaza. Funciona como una tribuna, y es literalmente el mueble más usado del barrio. Si volvés esta noche, y vas a volver porque el departamento está a la vuelta, no vas a poder sentarte: va a estar cubierta de gente joven de pie con una cerveza en la mano. Es la plaza del botellón romano y hay conflictos crónicos con los vecinos por el ruido.\n\nLas razones de que sea el punto de encuentro son físicas y bastante obvias cuando las mirás: la escalinata es una tribuna gratis desde donde ves a la gente pasar; estás al pie de Ponte Sisto, que es peatonal y es la puerta natural de entrada al barrio desde el centro; es de las pocas superficies abiertas y planas de un barrio que es todo callecitas; y no hay mesas, así que no consumís nada. Es plaza pública, no negocio. En una ciudad donde sentarse cuesta plata, eso alcanza.\n\nSegundo, la fuente de arriba de la escalinata: un arco grande en el medio, dos columnas a los costados y un escudo papal arriba. Mirá el escudo: hay un águila y un dragón. Es el escudo de la familia Borghese. Guardá esos dos bichos en la cabeza, porque los vas a volver a ver dentro de una hora, allá arriba en la colina, en una fuente cinco veces más grande.\n\nPorque son hermanas. Las dos las mandó hacer el mismo papa, Pablo quinto, de la familia Borghese, y las dos son bocas de salida del mismo acueducto, el Acqua Paola. Una arriba en el Gianicolo, del lado derecho del río; esta, del lado izquierdo.\n\nY esta fuente es, además, una mudanza. Se construyó en mil seiscientos trece, pero no acá: estaba enfrente, al final de Via Giulia, en la otra orilla, mirando hacia este puente. En mil ochocientos setenta empezaron a levantar los muraglioni, los muros enormes de contención del Tíber para que Roma dejara de inundarse, y la fuente estorbaba. La desarmaron. Quedó hecha pedazos casi treinta años, hasta que en mil ochocientos noventa y ocho un arquitecto la rearmó de este lado del río con las piezas que habían sobrevivido, sobre esta plataforma con quince escalones. La escalinata donde se sienta medio Trastevere existe porque hubo que inventarle un zócalo a una fuente mudada.\n\nY tercero, el busto de bronce que le da nombre a la plaza. Trilussa era Carlo Alberto Salustri, mil ochocientos setenta y uno a mil novecientos cincuenta, y «Trilussa» es el anagrama de su apellido: Salustri, Trilussa, las mismas letras.\n\nEscribía en romanesco, el dialecto de Roma, y escribía fábulas: animales que hablan, como Esopo. Solo que sus animales eran políticos, curas, burócratas y vecinos. Y esto es lo importante: bajo el fascismo, escribir que un zorro le dijo algo a una gallina era una manera de decir en voz alta cosas que no se podían decir de frente. Era enormemente popular, de esos poetas que la gente cita en el bar sin saber que los está citando.\n\nLo nombraron senador vitalicio muy poco antes de morir, en diciembre de mil novecientos cincuenta, y murió pocas semanas después. La versión que circula en Roma es que comentó que el nombramiento le llegaba tarde. No pude confirmar la frase, así que te la paso como lo que es: lo que cuentan.\n\nEl monumento es de Lorenzo Ferri y lo inauguraron el veintiuno de diciembre de mil novecientos cincuenta y cuatro, el aniversario de su muerte. Abajo tiene tallados versos de un poema suyo.",
      mirar: [

      guion: "Estás subiendo el Gianicolo. Son veinte minutos y es cuesta arriba todo el tiempo, así que te cuento algo mientras tanto para que no pienses en las piernas.\n\nRoma es la ciudad de las siete colinas. Es de las cosas que uno aprende en la escuela y no vuelve a revisar nunca. Las siete son el Palatino, el Capitolino, el Quirinal, el Viminal, el Esquilino, el Celio y el Aventino.\n\nEl Gianicolo no está en la lista.\n\nY acá viene la ironía: el Gianicolo es más alto que cualquiera de las siete. Ochenta y ocho metros. Algunas guías dan ochenta y dos, pero la fuente italiana más consistente da ochenta y ocho. Es el punto más alto que hay dentro de las murallas de Roma. Monte Mario es más alto todavía, ciento treinta y nueve metros, pero está afuera de todo y no juega.\n\nEntonces, ¿por qué no cuenta? Por una razón burocrática, que es la mejor clase de razón romana: está del lado equivocado del río.\n\nLas siete colinas están todas en la orilla izquierda, adentro de lo que los romanos consideraban la ciudad. Esta está de este lado, con los etruscos, con los marineros, con los inmigrantes. Técnicamente: quedó afuera de las Murallas Servianas, que es el recinto antiguo de la ciudad. Recién quedó parcialmente adentro con las Murallas Aurelianas, que se construyeron en el siglo tercero después de Cristo, más de setecientos años después de la fundación.\n\nPara cuando el Gianicolo entró, la lista ya estaba escrita hacía siglos y nadie la iba a tocar.\n\nDicho de otro modo: la colina más alta de Roma no es una de las siete colinas de Roma, porque el club se cerró antes de que esta clasificara.\n\nEl nombre también tiene su asterisco. La tradición lo deriva de Jano, el dios de las dos caras, el que mira para adelante y para atrás al mismo tiempo. Es lindo y todos lo repiten. Pero la etimología está discutida, y el único culto que está efectivamente documentado en esta colina es el de Fons, una divinidad menor de las fuentes y los manantiales. Cosa que, para una colina que tiene arriba la boca de un acueducto, no está mal como coincidencia.\n\nArriba te esperan cuatro cosas: una fuente enorme, la mejor vista de Roma, una colección de ochenta y cuatro caras de mármol con las narices rotas, y un faro. Un faro de verdad, en el medio de Roma, a treinta kilómetros del mar.\n\nEse faro lo pagaron argentinos. Pero eso te lo cuento cuando llegues.",
      mirar: [
        "Son 20 minutos de subida. Tomatelo con calma.",
        "88 metros: más alto que cualquiera de las siete colinas, y no es una de ellas.",

    {
      id: "rom1-09",
      tipo: "parada",
      orden: 9,
      sala: "Fontana dell'Acqua Paola (il Fontanone)",
      titulo: "El cartel de piedra",
      autor: "Giovanni Fontana y Flaminio Ponzio",
      fecha: "1610-1614",
      guion: "Antes de mirarla, cerrá los ojos treinta segundos y escuchá.\n\nEl caudal es una barbaridad. Y no es casualidad: esta fuente está diseñada para que el agua se escuche antes de verse. Era parte del efecto.\n\nAhora abrí los ojos. Cinco arcos, tres grandes en el medio y dos chicos a los costados. Seis columnas. Arriba, una franja horizontal con una inscripción latina gigante. Y en lo más alto, el escudo papal.\n\nMirá el escudo. Otra vez el águila y el dragón. Los Borghese. Los mismos que viste hace un rato en Piazza Trilussa, abajo. Están repetidos por toda la fachada: buscálos en los laterales.\n\nAhora, lo que esto es. No es una fuente decorativa. Es el punto de llegada de un acueducto. En latín eso se llama una mostra, una «muestra»: el cartel monumental que anuncia que el agua llegó a la ciudad. Toda fuente romana grande es el final de un caño.\n\nEl caño en este caso lo construyó el emperador Trajano en el año ciento nueve después de Cristo, trayendo agua de la zona del lago de Bracciano. Después se rompió y estuvo abandonado durante siglos. El papa Pablo quinto lo mandó restaurar en mil seiscientos ocho y, con una modestia notable, lo rebautizó con su propio nombre: Acqua Paola. Y después construyó esto, entre mil seiscientos diez y mil seiscientos catorce, para que no quedara ninguna duda de quién lo había arreglado.\n\nAsí que: esta fuente celebra que el agua volvió. Un acueducto del emperador Trajano, del año ciento nueve, que estuvo roto mil quinientos años, y un papa que lo arregló y puso este cartel de piedra gigante al lado.\n\nY ahora la mejor parte, que además la confirma la Superintendencia de Roma, o sea que no es chisme.\n\nMirá el mármol blanco. Vino del Foro Romano y del Templo de Minerva, en el Foro de Nerva. Sí: desarmaron un templo romano imperial para revestir esta fuente.\n\nY mirá las columnas: no son de mármol blanco, son de granito rojo y gris. Fijate en el color y en la textura. Esas columnas vienen de la vieja Basílica de San Pedro, la que había construido Constantino en el siglo cuarto y que demolieron para hacer la actual.\n\nSumalo: mirando esta sola fachada estás viendo piezas de un templo pagano del siglo primero y de la primera basílica de San Pedro del siglo cuarto, reensambladas en mil seiscientos doce para anunciar un acueducto del año ciento nueve. Cuatro capas de reciclaje en un edificio.\n\nY hay un error. La inscripción enorme del ático atribuye el agua al acueducto Alsietino, cuando en realidad es el de Trajano. Un error grabado en letras de un metro, hace cuatrocientos años, que nadie corrigió nunca.\n\nDos detalles más. La pileta enorme de mármol blanco de abajo no es original: al principio había cinco piletones chicos, uno bajo cada arco, y Carlo Fontana los reemplazó por esta sola entre mil seiscientos noventa y mil seiscientos noventa y tres. Y desde mil novecientos uno hasta los años treinta, el agua de esta fuente alimentó la primera central hidroeléctrica de Roma.\n\nAh, y si alguna vez viste «La gran belleza», de Sorrentino, la que ganó el Oscar: la película arranca exactamente acá. Esta fuente y esta terraza son el primer plano del film.",

        "El mármol blanco vino del Foro Romano y del Templo de Minerva.",

    {
      id: "rom1-10",
      tipo: "parada",
      orden: 10,
      sala: "Piazzale Giuseppe Garibaldi, la balaustrada",
      titulo: "Cómo leer Roma desde arriba",
      autor: "",
      fecha: "",
      guion: "Pará en la balaustrada, del lado derecho del monumento mirando hacia la ciudad. Este es el punto más alto que hay dentro de las murallas de Roma y la terraza más despejada de todo el paseo.\n\nAntes de nada, una corrección que te ahorra un papelón, porque es el error clásico acá arriba: la cúpula de San Pedro no está enfrente tuyo. Está atrás.\n\nEste balcón mira al este, sobre el centro histórico. San Pedro queda a un kilómetro y pico al nor-noroeste, o sea a tus espaldas y a la izquierda. No entra en el panorama principal. Si la querés ver, tenés que darte vuelta y caminar un rato hacia el norte por el paseo, en dirección al faro, hasta que los árboles y el relieve dejen de taparla. Doscientos, cuatrocientos metros. Buscá el claro entre los árboles.\n\nAhora, el panorama de adelante. Es una masa enorme y desordenada de techos ocres y cuesta saber dónde mirar, así que te doy un orden.\n\nEmpezá siempre por el ancla. Buscá un edificio enorme de mármol blanco brillante, con columnas y con dos carros tirados por caballos de bronce arriba. Es imposible confundirlo: es lo único blanco en un mar de ocre y ladrillo. Ese es el Vittoriano, el monumento a Víctor Manuel segundo. Los romanos lo llaman «la máquina de escribir» o «la torta de bodas» y en general lo detestan. Una vez que lo ubicás, todo lo demás se ordena en relación a él.\n\nA la izquierda del Vittoriano están las cúpulas. Roma tiene decenas y todas parecen la misma, así que la técnica es mirar la forma.\n\nLa cúpula grande y clara del centro-izquierda, con tambor alto y una torrecita arriba, es Sant'Andrea della Valle. Es la segunda cúpula más grande de Roma después de San Pedro.\n\nY ahora el juego difícil, que es encontrar el Panteón. Truco: no busques una cúpula. El Panteón es una semiesfera baja, gris, achatada, sin torrecita y sin tambor. Parece un platito dado vuelta entre los techos. Justamente porque no parece una cúpula monumental es como se lo reconoce. Tiene casi dos mil años y sigue siendo la cúpula de hormigón sin refuerzo más grande del mundo.\n\nCerca del río, buscá una cúpula de planta cuadrada, de metal claro. Es única en la silueta de Roma: es la única cuadrangular. Es la Sinagoga.\n\nA la izquierda del todo: un cilindro macizo junto al río, el Castel Sant'Angelo, y más allá la mancha verde en alto, que es el Pincio y Villa Borghese.\n\nA la derecha: el palacio del Quirinal, que es donde vive el presidente de Italia; la Torre delle Milizie, una torre medieval de ladrillo que está visiblemente inclinada; y al fondo, la curva del Coliseo.\n\nHonestidad sobre esta lista: la estructura general, con el Pincio a la izquierda, las cúpulas en el medio y el Coliseo a la derecha, está documentada. La identificación monumento por monumento la armé con la geografía y con lo que traen las guías; es correcta, pero no me la des como si la dijera el ayuntamiento.\n\nY una última cosa, que es la que más se nota cuando te la señalan. No hay un solo rascacielos. Es una masa baja y plana de techos de la que sobresalen únicamente cúpulas y campanarios. No es casualidad: Roma tiene límites de altura en el centro histórico desde hace más de un siglo. El perfil que estás mirando es esencialmente el mismo que el de un grabado del siglo dieciocho.",
      mirar: [
        "🔴 San Pedro NO está enfrente: está a tus espaldas. Caminá al norte para verla.",
        "Empezá por el Vittoriano: enorme, blanco, con carros de bronce arriba. Es el ancla.",
        "El Panteón: NO busques cúpula. Buscá un platito gris achatado entre los techos.",
        "La Sinagoga: la única cúpula de planta cuadrada de Roma. Cerca del río.",
