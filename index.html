      "autor": "",
      "fecha": "1565, y 1936-1950",
      "guion": "Estás en una calle que llama la atención por una razón rara: es recta. En el centro de Roma eso no pasa casi nunca.\n\nNo es casualidad. Borgo Pio se fundó de cero, con una bula del papa Pío cuarto del cinco de diciembre de mil quinientos sesenta y cinco. Se llamaba Civitas Pia, la ciudad de Pío. Calles paralelas, el nivel del suelo levantado a propósito para que no la alcanzaran las crecidas del Tíber, y cloacas subterráneas desde el primer día. Es ingeniería del siglo dieciséis, no un barrio que creció solo.\n\nY un detalle que está en las fuentes y que nadie cuenta: para poblarla rápido, Pío cuarto ofreció franquicias a quien construyera casa acá, y en particular a las cortesanas.\n\nAhora mirá para el lado del río. A doscientos metros hay una avenida ancha, con veintiocho faroles en forma de obelisco, catorce por lado, que va derecho a la plaza de San Pedro. Se llama Via della Conciliazione y es la cicatriz más grande de este barrio.\n\nHasta mil novecientos treinta y seis, ahí no había una avenida: había una manzana larga y angosta de casas medievales llamada la Spina di Borgo, la espina. A los dos lados corrían dos calles apretadas, y el efecto era que venías caminando por un pasillo oscuro y de golpe se te abría la plaza de Bernini entera encima. Era el efecto que Bernini había calculado.\n\nMussolini dio el primer golpe de pico el veintinueve de octubre de mil novecientos treinta y seis, desde una terraza. Algunas fuentes dicen el veintiocho, que es el aniversario de la Marcha sobre Roma y queda más redondo; la mayoría dice veintinueve.\n\nLo que se demolió: la iglesia de San Giacomo Scossacavalli y con ella la plaza entera de Scossacavalli, que desapareció del mapa; la iglesia de San Michele; la casa de Giacomo da Brescia, atribuida a Rafael; el Palazzo degli Alicorni; el palacio del gobernador del Borgo. Al ocho de octubre de mil novecientos treinta y siete llevaban demolidos seiscientos mil metros cúbicos de edificación. A la gente la mandaron a las borgate de las afueras y a la Garbatella.\n\nDos cosas sobrevivieron mudándose. Los palacios Convertendi y Rusticucci se desarmaron y se rearmaron sobre la calle nueva. Y la fuente de Maderno que estaba en Piazza Scossacavalli se llevó adelante de Sant'Andrea della Valle, donde sigue: si pasan por ahí, esa fuente es una refugiada.\n\nLa avenida terminó en mil novecientos cincuenta. Y logró exactamente lo contrario de lo que decía buscar: le sacó a la plaza el efecto sorpresa y le tapó la cúpula desde lejos.\n\nPor eso, cuando terminen de comer, no vayan por la Conciliazione. Vayan por el medio de Borgo Pio hasta el final y salgan de golpe a la plaza. Eso es lo que se demolió.",

      "fecha": "1656-1667",
      "guion": "Estás haciendo la cola bajo la columnata, que es el mejor lugar del mundo para estar parado sin hacer nada. Aprovechemos.\n\nLa hizo Bernini entre mil seiscientos cincuenta y seis y mil seiscientos sesenta y siete, para Alejandro séptimo. Once años. Travertino de Tívoli: cuarenta y cuatro mil metros cúbicos de piedra.\n\nSon doscientas ochenta y cuatro columnas de dieciséis metros, en cuatro filas, más ochenta y ocho pilastras. Digo doscientas ochenta y cuatro porque es el número del Vaticano y de todas las fuentes italianas; la Wikipedia en inglés dice doscientas cuarenta y ocho y no explica por qué. Tocá una: están a treinta centímetros tuyos y son las mismas que en las fotos se ven diminutas.\n\nArriba tuyo, en la balaustrada, hay estatuas de santos de más de tres metros. Son ciento cuarenta, y eso no es una estimación: hay una serie de grabados del siglo dieciocho que se titula, literalmente, «las ciento cuarenta estatuas de santos y santas esculpidas por la escuela de Bernini». El título del grabado es la mejor fuente que existe. Ojo con las guías: circulan noventa y seis, noventa y ocho y ciento sesenta y dos, todos sin respaldo. Y no son de Bernini: son de su escuela y de otros, empezadas por Alejandro séptimo y continuadas por sus sucesores durante décadas.\n\nBuscá también los seis escudos gigantes de Alejandro séptimo sobre la columnata. Se cuentan desde acá.\n\nY ahora el truco, que es lo que hay que hacer sí o sí antes de entrar. Hay dos losas de mármol blanco en el piso de la plaza, una entre el obelisco y cada fuente, con las palabras «CENTRO DEL COLONNATO» grabadas. Pará encima de una.\n\nDesde ese punto exacto, las cuatro filas de columnas se alinean y se ven como una sola. Las otras tres desaparecen. Das dos pasos al costado y vuelven a aparecer. Eso está calculado: Bernini construyó dos puntos en el mundo desde los cuales su propia obra se ve más simple de lo que es.\n\nUn dato para no repetir: casi todo el mundo dice que esos discos son de pórfido. La página oficial del Vaticano dice mármol blanco de veinte centímetros de espesor. El pórfido rojo famoso es otro, está adentro de la basílica y lo vas a pisar más tarde.\n\nÚltima cosa mientras esperás. Las dos fuentes parecen gemelas y no lo son. La del norte, la de tu derecha mirando la fachada, es de Carlo Maderno; la del sur es de Carlo Fontana, inaugurada en mil seiscientos setenta y siete. La única diferencia visible es el escudo: Pablo quinto Borghese en una, Clemente décimo en la otra. Y el chiste es que Carlo Fontana, que la hizo, le atribuyó la autoría a Bernini. De ahí vienen trescientos años de confusión sobre quién la firmó.",

      "guion": "El obelisco del medio de la plaza es el único de Roma que no tiene un solo jeroglífico. Está mudo: no dice quién lo mandó hacer ni para quién.\n\nViene de Egipto, de Heliópolis, y pasó por Alejandría. Lo trajo Calígula, en el treinta y siete o el cuarenta después de Cristo, para la spina de su circo, que después fue el circo de Nerón. Veinticinco metros y medio de granito, cuarenta con la base y la cruz, trescientas veintisiete toneladas.\n\nY acá está el punto que hace que esta piedra importe. El circo de Nerón estaba acá abajo, a unos doscientos cincuenta metros de donde estás. Es el lugar donde la tradición sitúa la ejecución de Pedro. Este obelisco ya estaba parado ahí ese día. Es el único objeto grande de esta plaza que estuvo presente.\n\nEn mil quinientos ochenta y seis Sixto quinto decidió moverlo los doscientos cincuenta metros hasta el eje de la basílica nueva. Lo hizo Domenico Fontana: novecientos hombres, setenta y cinco caballos, cuarenta cabrestantes, trece meses de preparativos. Se bajó en abril y se levantó el diez de septiembre. Fontana publicó el relato entero en mil quinientos noventa y se puede leer hoy.\n\nLa parte que sí está en ese relato: Fontana consiguió permiso para cerrar la plaza y prohibir cualquier ruido o palabra bajo pena de muerte, con una horca levantada ahí mismo para que quedara claro.\n\nLa parte que todo el mundo cuenta y que no está documentada: que un marinero de Sanremo gritó «¡agua a las sogas!» al ver las cuerdas recalentándose, y que el papa lo premió con el privilegio hereditario de proveer las palmas del Domingo de Ramos. El sitio histórico de Sanremo, que es el que más ganas tendría de que fuera cierto, admite por escrito la ausencia total de documentos. Ni el nombre está fijo: lo llaman Benedetto y Giacomo. Ni la frase: unos dicen «alle funi» y otros «alle corde». Lo que sí es cierto es que las palmas de Sanremo siguen llegando al Vaticano cada año. Lo que no está probado es el nexo.\n\nArriba tenía un       "fecha": "1607-1614",
      "guion": "Mirá la fachada y después mirá arriba, buscando la cúpula. Y ahora caminá veinte pasos hacia adelante y volvé a buscarla.\n\nSe fue. Cuanto más te acercás, menos cúpula ves, hasta que desaparece entera detrás del ático.\n\nEso no es un efecto óptico ni una ilusión: es un error de diseño, y es el más famoso de la historia de la arquitectura.\n\nMiguel Ángel había pensado esta iglesia en planta de cruz griega, con los cuatro brazos iguales y la cúpula en el centro, parada sola, visible desde cualquier punto. Pablo quinto decidió alargar el brazo de adelante para tener una nave larga, a la manera tradicional, y le encargó la fachada a Carlo Maderno entre mil seiscientos siete y mil seiscientos catorce.\n\nCiento catorce metros con sesenta y nueve de ancho. Unos cuarenta y cinco y medio de alto hasta la cornisa. Es una pantalla enorme, y funciona exactamente como una pantalla: tapa lo que está detrás.\n\nEl crítico Cesare Brandi la describió como un cierre, una barricada amorfa, y dijo que la cúpula queda cortada por la fachada. Es duro, pero parado acá se entiende.\n\nY conviene decir algo a favor de Maderno: el que decidió alargar la nave fue el papa, no él. Maderno resolvió un encargo imposible, y la cornisa de un edificio de esta escala no admite muchas soluciones.\n\nDos cosas para mirar.\n\nPrimero, la balaustrada de arriba: trece estatuas. Cristo, Juan Bautista y once apóstoles. Falta uno, y es el titular: Pedro no está ahí arriba, está abajo, en el atrio, a la altura de la gente.\n\nSegundo, leé la inscripción del friso. Dice: IN HONOREM PRINCIPIS APOSTOLORUM, PAULUS QUINTUS BURGHESIUS ROMANUS, PONTIFEX MAXIMUS, ANNO MDCXII, PONTIFICATUS SEPTIMO.\n\nO sea: en honor del príncipe de los apóstoles, Pablo quinto Borghese, romano, pontífice máximo, año mil seiscientos doce, séptimo de su pontificado.\n\nFijate qué es lo que ocupa el centro del friso, en letras enormes, en nominativo: el nombre del papa y su apellido de familia. El nombre de Cristo no aparece en ninguna parte de esa inscripción. Circula mucho la idea de que fue un escándalo de época; eso no está documentado en ningún lado y probablemente sea una lectura moderna. Pero lo que se lee, se lee.\n\nY un aviso para después, porque es de las confusiones más repetidas de Roma: el efecto famoso de la cúpula que se aleja mientras caminás hacia ella no es este, es el de Via Piccolomini, en el Gianicolo, a tres kilómetros. Son dos cosas distintas. Esta simplemente se esconde.",

      "sala": "La subida a la cúpula, entre las dos cáscaras",
      "titulo": "Caminar adentro de una pared",
      "autor": "Michelangelo y Giacomo Della Porta",
      "fecha": "1547-1593",
      "guion": "Estás subiendo, así que voy directo a lo que estás pisando.\n\nEsta cúpula tiene dos cáscaras de ladrillo, una adentro de la otra, con un hueco en el medio. Y el hueco es por donde estás caminando. El pasillo de la última parte no está al lado del muro: es el muro. Por eso el piso se te inclina y la pared te empuja el hombro. Estás adentro de la estructura.\n\nSon quinientos cincuenta y un escalones en total, o trescientos veinte si pagaste el ascensor. El ascensor llega hasta la terraza y nada más: los trescientos veinte de la cúpula se hacen a pie, todos, y no hay atajo. El último tramo es una escalera de caracol de una sola persona de ancho, con una soga en vez de baranda.\n\nMiguel Ángel tomó esta obra en mil quinientos cuarenta y siete, a los setenta y un años, y murió en mil quinientos sesenta y cuatro con solo el tambor levantado. Dejó un modelo de madera, hecho entre mil quinientos cincuenta y ocho y mil quinientos sesenta y uno, y lo que no dejó fue el detalle constructivo: era escultor, no ingeniero.\n\nGiacomo Della Porta y Domenico Fontana la levantaron entre junio de mil quinientos ochenta y ocho y mayo de mil quinientos noventa. Veintidós meses, ochocientos obreros. La bola y la cruz se colocaron el dieciocho de noviembre de mil quinientos noventa y tres.\n\nSe suele contar que Miguel Ángel la quiso semiesférica y que Della Porta lo traicionó peraltándola. Es demasiado simple: el propio Miguel Ángel dibujó perfiles ovoidales y su intención final es ambigua. Lo que sí está medido es que Della Porta levantó la línea de arranque cuatro metros con ochenta y afinó las dos cáscaras, y que eso bajó las tensiones de tracción un cuarenta por ciento. No fue una traición estética: fue una corrección estructural.\n\nY hacía falta. En mil seiscientos tres aparecieron las primeras grietas, y en mil setecientos cuarenta y dos el daño era alarmante. Benedicto catorce convocó a tres matemáticos, que en mil setecientos cuarenta y tres midieron el ancho de las grietas y calcularon el empuje. Fue la primera vez que se aplicó el cálculo estructural moderno a un edificio ya construido.\n\nOtro, Giovanni Poleni, estuvo en desacuerdo y armó un modelo con una cadena colgando y bolitas de plomo para encontrar la curva de equilibrio. De ahí salió un teorema que se sigue usando: si la línea de empuje cae entera dentro de la fábrica, el edificio está estable.\n\nResultado: seis anillos de hierro nuevos entre mil setecientos cuarenta y tres y mil setecientos cuarenta y ocho, sobre los tres que ya tenía. Cuidado con el número, porque las fuentes dan cuatro, cinco, seis y diez, y varias confunden anillos agregados con anillos reemplazados a lo largo de los siglos. La cúpula que estás subiendo está zunchada como un barril.\n\nCuando pases por el nivel interior, asomate al tambor y mirá las letras del anillo: TU ES PETRUS. Miden un metro cuarenta y uno, en mosaico turquesa sobre oro, hechas en mil seiscientos cinco. Las guías dicen dos metros; el dato del Studio del Mosaico Vaticano es un metro cuarenta y uno. Desde el piso parecen del tamaño de una mano.",

      "guion": "Llegaste. Recuperá el aire y después mirá.\n\nEstás a ciento diecisiete metros del piso de la basílica; la cruz que tenés encima está a más de ciento treinta y tres. Es la cúpula de fábrica más alta del mundo.\n\nY acá va el dato que conviene decir en voz alta, porque es al revés de lo que todos suponen: en diámetro, esta cúpula es la más chica de las tres grandes.\n\nSan Pedro mide entre cuarenta y uno y medio y cuarenta y dos metros y medio de diámetro interno, según a quién le creas: las fuentes no se ponen de acuerdo ni en eso. El Panteón mide cuarenta y tres con tres. La de Brunelleschi en Florencia, cuarenta y cinco y medio.\n\nO sea que después de un siglo y medio, con Miguel Ángel a cargo, Roma no consiguió superar en ancho ni al Panteón del emperador Adriano ni a la catedral de Florencia. Lo que hizo fue levantarla mucho más alto. Perdieron el ancho y se llevaron la altura.\n\nHay una trampa en la comparación y conviene saberla: la de Florencia es octogonal, así que sus cuarenta y cinco metros y medio son la luz entre caras, no un círculo. Por eso las fuentes se pelean eternamente sobre cuál es la más grande. La respuesta honesta es: depende de qué midas.\n\nY el Panteón, que perdió en altura, sigue teniendo un récord que nadie le sacó en mil novecientos años: es la cúpula de hormigón sin armar más grande del mundo.\n\nAhora, la vista. Buscá tres cosas.\n\nAbajo, la plaza: desde acá arriba se ve el óvalo de Bernini completo y se entiende de una que la columnata son dos brazos abiertos. Ese era el punto.\n\nA la derecha, los Jardines Vaticanos, que es prácticamente todo el país. Del lado de allá está la muralla de León cuarto, del año ochocientos cincuenta y dos: tres kilómetros de muro con cuarenta y cuatro torres, levantados a las apuradas después de que los sarracenos saquearan la basílica en el ochocientos cuarenta y seis. Se construyó con mano de obra romana, campesinos y prisioneros sarracenos capturados en Ostia. Es la única ampliación z y le astilló un párpado. Juntaron más de cien fragmentos y la restauraron con cola y polvo de mármol de Carrara. Volvió a exhibirse diez meses después.\n\nY un dato que casi ninguna guía tiene: el vidrio que estás mirando no es el del setenta y tres. Lo cambiaron entero en noviembre de dos mil veinticuatro. Nueve paneles de veinticuatro milímetros y medio, tres mil cuatrocientos kilos, y una iluminación nueva diseñada para esta capilla. Se ve bastante mejor que en cualquier foto anterior.\n\nLa firma, a esta distancia, es muy difícil de leer a ojo pelado. Sacale una foto con zoom y miralas después.\n\nY antes de irte, mirá hacia la última puerta de la derecha de la fachada: esa es la Puerta Santa. León catorce la cerró el seis de enero de dos mil veintiséis y diez días después la tapiaron con ladrillo por dentro, con una cápsula de bronce adentro del muro que tiene el acta del cierre, las monedas del Año Santo y las llaves de la puerta. No se vuelve a abrir hasta dos mil cincuenta.",

papeles y contado ochenta bombardas.\n\nAsí que la próxima vez que alguien te diga que estás mirando el Panteón fundido, sabés dos cosas mejores: que no, y que el metal de verdad salió de arriba tuyo, de la propia cúpula.\n\nMirá el color. Lo restauraron entero entre febrero y octubre de dos mil veinticuatro, la primera vez desde mil setecientos cincuenta y ocho: doscientos sesenta y seis años. Salió un contraste que estaba tapado por el hollín de las velas: el oro brillando y el bronce en un tono cuero. Entre los escombros del andamio encontraron la suela de un zapato de chico y una lista de compras del siglo dieciocho.\n\nY bajá la vista a los pedestales de mármol de las columnas. Hay escudos de los Barberini con las abejas, y sobre cada uno una cara de mujer que cambia de expresión de pedestal en pedestal, hasta terminar en una cabeza de bebé. La historia de guía dice que es el parto de una sobrina del papa. No hay un solo documento. La lectura del Vaticano es alegórica: la Iglesia madre pariendo. Pero las caras están, y se siguen con los ojos en treinta segundos.",

      "guion": "Debajo del altar hay una figura de mármol blanco, acostada de lado, chiquita. Un metro treinta y uno de largo, mármol pentélico, Stefano Maderno, año mil seiscientos, hecha para el Jubileo.\n\nMirá la posición, que es lo primero que desconcierta. No está tendida como una estatua funeraria clásica, con las manos cruzadas. Está caída sobre el lado derecho, con las rodillas dobladas, y la cabeza girada hacia el piso, de espaldas a vos. No le vas a ver la cara. No se puede.\n\nY mirale el cuello: hay tres cortes.\n\nAhora, la historia. El veintidós de octubre de mil quinientos noventa y nueve, el cardenal Sfondrati hizo abrir el sepulcro que había debajo de este altar. Aparecieron tres sarcófagos de mármol. Adentro de uno, en una caja de ciprés, un cuerpo con un vestido de seda con hilos de oro, con manchas de sangre y con tres heridas visibles en el cuello.\n\nLeé la inscripción que está tallada al lado de la estatua, porque es lo más raro de todo esto. Dice, en primera persona: «he aquí la imagen de la santísima virgen Cecilia, a la que yo mismo vi yacer íntegra en el sepulcro; te la he expresado en este mármol exactamente en la misma posición del cuerpo».\n\nO sea que el escultor no firmó: juró. Puso por escrito que esto es un acta notarial en piedra.\n\nY acá viene el reparo, que hay que decir. Los que estuvieron ahí esa noche no le levantaron el velo que le cubría la cara. Nadie le vio el rostro. Además, los especialistas señalan que la pose se parece bastante a estatuas antiguas de figuras yacentes que Maderno tenía a mano para mirar.\n\nAsí que esto es un juramento, no una fotografía. Y eso, en vez de arruinarlo, lo mejora: la cabeza girada hacia el piso puede ser exactamente la manera de no tener que inventar una cara que no vio.\n\nSobre los dedos hay dos lecturas y ninguna es de la época. Tres extendidos en la derecha y uno en la izquierda, que sería la Trinidad: tres personas, un Dios. O bien los tres de la derecha serían los tres días que, según el relato, tardó en morir. Elegí la que quieras: las dos son interpretaciones posteriores.\n\nY sobre el martirio en sí, conviene saber el terreno. Que hubo una iglesia titular de Cecilia acá está documentado en un concilio del año cuatrocientos noventa y nueve, y su nombre está en un martirologio del siglo cuarto. El relato del baño sobrecalentado y los tres hachazos viene de un texto de mediados del siglo quinto que la propia Enciclopedia Católica llama, textualmente, una novela piadosa sin valor histórico. Y la fecha de la muerte: hay cinco propuestas distintas repartidas entre el año ciento setenta y siete y el trescientos sesenta y dos. Ninguna se sostiene mejor que las otras.",

      "guion": "Levantá la vista al fondo, al mosaico de oro del ábside. Es del siglo nueve, del papa Pascual primero, que reconstruyó esta iglesia en el ochocientos veintidós.\n\nEn el centro está Cristo bendiciendo. A los costados, tres figuras de cada lado: Pedro, Pablo, Cecilia, Valeriano, Águeda, y el propio Pascual.\n\nA Pascual lo vas a reconocer por dos cosas. Primero, tiene en las manos una maqueta de esta iglesia: es la firma del que pagó. Y segundo, y es lo bueno, mirale el halo.\n\nNo es redondo. Es cuadrado.\n\nEso es una convención precisa del arte medieval y quiere decir una sola cosa: esta persona estaba viva cuando se hizo el mosaico. El halo redondo es de santo; el cuadrado es de vivo. Pascual se mandó a poner al lado de Cristo mientras respiraba, y el halo cuadrado es la letra chica que lo aclara.\n\nUn aviso: las fuentes no se ponen de acuerdo en el orden de las figuras. Tengo tres versiones distintas de quién está a la izquierda y quién a la derecha. Así que no te digo lados: buscá vos al de la maqueta y al del halo cuadrado.\n\nBuscá también un ave posada sobre una palmera con la cabeza rodeada de rayos. Es un fénix, símbolo de resurrección, y es de las cosas más lindas del mosaico. Y abajo, la franja de siempre: el cordero al centro y doce ovejas, seis de cada lado, saliendo de Jerusalén y de Belén.\n\nUna coincidencia que vale mencionar: el baldaquino gótico que tenés sobre el altar es de Arnolfo di Cambio, y está firmado y fechado en mil doscientos noventa y tres. El mismo año, o casi, que el fresco de Cavallini que acabás de ver arriba. Dos de las obras que dan vuelta el arte romano, en el mismo edificio, hechas al mismo tiempo. Eso no es prosa: son dos fechas que se tocan.\n\nY ahora bajá a la cripta, que es otra cosa.\n\nAbajo hay edificios de época republicana, muros de toba, una columna dórica. Y hay siete piletas cilíndricas de ladrillo hundidas en el piso.\n\nLa versión que vas a escuchar es que esto era una curtiembre, y que sería la       "guion": "Mirá el edificio de abajo hacia arriba y contá los pisos. Abajo, arcos con semicolumnas dóricas. Encima, arcos con columnas jónicas. Y arriba de todo, un palacio renacentista con ventanas y macetas.\n\nEse es el resumen de dos mil años en una fachada.\n\nLo empezó Julio César, que expropió y despejó el terreno, y lo terminó Augusto. Se inauguró en el trece antes de Cristo según Casio Dión, o en el once según Plinio, que cuenta que en la inauguración exhibieron un tigre amaestrado. La filología prefiere el trece. Ya se había usado antes de estar terminado, en el diecisiete.\n\nEstá dedicado a Marco Claudio Marcelo, sobrino de Augusto, hijo de su hermana Octavia y casado con su hija Julia. Era el heredero, y se murió en el veintitrés antes de Cristo a los diecinueve o veinte años. Augusto le dedicó esto una década después.\n\nLa capacidad no la sabe nadie. Un catálogo del siglo cuarto dice veinte mil quinientos loca, y toda la discusión es qué quiere decir locus: si son personas o son pies lineales de grada. Si es lo segundo, entran entre diez y catorce mil. Las cifras que vas a leer van de once mil a veinte mil y todas salen de interpretar esa misma palabra.\n\nHabía un tercer piso, con pilastras corintias. No está: lo desarmaron en la Edad Media para fortificar el edificio. Y el suelo romano está unos cuatro metros abajo del nivel actual de la calle: lo liberaron entre mil novecientos veintiséis y mil novecientos treinta y dos.\n\nAhora, lo de arriba. Los Pierleoni lo convirtieron en fortaleza en el siglo doce, los Savelli se quedaron con él en el trece, y a principios del dieciséis Baldassarre Peruzzi les construyó un palacio arriba de las arcadas. En el siglo dieciocho pasó a los Orsini.\n\nY sigue habitado. No es una metáfora: son departamentos privados, se venden en el mercado inmobiliario, y en dos mil doce un príncipe Orsini recompró una parte por más de treinta millones de euros. Parte del palacio es desde mil novecientos noventa y cuatro la embajada de la Orden de Malta ante la Santa Sede. No se visita.\n\nSobre la frase que te van a decir seguro: que este teatro fue el modelo del Coliseo. Es una inferencia moderna. Ninguna fuente antigua lo dice. Lo que sí es verdad es que este es el primer gran edificio romano conservado con arcadas y órdenes superpuestos en fachada de travertino, y que el Coliseo, noventa años después, repite el esquema y le agrega un piso. Precedente, sí. Modelo, no está escrito en ningún lado. Y además son cosas distintas: esto es un teatro, un semicírculo; el Coliseo es un anfiteatro, una elipse cerrada.\n\nÚltima cosa: las tres columnas corintias que tenés al lado, las del Templo de Apolo Sosiano. No están ahí desde la antigüedad. Son un montaje de mil novecientos cuarenta, con piezas caídas, y ni siquiera en la posición original. Son mármol de Carrara, de las primeras obras romanas hechas con ese mármol.",

      "guion": "El catorce de julio de mil quinientos cincuenta y cinco, a menos de un mes de haber sido elegido, el papa Pablo cuarto firmó una bula que empieza con las palabras «cum nimis absurdum»: «siendo demasiado absurdo».\n\nEn dos meses habían amurallado esto.\n\nLo que decía la bula: una sola sinagoga permitida, demolición de las demás. Sombrero amarillo en punta para los hombres, pañuelo amarillo para las mujeres. Prohibido tener propiedades, así que había que vender lo que se tuviera. Oficios reducidos a cuatro: trapero, ropavejero, pescadero y prestamista. Prohibido comerciar granos o alimentos básicos. Y las puertas cerradas del ocaso al alba.\n\nEl número que hay que retener es la superficie. Tres hectáreas, después de que Sixto quinto lo ampliara en mil quinientos ochenta y seis. Tres hectáreas.\n\nEn mil quinientos cincuenta y cinco encerraron acá a unas dos mil personas. A principios del siglo diecinueve vivían diez mil en esas mismas tres hectáreas. Las puertas empezaron siendo dos y terminaron siendo ocho.\n\nY el lugar no se eligió al azar: es la curva más baja del Tíber, la que se inunda. Durante trescientos años el río les entró a las casas.\n\nTres fechas que todo el mundo confunde y conviene separar. El muro lo hizo tirar Pío nono el diecisiete de abril de mil ochocientos cuarenta y ocho. El gueto se abolió legalmente el veinte de septiembre de mil ochocientos setenta, cuando Italia tomó Roma. Y el barrio, las casas, los callejones, todo eso se demolió recién desde mil ochocientos ochenta y ocho, por plan regulador, y se reemplazó por tres calles nuevas. Muro en el cuarenta y ocho, ley en el setenta, barrio en el ochenta y ocho. Son tres cosas distintas con cuarenta años de distancia.\n\nY hay una cosa más de Pío nono que conviene saber. El año anterior a tirar el muro, en mil ochocientos cuarenta y siete, había abolido las prédicas obligatorias: desde mil quinientos setenta y siete, un porcentaje fijo de la comunidad tenía que salir del gueto los sábados a la tarde, bajo escolta, a escuchar un sermón que buscaba convertirlos. Doscientos setenta años de eso. Hay resistencia documentada: tapones en los oídos, dormirse a propósito, hacer ruido.\n\nY ahora mirá la Sinagoga, que es el final de esta historia. La empezaron en mil novecientos uno y la consagraron en mil novecientos cuatro, treinta y cuatro años después de la caída del gueto. Arquitectos Costa y Armanni, estilo ecléctico con elementos griegos, egipcios y asirios.\n\nMirale la cúpula: es cuadrada. En el proyecto original era una pirámide escalonada y la cambiaron.\n\nEn una ciudad que es un bosque de cúpulas redondas, una cúpula cuadrada se reconoce desde cualquier punto y no se puede confundir con una iglesia. Esa lectura es la corriente y es verosímil, aunque no hay una declaración de los arquitectos que la respalde. Pero el hecho está: se ve desde el Gianicolo, y no se parece a nada.",

      "guion": "Mirá el cartel de la calle. La placita donde estás parado se llama Largo 16 Ottobre 1943. La ciudad le puso a este lugar la fecha de lo que pasó acá.\n\nTres semanas antes, el veintiséis de septiembre, el jefe de la policía alemana en Roma, Herbert Kappler, citó a los dirigentes de la comunidad y les exigió cincuenta kilos de oro en treinta y seis horas. Los juntaron. El veintiocho a las seis de la tarde entregaron cincuenta kilos trescientos gramos.\n\nNo sirvió de nada. Nunca iba a servir de nada.\n\nEl sábado dieciséis de octubre, a las cinco y media de la mañana, empezó la razzia. Era shabbat y además la víspera de Sucot: todo el mundo estaba en su casa. Terminó a las dos de la tarde. Ocho horas y media.\n\nDetuvieron a mil doscientas cincuenta y nueve personas. Seiscientas ochenta y nueve mujeres, trescientas sesenta y tres hombres, doscientos siete niños.\n\nSoltaron a doscientas treinta y siete: extranjeros, matrimonios mixtos.\n\nDeportaron a mil veintitrés. Vas a leer también mil veinticuatro y mil veintidós; es una discrepancia de archivo, no un error.\n\nEl tren salió de Tiburtina el lunes dieciocho a las dos y cinco de la tarde. Llegó a Auschwitz el veintidós a las once de la noche y los dejaron adentro de los vagones hasta que amaneció.\n\nEn la selección mandaron a la cámara de gas a ochocientos veinte, ahí mismo. Al trabajo, ciento cincuenta y cuatro hombres y cuarenta y siete mujeres.\n\nVolvieron dieciséis. Quince hombres y una mujer.\n\nLa mujer se llamaba Settimia Spizzichino. Tenía veintidós años cuando se la llevaron y la liberaron en Bergen-Belsen. Volvió a Roma, vivió acá, dio testimonio toda su vida y murió en el año dos mil.\n\nAhora caminá hasta Via del Portico d'Ottavia número nueve y mirá el piso, contra el umbral.\n\nHay doce cubos de bronce dorado del tamaño de un adoquín, con nombres grabados. Se llaman pietre d'inciampo, piedras de tropiezo: las hace un artista alemán, Gunter Demnig, desde mil novecientos noventa y cin ulo que Cellini.\n\nY buscá las iniciales que se repiten en la decoración: CCS y MS. Son en honor de la madre del príncipe Sciarra, que pagó todo esto.\n\nSobre el estilo, una precisión. Vas a leer que es Liberty, que es el art nouveau italiano. Y vas a leer que es prerrafaelita. Las dos cosas son ciertas y no se contradicen: las figuras tienen el gusto inglés prerrafaelita, y el conjunto decorativo y arquitectónico es Liberty. Con un detalle: mil ochocientos ochenta y cinco es muy temprano para el Liberty, que en Italia explota recién alrededor de mil novecientos. Esto es anterior. Es un ensayo general.",

do Florencia como duque. La república por la que él había construido murallas ya no existía.\n\nEl daño y la vergüenza no son una metáfora sobre la condición humana. Es política. Está diciendo que prefiere ser una piedra antes que ver en qué terminó su ciudad.\n\nLo dijo por boca de una estatua que le había hecho, y pagado, la familia responsable.",

      "guion": "Estás en una plaza grande, ordenada, con un arco de triunfo de un lado y cafés con toldos alrededor. Es la plaza más incómoda de Florencia y conviene saber por qué.\n\nAcá, hasta hace ciento cuarenta años, estaba el Mercato Vecchio, el mercado medieval, y pegado, el gueto judío. Un enredo de callecitas, arcadas, torres y casas apiladas que era el corazón más viejo de la ciudad: debajo está el foro romano, y el punto exacto donde se cruzaban las dos calles principales de la colonia.\n\nEntre mil ochocientos ochenta y cinco y mil ochocientos noventa y cinco lo tiraron todo abajo.\n\nSe llamó risanamento, saneamiento. Era el mismo impulso que había puesto a Florencia como capital veinte años antes: modernizar, higienizar, abrir. Y también era el mismo argumento que se usó en Roma para tirar la Spina di Borgo y en el gueto de ahí.\n\nY ahora leé el arco. Tiene una inscripción arriba, y dice que el antiguo centro de la ciudad, «de secular escualidez», fue restituido a vida nueva.\n\nEso está escrito ahí, en piedra, en primera persona del régimen que lo hizo. No es una interpretación mía: es el cartel que pusieron los que demolieron, explicando que lo que había antes era escualidez.\n\nEn el centro de la plaza, buscá una columna. Es la Colonna dell'Abbondanza y marca el cruce del cardo y el decumano romanos: el ombligo de la ciudad antigua. La de ahora es una reposición; la original se fue con el resto.\n\nUna nota sobre el gueto, porque cierra un círculo con Roma. El gueto de Florencia lo creó Cosme primero de Medici en mil quinientos setenta y uno, o sea dieciséis años después del de Roma y con la misma lógica. Y lo curioso es que se demolió no por tolerancia sino por urbanismo: para cuando lo tiraron ya no era gueto legal desde hacía décadas.\n\nSi estas piedras te parecen demasiado nuevas y demasiado prolijas para Florencia, tenés razón. Lo son.",

      "guion": "Caminá por la nave izquierda y mirá la pared. Hay dos frescos gigantes, de más de ocho metros de alto, cada uno con un hombre a caballo pintado como si fuera una estatua de piedra sobre un sarcófago.\n\nNo son santos ni papas. Son dos mercenarios.\n\nEl primero es Giovanni Acuto, que en realidad se llamaba John Hawkwood y era inglés. Capitán de compañía, de los que cobraban por pelear para quien pagara. Florencia lo tuvo de su lado y le prometió una tumba de mármol. Cuando murió, en mil trescientos noventa y cuatro, le hicieron esto en su lugar: una tumba pintada, que sale mucho más barata.\n\nLo pintó Paolo Uccello en mil cuatrocientos treinta y seis, y acá hay una historia documentada con fecha.\n\nUccello lo terminó. El veintiocho de junio de mil cuatrocientos treinta y seis el jefe de obra de la catedral le ordenó rehacerlo. El seis de julio lo eximieron de culpa y le pagaron las dos versiones. Y terminó la segunda antes del treinta y uno de agosto.\n\nPor qué se lo hicieron rehacer, no se sabe: el documento registra la orden, no el motivo. La lectura habitual es que el caballo y el jinete salieron demasiado agresivos. Y había apuro: tenía que estar listo para la inauguración de la cúpula, que fue ese agosto.\n\nAhora el detalle que se ve, y es el bueno.\n\nMirá el sarcófago de abajo: está pintado en escorzo, visto desde abajo, como lo verías realmente parado acá. Y ahora mirá el caballo y el jinete: están vistos de frente, a la altura de los ojos.\n\nSon dos puntos de vista distintos en el mismo fresco. Uccello rompió la perspectiva a propósito para que el condotiero se leyera bien desde el piso. Alejate un poco y vas a ver que el zócalo se hunde y el caballo no.\n\nEl de al lado es Niccolò da Tolentino, de Andrea del Castagno, mil cuatrocientos cincuenta y seis, veinte años después. Y no se parece por casualidad: le ordenaron hacerlo en la misma manera y forma que el otro. Es una copia de formato por contrato.\n\nA los dos los restauraron en do       "guion": "Parate abajo de la cúpula y mirá hacia la izquierda del altar. Hay una puerta de bronce, con paneles, y encima una lunetta de terracota vidriada en blanco y azul con una Resurrección.\n\nEsa puerta es de Luca della Robbia. Y es, probablemente, el objeto físico más cargado de esta catedral.\n\nEl domingo veintiséis de abril de mil cuatrocientos setenta y ocho, durante la misa, un grupo de conjurados atacó a los dos hermanos Medici acá adentro. La familia Pazzi, banqueros rivales, con apoyo del arzobispo de Pisa y, de fondo, del papa.\n\nLa señal habría sido el momento de la elevación de la hostia. Lo dice la propia Opera del Duomo, aunque no todas las fuentes lo sostienen.\n\nA Giuliano de Medici lo apuñalaron ahí mismo y murió en el acto. Se cuentan diecinueve heridas, aunque ese número viene de la tradición y no de un acta.\n\nA Lorenzo lo hirieron en el hombro. Corrió. Y un amigo, Francesco Nori, se metió entre él y el que lo perseguía. Lo mataron a él. Está enterrado en Santa Croce, a diez minutos de acá.\n\nLorenzo llegó hasta esta sacristía, con otros dos o tres, y cerraron detrás de ellos esas puertas de bronce.\n\nLa que estás mirando. Ahí se quedó, del otro lado, mientras afuera se resolvía si iba a gobernar Florencia o iba a morir a los veintinueve años.\n\nA los dos clérigos que tenían el encargo de matarlo se les erró el golpe. La explicación más simple es la mejor: no eran hombres de armas.\n\nLo que pasó después es más brutal que el atentado. Al arzobispo lo colgaron de una ventana del Palazzo della Signoria con los hábitos puestos. Entre el veintiséis de abril y el veinte de octubre de ese año ejecutaron a ochenta personas.\n\nY hay un detalle que cierra el día de una manera que no se puede planear. Giuliano, el que murió acá, es exactamente el hermano que viste hace dos horas en el cajón de mármol liso de la Sagrestia Nuova, abajo de la Virgen. El que no tiene tumba monumental.\n\nLo mataron acá. Lo enterraron ahí. Y el que se salvó de       "guion": "Entrás y hay un andamio enorme tapando la bóveda. Vamos por partes, porque igual hay tres cosas buenísimas acá adentro.\n\nPrimero, la edad de este edificio, que es una discusión más entretenida de lo que parece.\n\nLos florentinos del Renacimiento estaban convencidos de que esto era un templo romano de Marte reconvertido. Lo escribió Villani en el siglo catorce y se lo creyeron durante siglos: la ciudad necesitaba un pasado romano y este edificio octogonal, con mármoles ordenados, se lo daba.\n\nLas excavaciones encontraron abajo una casa romana. Una domus, no un templo.\n\nY hay una corrección más nueva que casi nadie tiene. La famosa consagración de mil cincuenta y nueve viene de un historiador de mil seiscientos ochenta y cuatro, y la investigación de archivo reciente la refuta directamente: dice que el baptisterio no se consagró ese año. Hoy se lo ubica en el siglo once o doce por técnica constructiva, y una hipótesis de dos mil veinticuatro propone los primeros años de mil setenta.\n\nAsí que lo honesto es decir siglo once y no una fecha.\n\nDante lo llamó «il mio bel San Giovanni», en el canto diecinueve del Infierno. Acá lo bautizaron.\n\nSegundo: mirá el piso. Hay una rueda del zodíaco con el sol en el centro, del siglo trece, y alrededor una inscripción en latín que dice EN GIRO TORTE SOL CICLOS ET ROTOR IGNE. Quiere decir: yo, el sol, hago girar los ciclos con fuego, y soy girado.\n\nY es un palíndromo. Se lee igual al derecho y al revés, letra por letra. Funcionaba además como reloj solar, con un rayo que entraba por un agujero en el vértice de la cúpula.\n\nTercero, y es lo mejor de acá adentro. Buscá una tumba alta contra la pared, con un difunto de bronce dorado acostado.\n\nEs de Donatello y Michelozzo, la primera vez que trabajaron juntos, y mide siete metros treinta y dos. Cuando se hizo era el monumento más alto de Florencia.\n\nAdentro está Baldassarre Cossa, napolitano, que en mil cuatrocientos diez fue elegido papa con el nombre de Juan veintitrés y lo reconocieron Francia, Inglaterra, Bohemia, Portugal, Florencia y Venecia. En mil cuatrocientos quince el Concilio de Constanza lo depuso. Después, retroactivamente, declararon ilegítima toda su línea: por eso hoy se lo llama antipapa.\n\nLo rescató Giovanni de Medici, el fundador de la fortuna familiar. Cossa se sometió al papa legítimo en junio de mil cuatrocientos diecinueve y murió en diciembre.\n\nY ahora leé la inscripción del sarcófago: dice IOANNES QUONDAM PAPA. Quondam en latín es ambiguo: puede querer decir «el difunto papa» o «el que alguna vez fue papa». El papa Martín quinto protestó por eso. Y la Señoría de Florencia le contestó con la frase de Pilato: quod scripsi, scripsi. Lo que escribí, escribí.\n\nSobre los mosaicos: son más de mil metros cuadrados y unos diez millones de teselas, con un Cristo juez de ocho metros y un infierno de Coppo di Marcovaldo. Están tapados desde dos mil veintitrés y la restauración termina en dos mil veintiocho. El andamio que ves es de aluminio, mide treinta y un metros y medio de alto y se apoya en apenas sesenta y tres metros cuadrados de piso.\n\nY las tres puertas de afuera son copias. Los originales están los tres juntos en el museo donde estuviste ayer.",

      "guion": "Bajaste al primer piso y quedan dos paradas. Esta es la última media hora, así que vale la pena que sepas qué mirar antes de entrar.\n\nPrimero la Venus de Urbino de Tiziano, mil quinientos treinta y ocho, óleo sobre tela.\n\nTodo el mundo la presenta como un escándalo. Y hay que ordenar eso, porque el escándalo tiene fecha y no es la que parece.\n\nEn mil quinientos treinta y ocho el que la encargó, Guidobaldo della Rovere, la llamaba en sus cartas simplemente «la mujer desnuda», y lo que le preocupaba era que Tiziano se la vendiera a otro antes. Ningún escándalo.\n\nLa lectura del museo es nupcial, no erótica, y tiene elementos que podés verificar mirando: el perro a los pies, que es fidelidad; las rosas en la mano; la maceta de mirto en el alféizar, que es la planta de Venus; y al fondo dos sirvientas sacando un vestido de un arcón de novia.\n\nEl escándalo llegó tres siglos después. Mark Twain, en mil ochocientos ochenta, escribió que era el cuadro más sucio, más vil y más obsceno que posee el mundo. Pero Twain no estaba escandalizado: se estaba burlando de la hipocresía victoriana, que permitía en pintura lo que censuraba en literatura. Si contás la frase sin eso, la contás al revés.\n\nAhora Caravaggio, que está en las dos últimas salas.\n\nLa Medusa está pintada sobre un escudo redondo y convexo, de madera forrada en tela. Sesenta por cincuenta y cinco centímetros, alrededor de mil quinientos noventa y siete. Era un regalo: se lo encargó un cardenal para regalárselo a Fernando primero de Medici.\n\nY acá está el truco que hay que mirar de cerca. La superficie es convexa, sale hacia vos. Pero Caravaggio pintó la sombra como si fuera cóncava, hundida. El resultado es que la cabeza parece meterse hacia adentro del escudo aunque el objeto haga lo contrario.\n\nHay una segunda versión, más chica y firmada, en colección privada. Esta no está firmada y es la grande.\n\nDe la Medusa se dice siempre que es un autorretrato. No hay ningún documento conte       "guion": "Lo primero que ves son las rayas.\n\nMármol blanco de la Montagnola sienesa y serpentino negro verdoso de Vallerano. En la fachada se suma mármol rojo. Los colores son los del escudo de la ciudad, la balzana.\n\nY ahí hay una leyenda linda y una historia menos linda.\n\nLa leyenda: Senio y Aschio, hijos de Remo, huyeron de su tío Rómulo montando dos caballos, uno blanco y uno negro, enviados por Diana y Apolo. De esos dos caballos vienen los colores.\n\nEl problema es que existe una segunda versión de la misma leyenda que dice otra cosa: que el blanco y el negro son el humo de la pira que se encendió al fundar la ciudad. Dos explicaciones incompatibles para un mismo escudo es la firma de una racionalización posterior. Cuando algo tiene dos orígenes míticos distintos, generalmente no tiene ninguno.\n\nLo que sí está documentado: las primeras pruebas de la balzana son del siglo trece. Mil doscientos cuarenta y seis, un pago por tela blanca y negra para banderas. Mil doscientos cincuenta y cinco, el Libro dei Consigli.\n\nY las hipótesis que manejan los historiadores son mucho más prosaicas: que viene de los propios mármoles de esta catedral, o que es una oposición deliberada a las bicromías blancas y rojas de Pisa y de Florencia. Un escudo elegido para no parecerse a los vecinos.\n\nAhora la fachada.\n\nLa parte de abajo es de Giovanni Pisano, que fue maestro de obra de la catedral entre mil doscientos ochenta y cuatro y mil doscientos noventa y siete, y se fue peleado.\n\nTalló profetas, sibilas y filósofos paganos. Platón. Aristóteles. Moisés. Habacuc. Isaías. Y el adivino Balaam. Profetas del Antiguo Testamento y griegos, juntos, en el frente de una catedral. Vas a ver por qué dentro de un rato, cuando pises el piso.\n\nTodas las estatuas que estás mirando son copias. Los originales están en el Museo dell'Opera, donde vas a estar esta tarde.\n\nY acá te dejo la clave para mirarlas allá adentro, que es lo mejor que aprendí preparando esto.\n\nPisano       "guion": "Estás pisando algo que dos tercios del año está tapado con planchas.\n\nCincuenta y seis taraceas de mármol, hechas entre mil trescientos sesenta y nueve y mil quinientos cuarenta y siete. Ciento setenta y ocho años de obra. Más de cuarenta artistas.\n\nEste año lo destaparon del dieciocho de agosto al quince de noviembre, y la edición se llama Il Sommo Bene, el sumo bien, por el octavo centenario de la muerte de Francisco de Asís.\n\nCómo está hecho. Dos técnicas. El graffito: surcos abiertos a cincel y trépano sobre losas de mármol blanco, rellenos con estuco negro. Y el commesso marmoreo: mármoles de color puestos uno al lado del otro como una taracea de madera, pero en piedra.\n\nLos mármoles son casi todos de canteras sienesas. Blanco de la Montagnola, amarillo broccatello de Siena, verde de Crevole, rojo de Gerfalco. La catedral está hecha con su propio territorio.\n\nSe tapa por desgaste, y acá va el dato duro que casi nadie dice: en el paso central, de tanto caminarlo, ninguna de las figuras es hoy la original. Ninguna.\n\nLa Loba fue rehecha entera por Maccari en mil ochocientos sesenta y cuatro. El ciclo de Elías fue reintegrado por Franchi en mil ochocientos setenta y ocho. El Monte de la Sabiduría lo restauró Mussini en mil ochocientos cincuenta y nueve.\n\nBuena parte de lo que estás pisando es una copia del siglo diecinueve de un original gastado. Y sigue siendo el mejor piso de Europa. Las dos cosas son ciertas.\n\nVasari dijo que era el más bello, grande y magnífico pavimento que jamás se hubiera hecho. Nadie me pudo confirmar en qué Vida lo escribió, así que te lo doy como frase suelta.\n\nDos cosas para buscar ahora mismo.\n\nPrimera, apenas pasás la puerta: la Loba de Siena amamantando a los gemelos, rodeada por los animales de las ciudades aliadas, en círculo. Arezzo es el caballo. Florencia es el león, el marzocco. Lucca la pantera, Orvieto la oca, Perugia la cigüeña, Pisa la liebre, Roma el elefante, Viterbo el unicornio. Y en l       "guion": "Dejá de mirar el piso un minuto.\n\nEl púlpito. Contrato firmado en Pisa el veintinueve de septiembre de mil doscientos sesenta y cinco, entre Nicola Pisano y la Opera. El contrato especifica todo: materiales, plazos, que Nicola solo podía ausentarse sesenta días al año, y los jornales.\n\nNicola cobraba ocho soldos por día. Arnolfo di Cambio y Lapo di Ricevuto, seis cada uno. Y Giovanni Pisano, cuatro. Giovanni era el hijo de Nicola, tenía poco más de quince años, y el padre le cobraba el sueldo.\n\nEs el mismo Giovanni que treinta años después hizo la fachada por la que entraste.\n\nOctogonal, mármol de Carrara, ocho columnas exteriores alternando granito, pórfido y mármol verde, apoyadas de manera alterna sobre bases planas y sobre leones que están devorando presas.\n\nSiete paneles narrativos. Natividad, los Magos, la Presentación y la Huida a Egipto, la Matanza de los Inocentes, la Crucifixión, y el Juicio Final partido en dos: los salvados y los condenados.\n\nNicola había hecho otro púlpito en Pisa cinco años antes, con cinco paneles. Acá hay siete y el espacio se satura de figuras. Desaparece la calma clásica de Pisa. La Matanza tiene veinticuatro chicos desnudos, cuando lo habitual eran tres o cuatro. Ese es el panel donde se mide el salto, y suele atribuirse a la mano del hijo.\n\nAhora más arriba.\n\nLa cúpula es hexagonal. En mil doscientos sesenta y tres ya se compraba plomo para cubrirla, así que estaba terminada. Por dentro tiene casetones pintados en trampantojo sobre fondo azul con estrellas doradas, de fines del siglo quince. No son casetones: es pintura que finge relieve.\n\nLa linterna es de mil seiscientos sesenta y seis o sesenta y siete. La Wikipedia italiana se la da a Bernini; la propia Opera dice solamente que fue reconstruida desde cero en el estilo original, sin nombrarlo. Te lo dejo así.\n\nY en la cornisa, todo alrededor: ciento setenta y un bustos de papas según la Opera, ciento setenta y dos según otras fuentes. Hechos       "guion": "Entrás de una catedral en penumbra a un cuarto que parece recién pintado. Esa es la impresión y es correcta: los colores de acá son distintos a todo lo demás.\n\nLa mandó hacer el cardenal Francesco Todeschini Piccolomini, hacia mil cuatrocientos noventa y dos, para guardar la biblioteca de manuscritos de su tío, el papa Pío Segundo, Eneas Silvio Piccolomini.\n\nEl cardenal llegó a papa. Fue Pío Tercero. Duró veintiséis días. Murió en mil quinientos tres sin ver los frescos terminados.\n\nEl contrato con Pinturicchio es del veintinueve de junio de mil quinientos dos, y dice algo que conviene escuchar con atención: le exige hacer todos los dibujos de las historias de su mano, y todas las cabezas de su mano, al fresco. O sea que el contrato mismo, en su letra, ya está admitiendo que el resto lo hace el taller.\n\nDiez recuadros, y son la vida de un hombre. En orden: la partida hacia el Concilio de Basilea, con una tempestad en el mar. La embajada ante Jacobo Primero de Escocia. La coronación como poeta laureado en Aquisgrán. La sumisión al papa Eugenio Cuarto. La recepción de Leonor en Siena, en mil cuatrocientos cincuenta y dos. El nombramiento como cardenal. La entrada en San Juan de Letrán como papa. La Dieta de Mantua para la cruzada. La canonización de Catalina de Siena. Y la llegada a Ancona, donde se murió esperando barcos que no llegaron.\n\nEs una biografía política completa, pintada por encargo de un sobrino, en la catedral de la ciudad de la familia.\n\nAhora: Rafael.\n\nVas a escuchar que Rafael pintó acá. Lo dice Vasari, y Vasari se contradice solo: en la Vida de Pinturicchio dice que Rafael hizo algunos dibujos y cartones, y en la Vida de Rafael dice que hizo todas las historias.\n\nLo que la crítica moderna reconoce: dos cartones documentados y dibujos preparatorios en el Ashmolean, en los Uffizi y en el Louvre. Rafael estuvo en Siena en mil quinientos dos y mil quinientos tres, antes de mudarse a Florencia.\n\nPero el contrato obliga a Pinturicchio a hacer los diseños él mismo. Así que: participación en dibujos, verosímil. Autoría de las escenas, no. Y el Rafael de calzas rojas que los guías señalan en uno de los frescos es identificación tradicional, no documento.\n\nEn el centro del cuarto, las Tres Gracias. Es una copia romana del siglo tercero de un original helenístico, que estaba en el palacio romano de los Piccolomini. El pedestal lo hizo Giovanni di Stefano, el mismo del Hermes de la puerta.\n\nEl grupo fue retirado varias veces por pudor religioso. En mil novecientos setenta y dos, Enzo Carli lo devolvió acá y ancló el pedestal al piso para que no lo movieran nunca más.\n\nY los libros: graduales y antifonarios miniados por Liberale da Verona y Girolamo da Cremona.\n\nPor qué se conservó tan bien: nadie publica una explicación técnica. Lo que sí está documentado es que este cuarto está cerrado, no tiene culto y nunca tuvo velas. Es un ambiente sin hollín.",

      "guion": "En mil novecientos noventa y nueve la Opera estaba excavando debajo del coro para recuperar un oratorio, y encontró un cuarto que nadie sabía que existía.\n\nEstaba relleno de escombro, probablemente desde la segunda mitad del siglo catorce. Vaciarlo llevó casi tres años.\n\nAdentro había ciento ochenta metros cuadrados de pared pintada de arriba abajo. Antiguo Testamento en la franja de arriba, Nuevo Testamento abajo, y el ciclo de la Pasión terminando en tres escenas: Crucifixión, Descendimiento y Sepultura.\n\nLa fecha es lo importante. Década de mil doscientos setenta.\n\nEso quiere decir que estos frescos son anteriores a Cimabue en Asís y anteriores a la primera Virgen grande de Duccio. Es la generación previa a todo lo que conocemos de la pintura sienesa, y estuvo sellada en la oscuridad seiscientos años.\n\nPor eso los colores están así. No hubo luz, no hubo ciclos de humedad, no hubo limpiezas y sobre todo no hubo repintes. Es una pintura del siglo trece que nunca pasó por manos del siglo diecisiete.\n\nQuién la hizo: la Opera propone Guido da Siena, Dietisalvi di Speme, Guido di Graziano, Rinaldo da Siena. Todos con un posiblemente adelante. Sigue en estudio.\n\nY una cosa que casi nadie aclara: esto no es una cripta. El nombre nació de la esperanza de haber encontrado la confesión de la catedral vieja. Enzo Carli y Kees van der Ploeg lo descartaron por una razón simple: el ambiente se comunicaba con el exterior por tres portales, y una cripta no tiene puertas a la calle.\n\nLa lectura mejor sostenida es que era un vestíbulo, una sala de acceso orientada hacia la parte más poblada de la ciudad. Se cerró alrededor de mil trescientos, cuando la construcción del nuevo baptisterio tapó sus tres puertas del este.\n\nLa iglesia se comió su propia entrada.\n\nY eso te lleva al baptisterio, que está acá abajo, detrás del ábside, y que existe por una razón puramente estructural.\n\nCuando decidieron extender el coro de la catedral hacia el noreste, el terreno caía. El coro quedaba colgado en el aire. La única forma de sostenerlo era construir debajo un edificio nuevo cuyo techo fuera el piso del coro.\n\nEl baptisterio de Siena es, literalmente, el cimiento del ábside de la catedral. Una iglesia entera usada como columna.\n\nSe construyó entre mil trescientos dieciséis y mil trescientos veinticinco. La fachada, de Domenico di Agostino, entre mil trescientos cincuenta y cinco y mil trescientos ochenta y dos, quedó inacabada: la parte de arriba nunca se hizo y la de abajo nunca se terminó de labrar.\n\nY en el centro está la pila bautismal, que es una de las cosas más raras del Renacimiento.\n\nLa Opera se la encargó a Jacopo della Quercia, sienés. Tardaba. Entonces reasignaron paneles a dos florentinos: Lorenzo Ghiberti y Donatello. Escuelas rivales, ciudades rivales, en un mismo objeto de dos metros.\n\nGhiberti hizo el Bautismo de Cristo y el Prendimiento. Giovanni di Turino, dos. Jacopo, la Anunciación a Zacarías y todo el tabernáculo de mármol.\n\nY Donatello hizo el Banquete de Herodes, que es donde hay que pararse.\n\nEs relieve aplastado, rilievo schiacciato. Las figuras de adelante salen; la arquitectura del fondo es casi plana, apenas rayada, y sin embargo se hunde metros. Y contiene tres momentos del relato en una sola escena continua: el anuncio, la danza de Salomé, y la cabeza servida en bandeja.\n\nEs de mil cuatrocientos veintisiete. El tratado de Alberti que formalizó la perspectiva es de mil cuatrocientos treinta y cinco. Donatello la está usando ocho años antes de que exista el manual.\n\nDos de las seis Virtudes de las esquinas también son suyas: la Fe y la Esperanza.\n\nLa pila se restauró entre febrero de dos mil veintiuno y junio de dos mil veinticuatro. Está entera y sin andamios.",

      "guion": "El contrato es del nueve de octubre de mil trescientos ocho y obliga a Duccio a dos cosas: pintarla de su propia mano, y no aceptar ningún otro trabajo hasta terminarla.\n\nTardó tres años.\n\nEl nueve de junio de mil trescientos once la Maestà se instaló en el altar mayor. Lo que se cuenta del traslado es una procesión con los comercios cerrados, el obispo, los Nueve, velas encendidas, las campanas de toda la ciudad sonando y una vuelta por el Campo.\n\nEsa descripción viene de una crónica atribuida a Agnolo di Tura, escrita en la segunda mitad del siglo catorce: entre cuarenta y setenta años después. El catálogo de la National Gallery marca la cautela y después agrega lo que salva el relato: hay registros de pago a músicos contratados para el traslado.\n\nEl hecho ocurrió. Los detalles son lo que la ciudad se contó a sí misma una generación más tarde. Que es, muchas veces, la parte más verdadera.\n\nDuccio la firmó en el escalón del trono: Santa Madre de Dios, sé causa de paz para Siena y de vida para Duccio, porque así te pintó.\n\nNo pidió gloria. Pidió seguir vivo.\n\nEn mil quinientos seis la sacaron del altar. Y en la década de mil setecientos setenta la serrucharon para separar el frente del dorso y venderlos mejor. La sierra se desvió y dañó la cara de la Virgen.\n\nHoy hay tablas de esta obra en Londres, en Washington, en la Frick de Nueva York, en el Thyssen de Madrid, en Fort Worth, en Filadelfia. Lo que tenés adelante es la mayor parte, y le faltan pedazos repartidos por tres continentes.\n\nEn la misma sala, las estatuas originales de Giovanni Pisano de la fachada. Acordate de lo que te dije afuera: mirales los cuellos. Están mal para tus ojos y perfectas para el lugar del que las bajaron.\n\nY buscá la Madonna dagli occhi grossi, la Virgen de los ojos grandes. Es de alrededor de mil doscientos veinte, tosca, enorme, frontal. Es la tabla que estaba sobre el altar la noche antes de Montaperti, cuando le entregaron las llaves de la ciudad. No es la mejor pintura del museo. Es la más importante.\n\nAhora subí.\n\nEl veintitrés de agosto de mil trescientos treinta y nueve el Consejo de la Campana votó, doscientos doce contra ciento treinta y dos, agrandar la catedral. El plan: que la iglesia existente pasara a ser el transepto de una catedral nueva, gigantesca, que se desarrollaba hacia el sudeste.\n\nEste museo está adentro de esa obra. La nave derecha inconclusa es la sala por la que caminaste.\n\nPor qué se paró. La versión escolar dice la peste de mil trescientos cuarenta y ocho. Y no es exacto: la obra siguió casi una década después de la peste. Hubo una inspección en mil trescientos cincuenta y seis y la renuncia se deliberó en junio de mil trescientos cincuenta y siete. Después de eso demolieron pilares y bóvedas de la nave nueva por defectuosos.\n\nLa monografía de Bartalini, de dos mil diecinueve, sostiene directamente que la causa no fue la peste. La propia Opera da las dos: la recesión posterior a la peste, y problemas de estabilidad en lo ya levantado.\n\nLa versión honesta es esta: la peste fue el golpe económico y demográfico, pero la sentencia técnica llegó en los años cincuenta y la firmaron peritos, no el contagio.\n\nY entonces salís arriba de esa pared que nunca fue fachada de nada, y ves Siena entera, con el campanario de la catedral a tu misma altura, y la Torre del Mangia enfrente.\n\nEstás parado arriba de una ambición que no salió.",
      "mirar": [
        "La Maestà: la firma está en el escalón del trono, abajo del manto.",
        "La cara de la Virgen: ahí se desvió la sierra en la década de 1770.",
        "Las estatuas de Pisano: los cuellos. Están hechas para verse desde abajo.",
        "🔑 En los muros del museo, las bases de columna abandonadas de 1339.",
        "Arriba: la escalera es de una sola vía y no hay ascensor. Ocaso 18:30."
      ]
    },
    {
      "id": "flo3-16",
      "tipo": "parada",
      "orden": 16,
      "sala": "Piazza del Campo",
      "titulo": "Nueve gajos, una fuente censurada y un río que no existe",
      "autor": "El Gobierno de los Nueve",
      "fecha": "1287-1355",
      "guion": "Sentate un rato, aunque sea en el piso. Todo el mundo lo hace.\n\nEsto era el mercado. El punto donde se cruzaban los tres barrios grandes de Siena, tierra de nadie entre tres colinas, y además el fondo natural donde bajaba el agua de lluvia.\n\nLa inclinación no es un gesto de diseño: es un desagüe. El punto más bajo se llama gavinone.\n\nEl ladrillo se puso entre mil trescientos treinta y tres y mil trescientos treinta y cuatro, y el anillo exterior entre mil trescientos cuarenta y siete y cuarenta y ocho. Diez franjas de travertino blanco dividen el cuenco en nueve gajos que convergen hacia el Palazzo Pubblico.\n\nNueve. El Comune dice que son los Nueve, el gobierno que mandó acá entre mil doscientos ochenta y siete y mil trescientos cincuenta y cinco. La Wikipedia italiana lo dice en potencial. Y hay una segunda lectura que circula igual de fuerte: los nueve pliegues del manto de la Virgen.\n\nNingún documento declara la intención. Y la cronología incomoda: cuando terminaron el piso, el régimen llevaba medio siglo en el poder.\n\nLo que sí está documentado es una ley de mil doscientos noventa y siete: los edificios que dan a esta plaza solo podían abrir ventanas de dos o tres luces, bajo pena de demolición. La armonía que estás viendo es un código de edificación. Alguien la obligó.\n\nLa fuente. La Fonte Gaia que estás mirando no es la de Jacopo della Quercia.\n\nLa suya se encargó hacia mil cuatrocientos ocho y se terminó en mil cuatrocientos diecinueve. Los originales se retiraron en mil ochocientos cincuenta y nueve y están en Santa Maria della Scala, a cien metros de acá.\n\nA Tito Sarrocchi le encargaron la copia en mil ochocientos cincuenta y ocho y la inauguraron en mil ochocientos sesenta y nueve. Y no copió todo: dejó afuera los dos desnudos femeninos, Rea Silvia y Acca Larentia, que Jacopo había puesto sobre las columnas del frente.\n\nLo que tenés adelante es una versión censurada del siglo diecinueve.\n\nEl agua llega por los bottini: veinticinco kilómetros de galerías excavadas a mano en arenisca, que funcionan por gravedad, y que alcanzaron su máxima extensión en mil cuatrocientos sesenta y seis. Fueron la única agua de Siena hasta mil novecientos catorce.\n\nY mientras cavaban eso, buscaban otra cosa.\n\nLa Diana. Un río subterráneo que los sieneses persiguieron desde mil ciento setenta y seis, cuando unos frailes encontraron una vena de agua y cavaron un pozo. El comune financió excavaciones durante generaciones. Nunca se encontró.\n\nDante se burla en el canto trece del Purgatorio, en boca de una sienesa: perderán más esperanza que en encontrar la Diana. Cuando él escribe eso, alrededor de mil trescientos diez, la búsqueda ya era proverbial en toda Toscana. Lo único que hay hoy debajo es humedad rara en las bodegas del barrio de San Marco.\n\nLa torre. El Comune dice casi ochenta y siete metros sobre el nivel del Campo y ciento dos hasta el pararrayos: las dos cifras son correctas y miden cosas distintas. Cimientos en el otoño de mil trescientos veinticinco. Unos cuatrocientos escalones.\n\nSe llama del Mangia por un campanero, Giovanni di Balduccio, apodado Mangiaguadagni, el que se come las ganancias. Primero el hombre, después el autómata que heredó el apodo.\n\nY vas a escuchar que la torre mide exactamente lo mismo que la catedral, para que el poder civil no se someta al religioso. Es una lectura del siglo veinte, atribuida a un arqueólogo sienés. El Comune no la menciona y el campanario de la catedral mide setenta y siete, no ochenta y siete. Funciona como efecto, no como documento.\n\nAl pie de la torre, la Cappella di Piazza: un voto por el fin de la peste de mil trescientos cuarenta y ocho. Se empezó en mil trescientos cincuenta y dos y recién se le puso la bóveda entre mil cuatrocientos sesenta y uno y sesenta y ocho. Un voto de agradecimiento que tardó ciento veinte años en cumplirse.\n\nAhora levantá la vista una última vez. La plaza ya no tiene sol y la torre todavía sí. Esa es la forma de este lugar en una sola imagen.",
      "mirar": [
        "Los nueve gajos: seguilos con la vista hasta el gavinone, el desagüe.",
        "Las ventanas de los palacios: todas de dos o tres luces. Ley de 1297.",
        "La Fonte Gaia: faltan los dos desnudos. La copia de 1869 los sacó.",
        "🔑 La Torre del Mangia todavía tiene sol. La plaza no. Ocaso 18:30.",
        "El Palio se corre en el anillo exterior, con 15 cm de tufo encima."
      ]
    }
  ]
};

</script>

<script>
/* ========= configuración de audio =========
   Si al lado de este archivo existe una carpeta "audio" con los MP3
   generados (audio/prado-01.mp3, etc.), la app los usa.
   Si no encuentra el archivo, lee el guion con la voz del dispositivo. */
var AUDIO_BASE = "audio/";

(function () {
  "use strict";

  /* En orden de viaje: es como se leen en la pestaña Audioguías. */
  var GUIAS = [GUIA_MADRID_D1, GUIA_MADRID_D2, GUIA_TOLEDO, GUIA_MADRID_D4,
               GUIA_NAPOLES_D1, GUIA_NAPOLES_D2, GUIA_NAPOLES_D3,
             GUIA_NAPOLES_D4, GUIA_NAPOLES_D5,
               GUIA_ROMA_D1, GUIA_ROMA_D2, GUIA_ROMA_D3, GUIA_ROMA_D4, GUIA_FLORENCIA_D1, GUIA_FLORENCIA_D2, GUIA_FLORENCIA_D3];
  /* Cada guía se narra con una voz. Se copia a cada parada porque la huella
     del MP3 la incluye: si le cambio la voz a una guía, cambia la URL y el
     teléfono se baja SOLO esas pistas, sin tocar las demás. */
  GUIAS.forEach(function (g) {
    g.paradas.forEach(function (p) { p.voz = g.voz || ""; });
  });
  var IT = ITINERARIO;

  /* ---------- almacenamiento tolerante a fallos ---------- */
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem("eurotrip." + k); return v === null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem("eurotrip." + k, JSON.stringify(v)); } catch (e) {}
    }
  };
  var hechas = store.get("hechas", {});

  /* ---------- utilidades ---------- */
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  /* nombres cortos de los días. Ojo: DIAS a secas son los del viaje,
     que vienen de dias.js. */
  var DIA_SEM = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fechaCorta(s) { var d = parseISO(s); return DIA_SEM[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parrafos(t) {
    return String(t).split("\n\n").map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  }
  function el(id) { return document.getElementById(id); }

  /* ---------- cuenta regresiva ---------- */
  (function () {
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var salida = new Date(2026, 8, 30);
    var fin = parseISO(IT.fin);
    var dias = Math.round((salida - hoy) / 86400000);
    var txt;
    if (dias > 1) txt = "faltan " + dias + " días";
    else if (dias === 1) txt = "salís mañana";
    else if (dias === 0) txt = "salís hoy";
    else if (hoy <= fin) {
      var n = Math.round((hoy - parseISO(IT.inicio)) / 86400000) + 1;
      txt = "día " + n + " de 35";
    } else txt = "viaje terminado";
    el("countdown").textContent = txt;
  })();

  /* ================= VISTA: ITINERARIO ================= */
  /* ================= ITINERARIO POR DÍA =================
     La pestaña principal: cada día se despliega y muestra su línea de tiempo
     con TODO junto — actividades, audioguías y pases —, ordenado por hora.
     Las pestañas Audioguías y Pases siguen existiendo como listas sueltas,
     pero el día es el lugar donde uno mira cuando está viajando. */

  var pasesCache = [];
  /* undefined = todavía no se calculó el día por defecto.
     null = el usuario cerró todo a propósito. Distinguirlos importa: si se
     usa null para las dos cosas, el día por defecto no se puede compactar
     porque renderItin lo vuelve a abrir en el acto. */
  var diaAbierto;

  function paradaPorId(id) {
    for (var i = 0; i < GUIAS.length; i++) {
      var g = GUIAS[i];
      for (var k = 0; k < g.paradas.length; k++) {
        if (g.paradas[k].id === id) return { guia: g, idx: k, p: g.paradas[k] };
      }
    }
    return null;
  }

  /* Reproduce una parada desde donde sea, sin pasar por la pestaña de guías. */
  function tocarParadaPorId(id) {
    var r = paradaPorId(id);
    if (!r) return;
    guiaActual = r.guia;
    cargarParada(r.idx);
  }

  /* Todos los audios de un día, en el orden en que los vas a caminar. No es
     el orden de la guía: un día puede cruzar guías y mezcla paradas y tramos. */
  function paradasDelDia(fecha) {
    var d = DIAS.filter(function (x) { return x.fecha === fecha; })[0];
    if (!d) return [];
    var out = [];
    (d.actividades || []).forEach(function (a) {
      (a.paradas || []).forEach(function (id) {
        var r = paradaPorId(id);
        if (r) out.push(r.p);
      });
    });
    return out;
  }

  function minutosDeParada(p) {
    return Math.max(1, Math.round(p.guion.length / CARACTERES_POR_MINUTO));
  }

  function hoyISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }

  function diaPorDefecto() {
    var hoy = hoyISO();
    for (var i = 0; i < DIAS.length; i++) if (DIAS[i].fecha >= hoy) return DIAS[i].fecha;
    return DIAS.length ? DIAS[DIAS.length - 1].fecha : null;
  }

  function pasesDelDia(fecha) {
    return pasesCache.filter(function (p) { return p.fecha === fecha; });
  }

  /* Las actividades se marcan como hechas con un toque en el círculo. La clave
     es fecha + posición: los días vienen de dias.js y no tienen id propio. */
  var actHechas = store.get("actHechas", {});

  function claveAct(fecha, i) { return fecha + "#" + i; }

  /* Qué bloques de audio se abrieron a mano. Un bloque con 3 o más audios
     arranca colapsado: si no, una sala de museo te empuja el día entero. */
  var audiosAbiertos = {};

  function filaActividad(a, fecha, i) {
    var k = claveAct(fecha, i);
    var lista = !!actHechas[k];
    var h = '<div class="fila' + (lista ? " hecha" : "") + '">';
    h += '<div class="fila-h">' + esc(a.hora) + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-t"><button class="tic" data-act="' + esc(k) + '" ' +
         'aria-pressed="' + lista + '" aria-label="Marcar como hecha">' +
         (lista ? "&#10003;" : "") + "</button>";
    h += "<span>" + esc(a.titulo) + "</span></div>";
    (a.detalle || []).forEach(function (d) {
      h += '<div class="fila-d">' + esc(d) + "</div>";
    });
    var pegados = pasesDelDia(fecha).filter(function (x) { return x.actividad === k; });
    if ((a.paradas && a.paradas.length) || pegados.length) {
      h += '<div class="fila-audio">';
      pegados.forEach(function (x) {
        h += '<button class="mini-play ver" data-verpase="' + esc(x.id) + '">';
        h += '<span class="mp-ico">&#9744;</span>';
        h += '<span class="mp-t">' + esc(x.titulo) + "</span>";
        h += '<span class="mp-m">' + esc(nombreTipo(x.tipo).toLowerCase()) + "</span></button>";
      });
      var refs = (a.paradas || []).map(paradaPorId).filter(Boolean);
      var mins = refs.reduce(function (s2, r) { return s2 + minutosDeParada(r.p); }, 0);
      if (refs.length >= 3 && !audiosAbiertos[k]) {
        h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
        h += '<span class="mp-ico">&#9835;</span>';
        h += '<span class="mp-t">' + refs.length + " audios &middot; " + mins + " min</span>";
        h += '<span class="mp-m">ver</span></button>';
      } else {
        refs.forEach(function (r) {
          var id = r.p.id, listo = hechas[id], esTramo = r.p.tipo === "tramo";
          h += '<button class="mini-play' + (listo ? " listo" : "") +
               (esTramo ? " tramo" : "") + '" data-tocar="' + esc(id) + '">';
          h += '<span class="mp-ico">' +
               (listo ? "&#10003;" : esTramo ? "&#8599;" : "&#9654;") + "</span>";
          h += '<span class="mp-t">' + esc(r.p.titulo);
          /* Solo el tramo necesita aclaración: la parada es el caso normal, y
             ponerle "parate acá" a todo hacía el día más alto y más ruidoso. */
          if (esTramo) h += '<span class="mp-tipo">mientras caminás</span>';
          h += "</span>";
          h += '<span class="mp-m">' + minutosDeParada(r.p) + " min</span>";
          h += "</button>";
        });
        if (refs.length >= 3) {
          h += '<button class="mini-play resumen" data-audios="' + esc(k) + '">';
          h += '<span class="mp-ico">&#9652;</span><span class="mp-t">Ocultar</span>';
          h += '<span class="mp-m"></span></button>';
        }
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }

  function filaPase(p) {
    var h = '<div class="fila pase-fila">';
    h += '<div class="fila-h">' + esc(p.hora || "") + "</div>";
    h += '<div class="fila-c">';
    h += '<div class="fila-tipo">' + esc(nombreTipo(p.tipo)) + " &middot; pase</div>";
    h += '<div class="fila-t">' + esc(p.titulo) + "</div>";
    if (p.codigo) h += '<div class="fila-cod">' + esc(p.codigo) + "</div>";
    if (p.nota) h += '<div class="fila-d">' + esc(p.nota) + "</div>";
    h += '<div class="fila-audio"><button class="mini-play ver" data-verpase="' + esc(p.id) + '">';
    h += '<span class="mp-ico">&#9744;</span><span class="mp-t">Ver el pase</span></button></div>';
    h += "</div></div>";
    return h;
  }

  function cuerpoDia(d) {
    var items = [];
    (d.actividades || []).forEach(function (a, i) {
      items.push({ hora: a.hora || "99:99", html: filaActividad(a, d.fecha, i) });
    });
    /* Los pases enganchados a una actividad ya se dibujaron dentro de ella.
       Los sueltos van por hora, y los que no tienen hora al final — antes
       caían primeros y te aparecía el pase arriba de todo el día. */
    pasesDelDia(d.fecha).forEach(function (p) {
      if (p.actividad) return;
      items.push({ hora: p.hora || "99:98", html: filaPase(p) });
    });
    items.sort(function (a, b) { return a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : 0; });

    var h = '<div class="linea">' + items.map(function (x) { return x.html; }).join("") + "</div>";
    if (d.notas && d.notas.length) {
      h += '<div class="dia-notas">';
      d.notas.forEach(function (n) { h += "<div>" + esc(n) + "</div>"; });
      h += "</div>";
    }
    return h;
  }

  function cabeceraDia(d) {
    var nAud = (d.actividades || []).reduce(function (s, a) {
      return s + ((a.paradas && a.paradas.length) || 0);
    }, 0);
    var nPas = pasesDelDia(d.fecha).length;
    var total = (d.actividades || []).length;
    var listas = 0;
    for (var i = 0; i < total; i++) if (actHechas[claveAct(d.fecha, i)]) listas++;
    var partes = [listas ? listas + " de " + total + " hechas" : total + " actividades"];
    if (nAud) partes.push(nAud + (nAud === 1 ? " audioguía" : " audioguías"));
    if (nPas) partes.push(nPas + (nPas === 1 ? " pase" : " pases"));

    var h = '<button class="dia-cab">';
    h += '<div class="dia-top"><span class="dia-n">Día ' + d.n + "</span>";
    h += '<span class="dia-f">' + esc(fechaLarga(d.fecha)) + "</span></div>";
    h += "<h3>" + esc(d.titulo) + "</h3>";
    h += '<div class="dia-tags">' + esc(partes.join(" · ")) + "</div>";
    if (nAud) {
      var minDia = paradasDelDia(d.fecha).reduce(function (s2, p) {
        return s2 + minutosDeParada(p);
      }, 0);
      h += '<span class="dia-play" data-diaplay="' + esc(d.fecha) + '">' +
           "&#9654; Reproducir el día &middot; " + minDia + " min</span>";
    }
    h += '<span class="dia-flecha">&#9662;</span>';
    h += "</button>";
    return h;
  }

  function renderItin() {
    if (diaAbierto === undefined) diaAbierto = diaPorDefecto();
    /* El itinerario es la lista de días y nada más. Los avisos y los tramos
       viven en Práctico: acá estorbaban arriba de todo. */
    var h = "";

    IT.ciudades.forEach(function (c) {
      var dd = DIAS.filter(function (x) { return x.ciudad === c.id; });
      if (!dd.length) return;

      h += '<h2 class="sec">' + esc(c.nombre) + " &middot; " + fechaCorta(c.desde) +
           " &rarr; " + fechaCorta(c.hasta) + "</h2>";

      var alo = IT.alojamientos.filter(function (a) { return a.ciudad === c.id; })[0];
      if (alo) {
        h += '<div class="alo">';
        if (alo.estado === "reservado") {
          h += '<div class="eyebrow">Alojamiento</div><div class="alo-t">' + esc(alo.nombre) + "</div>";
          var bits = [];
          if (alo.zona) bits.push(alo.zona);
          if (alo.plataforma) bits.push(alo.plataforma);
          if (alo.checkin) bits.push("check-in " + alo.checkin);
          h += '<div class="alo-s">' + esc(bits.join(" · ")) + "</div>";
        } else {
          h += '<div class="eyebrow" style="color:var(--alert)">Alojamiento sin reservar</div>';
          h += '<div class="alo-s">' + esc(alo.nota || "") + "</div>";
        }
        h += "</div>";
      }

      dd.forEach(function (d) {
        var abierto = d.fecha === diaAbierto;
        h += '<article class="dia' + (abierto ? " abierto" : "") + '" data-dia="' + esc(d.fecha) + '">';
        h += cabeceraDia(d);
        h += '<div class="dia-cuerpo"' + (abierto ? "" : " hidden") + ">";
